순서가 논리성의 핵심입니다.\n【답변 구성】 [1] ① 평가 기준 2~3개 선언 → ② 기준별로 두 공약 비교 → ③ 선택과 근거(단, 상대 공약의 장점도 수용) [2] ① 하나의 목표 → ② 실행 계획(절차·협력·검증) → ③ 공약의 지속성 장치", "a": ["저의 평가 기준은 세 가지입니다. 첫째, 그 일이 학생회만 할 수 있는 일인가. 둘째, 효과가 임기 후에도 지속되는가. 셋째, 실현 계획이 구체적인가입니다. 이 기준으로 보면 A후보의 공약은 즐거움을 주지만 대부분 일회성 소비이고, 사실 학생회가 아니어도 할 수 있는 일들입니다. B후보의 공약, 특히 학칙 개정 절차 마련은 눈에 띄지 않지만 한번 만들어지면 후배들까지 계속 쓰는 구조의 변화이고, 학생 대표 기구만이 할 수 있는 고유한 일입니다. 그래서 저는 B후보에게 투표하겠습니다. 다만 A후보 공약의 장점, 즉 학생들의 일상적 만족도 가볍게 볼 것은 아니므로, 당선된 B후보가 A의 공약 중 실현 가능한 것을 흡수하면 좋겠다고 생각합니다. '어차피 공약은 공약'이라는 냉소에 대해서는, 냉소야말로 공약을 지키지 않아도 되게 만드는 면죄부라고 생각합니다. 유권자가 공약을 기억하고 확인할 때만 공약은 약속이 됩니다.", "제가 학생회장이 된다면 '학생 제안이 실제로 처리되는 공식 통로'를 만들고 싶습니다. 많은 학교에 건의함은 있지만, 건의가 어디로 가서 왜 되고 안 되는지 아무도 모르기 때문에 냉소가 쌓입니다. 실행 계획은 세 단계입니다. 첫째, 분기마다 학생 제안을 모아 학생회가 실현 가능성을 1차 검토하고, 상위 제안을 학교에 공식 전달하는 절차를 선생님들과 협의해 규정으로 만들겠습니다. 둘째, 모든 제안에 '수용, 보류, 불가'와 그 이유를 공개적으로 회신하는 것을 원칙으로 하겠습니다. 채택되지 않아도 이유를 아는 것만으로 신뢰가 쌓이기 때문입니다. 셋째, 이 절차를 저의 임기용이 아니라 학생회 규정으로 문서화해서 다음 학생회가 그대로 이어받게 하겠습니다. 회장의 성과는 임기 중에 한 일이 아니라 임기 후에도 남는 것으로 평가받아야 한다고 생각합니다."], "tips": ["'기준 먼저, 판정 나중'의 순서가 논리적 답변의 기본기입니다.", "상대 공약(A)의 가치를 흡수하는 여유가 통합의 리더십으로 읽힙니다.", "'임기 후에도 남는 것'이라는 관점은 리더십 관련 모든 질문에서 차별화 포인트입니다."]}, {"t": "버스 정류장의 빨간 스티커", "ty": "인성상황", "p": "한 시민이 버스 정류장의 노선도를 보다가, 노선도에 진행 방향 표시가 없어서 처음 온 사람은 반대 방향 버스를 탈 수 있겠다는 것을 발견했다. 그는 구청에 민원을 넣는 대신, 화살표 모양의 빨간 스티커를 직접 만들어 동네 정류장들을 돌며 노선도에 하나하나 붙였다. 그 후 이 스티커는 SNS에서 화제가 되었고, 실제로 여러 지자체가 노선도에 방향 표시를 넣기 시작했다.\n\n아무도 시키지 않았고, 아무 보상도 없었다. 그는 그저 남들이 무심코 지나치는 불편을 발견했고, 그것을 자신의 시간과 손으로 고쳤다.", "q": ["이 시민의 행동에서 발견할 수 있는 인성적 특성 세 가지를 이유와 함께 설명하고, 이와 관련된 자신의 실천 경험을 한 가지 말해 보세요."], "guide": "【제시문 분석】 행동의 단계에서 특성을 추출하세요 — 발견(타인의 입장에서 보는 공감·관찰력), 실행(생각을 행동으로 옮기는 실천력), 무보상(대가 없는 공익성·이타심). '세 가지 + 이유 + 경험 한 가지'라는 요구 형식을 정확히 지키는 것이 중요합니다.\n【답변 구성】 ① 특성 1: 공감적 관찰력(왜 그런가) → ② 특성 2: 실천력(민원 대신 직접) → ③ 특성 3: 공익성(무보상) → ④ 자기 경험(발견→행동→변화의 구조로) → ⑤ 한 문장 정리", "a": ["세 가지 특성을 발견할 수 있습니다. 첫째는 공감에서 나온 관찰력입니다. 이 시민은 매일 다니는 자신에게는 문제가 없는 노선도를 '처음 온 사람'의 눈으로 다시 보았습니다. 불편의 발견은 시력이 아니라 타인의 입장에 서 보는 마음에서 나온다는 점에서, 이것은 관찰력이자 공감 능력입니다. 둘째는 실천력입니다. 문제를 발견한 사람은 많아도 대부분 '누가 해야 할 텐데'에서 멈춥니다. 그는 민원을 넣고 기다리는 대신 자신의 시간과 손으로 즉시 해결했습니다. 셋째는 공익성입니다. 알아주는 사람도 보상도 없는 일에 움직였다는 것은, 행동의 동기가 인정이 아니라 불특정 다수의 편의, 즉 공동체 자체였다는 뜻입니다.\n\n저의 실천 경험을 말씀드리면, 학교 도서관에서 책을 찾다가 반납된 책들이 아무 자리에나 꽂혀 있어서 검색대에는 '대출 가능'인데 실제로는 찾을 수 없는 책이 많다는 것을 발견했습니다. 저도 몇 번 허탕을 친 뒤에야, 이것이 저만의 불편이 아니라 모두의 시간 낭비라는 생각이 들었습니다. 그래서 도서부 선생님께 말씀드리고, 점심시간마다 서가 한 구역씩 제자리를 찾아 주는 정리를 몇 주간 계속했습니다. 나중에는 반납 책을 임시로 두는 '반납 전용 수레'를 제안해서 잘못 꽂히는 일 자체가 줄었습니다. 이 경험으로 배운 것은, 공동체를 바꾸는 일은 거창한 것이 아니라 내가 겪은 불편을 남의 불편으로 확장해서 보는 데서 시작된다는 것입니다."], "tips": ["'세 가지+이유+경험 하나'라는 문제의 요구 형식을 답변 구조에 그대로 반영하세요.", "경험담은 '불편의 발견 → 나의 행동 → 시스템의 변화'까지 이어지면 최상급입니다.", "특성에 이름을 붙일 때 '착함' 같은 뭉툭한 말 대신 '공감적 관찰력'처럼 정확한 언어를 쓰세요."]}, {"t": "나를 성장시킨 가치·덕목", "ty": "인성상황", "p": "[보기] 존중 / 성찰 / 끈기 / 소신 / 유연성\n\n사람은 저마다 자신을 지탱하는 가치를 갖고 있다. 어떤 사람은 흔들릴 때마다 끈기로 버티고, 어떤 사람은 자신을 돌아보는 성찰로 방향을 고치며, 어떤 사람은 다수의 흐름 앞에서도 소신으로 자기 자리를 지킨다. 위 보기의 다섯 가지는 학교라는 공동체에서 특히 자주 시험대에 오르는 가치들이다.", "q": ["보기 중 자신의 성장에 가장 큰 영향을 준 가치·덕목 하나를 경험을 바탕으로 말하고, 그것이 고등학교 생활에 어떤 도움이 될지 두 가지 이유를 들어 말해 보세요."], "guide": "【제시문 분석】 자기 이해와 표현력을 보는 전형적 인성 문항입니다. 채점 형식이 명확합니다 — 하나 선택, 경험 근거, 도움 이유 두 가지. 어떤 가치를 골라도 되지만 '경험의 구체성'과 '학교생활 연결의 논리'가 점수를 가릅니다.\n【답변 구성】 ① 선택 선언 → ② 경험(위기→가치의 작동→결과) → ③ 고교 생활 도움 이유 ①(학업 측면) → ④ 이유 ②(공동체 측면) → ⑤ 정리", "a": ["저는 '성찰'을 선택하겠습니다.\n\n성찰이 저를 성장시킨 경험을 말씀드리면, 중학교 2학년 때 저는 수학 성적이 계속 떨어지는데도 '문제를 더 많이 풀면 되겠지'라며 같은 방법을 반복하고 있었습니다. 어느 날 오답 노트를 처음부터 다시 넘겨 보다가, 제가 틀리는 문제의 대부분이 새로운 유형이 아니라 이미 틀렸던 유형이라는 것을 발견했습니다. 문제는 양이 아니라 저의 복습 방식이었던 것입니다. 그날 이후 저는 일주일에 한 번 '무엇을 공부했는가'가 아니라 '어떻게 공부했는가'를 점검하는 시간을 갖게 되었고, 같은 유형을 두 번 틀리지 않는 것을 목표로 방법을 바꾸자 성적이 회복되었습니다. 이 경험으로 저는 노력에도 방향이 필요하며, 방향을 잡아 주는 것이 성찰이라는 것을 배웠습니다.\n\n성찰이 고등학교 생활에 도움이 될 이유는 두 가지입니다. 첫째, 학업 면에서 고등학교는 공부의 양이 급격히 늘어나는 곳이므로, 잘못된 방법으로 성실하기만 하면 열심히 하고도 무너질 수 있습니다. 주기적으로 방법 자체를 점검하는 성찰의 습관은 시행착오의 비용을 줄여 줄 것입니다. 둘째, 공동체 면에서 기숙사와 모둠 활동처럼 부딪힘이 많은 생활에서는 갈등의 원인을 상대에게서만 찾기 쉽습니다. '내 쪽에는 무엇이 있었나'를 먼저 돌아보는 성찰은 갈등을 관계의 파국이 아니라 서로를 이해하는 계기로 바꿔 줄 것이라고 생각합니다. 저에게 성찰은 반성문이 아니라, 더 나은 다음을 설계하는 도구입니다."], "tips": ["어떤 가치를 골라도 됩니다. 중요한 것은 '경험 1개 + 학교생활 연결 이유 2개'라는 형식의 완주입니다.", "이유 두 가지는 '학업/공동체'처럼 서로 다른 영역에서 고르면 겹치지 않습니다.", "'성찰은 반성문이 아니라 설계 도구'처럼 가치를 자기식으로 재정의하는 마무리가 인상을 남깁니다."]}, {"t": "함께 빛난 순간, 부끄러웠던 순간", "ty": "서류연계", "p": "면접에서는 서류에 적힌 활동이 실제 자신의 경험인지, 그 경험이 자신을 어떻게 바꿨는지를 확인하는 질문이 나온다. 다음 두 질문에 대해 자기소개서 또는 학교생활기록부의 활동을 소재로 답해 보자.\n\n(질문 1) 다른 사람들과 '함께했기에 빛났던' 중학교 시절의 순간을, 그렇게 생각하는 이유 두 가지와 함께 말해 보시오.\n(질문 2) 부끄러움을 느꼈던 경험과, 그 경험이 자신의 삶에 준 영향을 말해 보시오.", "q": ["함께해서 빛났던 중학교 시절의 순간을 두 가지 이유를 제시하여 말해 보세요.", "부끄러움을 느꼈던 경험과 그것이 자신의 삶에 준 영향을 말해 보세요."], "guide": "【제시문 분석】 서류 연계형 인성 문항의 전형입니다. 1번의 채점 요소: 협업 경험의 구체성 + '함께여서'의 의미를 담은 이유 두 가지. 2번의 채점 요소: 부끄러움의 솔직한 인정 + 성찰 + 행동의 변화(영향). 자기 생기부 활동에서 소재를 미리 정해 두어야 합니다.\n【답변 구성】 [1] ① 장면 제시(언제·무엇을) → ② 이유 1(혼자서는 불가능했던 결과) → ③ 이유 2(과정에서 배운 협업의 기술) [2] ① 부끄러운 장면(정직하게, 그러나 치명적이지 않은 것) → ② 그때의 깨달음 → ③ 달라진 행동 → ④ 현재까지의 영향", "a": ["저에게 함께해서 빛났던 순간은 학교 축제에서 학급 부스를 운영했던 일입니다. 저희 반은 재활용품으로 만든 게임 부스를 열었는데, 준비 기간 동안 기획을 잘하는 친구는 게임 규칙을, 손재주 좋은 친구들은 제작을, 저는 홍보와 운영 동선을 맡아 각자의 강점대로 역할을 나눴습니다. 축제 당일 저희 부스 앞에 줄이 늘어섰을 때의 장면을 지금도 기억합니다. 이 순간이 빛났다고 생각하는 이유는 두 가지입니다. 첫째, 혼자서는 불가능한 규모의 결과였기 때문입니다. 그 부스는 어느 한 사람의 능력으로는 만들 수 없는, 서로 다른 재능이 조립된 결과물이었습니다. 둘째, 결과보다 과정에서 배운 것이 컸기 때문입니다. 준비 중에 게임 난이도를 두고 의견이 갈렸을 때, 저희는 다수결 대신 쉬는 시간에 시제품을 만들어 직접 테스트해 보고 결정했습니다. 갈등을 감정 싸움이 아니라 검증으로 푸는 경험은, 함께였기에 얻을 수 있었던 배움이었습니다.", "저의 부끄러웠던 경험은 모둠 발표 준비에서 소극적인 친구의 의견을 흘려들었던 일입니다. 시간에 쫓기던 저는 조용한 친구가 조심스럽게 낸 아이디어를 '일단 진행하자'며 사실상 무시하고 제 방식대로 이끌었습니다. 그런데 발표 후 선생님의 피드백에서 지적된 약점이, 정확히 그 친구가 걱정했던 부분이었습니다. 그 순간 얼굴이 뜨거워졌습니다. 부끄러웠던 것은 발표의 허점이 아니라, 제가 '듣는 리더'라고 스스로 믿어 왔으면서 실제로는 목소리 큰 의견만 들었다는 사실이었습니다. 이 경험은 저의 행동을 두 가지로 바꿨습니다. 첫째, 모둠 회의에서 모든 사람에게 한 번씩 발언 기회를 먼저 돌리는 습관이 생겼습니다. 둘째, 의견을 낸 사람에게는 채택 여부와 상관없이 왜 그렇게 결정했는지를 설명하게 되었습니다. 지금 저는 좋은 의견은 큰 목소리가 아니라 좋은 질문에서 나온다고 믿고 있고, 이 믿음은 그날의 부끄러움이 남겨 준 것입니다."], "tips": ["이 문항은 자신의 생기부 활동으로 답해야 합니다. 답변 틀은 참고하되 소재는 반드시 자기 것으로 바꾸세요.", "부끄러운 경험은 '치명적이지 않되 진짜인 것'을 고르고, 반드시 행동의 변화로 끝맺으세요.", "'함께여서 빛났다'의 이유
