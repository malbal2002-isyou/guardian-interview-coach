 질문이 자연스럽게 나온다. 실제로 일부 대학의 어문계열 지원자는 줄어드는 추세다.\n\n그러나 언어학자들은 번역기가 옮기는 것은 '정보'이지 '관계'가 아니라고 말한다. 상대의 언어로 건네는 인사 한마디가 만드는 신뢰, 농담과 말장난, 그 언어 특유의 정서는 기계를 거치는 순간 온도가 달라진다. 또한 외국어 학습은 단어 암기가 아니라 다른 사고방식을 몸에 익히는 훈련이어서, 모국어를 더 깊이 이해하게 하고 사고의 유연성을 키운다는 연구도 있다. 번역기의 시대에 외국어 교육의 목적은 '의사소통의 도구 습득'에서 다른 무엇으로 이동하고 있다.", "q": ["번역기가 대체할 수 있는 것과 대체할 수 없는 것을 구분하여 설명하고, AI 시대 외국어 학습의 의미에 대한 자신의 생각을 말해 보세요."], "guide": "【제시문 분석】 대비 구조: 번역기가 옮기는 것(정보) vs 옮기지 못하는 것(관계·정서·사고방식). 마지막 문장 '교육의 목적 이동'이 견해 제시의 방향을 지정합니다. 외고 지원자에게는 지원 동기와 직결되는 문항입니다.\n【답변 구성】 ① 대체 가능/불가능의 구분(정보 vs 관계·사고) → ② 자기 경험으로 뒷받침 → ③ 외국어 학습의 새 목적 제시 → ④ 자신의 학습 계획과 연결", "a": ["번역기가 대체할 수 있는 것은 정보의 전달입니다. 길을 묻고, 계약 조건을 확인하고, 설명서를 읽는 일은 이미 기계가 사람보다 빠르고 정확하게 해냅니다. 그러나 대체할 수 없는 것이 두 가지 있다고 생각합니다. 첫째는 관계입니다. 서툴더라도 상대의 언어로 직접 건네는 한마디는 '당신을 이해하려고 노력했다'는 존중의 표시이고, 그 온도는 이어폰 속 기계음이 만들 수 없습니다. 둘째는 사고의 확장입니다. 외국어를 배운다는 것은 세상을 다르게 자르는 방식을 익히는 일입니다. 저는 영어를 공부하면서 우리말의 '답답하다'에 정확히 대응하는 영어 단어가 없다는 것을 알고, 언어마다 감정을 분류하는 지도가 다르다는 것을 실감했습니다. 그 순간 이해하게 된 것은 영어가 아니라 오히려 한국어와 저 자신의 사고방식이었습니다.\n\n그래서 저는 AI 시대 외국어 학습의 의미가 '통역사 없이 말하기'에서 '다르게 생각하는 능력 기르기'와 '사람의 마음을 얻는 소통'으로 이동한다고 생각합니다. 정보 전달은 기계에 맡기더라도, 문화의 맥락을 읽고 신뢰를 쌓는 일은 그 언어를 몸에 익힌 사람만 할 수 있습니다. 오히려 번역기 덕분에 단순 암기의 부담이 줄어든 만큼, 저는 언어 뒤에 있는 문화와 사고방식까지 배우는 더 깊은 언어 학습을 하고 싶습니다."], "tips": ["외고·국제고 면접의 사실상 단골 문항입니다. 자신의 언어 학습 경험 한 장면을 반드시 준비하세요.", "'번역 불가능한 단어' 사례(답답하다, 눈치, 정)를 하나 가지고 있으면 여러 문항에서 활용됩니다.", "'번역기 반대'가 아니라 '역할 분담'의 관점으로 답해야 기술에 대한 균형 감각을 보여 줍니다."]}, {"t": "경계가 만드는 '우리'와 '그들'", "ty": "독해·견해", "p": "한 심리학 실험에서 연구자는 아이들을 셔츠 색깔에 따라 파란 팀과 빨간 팀으로 나누기만 했다. 팀을 나눈 것 외에 어떤 경쟁도 시키지 않았지만, 몇 주 뒤 아이들은 같은 색 팀원을 더 긍정적으로 평가하고 다른 색 팀에게는 인색해졌다. 인간은 아주 사소한 기준의 경계만 주어져도 '우리'와 '그들'을 나누고, 우리 편에게는 관대하고 그들에게는 차갑게 구는 경향이 있다는 것이다.\n\n이 심리는 진화의 유산이다. 낯선 집단을 경계하는 것이 생존에 유리했던 시대의 본능이 남아 있는 것이다. 문제는 이 본능이 현대 사회에서 지역감정, 학벌주의, 성별 갈등, 외국인 혐오 같은 모습으로 나타난다는 점이다. 온라인 공간은 편을 나누는 속도를 높이고, '그들'을 향한 거친 말은 클릭을 부르는 상품이 된다. 경계 짓기가 본능이라면, 그 본능을 넘어서는 것은 교육과 제도, 그리고 의식적인 노력의 몫이다.", "q": ["제시문의 실험이 보여 주는 인간 심리의 특징을 설명하고, 우리 사회의 사례에 적용해 분석해 보세요.", "'우리와 그들'의 경계를 넘기 위해 개인이 기를 수 있는 습관은 무엇인지 자신의 경험과 함께 말해 보세요."], "guide": "【제시문 분석】 실험의 함의: 차별은 특별히 나쁜 사람의 문제가 아니라 사소한 경계에도 작동하는 보편적 심리 기제라는 것. '본능이므로 어쩔 수 없다'가 아니라 '본능이므로 의식적 노력이 필요하다'로 방향을 잡아야 합니다.\n【답변 구성】 [1] ① 실험 요약(기준의 사소함 ↔ 효과의 강력함 대비) → ② 사회 사례 1~2개에 적용 → ③ 온라인의 증폭 효과 [2] ① 습관 제시(개인화, 접촉, 언어 점검) → ② 경험 → ③ 정리", "a": ["실험이 보여 주는 것은, 인간은 셔츠 색깔처럼 아무 의미 없는 기준만 주어져도 자동으로 편을 나누고 차별을 시작한다는 사실입니다. 중요한 것은 이 심리가 악한 사람의 특성이 아니라 모든 사람 안에 있는 기본 설정이라는 점입니다. 우리 사회에 적용해 보면, 지역감정이나 출신 학교에 따른 편 가르기, 남녀 갈등이 모두 같은 구조를 갖고 있습니다. 실제 이해관계의 충돌보다 '우리 편'이라는 소속감 자체가 갈등을 키우는 경우가 많고, 온라인 커뮤니티는 셔츠 색깔보다 훨씬 강력한 팀 나누기 장치가 되어 상대 집단을 향한 혐오 표현을 상품처럼 유통시킵니다. 결국 문제의 핵심은 '그들'을 하나의 얼굴 없는 덩어리로 보는 순간, 그 안의 다양한 개인이 보이지 않게 된다는 것입니다.", "저는 세 가지 습관이 경계를 약하게 만든다고 생각합니다. 첫째, 집단을 개인으로 되돌려 보는 습관입니다. '요즘 애들은', '그 지역 사람들은'이라는 문장이 나오려 할 때, 제가 실제로 아는 그 집단의 한 사람을 떠올리면 일반화가 멈춥니다. 둘째, 다른 집단과의 직접 접촉입니다. 저의 경험으로, 저는 운동을 잘하는 친구들과는 어울리기 어렵다고 지레 생각했는데, 체육대회 준비로 한 팀이 되어 몇 주를 보내고 나니 그 벽이 제 머릿속에만 있었다는 것을 알게 되었습니다. 함께 공동의 목표를 겪은 뒤에는 '그들'이 그냥 이름을 아는 친구들이 되었습니다. 셋째, 제 언어를 점검하는 것입니다. 편을 가르는 말은 생각보다 먼저 나오기 때문에, 특정 집단을 뭉뚱그리는 표현을 쓰지 않으려고 의식합니다. 경계 짓기가 본능이라면, 경계 넘기는 연습이라고 생각합니다. 연습은 누구나 시작할 수 있다는 점이 이 문제의 희망이라고 생각합니다."], "tips": ["'본능이니 어쩔 수 없다'는 결론은 함정입니다. '본능이기에 노력이 필요하다'로 뒤집으세요.", "실험·연구 제시문은 '기준의 사소함과 효과의 강력함' 같은 대비 구조를 요약에 담으면 좋습니다.", "접촉 경험(팀이 되어 벽이 사라진 일)은 인성 문항에도 재활용할 수 있는 만능 사례입니다."]}, {"t": "30년 후의 세상과 나의 준비", "ty": "독해·견해", "p": "미래학자들은 앞으로 30년의 변화가 지난 100년의 변화보다 클 것이라고 전망한다. AI는 지식 노동의 상당 부분을 대체하거나 보조하게 되고, 기후변화는 산업과 도시의 지도를 다시 그리게 만들며, 초고령화는 일하는 방식과 복지의 틀을 바꿀 것이다. 세계경제포럼은 지금 초등학생의 상당수가 '아직 존재하지 않는 직업'에 종사하게 될 것이라고 예측한 바 있다.\n\n그러나 미래 예측의 역사는 겸손을 가르친다. 전문가들은 인터넷의 폭발도, 스마트폰이 바꿀 일상도 제대로 예측하지 못했다. 확실한 것은 변화의 방향이 아니라 변화의 속도뿐이라는 말도 있다. 그래서 미래 교육의 초점은 '무엇이 올지 맞히는 것'이 아니라 '무엇이 오든 대응할 수 있는 힘', 즉 스스로 배우는 능력, 질문하는 능력, 다른 사람과 협력하는 능력을 기르는 쪽으로 이동하고 있다.", "q": ["30년 후 우리 사회의 변화 중 가장 중요하다고 생각하는 것 하나를 골라 그 파급 효과를 말해 보세요.", "예측이 불가능한 시대에 자신은 무엇을 준비하고 있는지, 지금의 학습 태도와 연결해 말해 보세요."], "guide": "【제시문 분석】 1문단은 변화의 목록(AI·기후·고령화), 2문단은 반전 — 예측의 한계와 '적응력'으로의 초점 이동. 2문단을 놓치고 미래 예측만 나열하면 절반의 독해입니다.\n【답변 구성】 [1] ① 하나 선택과 선택 이유 → ② 파급 효과를 2~3개 영역으로 확장(일자리→교육→복지 등) [2] ① '맞히기가 아니라 대응력'이라는 제시문 관점 수용 → ② 자신이 기르는 능력과 구체적 실천 → ③ 진학 후 계획 연결", "a": ["저는 AI에 의한 지식 노동의 변화를 가장 중요한 변화로 꼽고 싶습니다. 기후나 고령화도 거대한 변화이지만, AI는 '인간이 무엇으로 가치를 만드는가'라는 질문 자체를 바꾸기 때문입니다. 파급 효과는 연쇄적입니다. 먼저 일자리에서, 지식을 외우고 처리하는 직업은 축소되고 문제를 정의하고 AI를 다루며 사람을 상대하는 직업이 커질 것입니다. 그러면 교육이 바뀌어야 합니다. 정답을 빨리 찾는 훈련의 가치는 떨어지고, 질문을 만들고 결과를 검증하는 능력이 핵심이 됩니다. 나아가 AI가 만든 부가 소수에게 몰리면 분배를 둘러싼 사회적 합의, 예를 들어 세금과 복지 제도의 재설계까지 요구될 것입니다. 하나의 기술이 노동, 교육, 복지의 틀을 연달아 흔드는 셈입니다.", "제시문에서 가장 공감한 문장은 '무엇이 오든 대응할 수 있는 힘'을 길러야 한다는 부분입니다. 저는 세 가지를 준비하고 있습니다. 첫째, 스스로 배우는 능력입니다. 학교 진도와 별개로 궁금한 주제가 생기면 책과 강의를 찾아 혼자 공부하고 정리하는 습관을 들이고 있는데, 이 습관은 어떤 지식이 필요해지든 그것을 배울 수 있게 해 주는 기초 체력이라고 생각합니다. 둘째, 질문하는 능력입니다. 수업에서 배운 내용에 '왜'와 '만약'을 붙여 보는 연습을 합니다. AI가 답을 잘하는 시대일수록 좋은 질문이 사람의 몫이기 때문입니다. 셋째, 협력의 경험입니다. 모둠 활동에서 의견이 다른 친구와 결과물을 만들어 내는 과정은 어떤 미래가 와도 필요할 능력이라고 생각해 피하지 않고 부딪히고 있습니다. 진학 후에도 특정 직업을 목표로 지식을 쌓기보다, 변화를 겁내지 않는 학습의 근육을 기르는 것을 목표로 삼고 싶습니다."], "tips": ["'하나를 골라'라는 지시에는 선택의 이유부터 말하는 것이 논리적 순서입니다.", "파급 효과는 도미노처럼 '1차→2차→3차'로 연결해 말하면 사고의 확장력이 드러납니다.", "자기주도학습 전형에서는 두 번째 답변이 곧 자기소개입니다. 실제 학습 습관과 반드시 일치시키세요."]}, {"t": "K-컬처의 세계화와 문화의 정체성", "ty": "독해·견해", "p": "K-팝과 K-드라마, 한국 영화가 세계 시장의 주류로 올라섰다. 한국어 가사를 따라 부르는 해외 팬들이 늘고, 한글을 배우는 외국인, 한국 음식과 화장품의 수출도 함께 성장했다. 문화의 힘이 국가 이미지와 경제까지 끌어올리는 '소프트 파워'의 대표 사례로 꼽힌다.\n\n그런데 세계화가 깊어질수록 새로운 질문이 나온다. 세계 시장을 겨냥해 외국인 멤버를 뽑고 영어 가사의 비중을 늘리며 해외 제작사와 함께 만든 콘텐츠는 어디까지 '한국' 문화인가. 일부에서는 K-컬처가 성공할수록 한국적인 색은 옅어지는 역설을 지적한다. 반대로, 문화란 원래 섞이면서 발전하는 것이며 '순수한 우리 것'에 대한 집착이야말로 문화의 생명력을 죽인다는 반론도 있다. 김치와 고추도 외래 작물이 토착화된 결과라는 것이다.", "q": ["'K-컬처의 세계화가 한국 문화의 정체성을 옅게 만든다'는 우려에 대한 자신의 견해를 제시문의 논거를 활용해 말해 보세요."], "guide": "【제시문 분석】 우려(성공할수록 한국색이 옅어짐)와 반론(문화는 혼합으로 발전, 고추의 사례)이 대립합니다. '정체성'을 고정된 원형으로 볼 것인가, 변화하는 과정으로 볼 것인가라는 정의의 문제로 내려가면 답이 선명해집니다.\n【답변 구성】 ① 우려의 논리 요약 → ② 자기 견해(정체성에 대한 재정의) → ③ 근거(고추·김치 사례 활용, 역사적 반복) → ④ 단서(상업적 획일화의 경계) → ⑤ 정리", "a": ["그 우려는 정체성을 '변하지 않는 원형'으로 볼 때 성립한다고 생각합니다. 외국인 멤버와 영어 가사가 늘어나면 원형에서 멀어지니 정체성이 옅어진다는 논리입니다. 하지만 저는 문화의 정체성이 고정된 원형이 아니라 다른 것을 받아들여 자기 것으로 만드는 방식 그 자체라고 생각합니다.\n\n제시문의 사례가 좋은 근거입니다. 고추는 외래 작물이었지만 김치라는 가장 한국적인 음식의 중심이 되었습니다. 지금 우리가 전통이라고 부르는 것들의 상당수가 과거의 혼합이 토착화된 결과입니다. K-팝도 마찬가지로, 서양의 팝 음악을 받아들이되 훈련 시스템과 무대 완성도, 팬과의 소통 방식이라는 고유한 문법으로 재조합했기 때문에 세계가 그것을 '한국적'이라고 부르게 되었습니다. 외국인 멤버가 있어도 그 문법이 살아 있다면 정체성은 유지되는 것입니다.\n\n다만 하나의 단서를 붙이고 싶습니다. 경계해야 할 것은 혼합이 아니라 획일화입니다. 세계 시장의 공식만 따르다 보면 어느 나라 것도 아닌 평균적인 콘텐츠가 될 수 있고, 그 순간 매력의 원천도 사라집니다. 세계가 K-컬처에 열광한 이유는 익숙한 보편성 속의 낯선 고유함이었기 때문입니다. 그래서 저는 정체성을 지키는 길이 순수함을 고집하는 것이 아니라, 무엇을 섞더라도 우리의 방식으로 소화하는 힘을 잃지 않는 것이라고 생각합니다."], "tips": ["'정체성'처럼 논쟁의 핵심 개념은 스스로 정의를 내리고 시작하면 논의 전체를 주도할 수 있습니다.", "제시문 속 사례(고추·김치)는 반론의 무기로 설계된 것입니다. 반드시 활용하세요.", "'혼합은 좋지만 획일화는 경계'라는 단서 조항이 균형 감각을 보여 줍니다."]}, {"t": "플랫폼 노동의 명과 암", "ty": "독해·견해", "p": "배달 앱과 대리운전 앱, 프리랜서 중개 사이트처럼 디지털 플랫폼을 통해 일감을 얻는 '플랫폼 노동'이 빠르게 늘고 있다. 국내 플랫폼 종사자는 이미 80만 명을 넘어선 것으로 추산된다. 원하는 시간에 원하는 만큼 일할 수 있는 자유로움 덕분에 학업이나 육아와 병행하는 사람도 많다.\n\n그러나 플랫폼 노동자는 법적으로 근로자가 아닌 개인사업자로 분류되는 경우가 많아, 최저임금·산재보험·유급휴가 같은 노동법의 보호를 온전히 받지 못한다. 일감의 배정과 보수는 알고리즘이 결정하는데, 그 기준은 공개되지 않는다. 별점이 떨어지면 일감이 끊기지만 왜 떨어졌는지 물어볼 상대도 없다. '자유로운 사장님'이라는 이름 뒤에, 고용의 책임은 지지 않으면서 지휘·감독은 하는 새로운 형태의 사용자가 있다는 비판이 나오는 이유다.", "q": ["플랫폼 노동의 장점과 문제점을 정리하고, '자유로운 사장님'이라는 표현에 담긴 모순을 설명해 보세요.", "기술 발전이 만든 새로운 노동 형태를 제도가 어떻게 뒷받침해야 할지 자신의 생각을 말해 보세요."], "guide": "【제시문 분석】 장점(시간의 자유)과 문제(법적 보호의 공백, 알고리즘의 불투명한 통제)의 대비. '자유로운 사장님'의 모순 — 사장님이라기엔 알고리즘의 지휘를 받고, 노동자라기엔 보호가 없음 — 을 풀어내는 것이 독해의 핵심입니다.\n【답변 구성】 [1] ① 장점 → ② 문제점 → ③ 모순 설명(권리는 사업자, 통제는 근로자) [2] ① 제도의 방향(이분법을 넘는 제3의 범주 또는 보호의 보편화) → ② 알고리즘 투명성 → ③ 정리", "a": ["플랫폼 노동의 장점은 시간과 양을 스스로 정하는 유연함입니다. 학업이나 육아와 병행할 수 있는 일자리는 분명 새로운 기회입니다. 그러나 문제점은 그 자유의 법적 대가가 너무 크다는 것입니다. 개인사업자로 분류되는 순간 최저임금도 산재보험도 적용되지 않아, 사고의 위험과 수입의 불안정을 모두 개인이 떠안게 됩니다. '자유로운 사장님'이라는 표현의 모순은 여기에 있습니다. 사장님이라면 가격을 정하고 거래처를 고를 수 있어야 하는데, 실제로는 알고리즘이 일감과 보수를 일방적으로 정하고 별점으로 사실상 해고까지 합니다. 즉 통제는 근로자처럼 받으면서 권리는 사업자로 취급되는, 의무와 권리가 어긋난 상태입니다. 자유는 이름뿐이고 책임만 실재하는 구조라고 설명할 수 있습니다.", "저는 제도가 두 방향으로 움직여야 한다고 생각합니다. 첫째, '근로자냐 사업자냐'라는 낡은 이분법을 현실에 맞게 고치는 것입니다. 플랫폼 노동은 둘의 중간에 있는 새로운 형태이므로, 고용 형태와 무관하게 일하는 모든 사람에게 산재보험과 최소한의 소득 안전망을 적용하는 보편적 보호가 필요합니다. 실제로 배달 종사자의 산재보험 적용처럼 제도가 조금씩 따라가고 있지만 속도가 느립니다. 둘째, 알고리즘의 투명성입니다. 일감 배정과 보수 산정의 기준을 공개하게 하고, 별점에 의한 일방적 계약 해지에는 소명 절차를 두어야 합니다. 사람이 상사라면 항의라도 할 수 있는데 알고리즘 상사에게는 그것조차 불가능하다는 것은 공정하지 않기 때문입니다. 기술이 노동의 형태를 바꾸는 것은 막을 수 없지만, 어떤 형태의 노동이든 사람의 존엄이 지켜지는 바닥선은 제도가 지켜야 한다고 생각합니다."], "tips": ["표현의 모순을 설명하라는 문제는 '이름과 실체의 어긋남'을 대비시켜 풀면 됩니다.", "'권리는 사업자, 통제는 근로자'처럼 모순을 한 문장으로 압축해 보세요.", "새로운 현상에 낡은 범주를 적용할 때 생기는 문제는 사회 이슈의 단골 구조입니다. 틀로 기억해 두세요."]}, {"t": "꿀벌이 사라지는 봄", "ty": "독해·견해", "p": "최근 몇 년 사이 우리나라에서 겨울을 나던 꿀벌 수십억 마리가 사라지는 일이 되풀이되고 있다. 원인으로는 이상기후로 인한 개화 시기의 혼란, 살충제, 진드기 같은 병해충, 도시화로 인한 서식지 감소가 복합적으로 지목된다. 유엔에 따르면 세계 주요 100대 농작물의 70% 이상이 꿀벌 등 꽃가루 매개자의 수분에 의존한다. 꿀벌이 사라지면 꿀이 없어지는 것이 아니라, 과일과 채소의 생산 자체가 흔들린다.\n\n꿀벌의 실종은 생태계가 보내는 경고로 읽힌다. 생태계는 수많은 종이 촘촘히 연결된 그물이어서, 한 종의 붕괴는 연쇄적인 붕괴로 이어질 수 있다. 문제는 그 연결이 평소에는 보이지 않는다는 점이다. 사람들은 꿀벌의 노동에 한 번도 대가를 지불한 적이 없기에, 그것이 사라지고 나서야 그 가치를 계산하기 시작했다. 한 연구는 꽃가루 매개자가 세계 경제에 기여하는 가치를 연간 수백조 원으로 추산했다.", "q": ["꿀벌 실종이 '생태계의 경고'로 불리는 이유를 제시문을 바탕으로 설명하고, 이 문제가 우리에게 요구하는 인식의 전환은 무엇인지 말해 보세요."], "guide": "【제시문 분석】 핵심 논리 사슬: 꿀벌=수분 매개자 → 식량 생산의 기반 → 생태계는 보이지 않는 연결망 → 공짜로 누리던 '자연의 서비스'의 가치를 상실 후에야 계산. '보이지 않는 연결'과 '무상의 서비스'가 두 열쇠어입니다.\n【답변 구성】 ① 경고인 이유(연쇄 구조: 꿀벌→작물 70%→식량) → ② 인식 전환 1: 자연을 공짜 배경이 아닌 기반 시설로 → ③ 인식 전환 2: 사라진 뒤의 계산에서 사라지기 전의 보전으로 → ④ 실천 연결", "a": ["꿀벌 실종이 경고인 이유는, 그것이 꿀벌 한 종의 문제가 아니라 생태계라는 연결망 전체의 이상 신호이기 때문입니다. 제시문에 따르면 세계 주요 농작물의 70% 이상이 꿀벌 같은 꽃가루 매개자에 의존합니다. 꿀벌이 무너지면 과일과 채소의 생산이 흔들리고, 이는 식량 가격과 인간의 생존으로 직결됩니다. 즉 꿀벌의 실종은 '생태계의 그물이 찢어지기 시작했으며, 그 그물 위에 인간도 앉아 있다'는 사실을 보여 주는 사건입니다.\n\n이 문제가 요구하는 인식의 전환은 두 가지라고 생각합니다. 첫째, 자연을 풍경이 아니라 기반 시설로 보는 것입니다. 우리는 도로나 전기가 끊기면 사회가 멈춘다는 것은 알면서, 수분·정화·기후 조절처럼 자연이 무상으로 제공해 온 서비스는 당연한 배경으로 여겨 왔습니다. 꿀벌의 노동에 대가를 지불한 적이 없다는 제시문의 표현처럼, 공짜였기 때문에 가치가 없다고 착각한 것입니다. 둘째, 계산의 시점을 바꾸는 것입니다. 사라진 뒤에 수백조 원이라고 계산하는 것은 이미 늦은 계산입니다. 생태계 훼손은 되돌리기 어렵기 때문에, 개발과 정책의 비용 계산에 생태계의 가치를 미리 포함하는 사전적 태도가 필요합니다. 저는 이 전환이 거창한 구호가 아니라, 도시의 꿀벌 정원 조성이나 농약 사용 기준 강화처럼 구체적인 제도로 번역될 때 의미가 있다고 생각합니다."], "tips": ["'꿀벌→작물 70%→식량'처럼 연쇄 고리를 순서대로 말하면 인과적 사고가 드러납니다.", "'공짜여서 가치 없다고 착각했다'는 제시문의 통찰을 자기 말로 재진술하는 것이 독해력 어필의 핵심입니다.", "환경 제시문의 결론은 항상 '구체적 제도나 실천으로의 번역'까지 나아가야 공허하지 않습니다."]}, {"t": "초연결 시대의 외로움", "ty": "독해·견해", "p": "인류는 역사상 가장 촘촘하게 연결되어 있다. 스마트폰 하나로 수백 명의 친구와 실시간으로 이어지고, 지구 반대편의 소식이 몇 초 만에 도착한다. 그런데 역설적으로 '외롭다'고 답하는 사람의 비율은 세계적으로 늘고 있다. 영국은 2018년 '외로움 담당 장관'을 임명했고, 일본도 뒤를 이었다. 외로움이 개인의 감정을 넘어 흡연만큼 건강에 해롭고 사회적 비용을 낳는 공중보건의 문제로 다뤄지기 시작한 것이다.\n\n연구자들은 연결의 양과 관계의 질을 구분한다. SNS의 '친구'가 아무리 많아도, 힘들 때 새벽에 전화할 수 있는 사람이 없다면 사람은 외롭다. 오히려 타인의 빛나는 순간만 모아 놓은 피드를 들여다볼수록 자신의 평범한 일상은 초라해 보이고, '좋아요'로 유지되는 관계는 정작 위기의 순간에 힘이 되지 않는다. 연결이 관계를 대체할 때, 초연결은 더 깊은 고립을 낳는다.", "q": ["'가장 연결된 시대에 가장 외롭다'는 역설이 생기는 이유를 제시문을 바탕으로 분석해 보세요.", "관계의 질을 지키기 위한 자신만의 방법이나 경험을 말해 보세요."], "guide": "【제시문 분석】 역설의 해부: 연결의 양 ≠ 관계의 질. 두 가지 기제 — ① 비교로 인한 상대적 박탈(빛나는 피드 vs 나의 일상) ② 얕은 연결이 깊은 관계의 시간을 잠식. '외로움의 공공 문제화'(장관 임명)도 짚을 포인트입니다.\n【답변 구성】 [1] ① 역설의 원인을 '양과 질의 구분'으로 설명 → ② 두 기제 상술 → ③ 개인 문제에서 사회 문제로의 확장 언급 [2] ① 자신의 원칙·경험 → ② 그 효과 → ③ 정리", "a": ["이 역설이 생기는 이유는 연결의 양이 관계의 질을 보장하지 않기 때문입니다. 제시문의 구분처럼, 수백 명과 이어져 있어도 새벽에 전화할 한 사람이 없다면 외로움은 해소되지 않습니다. 구체적으로 두 가지 기제가 작동한다고 분석합니다. 첫째는 비교의 기제입니다. SNS 피드는 타인의 가장 빛나는 순간만 모은 전시장이어서, 그것을 들여다볼수록 나의 평범한 일상이 상대적으로 초라해지고 소외감이 커집니다. 둘째는 대체의 기제입니다. '좋아요'와 짧은 댓글로 관계를 유지했다는 느낌을 받으면, 정작 깊은 관계에 필요한 시간과 노력, 즉 만나서 이야기하고 힘든 일을 함께 겪는 과정을 건너뛰게 됩니다. 얕은 연결이 깊은 관계의 자리를 차지하는 것입니다. 영국이 외로움 담당 장관까지 둔 것은, 이것이 개인의 성격 문제가 아니라 건강과 사회적 비용에 영향을 주는 구조적 문제가 되었다는 뜻이라고 생각합니다.", "저는 관계에도 '농도'가 필요하다고 생각해서 두 가지를 지키려고 합니다. 첫째, 중요한 이야기는 메시지가 아니라 얼굴을 보고 하는 것입니다. 친구와 오해가 생겼을 때 메시지로 해명할수록 꼬였던 경험이 있는데, 직접 만나 이야기하자 10분 만에 풀렸습니다. 글자는 표정과 말투를 전달하지 못해 같은 말도 차갑게 읽히기 때문입니다. 둘째, 소수의 관계에 시간을 몰아 쓰는 것입니다. 모든 단체방에 성실하게 반응하는 대신, 저에게 소중한 친구 몇 명과는 정기적으로 만나거나 긴 대화를 나누려고 합니다. 그 뒤로 아는 사람은 줄었을지 몰라도 기댈 사람은 늘었다고 느낍니다. 연결은 기술이 해 주지만 관계는 시간이 만든다는 것이, 제가 경험으로 배운 결론입니다."], "tips": ["역설 분석은 '양과 질', '연결과 관계' 같은 개념 쌍의 구분으로 시작하면 명료해집니다.", "기숙사 생활을 앞둔 지원자라면 이 답변이 공동체 적응력의 간접 증거가 됩니다.", "'아는 사람은 줄고 기댈 사람은 늘었다'처럼 경험의 결론을 대구로 정리하면 인상에 남습니다."]}, {"t": "패스트 패션의 진짜 가격", "ty": "독해·견해", "p": "최신 유행의 옷을 초저가로 빠르게 공급하는 패스트 패션이 세계 의류 시장을 지배하고 있다. 일주일 단위로 신상품이 쏟아지고, 몇천 원짜리 티셔츠가 한 철 입고 버려진다. 세계적으로 매년 수천만 톤의 의류 폐기물이 발생하며, 그중 상당수는 개발도상국의 매립지와 해변에 쌓인다. 의류 산업은 세계 탄소 배출의 약 10%를 차지해 항공과 해운을 합친 것보다 많고, 청바지 한 벌을 만드는 데는 물 7,500L가 든다.\n\n가격표에 적히지 않은 비용은 환경만이 아니다. 초저가는 개발도상국 봉제 노동자의 저임금·장시간 노동 위에서 가능해진다. 2013년 방글라데시의 의류 공장 건물 '라나 플라자'가 붕괴해 1,100명 넘는 노동자가 목숨을 잃은 사건은, 우리가 입는 싼 옷의 보이지 않는 가격을 세계에 보여 주었다. 이후 '천천히, 오래 입는' 슬로우 패션과 중고 거래, 옷 수선 문화가 대안으로 확산되고 있다.", "q": ["'가격표에 적히지 않은 비용'이 무엇을 의미하는지 설명하고, 소비자·기업·정부 차원에서 이 문제에 어떻게 대응해야 할지 말해 보세요."], "guide": "【제시문 분석】 핵심 개념은 '외부 비용' — 상품 가격에 포함되지 않고 환경(폐기물·탄소·물)과 타인(노동자)에게 전가된 비용입니다. 라나 플라자는 그 비용이 극단적으로 드러난 사건. 수치(탄소 10%, 물 7,500L)를 활용하세요.\n【답변 구성】 ① 개념 설명(외부 비용: 환경 비용 + 인간 비용) → ② 소비자(소비 습관의 전환) → ③ 기업(공급망 책임) → ④ 정부(공시 의무·규제) → ⑤ '싼 것의 진짜 값'으로 정리", "a": ["'가격표에 적히지 않은 비용'이란 옷값에 포함되지 않은 채 다른 누군가와 미래에 전가되는 비용, 경제학에서 말하는 외부 비용을 의미합니다. 제시문에 따르면 그 비용은 두 종류입니다. 하나는 환경 비용으로, 세계 탄소 배출의 약 10%, 청바지 한 벌에 물 7,500리터, 그리고 개발도상국 해변에 쌓이는 의류 쓰레기입니다. 다른 하나는 인간 비용으로, 라나 플라자 붕괴로 1,100여 명이 목숨을 잃은 것처럼 초저가를 떠받치는 노동자들의 안전과 존엄입니다. 몇천 원짜리 티셔츠가 가능한 이유는 그 차액을 지구와 가장 약한 사람들이 대신 내고 있기 때문입니다.\n\n대응은 세 주체가 나눠야 한다고 생각합니다. 소비자 차원에서는 '많이 사서 빨리 버리는' 습관을 '적게 사서 오래 입는' 습관으로 바꾸는 것입니다. 저부터도 유행보다 오래 입을 수 있는지를 기준으로 삼고, 중고 거래와 수선을 활용하려고 합니다. 기업 차원에서는 하청의 하청 뒤에 숨지 않는 공급망 책임이 필요합니다. 어느 공장에서 어떤 조건으로 만들어졌는지 추적하고 공개해야 합니다. 정부 차원에서는 그 공개를 자율에 맡기지 않고, 생산자에게 의류 폐기물 처리 책임을 지우는 제도나 공급망 인권·환경 실사 의무화 같은 규제로 최저선을 만들어야 합니다. 결국 이 문제의 해법은 싼 옷을 없애는 것이 아니라, 숨겨진 비용을 가격에 되돌려 넣어 '진짜 값'을 치르게 하는 것이라고 생각합니다."], "tips": ["'외부 비용' 개념을 알고 쓰면 환경·노동 이슈 전반에서 분석의 격이 올라갑니다.", "수치는 탄소 10%와 물 7,500L 중 하나만 정확히 인용해도 충분합니다.", "'숨은 비용을 가격에 되돌려 넣는다'는 결론은 플라스틱·탄소세 등 다른 문항에도 응용됩니다."]}, {"t": "유전자 편집 기술, 어디까지 허용할 것인가", "ty": "가치판단", "p": "유전자 가위(크리스퍼) 기술은 DNA의 특정 부위를 잘라 내고 교정하는 기술로, 유전병 치료의 길을 열었다는 평가를 받아 2020년 노벨 화학상을 받았다. 이미 성인 환자의 유전자를 교정해 겸상 적혈구 빈혈 같은 난치병을 치료하는 시도가 성과를 내고 있다. 그러나 2018년 중국의 한 과학자가 에이즈 감염을 막겠다며 세계 최초로 유전자를 편집한 아기를 태어나게 하자, 세계 과학계는 일제히 그를 비판했고 그는 실형을 선고받았다.\n\n환자 개인의 치료와 달리, 배아 단계의 편집은 그 변화가 후손에게까지 대물림되고, 당사자인 아기는 동의할 기회조차 없다. 안전성이 검증되지 않은 것도 문제지만, 더 깊은 우려는 그 다음이다. 질병 치료가 허용되면 키·지능·외모 같은 '개선'의 요구가 뒤따를 것이고, 비용을 감당할 수 있는 계층만 유전적 이점을 사들이는 '맞춤 아기'의 시대가 올 수 있다는 것이다.", "q": ["유전자 편집 기술의 허용 범위에 대한 자신의 기준을 제시하고, '치료와 개선의 경계'가 왜 중요한 문제인지 설명해 보세요."], "guide": "【제시문 분석】 쟁점의 층위: ① 성인 치료(대체로 합의) ② 배아 편집(대물림·동의 불가) ③ 치료를 넘은 '개선'(불평등의 유전). 중국 사례는 과학계의 현재 합의선을 보여 주는 장치입니다.\n【답변 구성】 ① 기준 제시(치료/개선, 성인/배아의 두 축) → ② 각 영역별 판단과 근거 → ③ 치료·개선 경계의 중요성(불평등의 생물학적 고착) → ④ 사회적 통제 장치 언급으로 정리", "a": ["저는 두 개의 축으로 기준을 세우고 싶습니다. 하나는 '치료인가 개선인가', 다른 하나는 '성인인가 배아인가'입니다.\n\n먼저 이미 태어난 환자의 난치병 치료는 적극 허용해야 한다고 생각합니다. 본인이 동의할 수 있고, 효과가 당사자에게 한정되며, 고통을 줄인다는 의학의 본래 목적에 부합하기 때문입니다. 반면 배아 편집은 치료 목적이라도 현 단계에서는 금지해야 한다고 생각합니다. 변화가 후손에게 대물림되어 실수를 되돌릴 수 없고, 정작 당사자인 아기는 동의할 기회가 없기 때문입니다. 중국의 유전자 편집 아기 사건에 세계 과학계가 한목소리로 분노한 것도 이 선을 넘었기 때문이라고 이해합니다.\n\n'치료와 개선의 경계'가 중요한 이유는, 그 경계가 무너지는 순간 유전자 기술이 의학이 아니라 계급의 도구가 되기 때문입니다. 질병을 고치는 것은 불행을 줄이는 일이지만, 키와 지능을 사는 것은 우위를 사는 일입니다. 지금의 불평등은 교육과 노력으로 따라잡을 여지라도 있지만, 유전적 이점이 돈으로 거래되면 불평등이 생물학적으로 고착되어 다음 세대는 출발선 자체가 다른 존재로 태어나게 됩니다. 물론 치료와 개선의 경계가 항상 선명하지는 않습니다. 그래서 저는 그 경계를 과학자 개인이나 시장에 맡기지 않고, 사회적 합의 기구가 공개적으로 심사하고 갱신하는 통제 장치가 기술 발전과 함께 가야 한다고 생각합니다."], "tips": ["두 개의 축(치료/개선, 성인/배아)으로 사분면을 만들면 복잡한 쟁점이 정리됩니다.", "'불평등의 생물학적 고착'이라는 심층 우려까지 닿으면 최상위 답변입니다.", "'경계가 모호하다'는 반론을 스스로 언급하고 절차적 해법으로 받는 구조를 연습하세요."]}, {"t": "자율주행차의 윤리적 딜레마", "ty": "가치판단", "p": "자율주행차가 피할 수 없는 사고 상황에 놓였다고 하자. 직진하면 무단횡단 중인 보행자 다섯 명을 치게 되고, 핸들을 꺾으면 벽에 부딪혀 탑승자 한 명이 크게 다친다. 자율주행차는 어느 쪽을 선택하도록 프로그래밍되어야 하는가. 이것은 유명한 '트롤리 딜레마'의 현대판이다. 사람 운전자라면 순간의 반사적 행동으로 넘어갈 일이, 기계에게는 미리 정해 두어야 할 '설계의 문제'가 된다.\n\n한 국제 연구진이 세계 수백만 명에게 이런 상황들을 묻는 '모럴 머신' 실험을 진행한 결과, 사람들은 대체로 '더 많은 생명을 구하는 선택'을 지지했다. 그러나 흥미롭게도 '탑승자를 희생시키는 차를 사겠느냐'는 질문에는 대부분이 사지 않겠다고 답했다. 모두를 위한 원칙과 나를 위한 선택이 어긋난 것이다. 문화권마다 판단이 달랐다는 점도 논쟁을 더한다. 누가, 어떤 기준으로 기계의 윤리를 정할 것인가는 여전히 열린 문제다.", "q": ["'모두를 위한 원칙'과 '나를 위한 선택'이 어긋나는 모럴 머신 실험 결과가 보여 주는 문제를 분석해 보세요.", "자율주행차의 윤리 기준은 누가 어떻게 정해야 한다고 생각하는지 말해 보세요."], "guide": "【제시문 분석】 이 문항의 초점은 트롤리 딜레마의 정답 찾기가 아니라, 실험이 드러낸 '원칙과 이익의 불일치'(공리주의를 지지하지만 그 차는 안 삼)와 '윤리의 제도화'라는 새로운 문제입니다.\n【답변 구성】 [1] ① 결과 요약 → ② 불일치의 의미(무임승차 구조, 시장에 맡기면 안전이 상품화됨) [2] ① 정하는 주체(사회적 합의+공적 규제) → ② 방식(공개성, 문화적 논의, 최소 원칙) → ③ 남는 한계 인정", "a": ["모럴 머신 실험이 보여 주는 문제는, 윤리의 원칙과 소비의 선택이 어긋난다는 것입니다. 사람들은 사회 전체로는 더 많은 생명을 구하는 차가 옳다고 답하면서도, 정작 자신은 자기를 희생시킬 수 있는 차를 사지 않겠다고 합니다. 이것은 위선이라기보다 구조의 문제라고 생각합니다. 모두가 '남들은 공리적인 차를 타고, 나만 나를 지키는 차를 타는' 상황을 원하는, 일종의 무임승차 구조이기 때문입니다. 이 불일치가 심각한 이유는, 자율주행차의 윤리를 시장에 맡기면 어떤 일이 벌어질지 예고하기 때문입니다. 제조사들은 팔리는 차, 즉 탑승자를 우선 보호하는 차를 만들 것이고, 그러면 도로의 안전이 구매력에 따라 배분되는 상황이 올 수 있습니다. 윤리를 소비자의 선택에 맡겨서는 안 되는 이유가 실험 결과 안에 들어 있는 셈입니다.", "저는 세 가지 원칙으로 답하고 싶습니다. 첫째, 주체는 제조사나 소비자가 아니라 사회 전체여야 합니다. 도로는 모두가 함께 쓰는 공간이므로, 기계의 윤리 기준은 법과 공적 규제의 영역이 되어야 하고 모든 차에 동일하게 적용되어야 합니다. 그래야 방금 말씀드린 무임승차 구조가 차단됩니다. 둘째, 방식은 공개적이어야 합니다. 알고리즘이 어떤 우선순위를 갖는지 기업의 영업 비밀로 숨겨 둘 것이 아니라, 시민이 알고 토론할 수 있게 공개해야 합니다. 셋째, 내용은 '완벽한 정답'보다 '합의 가능한 최소 원칙'을 목표로 해야 합니다. 예를 들어 나이나 사회적 지위로 생명의 가치를 차등하지 않는다는 금지선처럼, 무엇을 하지 않을지부터 합의하는 것입니다. 문화권마다 판단이 다르다는 실험 결과처럼 완전한 합의는 어렵겠지만, 저는 이 논의 자체가 기술 시대의 민주주의 훈련이라고 생각합니다. 기계에게 윤리를 가르치려면 먼저 우리가 우리의 윤리를 명확한 언어로 합의해야 하기 때문입니다."], "tips": ["딜레마에서 '5명 대 1명'의 정답을 고르는 데 매달리지 마세요. 출제 의도는 판단 기준과 제도화 논의입니다.", "'안전이 구매력으로 배분되면 안 된다'는 통찰이 이 문항의 급소입니다.", "'무엇을 할지보다 무엇을 금지할지부터 합의'라는 접근은 AI 윤리 문항 전반에 응용됩니다."]}, {"t": "동물실험의 윤리", "ty": "가치판단", "p": "새로운 약과 치료법은 사람에게 쓰이기 전에 동물실험을 거친다. 전 세계에서 매년 수억 마리의 동물이 실험에 사용되는 것으로 추산되며, 백신 개발과 암 치료의 역사에는 동물실험이 기여한 부분이 분명히 있다. 사람의 생명을 구하기 위한 불가피한 희생이라는 것이 오랜 정당화였다.\n\n그러나 반론도 커지고 있다. 동물도 고통을 느끼는 존재인데 인간의 이익을 위해 다른 종을 수단으로 삼는 것이 정당한가라는 근본적 물음과 함께, 실용적 비판도 있다. 동물에게 안전했던 약의 상당수가 사람 임상시험에서 실패하는 것처럼 종이 다르면 결과도 달라, 동물실험의 예측력에 한계가 있다는 것이다. 최근에는 인공 장기 칩, 컴퓨터 시뮬레이션 등 대체 기술이 발전하면서, 국제사회는 대체(Replacement)·감소(Reduction)·개선(Refinement)의 '3R 원칙'을 확산시키고 있다. 화장품 동물실험은 이미 여러 나라에서 금지되었다.", "q": ["동물실험을 둘러싼 찬반의 논거를 정리하고, 어떤 조건에서 동물실험이 정당화될 수 있는지 자신의 기준을 말해 보세요."], "guide": "【제시문 분석】 찬성 논거는 '인간 생명 구제의 불가피성', 반대 논거는 윤리적(고통을 느끼는 존재의 수단화)·실용적(예측력 한계) 두 갈래입니다. 3R 원칙과 화장품 금지 사례는 '전면 찬반이 아닌 조건 설정'이라는 답의 방향을 제시합니다.\n【답변 구성】 ① 찬반 논거 정리(반대 논거는 두 갈래로) → ② 기준 제시: 목적의 중대성 × 대체 불가능성 → ③ 3R 원칙으로 구체화 → ④ 화장품 사례로 기준 적용 시범 → ⑤ 정리", "a": ["찬성의 논거는 인간의 생명을 구하기 위한 불가피한 희생이라는 것입니다. 백신과 암 치료의 역사가 실제로 동물실험 위에 서 있다는 사실이 이를 뒷받침합니다. 반대의 논거는 두 갈래입니다. 윤리적으로는 고통을 느끼는 존재를 다른 종의 이익을 위한 도구로 쓰는 것이 정당한가라는 물음이고, 실용적으로는 동물에게 안전했던 약이 사람에게는 실패하는 경우가 많아 실험의 예측력 자체에 한계가 있다는 지적입니다.\n\n저는 동물실험의 정당성을 '목적의 중대성'과 '대체 불가능성'이라는 두 조건으로 판단해야 한다고 생각합니다. 첫째, 목적이 생명을 구하는 것처럼 중대해야 합니다. 이 기준을 적용하면 화장품처럼 새로운 선택지를 늘리는 것에 불과한 목적을 위해 동물에게 고통을 주는 것은 정당화될 수 없고, 여러 나라의 화장품 동물실험 금지는 옳은 방향입니다. 둘째, 대체 수단이 없어야 합니다. 인공 장기 칩이나 시뮬레이션으로 같은 결과를 얻을 수 있다면 동물실험을 선택할 이유가 사라집니다. 제시문의 3R 원칙은 이 두 조건을 제도화한 것이라고 이해합니다. 대체 가능하면 대체하고, 불가피하면 수를 줄이고, 하더라도 고통을 최소화하는 것입니다. 정리하면 저는 동물실험을 당장 전면 금지하는 것은 현실적으로 어렵지만, 그것을 '언젠가 없어져야 할 과도기적 수단'으로 규정하고 대체 기술에 투자하는 것이 문명이 가야 할 방향이라고 생각합니다."], "tips": ["반대 논거를 '윤리적/실용적'으로 갈라 정리하면 독해의 정밀함이 드러납니다.", "'과도기적 수단'이라는 규정은 찬반을 넘어서는 시간 축의 사고를 보여 줍니다.", "3R처럼 제시문에 등장한 원칙·개념은 자신의 기준과 연결해 반드시 활용하세요."]}, {"t": "국가 예산의 우선순위 정하기", "ty": "가치판단", "p": "정부의 예산은 한정되어 있고, 써야 할 곳은 늘 그보다 많다. 저출산 대응, 노인 복지, 국방, 연구개발(R&D), 교육, 사회기반시설 중 무엇을 늘리고 무엇을 줄일 것인가. 예산 배분은 단순한 회계가 아니라 그 사회가 무엇을 중요하게 여기는지를 보여 주는 가치의 선언이다.\n\n우선순위를 정하는 기준도 여럿이다. 가장 많은 사람에게 혜택이 가는 곳에 써야 한다는 효율의 기준, 가장 절박한 사람부터 도와야 한다는 필요의 기준, 미래 세대를 위한 투자가 우선이라는 시간의 기준이 서로 경쟁한다. 예컨대 노인 빈곤율이 높은 우리나라에서 노인 복지는 필요의 기준에서 시급하지만, 시간의 기준에서는 저출산과 교육·연구 투자가 우선일 수 있다. 민주주의 사회에서 이 선택은 결국 시민의 몫이다.", "q": ["제시문의 세 가지 기준(효율·필요·시간) 중 자신이 가장 중시하는 기준을 밝히고, 그 기준으로 예산을 배분할 때 생기는 문제를 어떻게 보완할지 말해 보세요."], "guide": "【제시문 분석】 '예산 = 가치의 선언'이라는 관점과 세 기준(효율·필요·시간)의 경쟁 구도가 뼈대입니다. 어떤 기준을 골라도 정답이지만, 선택한 기준의 약점을 스스로 알고 보완하는 것까지가 문제의 요구입니다.\n【답변 구성】 ① 기준 선택과 이유 → ② 그 기준의 적용 예시 → ③ 그 기준의 맹점 자인 → ④ 보완 장치(최저선 보장 등) → ⑤ 정리", "a": ["저는 '시간의 기준', 즉 미래 세대를 위한 투자를 가장 중시하고 싶습니다. 이유는 두 가지입니다. 첫째, 예산에는 시차가 있기 때문입니다. 교육과 연구개발, 저출산 대응은 효과가 10년, 20년 뒤에 나타나므로 지금 미루면 미래에는 아예 선택지가 사라집니다. 반면 당장의 필요는 그때그때의 예산으로도 대응할 여지가 있습니다. 둘째, 미래 세대는 지금의 예산 결정에 투표할 수 없기 때문입니다. 현재의 유권자만 보고 배분하면 예산은 구조적으로 현재 쪽으로 기울게 되므로, 의식적으로 미래에 가중치를 두는 것이 오히려 공정하다고 생각합니다.\n\n그러나 이 기준에는 분명한 맹점이 있습니다. 미래를 위한다는 이름으로 오늘 가장 절박한 사람들, 예를 들어 빈곤 속의 노인이나 위기 가정을 외면하면, 그것은 투자가 아니라 방치가 됩니다. 그래서 저는 두 가지 보완 장치를 두고 싶습니다. 첫째, 필요의 기준을 '최저선'으로 먼저 보장하는 것입니다. 생존과 존엄에 직결되는 복지는 우선순위 경쟁의 대상이 아니라 경쟁 이전에 확보해야 할 바닥으로 두고, 그 위에서 남은 재원의 우선순위를 시간의 기준으로 정하는 것입니다. 둘째, 미래 투자의 성과를 주기적으로 검증하는 것입니다. 미래라는 말은 낭비를 포장하기 쉬운 말이기 때문에, 효과가 확인되지 않는 사업은 조정해야 합니다. 정리하면, 저의 원칙은 '바닥은 필요로 지키고, 방향은 미래로 잡는다'입니다."], "tips": ["기준 선택형 문제의 핵심은 선택이 아니라 '선택한 기준의 약점을 아는가'입니다.", "'미래 세대는 투표할 수 없다'는 논거는 세대 정의 관련 문항 전반에 쓸 수 있습니다.", "'바닥은 필요, 방향은 미래'처럼 자신의 원칙을 한 문장으로 요약해 마무리하세요."]}, {"t": "규칙이 부당하다고 느껴질 때", "ty": "가치판단", "p": "소크라테스는 부당한 재판으로 사형을 선고받고도 탈옥을 권하는 제자에게 '나는 평생 이 나라의 법이 주는 혜택 속에 살았다'며 독배를 들었다. 후대에 '악법도 법이다'라는 말로 알려진 이 일화는, 공동체의 규칙이 개인의 판단과 어긋날 때 어떻게 해야 하는가라는 오랜 질문을 던진다.\n\n한 학교의 사례를 보자. 이 학교는 지각을 줄이기 위해 지각 1회당 벌점과 함께 소액의 벌금을 걷어 학급비로 쓰는 규칙을 학생 다수결로 정했다. 그런데 일부 학생들이 '돈으로 잘못을 갚는 것은 이상하다', '같은 5분 지각도 사정이 다른데 일률 부과는 부당하다'며 반발했다. 흥미롭게도 벌금제 도입 후 지각은 오히려 늘었다. '벌금만 내면 된다'는 인식이 지각의 죄책감을 지워 버렸다는 분석이 나왔다. 규칙은 왜 지켜야 하며, 부당해 보이는 규칙 앞에서 우리는 무엇을 할 수 있는가.", "q": ["벌금제 도입 후 지각이 오히려 늘어난 현상이 보여 주는 것을 분석해 보세요.", "부당하다고 생각하는 학교 규칙이 있을 때 자신은 어떻게 행동할지, 소크라테스의 일화와 연결지어 말해 보세요."], "guide": "【제시문 분석】 두 개의 이야기 — 소크라테스(준법의 근거)와 벌금제(규칙 설계의 역설). 벌금의 역설은 '도덕적 의무가 시장의 거래로 바뀌는 순간 규범의 힘이 사라진다'는 통찰입니다. 두 이야기를 연결하는 것이 관건입니다.\n【답변 구성】 [1] ① 현상 분석(죄책감→요금의 전환) → ② 함의(모든 규칙이 처벌 강화로 해결되지 않음) [2] ① 원칙: 지키면서 바꾼다 → ② 절차적 행동(문제 제기→공론화→개정 요구) → ③ 소크라테스 일화의 재해석과 연결", "a": ["벌금제 이후 지각이 늘어난 것은, 규칙 위반의 성격이 '잘못'에서 '거래'로 바뀌었기 때문이라고 분석합니다. 벌금이 없을 때 지각을 막던 힘은 처벌이 아니라 미안함과 책임감이라는 도덕적 규범이었습니다. 그런데 가격이 붙는 순간 지각은 '돈을 내면 살 수 있는 서비스'가 되어, 죄책감이라는 보이지 않는 비용이 사라진 것입니다. 이 현상이 보여 주는 것은 두 가지입니다. 첫째, 사람은 인센티브에 반응하지만 그 반응이 설계자의 의도대로만 움직이지는 않는다는 것, 둘째, 도덕의 영역을 돈의 영역으로 옮기면 규범 자체가 훼손될 수 있다는 것입니다. 규칙을 만들 때는 처벌의 크기보다 그 처벌이 구성원의 마음속에서 무엇을 의미하게 될지를 함께 설계해야 한다고 생각합니다.", "저의 원칙은 '지키면서 바꾼다'입니다. 부당하다고 느끼는 규칙이 있다면, 먼저 그 규칙이 왜 만들어졌는지 취지를 알아보겠습니다. 부당해 보였던 규칙에 몰랐던 이유가 있는 경우도 있기 때문입니다. 그래도 부당하다고 판단되면 어기는 방식이 아니라 바꾸는 절차를 밟겠습니다. 학급회의나 학생회에 정식으로 문제를 제기하고, 저와 같은 생각을 가진 친구들의 의견을 모으고, 대안을 담아 개정을 요구하는 것입니다. 그 절차가 진행되는 동안에는 규칙을 지키겠습니다. 소크라테스가 독배를 든 이유도 저는 '악법도 무조건 복종하라'가 아니라, 자신이 혜택을 누려 온 공동체의 질서를 사적인 판단으로 무너뜨리지 않겠다는 책임감이었다고 해석합니다. 다만 저는 소크라테스의 시대와 달리 우리에게는 규칙을 바꿀 민주적 절차가 열려 있다는 점이 중요하다고 생각합니다. 규칙을 어길 자유가 아니라 규칙을 바꿀 권리를 쓰는 것이, 규칙의 취지와 나의 양심을 모두 지키는 길이라고 생각합니다."], "tips": ["벌금의 역설(죄책감이 요금이 됨)은 유명한 실제 실험(어린이집 벌금 연구)에 기반한 논리입니다. 구조를 기억해 두세요.", "'지키면서 바꾼다'는 원칙은 교칙·규정 관련 모든 인성 문항의 표준 답안 구조입니다.", "소크라테스 인용은 '무조건 복종'으로 읽지 않고 재해석하는 모습이 사고력을 보여 줍니다."]}, {"t": "착한 사람은 손해를 본다", "ty": "가치판단", "p": "'착한 사람은 손해를 본다'는 말이 있다. 양보하는 사람은 순서를 빼앗기고, 거절하지 못하는 사람은 일을 떠안으며, 정직하게 신고한 사람만 세금을 더 내는 것처럼 보인다. 경쟁이 치열한 사회일수록 선함은 전략적으로 어리석은 선택이라는 냉소가 힘을 얻는다.\n\n그러나 반대의 증거들도 있다. 신뢰를 쌓은 사람에게 기회가 모이고, 협력적인 사람이 장기적으로 더 좋은 평판과 관계를 얻는다는 연구들이다. 문제는 '착함'이 무엇을 뜻하느냐일 수도 있다. 부당한 요구까지 받아 주는 것이 착함인가, 아니면 원칙을 지키며 남을 배려하는 것이 착함인가에 따라 이 명제의 답은 달라진다.", "q": ["'착한 사람은 손해를 본다'는 주장에 대한 자신의 견해를 밝히고, 근거 두 가지를 제시하되 그중 하나는 자신의 직접 또는 간접 경험과 연결지어 말해 보세요."], "guide": "【제시문 분석】 명제 검토형 문항입니다. 2문단이 두 개의 반박 경로를 제공합니다 — ① 시간 축(단기 손해, 장기 이익) ② 개념 축(착함의 재정의: 무른 것 ≠ 착한 것). 경험 연계는 필수 조건이므로 미리 준비된 사례가 필요합니다.\n【답변 구성】 ① 입장 → ② 근거 1(단기/장기의 구분, 신뢰 자산) → ③ 근거 2(경험 연계) → ④ 단서(원칙 없는 착함과의 구분) → ⑤ 정리", "a": ["저는 이 주장에 동의하지 않습니다. 다만 '단기적으로는 손해처럼 보일 수 있다'는 점은 인정하면서, 두 가지 근거로 반박하고 싶습니다.\n\n첫 번째 근거는 손익을 계산하는 시간의 길이입니다. 착함의 손해는 대부분 눈앞의 계산입니다. 양보한 순서, 빌려준 시간은 당장 잃은 것으로 보입니다. 하지만 그 행동들은 신뢰라는 자산으로 쌓입니다. 신뢰를 얻은 사람에게는 정보와 기회, 결정적인 순간의 도움이 모여들기 때문에, 계산의 기간을 길게 잡으면 선함은 손해가 아니라 가장 안정적인 투자라고 생각합니다. 두 번째 근거는 제 경험입니다. 시험 기간에 친구가 어려워하는 단원을 설명해 준 적이 있습니다. 제 공부 시간을 뺏기는 손해라고 생각할 수도 있었지만, 설명하는 과정에서 오히려 제 이해가 정리되어 그 단원 성적이 올랐고, 이후 그 친구가 저의 취약 과목을 도와주면서 서로의 부족함을 채우는 관계가 만들어졌습니다. 착한 행동이 만든 관계가 다시 저를 돕는 순환을 직접 경험한 것입니다.\n\n다만 하나의 단서를 붙이고 싶습니다. 부당한 요구를 거절하지 못하는 것은 착함이 아니라 자기 존중의 부족이라고 생각합니다. 제시문의 표현을 빌리면, 손해를 보는 것은 착한 사람이 아니라 원칙 없이 무른 사람입니다. 원칙 위에 선 선함은 존중을 부르고, 그런 사람은 결국 손해 보지 않는다고 믿습니다."], "tips": ["'하나는 경험과 연결하라'는 조건은 채점 기준입니다. 반드시 이행하세요.", "'착함'과 '무름'을 구분하는 재정의가 이 문항의 결정적 득점 포인트입니다.", "경험담은 결과(성적·관계의 순환)까지 말해야 근거로 완성됩니다."]}, {"t": "받은 것과 베푼 것의 계산법", "ty": "가치판단", "p": "어떤 사람이 인생의 만족을 이렇게 계산한다고 하자. '내가 받은 혜택(A)에서 내가 베푼 혜택(B)을 뺀 값(C=A-B)이 클수록 나는 이득을 본 인생이다.' 이 계산법에 따르면 남에게 많이 베풀수록 C는 작아지므로, 베풂은 손해가 된다.\n\n그러나 이 수식에는 숨은 전제가 있다. 받는 것만이 이득이고 베푸는 것은 순수한 지출이라는 전제다. 심리학 연구들은 다른 결과를 보여 준다. 남을 도운 사람이 도움을 받은 사람보다 행복감이 높게 나타나는 경우가 많고, 기부와 봉사가 삶의 만족도와 건강에도 긍정적이라는 것이다. 베푸는 행위 자체가 A에 더해지는 새로운 혜택이라면, 수식은 다시 써져야 할지도 모른다.", "q": ["C=A-B라는 계산법의 문제점을 분석하고, 자신이 생각하는 '잘 사는 삶'의 계산법을 경험을 바탕으로 제안해 보세요."], "guide": "【제시문 분석】 수식 비판형 문항입니다. 공격 지점은 전제 — ① 베풂을 지출로만 계산(베풂의 내적 보상 누락) ② 혜택을 제로섬으로 가정(관계 속에서 혜택은 상호 증폭) ③ 만족을 '남보다 더 받음'으로 정의한 것 자체.\n【답변 구성】 ① 수식의 숨은 전제 지적 → ② 반증(베풂의 심리적 보상, 관계 자산) → ③ 자기만의 수식 제안 → ④ 경험으로 검증 → ⑤ 정리", "a": ["이 계산법의 문제는 수식 자체가 아니라 그 밑에 깔린 전제에 있다고 생각합니다. 첫째, 베풂을 순수한 지출로만 계산합니다. 그러나 제시문의 연구처럼 남을 돕는 행위는 그 자체로 행복감과 만족이라는 보상을 줍니다. 제가 누군가를 도울 때 얻는 뿌듯함이 실재한다면, B는 빼기만 하는 항이 아니라 동시에 A를 늘리는 항이기도 합니다. 둘째, 이 수식은 혜택의 총량이 정해져 있다고 가정합니다. 하지만 관계 속에서 베풂은 상대의 베풂을 부르고, 서로 돕는 관계에서는 A와 B가 함께 커집니다. 혜택은 뺏고 뺏기는 제로섬이 아니라 주고받으며 불어나는 것입니다. 셋째, 가장 근본적으로는 '남보다 더 받아 내는 것'을 잘 사는 삶으로 정의한 것 자체가 빈약하다고 생각합니다.\n\n저라면 잘 사는 삶의 계산법을 '내가 주고받으며 만든 관계와 성장의 총합'으로 다시 쓰고 싶습니다. 받은 것과 베푼 것을 빼는 것이 아니라 더하는 것입니다. 저의 경험으로, 학급에서 수학을 어려워하는 친구를 한 학기 동안 도운 적이 있습니다. C=A-B의 계산으로는 제 시간만 쓴 손해였지만, 실제로는 설명하며 깊어진 제 실력, 그 친구와의 우정, 그리고 '나도 누군가에게 도움이 되는 사람'이라는 자존감까지, 뺄셈으로는 잡히지 않는 것들이 남았습니다. 이득을 계산하는 수식이 어떠하냐에 따라 삶의 방향이 달라진다면, 저는 뺄셈이 아니라 덧셈의 수식을 선택하고 싶습니다."], "tips": ["수식·모델이 나오는 제시문은 '수식의 숨은 전제'를 공격하는 것이 정석입니다.", "자신만의 대안 수식(덧셈의 계산법)을 제시하면 비판을 넘어 구성 능력을 보여 줍니다.", "봉사·멘토링 경험이 있다면 이 문항과 봉사의 가치 문항에 공용으로 쓸 수 있게 정리해 두세요."]}, {"t": "익명성은 자유인가 가면인가", "ty": "가치판단", "p": "인터넷의 익명성은 두 얼굴을 갖고 있다. 한쪽에서 익명성은 약자의 방패다. 내부 고발자가 조직의 비리를 폭로하고, 억압적인 사회의 시민이 처벌의 두려움 없이 의견을 말할 수 있는 것은 익명성 덕분이다. 이름을 밝혀야만 말할 수 있는 사회에서는 힘 있는 사람만 말하게 된다.\n\n다른 한쪽에서 익명성은 폭력의 가면이다. 악성 댓글과 사이버 불링, 신상 털기와 혐오 표현은 '들키지 않는다'는 조건 아래에서 대담해진다. 심리학에서는 익명 상태에서 자기 통제와 책임감이 약해지는 현상을 '몰개성화'라고 부른다. 유명인들이 악성 댓글로 고통받다 세상을 떠나는 일이 반복되자, 인터넷 실명제를 도입하자는 주장이 힘을 얻었다. 그러나 우리나라 헌법재판소는 2012년 표현의 자유를 이유로 인터넷 실명제에 위헌 결정을 내린 바 있다.", "q": ["익명성의 두 얼굴을 정리하고, 인터넷 실명제에 대한 자신의 입장을 헌법재판소 결정을 참고하여 말해 보세요."], "guide": "【제시문 분석】 익명성의 양면 — 방패(약자의 발언권)와 가면(몰개성화된 폭력). 헌재의 위헌 결정은 '폭력 방지라는 목적이 정당해도 수단이 표현의 자유를 과도하게 제한하면 안 된다'는 비례의 논리입니다.\n【답변 구성】 ① 두 얼굴 요약 → ② 실명제에 대한 입장 → ③ 근거(실명제의 실효성 문제 + 방패 기능의 상실) → ④ 대안(처벌의 실효화, 플랫폼 책임, 디지털 시민교육) → ⑤ 정리", "a": ["익명성은 약자에게는 방패, 가해자에게는 가면입니다. 내부 고발과 자유로운 비판을 가능하게 하는 힘과, 몰개성화 속에서 폭력을 대담하게 만드는 힘이 같은 뿌리에서 나옵니다.\n\n저는 인터넷 실명제 도입에 반대합니다. 근거는 세 가지입니다. 첫째, 실명제는 가면만 벗기는 것이 아니라 방패까지 빼앗습니다. 모든 발언에 이름이 붙는 순간 가장 먼저 침묵하는 것은 악플러가 아니라 내부 고발자와 사회적 약자입니다. 힘 있는 사람만 말할 수 있는 공간이 되는 것입니다. 둘째, 실효성의 문제입니다. 실명제가 시행됐던 기간에 악성 댓글이 기대만큼 줄지 않았다는 분석이 있었고, 오히려 수집된 실명 정보가 대규모로 유출되는 부작용이 있었습니다. 헌법재판소가 위헌 결정을 내린 것도 목적이 정당하다고 해서 기본권을 과도하게 제한하는 수단까지 정당화되지는 않는다는 판단이었다고 이해합니다.\n\n다만 반대가 방치를 뜻해서는 안 되므로 대안이 필요합니다. 저는 '익명의 보장, 책임의 추적'이 원칙이 되어야 한다고 생각합니다. 평소에는 익명을 보장하되, 범죄 수준의 폭력에 대해서는 수사를 통해 반드시 책임을 물을 수 있게 하고, 플랫폼에는 혐오·모욕 콘텐츠에 대한 신속한 조치 의무를 지우는 것입니다. 여기에 어릴 때부터의 디지털 시민교육이 더해져야 합니다. 결국 문제는 이름을 가리는 기술이 아니라 가려졌을 때 드러나는 시민의식의 수준이며, 제도는 그 의식이 자랄 때까지의 안전장치라고 생각합니다."], "tips": ["헌재 결정 같은 제도적 사실이 제시문에 있으면 그 논리(비례 원칙)를 자기 근거로 흡수하세요.", "'방패까지 빼앗는다'는 논거는 실명제 반대의 급소입니다. 찬성 입장이라면 이 논거에 대한 방어를 준비해야 합니다.", "'익명의 보장, 책임의 추적'처럼 대안을 표어화하면 설득력이 커집니다."]}, {"t": "안전과 자유 — 감시 카메라의 확대", "ty": "가치판단", "p": "우리나라의 공공 CCTV는 100만 대를 넘어섰고, 여기에 차량 블랙박스와 스마트폰까지 더하면 도시의 거의 모든 공간이 기록되고 있다. 범죄 예방과 검거에서 CCTV의 효과는 분명하다. 강력 사건의 상당수가 CCTV 분석으로 해결되고, 어두운 골목의 카메라는 시민들에게 안심을 준다. 최근에는 AI가 영상 속 얼굴을 실시간으로 인식해 수배자를 찾아내는 기술까지 등장했다.\n\n그러나 '지켜보는 눈'이 늘어날수록 다른 질문도 커진다. 잘못한 것이 없어도 늘 기록되는 삶은 자유로운가. 감시받는다는 의식은 사람들의 행동을 위축시키고, 축적된 영상 정보가 유출되거나 권력에 의해 남용될 위험도 있다. 얼굴 인식 기술을 결합한 전면적 감시 시스템을 운영하는 국가의 사례는, 안전을 명분으로 한 기술이 통제의 도구가 될 수 있음을 보여 준다. 안전과 자유, 우리는 어디쯤에서 선을 그어야 하는가.", "q": ["CCTV 확대를 둘러싼 두 가치의 충돌을 설명하고, '잘못한 게 없으면 감시를 두려워할 필요가 없다'는 주장에 대한 자신의 견해를 말해 보세요."], "guide": "【제시문 분석】 안전(범죄 예방의 실증 효과) vs 자유·프라이버시(위축 효과, 남용 위험)의 고전적 충돌입니다. '잘못 없으면 두려울 것 없다'는 주장의 허점 — 감시의 문제는 죄의 유무가 아니라 권력관계와 위축 효과 — 을 짚는 것이 핵심입니다.\n【답변 구성】 ① 두 가치 충돌 정리 → ② 해당 주장의 논리 요약 → ③ 반박 3단계(전제의 오류, 위축 효과, 남용 가능성) → ④ 균형점(목적 제한·보관 기한·독립 감독) → ⑤ 정리", "a": ["CCTV 확대는 범죄로부터의 안전이라는 가치와, 기록되지 않을 자유라는 가치의 충돌입니다. 안전의 편익은 사건 해결처럼 눈에 보이는 반면, 자유의 손실은 서서히 일어나 보이지 않는다는 점이 이 논쟁을 어렵게 만듭니다.\n\n'잘못한 게 없으면 두려워할 필요가 없다'는 주장은 직관적이지만, 세 가지 점에서 동의하기 어렵습니다. 첫째, 이 주장은 프라이버시를 '숨길 것이 있는 사람의 권리'로 오해하고 있습니다. 우리가 일기장을 잠그고 커튼을 치는 것은 죄가 있어서가 아닙니다. 감시받지 않을 권리는 잘못의 유무와 무관한, 인간이 자기 삶의 주인이기 위한 기본 조건입니다. 둘째, 위축 효과입니다. 늘 기록된다는 의식은 사람들의 표현과 행동을 무난한 쪽으로 길들입니다. 집회에 나가거나 소수 의견을 말하는 일이 '기록될 일'이 되는 순간, 민주주의의 활력 자체가 줄어듭니다. 셋째, 감시의 문제는 '지금의 나'가 아니라 '데이터를 쥔 권력'에 있습니다. 선한 목적으로 모인 정보도 유출되거나 다른 정부, 다른 목적 아래에서 통제의 도구로 바뀔 수 있다는 것을 해외 사례가 보여 줍니다.\n\n그래서 저는 CCTV 자체를 반대하기보다 조건을 걸고 싶습니다. 설치는 범죄 예방 효과가 확인되는 장소에 한정하고, 영상의 보관 기한과 접근 권한을 엄격히 제한하며, 얼굴 인식 같은 고위험 기술은 법원의 통제와 독립 기구의 감독 아래에만 허용하는 것입니다. 안전은 소중하지만, 감시의 편리함에 익숙해질수록 자유의 감각은 무뎌지기 때문에, 선은 기술이 아니라 시민이 그어야 한다고 생각합니다."], "tips": ["'잘못 없으면 문제없다' 류의 직관적 주장은 전제를 드러내 반박하는 훈련의 좋은 소재입니다.", "'편익은 보이고 손실은 보이지 않는다'는 비대칭 구조를 짚으면 분석의 깊이가 생깁니다.", "전면 반대가 아니라 '조건과 통제 장치'로 답하는 것이 균형 잡힌 인상을 줍니다."]}, {"t": "조삼모사 다시 읽기", "ty": "고전·문학", "p": "송나라의 저공(狙公)은 원숭이들에게 도토리를 아침에 세 개, 저녁에 네 개 주겠다고 했다. 원숭이들이 화를 내자 그는 말을 바꾸었다. \"그러면 아침에 네 개, 저녁에 세 개를 주마.\" 원숭이들은 기뻐했다. 총량은 일곱 개로 같은데도 배열만 바꾸자 반응이 달라진 것이다. '조삼모사(朝三暮四)'는 흔히 잔꾀로 남을 속이는 일, 또는 눈앞의 차이에 속는 어리석음을 비웃는 말로 쓰인다.\n\n그러나 이 이야기는 다르게 읽을 수도 있다. 원숭이들에게는 불확실한 저녁보다 확실한 아침이 중요했을 수 있고, 배고픈 아침에 하나 더 받는 것이 실제로 더 나은 선택일 수도 있다. 행동경제학은 인간 역시 같은 금액이라도 받는 시점과 표현 방식(프레임)에 따라 전혀 다르게 반응한다는 것을 보여 준다. '10% 할인'과 '10% 추가 증정'에 대한 소비자의 선택이 달라지는 것처럼, 조삼모사는 어리석음의 이야기가 아니라 인간 심리의 이야기일지도 모른다.", "q": ["조삼모사의 전통적 교훈과 제시문의 새로운 해석을 비교하고, 일상에서 '표현 방식이 판단을 바꾼' 사례를 들어 자신의 생각을 말해 보세요."], "guide": "【제시문 분석】 1문단은 전통적 독해(총량이 같으니 속은 것), 2문단은 재해석(시점 선호와 프레임 효과는 비합리가 아닐 수 있음). 고전을 현대 개념(행동경제학·프레이밍)으로 다시 읽는 구조 자체가 출제 의도입니다.\n【답변 구성】 ① 두 해석 비교 → ② 자기 견해(둘의 종합: 프레임에 흔들리는 존재임을 아는 것이 지혜) → ③ 일상 사례 → ④ 적용(설득할 때와 판단할 때의 활용) → ⑤ 정리", "a": ["전통적 해석에서 조삼모사의 교훈은 '총량이 같은데 배열에 속지 말라'는 것입니다. 원숭이는 어리석음의 상징이고, 우리는 본질을 꿰뚫어 보라는 가르침을 받습니다. 반면 제시문의 새로운 해석은 원숭이의 선택에도 나름의 합리성이 있을 수 있다고 봅니다. 불확실한 미래보다 확실한 현재를 선호하는 것, 같은 내용도 표현 방식에 따라 다르게 받아들이는 것은 원숭이만의 어리석음이 아니라 인간 심리의 보편적 특성이라는 것입니다.\n\n저는 두 해석을 이렇게 종합하고 싶습니다. 조삼모사의 진짜 교훈은 '속지 않는 완벽한 이성이 되라'가 아니라, '나 역시 프레임에 흔들리는 존재임을 알라'는 것입니다. 제 일상의 사례를 들면, 같은 시험 결과를 두고 '20문제 중 5개 틀렸다'고 생각한 날은 우울했는데, '15개 맞혔다'고 적어 본 날은 남은 5개를 채울 의욕이 생겼습니다. 사실은 같은데 표현이 저의 감정과 행동을 바꾼 것입니다. 또 상품 광고의 '무이자 할부'나 '한정 수량' 같은 표현 앞에서 제 판단이 흔들리는 것을 느낄 때마다, 저는 스스로에게 '총량은 얼마인가'를 묻는 습관을 들이려고 합니다.\n\n정리하면, 프레임은 속임수가 될 수도 있고 지혜가 될 수도 있습니다. 남을 속이는 데 쓰면 잔꾀지만, 같은 현실을 더 나은 행동으로 이끄는 데 쓰면 삶의 기술이 됩니다. 고전이 저에게 남긴 질문은 '너는 프레임을 어느 쪽으로 쓰고 있는가'라고 생각합니다."], "tips": ["고전 재해석 문항은 '전통 독해 → 새 독해 → 종합'의 3단 구조가 안정적입니다.", "프레이밍 효과의 일상 사례(시험 점수, 할인 표현)를 하나 준비하면 여러 문항에 활용됩니다.", "'고전이 나에게 남긴 질문'으로 끝맺는 방식은 고전 문항 전반에서 좋은 마무리가 됩니다."]}, {"t": "법고창신 — 옛것에서 새것을 만들다", "ty": "고전·문학", "p": "연암 박지원은 '법고창신(法古創新)'을 말했다. 옛것을 본받되 그대로 답습하지 말고, 새것을 만들되 근본을 잃지 말라는 뜻이다. 그는 옛글만 흉내 내는 사람도, 근본 없이 기발함만 좇는 사람도 함께 비판했다. 옛것을 제대로 알아야 무엇을 바꿔야 할지 보이고, 새로움은 그 토대 위에서만 생명력을 갖는다는 것이다.\n\n이 정신은 시대를 넘어 반복된다. 공자는 '옛것을 익혀 새것을 안다(온고지신)'고 했고, 스티브 잡스는 인문학과 기술의 교차점에서 혁신이 나온다며 서체 수업에서 배운 타이포그래피를 컴퓨터에 접목했다. 우리 주변에서도 한옥의 구조를 살린 현대 건축, 국악과 힙합을 결합한 음악, 전통 문양을 활용한 디자인처럼 법고창신의 사례는 이어지고 있다.", "q": ["법고창신의 의미를 설명하고, 자신의 삶이나 학습에서 '옛것을 바탕으로 새것을 만든' 경험 또는 앞으로 적용하고 싶은 분야를 말해 보세요."], "guide": "【제시문 분석】 법고창신의 핵심은 '본받되 답습하지 않고, 창조하되 근본을 잃지 않는' 이중 부정의 균형입니다. 답습만 하는 사람과 근본 없이 기발함만 좇는 사람, 양쪽 비판을 모두 담아야 정확한 이해입니다.\n【답변 구성】 ① 개념 설명(양쪽 극단의 비판 포함) → ② 사례로 원리 확인(잡스 등) → ③ 자기 경험 또는 적용 계획(공부법·탐구·진로) → ④ 진학 후 포부로 연결", "a": ["법고창신은 옛것을 본받되 거기에 갇히지 말고, 새것을 만들되 근본을 잃지 말라는 가르침입니다. 중요한 것은 이 말이 양쪽을 동시에 비판한다는 점입니다. 옛글만 흉내 내는 답습도, 토대 없이 기발함만 좇는 창신도 모두 반쪽이라는 것입니다. 스티브 잡스의 사례가 이 원리를 잘 보여 줍니다. 서체라는 오래된 전통을 깊이 배웠기에 그것을 컴퓨터라는 새 그릇에 옮길 수 있었습니다. 새로움은 무에서 나오는 것이 아니라, 옛것을 깊이 아는 사람이 그것을 낯선 곳에 연결할 때 나온다고 생각합니다.\n\n저의 학습에서 이 원리를 경험한 적이 있습니다. 수학 오답 노트를 처음에는 선배들이 하던 방식 그대로 틀린 문제와 풀이를 옮겨 적었는데, 시간만 들고 효과가 없었습니다. 그래서 방식의 '근본'이 무엇인지 생각해 보니, 핵심은 베껴 쓰기가 아니라 '왜 틀렸는지의 기록'이었습니다. 그 근본만 남기고 형식을 바꿔, 문제 대신 '내가 틀린 이유 한 줄과 다음에 쓸 전략 한 줄'만 적는 저만의 노트로 바꾸자 복습 시간은 줄고 같은 실수는 눈에 띄게 줄었습니다. 전통적 방법을 먼저 제대로 해 봤기에 무엇을 바꿔야 할지 보였다고 생각합니다.\n\n앞으로는 이 태도를 언어와 문화 공부에 적용하고 싶습니다. 우리 문화의 원형을 깊이 공부한 사람이 그것을 세계의 언어로 새롭게 전할 수 있다고 믿기 때문에, 진학 후에 고전과 역사를 탄탄히 읽는 것부터 시작하려고 합니다."], "tips": ["사자성어 문항은 뜻풀이에서 멈추지 말고 '양쪽 극단 비판'이라는 구조까지 설명해야 깊이가 생깁니다.", "공부법 개선 경험은 자기주도학습 전형에서 가장 환영받는 사례 유형입니다.", "마지막의 진학 후 계획 연결은 짧게, 그러나 반드시 하세요."]}, {"t": "하종오 '동승' — 같은 버스 안의 세계", "ty": "고전·문학", "p": "국철을 타고 앉아 있는 '나'의 맞은편에 동남아시아인 두 사람이 앉아 있다. 서로 다른 나라 사람인 듯한 두 사람은 창밖을 두리번거리며 자기 나라 말로 조심스럽게 이야기를 나눈다. 시의 화자는 그들이 무슨 이야기를 하는지 알아듣지 못하면서도, 고향을 떠나 낯선 땅에서 일하며 살아가는 그들의 처지를 헤아려 본다. 그리고 그들과 함께 같은 방향으로 실려 가는 자신을 발견한다.\n\n하종오의 시 '동승(同乘)'은 이주 노동자와 한 차량에 '함께 타고 있다'는 사실에서 출발한다. 국적과 언어가 달라도 같은 시대, 같은 사회라는 하나의 차를 타고 같은 방향으로 가고 있다는 자각이다. 우리나라의 등록 외국인은 이미 200만 명을 넘어, '동승'은 시적 상상이 아니라 통계적 현실이 되었다.", "q": ["시의 제목 '동승'에 담긴 의미를 해석해 보세요.", "이주민과 '함께 타고 있는' 우리 사회가 갖추어야 할 태도를 구체적 상황을 들어 말해 보세요."], "guide": "【제시문 분석】 '동승'의 이중적 의미 — 물리적(같은 차량에 탐)과 상징적(같은 시대·사회를 함께 살아감)을 해석하는 것이 1번의 핵심. 화자의 태도(알아듣지 못해도 처지를 헤아림)가 2번 답변의 모델입니다.\n【답변 구성】 [1] ① 표면적 의미 → ② 상징적 의미 → ③ 화자의 시선(관찰→공감→동질감의 이동) [2] ① 태도 제시(시혜가 아닌 동료 의식) → ② 구체적 상황(학교·직장·동네) → ③ 정리", "a": ["'동승'은 표면적으로는 같은 국철에 함께 타고 있다는 사실을 가리키지만, 시인이 말하려는 것은 그 너머의 의미라고 생각합니다. 국적도 언어도 다른 사람들이 같은 시대, 같은 사회라는 하나의 차에 올라 같은 방향으로 실려 가고 있다는 자각입니다. 주목할 것은 화자의 시선의 이동입니다. 처음에는 맞은편의 낯선 사람들을 관찰하다가, 알아듣지 못하는 말 너머로 고향을 떠나 일하는 그들의 처지를 헤아리고, 마침내 함께 실려 가는 자신을 발견합니다. 구경꾼의 시선이 동승자의 시선으로 바뀌는 것입니다. 저는 이 제목이 '그들이 우리 사회에 들어왔다'가 아니라 '우리가 이미 함께 가고 있다'는 관계의 재정의라고 해석합니다.", "함께 타고 있다면, 필요한 태도는 시혜가 아니라 동료 의식이라고 생각합니다. 구체적인 상황으로 학교를 들고 싶습니다. 이주 배경 친구가 전학을 왔을 때, '도와줘야 할 대상'으로 대하는 것과 '함께 배우는 동료'로 대하는 것은 다릅니다. 모둠 활동에서 그 친구에게 가장 쉬운 일만 맡기는 것은 배려처럼 보이지만 사실은 배제입니다. 그 친구가 잘하는 것, 예를 들어 모국어와 그 나라의 문화를 발표 주제로 삼아 역할을 주는 것이 동승자의 태도라고 생각합니다. 사회 차원에서도 마찬가지입니다. 이주 노동자를 '부족한 일손을 채우는 수단'으로만 보면 임금 체불이나 위험한 작업 환경에 둔감해지지만, 같은 차의 승객으로 보면 안전과 권리는 당연히 함께 지켜야 할 것이 됩니다. 시가 저에게 남긴 질문은 '나는 그들을 구경하고 있는가, 함께 타고 있는가'입니다. 같은 방향으로 가는 차 안에서는, 누군가의 자리가 위험하면 결국 차 전체가 흔들린다고 생각합니다."], "tips": ["문학 제시문은 제목·시어의 '이중적 의미'(표면/상징)를 해석하는 것이 기본 문법입니다.", "화자의 시선 이동(관찰→공감→동일시)을 짚으면 시를 구조적으로 읽었다는 평가를 받습니다.", "'시혜가 아니라 동료 의식'은 다문화 관련 모든 문항에 통하는 핵심 태도입니다."]}, {"t": "관점의 상대성 — 기차 안의 사과", "ty": "고전·문학", "p": "(가) 달리는 기차 안에서 사과를 위로 던졌다 받는 사람에게 사과는 제자리에서 오르내린 것이다. 그러나 기차 밖에 서 있는 사람에게 그 사과는 기차와 함께 수십 미터를 날아간 포물선을 그린 것이다. 물리학은 두 관찰 모두 옳다고 말한다. 운동은 어디에서 보느냐에 따라 달라지기 때문이다.\n\n(나) 어떤 문화권에서는 장례에서 곡을 크게 하는 것이 효심이고, 다른 문화권에서는 침묵이 애도다. 한 인류학자는 낯선 부족의 풍습을 '야만'이라 기록했다가, 그 부족이 자신들의 풍습을 어떻게 설명하는지 듣고 기록을 고쳐 썼다. 안에서 보면 질서인 것이 밖에서 보면 기이해 보일 수 있다.\n\n(다) 그러나 '모든 것이 관점의 차이'라는 말이 모든 것을 정당화하지는 않는다. 인신공희처럼 인간의 생명과 존엄을 해치는 관습 앞에서도 '그들의 문화'라며 물러서야 하는가. 관점의 상대성을 인정하는 것과 모든 가치판단을 포기하는 것은 다른 문제다.", "q": ["(가)와 (나)의 공통된 원리를 설명하고, (다)가 제기하는 문제에 대한 자신의 기준을 말해 보세요."], "guide": "【제시문 분석】 (가)물리학과 (나)문화의 공통 원리는 '기준계에 따라 같은 현상이 다르게 기술된다'는 것. (다)는 상대주의의 한계선을 묻습니다. '이해의 상대주의는 넓게, 정당화의 상대주의는 좁게'라는 구분이 열쇠입니다.\n【답변 구성】 ① 공통 원리 추출(관찰의 기준계) → ② (다)의 문제의식 정리 → ③ 자기 기준: 이해와 정당화의 구분, 보편적 한계선(생명·존엄) → ④ 적용 예시 → ⑤ 정리", "a": ["(가)와 (나)의 공통 원리는, 같은 현상도 어떤 기준에서 보느냐에 따라 다르게 기술되며 각 기준 안에서는 모두 타당할 수 있다는 것입니다. 기차 안의 사람과 밖의 사람이 본 사과의 운동이 모두 옳은 것처럼, 문화의 풍습도 그 안의 맥락에서 보면 나름의 질서를 갖고 있습니다. 물리학의 상대성이 문화 이해의 태도로 확장된 것입니다.\n\n그러나 (다)는 이 원리를 끝까지 밀고 가면 부딪히는 문제, 즉 '모든 것이 관점 차이라면 어떤 것도 비판할 수 없는가'를 제기합니다. 저의 기준은 '이해'와 '정당화'를 구분하는 것입니다. 낯선 문화를 판단하기 전에 그 내부의 맥락에서 이해하려는 노력은 최대한 넓게 해야 합니다. 인류학자가 기록을 고쳐 쓴 것처럼, 성급한 야만 규정은 대부분 무지의 산물이기 때문입니다. 하지만 이해가 곧 정당화는 아닙니다. 인간의 생명과 존엄을 직접 해치는 관습은 '그들의 관점'이라는 이유로 허용될 수 없다고 생각합니다. 관점의 상대성이 성립하려면 관점을 가진 인간들이 먼저 존재해야 하는데, 생명과 존엄의 침해는 그 전제 자체를 부수기 때문입니다. 즉 상대주의가 설 수 있는 바닥에는 최소한의 보편이 필요합니다.\n\n일상에 적용하면, 저와 다른 의견이나 문화를 만났을 때 '틀렸다'고 하기 전에 그 사람의 기차에 한번 타 보려는 노력을 하되, 누군가를 해치는 일 앞에서는 관점의 차이라는 말 뒤로 숨지 않는 것. 그것이 제가 이 세 제시문에서 얻은 기준입니다."], "tips": ["과학 제시문과 인문 제시문을 하나의 원리로 묶는 것이 융합형 문항의 핵심 기술입니다.", "'이해는 넓게, 정당화는 좁게'라는 구분은 문화 상대주의 문항의 만능 열쇠입니다.", "(다)처럼 앞의 논리를 뒤집는 제시문이 있으면, 그것이 진짜 질문입니다. 반드시 정면으로 답하세요."]}, {"t": "우물 안 개구리와 바다 이야기", "ty": "고전·문학", "p": "『장자』에는 우물 안 개구리 이야기가 나온다. 우물 안 개구리에게 바다를 말해 줄 수 없는 것은 그가 우물이라는 공간에 갇혀 있기 때문이고, 여름 벌레에게 얼음을 말해 줄 수 없는 것은 그가 여름이라는 시간에 갇혀 있기 때문이며, 편협한 선비에게 도(道)를 말해 줄 수 없는 것은 그가 자신이 배운 가르침에 갇혀 있기 때문이라는 것이다.\n\n장자의 통찰은 '갇힘'이 공간만의 문제가 아니라는 데 있다. 시간에 갇히고, 배움에 갇힌다. 오늘의 우리에게는 새로운 우물도 생겼다. 알고리즘이 만들어 주는 정보의 우물, 비슷한 사람들끼리 모인 커뮤니티의 우물, 성적과 입시라는 시야의 우물이다. 우물이 나쁜 것만은 아니다. 개구리는 우물 덕분에 안전하게 자랐다. 문제는 우물을 세상의 전부로 아는 것, 그리고 우물 밖 이야기를 하는 이를 비웃는 것이다.", "q": ["장자가 말한 세 가지 '갇힘'을 설명하고, 자신이 갇혀 있(었)다고 느끼는 우물과 그곳에서 나오기 위한 노력을 말해 보세요."], "guide": "【제시문 분석】 세 갇힘의 구조 — 공간(우물), 시간(여름), 지식(배운 가르침). 2문단은 이를 현대의 우물(알고리즘·커뮤니티·입시 시야)로 번역하고, '우물 자체가 아니라 우물을 전부로 아는 것이 문제'라는 단서를 답니다.\n【답변 구성】 ① 세 갇힘 설명(공간·시간·지식) → ② 자기 우물의 고백(구체적으로) → ③ 나오려는 노력(행동 수준) → ④ '우물의 효용'까지 언급하며 균형 있게 마무리", "a": ["장자는 갇힘을 세 겹으로 말합니다. 개구리는 우물이라는 공간에, 여름 벌레는 계절이라는 시간에, 편협한 선비는 자신이 배운 지식에 갇혀 있습니다. 갈수록 갇힘의 차원이 깊어지는 것이 이 이야기의 묘미라고 생각합니다. 공간의 갇힘은 눈에 보이지만, 시간의 갇힘은 알아차리기 어렵고, 배움의 갇힘은 오히려 '내가 안다'는 확신의 모습으로 나타나 가장 벗어나기 어렵기 때문입니다.\n\n저의 우물을 고백하자면, 저는 한동안 '성적의 우물'에 갇혀 있었다고 생각합니다. 공부의 목적이 등수가 되면서, 시험에 나오지 않는 책은 시간 낭비로 느껴지고 친구는 은근한 경쟁자로 보이던 시기가 있었습니다. 그 우물에서 나오게 된 계기는 독서 동아리에서 시험과 무관한 책 한 권을 읽고 토론했던 경험입니다. 등수와 상관없는 배움이 주는 즐거움을 다시 느끼면서, 제가 좁은 기준 하나로 세상과 저 자신을 재고 있었다는 것을 알게 되었습니다. 그 뒤로 저는 한 달에 한 번은 제 관심사 밖의 책이나 강연을 일부러 접하고, 저와 생각이 다른 친구의 말을 끝까지 들어 보는 연습을 하고 있습니다.\n\n다만 제시문의 마지막처럼, 우물 자체를 부정하고 싶지는 않습니다. 우물은 저를 키워 준 안전한 토대이기도 했습니다. 중요한 것은 우물을 부수는 것이 아니라, 우물 밖에 바다가 있다는 것을 잊지 않는 것, 그리고 바다를 말하는 사람을 비웃지 않는 겸손이라고 생각합니다. 저에게 고등학교 진학은 더 큰 우물로 옮기는 일이 아니라, 바다로 나가는 연습을 시작하는 일이었으면 합니다."], "tips": ["세 갇힘의 '차원이 깊어지는 구조'(공간→시간→지식)를 짚으면 독해력이 빛납니다.", "자기 우물의 고백은 진솔할수록 좋습니다. 성적·알고리즘·또래 문화 등 실제 자기 것을 고르세요.", "'우물의 효용'까지 언급하는 균형이 제시문을 끝까지 읽었다는 증거가 됩니다."]}, {"t": "무지의 베일 — 공정한 규칙 만들기", "ty": "철학", "p": "철학자 존 롤스는 공정한 사회의 규칙을 정하는 사고실험을 제안했다. 규칙을 정하는 사람들이 '무지의 베일'을 쓴다고 상상해 보자. 베일을 쓰면 자신이 부자인지 가난한지, 어떤 재능을 가졌는지, 건강한지 아픈지 전혀 모르는 상태가 된다. 이 상태에서 사회의 규칙을 정한다면, 사람들은 자신이 가장 불리한 자리에 태어날 가능성까지 고려해 약자에게도 견딜 만한 규칙을 만들게 된다는 것이다.\n\n예를 들어 급식 당번이 케이크를 자르는 규칙을 생각해 보자. '자르는 사람이 마지막 조각을 가져간다'는 규칙 아래에서 당번은 모든 조각을 최대한 똑같이 자르려고 노력하게 된다. 자신이 어느 조각을 받을지 모르기 때문이다. 롤스의 통찰은 공정함이란 선한 마음이 아니라 '자신의 위치를 모르는 상태'라는 절차의 설계에서 나온다는 것이다.", "q": ["무지의 베일의 원리를 케이크 자르기 사례로 설명해 보세요.", "학교나 사회의 규칙 중 하나를 골라, 무지의 베일을 쓰고 다시 설계한다면 어떻게 바뀔지 말해 보세요."], "guide": "【제시문 분석】 핵심 원리: 공정 = 선의가 아니라 절차의 설계. '자기 위치에 대한 무지'가 이기심을 공정함으로 전환시키는 메커니즘을 정확히 이해해야 합니다. 케이크 사례는 그 메커니즘의 축소판입니다.\n【답변 구성】 [1] ① 원리 요약 → ② 케이크 사례에서 '무지'가 하는 역할 설명 → ③ 통찰(마음이 아니라 구조) [2] ① 규칙 하나 선택 → ② 현재 규칙의 문제(강자 기준) → ③ 베일 아래에서의 재설계 → ④ 정리", "a": ["무지의 베일의 원리는, 규칙을 정하는 사람이 자신의 위치를 모르게 만들면 이기심이 오히려 공정함을 만들어 낸다는 것입니다. 케이크 자르기가 정확한 예입니다. 자르는 사람이 마지막 조각을 갖는 규칙에서는, 어느 조각이 내 것이 될지 모르기 때문에 가장 작은 조각도 만족스럽도록 모든 조각을 똑같이 자르게 됩니다. 자르는 사람이 착해서가 아니라, 구조가 그렇게 만드는 것입니다. 저는 이 사고실험의 통찰이 '공정한 사회는 좋은 사람이 아니라 좋은 절차가 만든다'는 데 있다고 생각합니다. 사람의 선의는 변덕스럽지만, 잘 설계된 절차는 평범한 이기심조차 공정한 결과로 이끌기 때문입니다.", "저는 학급의 자리 배정 규칙을 다시 설계해 보고 싶습니다. 현재 많은 학급에서 자리는 키 순서나 선착순, 또는 성적순 선택권으로 정해지는데, 이 규칙들은 각각 특정한 사람들에게 유리합니다. 무지의 베일을 쓴다면, 나는 내 키도, 시력도, 집중력도, 친한 친구가 누구인지도 모르는 상태에서 규칙을 정해야 합니다. 그렇다면 저는 이런 규칙을 만들게 될 것입니다. 기본은 주기적인 추첨으로 하되, 시력이 나쁘거나 청력이 약한 학생처럼 특정 자리가 학습에 꼭 필요한 사람에게는 우선권을 주는 예외를 두는 것입니다. 내가 그 '특정 자리가 필요한 사람'일 수도 있기 때문에, 베일 아래에서는 누구나 이 예외에 동의하게 됩니다. 흥미로운 것은, 이렇게 만든 규칙이 실제로 지금 대부분의 사람이 공정하다고 느끼는 규칙과 비슷하다는 점입니다. 무지의 베일은 결국 '내가 가장 약한 사람이라면 이 규칙을 받아들일 수 있는가'라는 질문이고, 저는 규칙을 만들거나 평가할 때마다 이 질문을 던져 보려고 합니다."], "tips": ["철학 개념은 반드시 구체적 사례(케이크)로 번역해서 설명하세요. 개념어 반복은 이해의 증거가 아닙니다.", "'선의가 아니라 절차'라는 통찰이 이 문항의 핵심입니다. 이 한 문장을 자기 말로 만드세요.", "재설계 연습은 자리 배정, 청소 당번, 발표 순서 등 학급의 작은 규칙일수록 설득력 있습니다."]}, {"t": "관용의 역설", "ty": "철학", "p": "철학자 칼 포퍼는 '관용의 역설'을 제기했다. 무제한의 관용은 결국 관용 자체를 파괴한다는 것이다. 관용적인 사회가 불관용적인 세력, 즉 다른 생각을 폭력으로 억누르려는 세력까지 무한히 관용하면, 그 세력이 커져 관용적인 사회 자체를 무너뜨릴 수 있다. 그래서 포퍼는 '관용을 지키기 위해, 불관용에 대해서는 관용하지 않을 권리'를 사회가 가져야 한다고 주장했다.\n\n그러나 이 논리에는 조심해야 할 함정이 있다. '불관용 세력'을 판정하는 권한을 누가 갖는가의 문제다. 그 판정이 자의적으로 이루어지면, 관용의 역설은 마음에 들지 않는 의견을 '불관용'으로 낙인찍어 배제하는 도구로 변질될 수 있다. 나와 다른 의견과, 다름 자체를 없애려는 폭력을 구분하는 기준이 필요한 이유다.", "q": ["관용의 역설이 무엇인지 설명하고, '참아서는 안 되는 것'과 '참아야 하는 것'을 가르는 자신의 기준을 사례와 함께 말해 보세요."], "guide": "【제시문 분석】 1문단은 역설의 구조(무제한 관용 → 관용의 자멸), 2문단은 역설의 오남용 위험(판정 권한의 문제). 두 문단의 긴장을 모두 다뤄야 완전한 답입니다. 기준 설정이 문제의 핵심 요구입니다.\n【답변 구성】 ① 역설 설명 → ② 기준 제시(의견 vs 폭력, 토론 참여 vs 토론 자체의 파괴) → ③ 사례 적용(혐오 표현 등) → ④ 판정 권한의 위험까지 언급 → ⑤ 정리", "a": ["관용의 역설이란, 모든 것을 관용하는 사회는 관용을 파괴하려는 세력까지 허용하게 되어 결국 관용 자체가 무너진다는 역설입니다. 열린 사회가 살아남으려면 역설적으로 '불관용에 대한 불관용'이라는 최소한의 방어선이 필요하다는 것이 포퍼의 주장입니다.\n\n저의 기준은 '토론의 참여자인가, 토론 자체의 파괴자인가'입니다. 참아야 하는 것은 나와 다른 의견입니다. 아무리 불편하고 틀려 보이는 주장이라도, 그것이 근거를 들고 토론의 장에 들어와 설득을 시도하는 한 관용의 대상입니다. 참아서는 안 되는 것은 다름 자체를 없애려는 시도입니다. 특정 집단을 향한 혐오 선동, 폭력의 위협, 상대의 발언 기회 자체를 봉쇄하는 행동은 의견이 아니라 토론이라는 게임판을 부수는 행위이기 때문입니다. 예를 들어 '이민 정책을 줄여야 한다'는 주장은 제가 동의하지 않더라도 토론할 의견이지만, '특정 민족은 몰아내야 한다'며 증오를 조직하는 것은 토론이 아니라 폭력의 준비이므로 사회가 제지해야 한다고 생각합니다.\n\n다만 제시문의 경고처럼, '불관용'의 낙인이 남용되면 이 원리는 반대 의견을 지우는 무기가 됩니다. 그래서 판정은 가능한 한 좁게, 명백한 폭력성과 구체적 위험이 있는 경우로 한정해야 하고, 그 판단도 특정 권력이 아니라 법의 절차와 공론을 거쳐야 한다고 생각합니다. 관용의 방어선은 필요하지만, 그 선을 긋는 손이 떨려야 건강한 사회라고 생각합니다."], "tips": ["역설 설명 → 기준 → 남용 경계까지가 한 세트입니다. 마지막을 빠뜨리면 절반의 답입니다.", "'게임판을 부수는 행위'라는 비유처럼 기준을 감각적으로 전달하는 표현을 준비하세요.", "'선을 긋는 손이 떨려야 한다'처럼 신중함을 담은 마무리가 성숙한 인상을 남깁니다."]}, {"t": "의무와 결과 — 두 개의 윤리", "ty": "철학", "p": "(가) 칸트의 의무론은 행위의 옳고 그름이 결과가 아니라 원칙에 있다고 본다. 거짓말은 설령 좋은 결과를 낳더라도 옳지 않다. 사람을 언제나 목적으로 대하고 결코 수단으로만 대하지 말라는 것이 그의 정언명령이다. 열 명을 구하기 위해서라도 무고한 한 사람을 희생시키는 것은 허용되지 않는다.\n\n(나) 공리주의는 반대로 결과를 기준으로 삼는다. 옳은 행위란 관련된 모든 사람의 행복을 최대로 만드는 행위다. '최대 다수의 최대 행복'이라는 벤담의 말처럼, 열 명을 구할 수 있다면 한 사람의 희생은 안타깝지만 정당화될 수 있다.\n\n(다) 두 윤리는 일상에서도 부딪힌다. 불치병 환자에게 사실을 알리는 것이 옳은가, 희망을 위해 숨기는 것이 옳은가. 친구의 새 옷이 어울리지 않을 때 정직이 먼저인가, 배려가 먼저인가. 우리는 대부분 상황에 따라 두 기준 사이를 오가며 산다.", "q": ["의무론과 공리주의의 차이를 (다)의 사례 중 하나에 적용하여 설명해 보세요.", "두 윤리가 충돌할 때 자신은 어떤 기준으로 판단하는지, 실제 경험을 들어 말해 보세요."], "guide": "【제시문 분석】 의무론(원칙·인간=목적)과 공리주의(결과·행복 총량)의 대비를 정확히 잡고, (다)의 일상 사례로 두 이론을 '작동'시켜 보이는 것이 1번의 요구입니다. 2번은 자신의 메타 기준(언제 어떤 윤리를 쓰는가)을 묻습니다.\n【답변 구성】 [1] ① 두 이론의 기준 차이 → ② 사례 선택(환자 고지 등) → ③ 각 이론의 결론 도출 시범 [2] ① 자기 기준(예: 되돌릴 수 없는 일은 의무론, 조정 가능한 일은 결과 고려) → ② 경험 → ③ 정리", "a": ["의무론은 '무엇이 원칙에 맞는가'를, 공리주의는 '무엇이 모두의 행복을 크게 하는가'를 기준으로 삼습니다. 불치병 환자에게 사실을 알릴 것인가의 사례에 적용해 보겠습니다. 의무론자는 알려야 한다고 답할 것입니다. 거짓은 결과와 무관하게 옳지 않고, 환자를 진실을 감당할 수 없는 존재로 취급하는 것은 그를 목적이 아니라 보호의 대상, 즉 수단처럼 대하는 일이기 때문입니다. 자신의 남은 삶을 스스로 결정할 권리는 본인에게 있습니다. 반면 공리주의자는 상황을 계산할 것입니다. 진실이 환자의 남은 시간을 절망으로 채운다면, 가족과 환자의 행복 총량을 위해 희망적인 설명을 선택할 수도 있습니다. 같은 상황에서 두 이론이 정반대의 답을 내놓을 수 있다는 것이 두 윤리의 차이를 잘 보여 줍니다.", "저의 기준은 '되돌릴 수 있는가'입니다. 결과를 되돌릴 수 없는 문제, 특히 사람의 존엄이나 신뢰가 걸린 문제에서는 의무론적으로 원칙을 지키려고 합니다. 한번 무너진 신뢰는 좋은 의도로도 복구되지 않기 때문입니다. 반면 결과를 조정할 수 있는 일상의 문제에서는 상황과 결과를 고려합니다. 저의 경험을 말씀드리면, 친한 친구가 준비한 발표 자료가 부족해 보였을 때 고민한 적이 있습니다. 칭찬만 해 주는 것이 당장의 행복 총량은 컸겠지만, 발표는 내일이고 수정할 시간이 남아 있었습니다. 저는 '지금의 솔직함은 되돌릴 수 있는 상처지만, 발표의 실패는 되돌릴 수 없다'고 판단해서, 좋은 점을 먼저 말한 뒤 보완할 부분을 구체적으로 말해 줬습니다. 친구는 그날은 서운해했지만 발표를 잘 마친 뒤 고맙다고 했습니다. 이 경험으로 저는 정직과 배려가 반대말이 아니라, 배려란 정직을 전달하는 방식의 문제라는 것을 배웠습니다."], "tips": ["윤리 이론은 암기가 아니라 '사례에 작동시키는 능력'으로 평가됩니다. 반드시 적용 시범을 보이세요.", "'되돌릴 수 있는가' 같은 자기만의 메타 기준을 하나 세워 두면 모든 딜레마 문항에 응용됩니다.", "경험담은 갈등→판단 기준→행동→결과→배움의 5단계로 정리해 두세요."]}, {"t": "행복은 소득순이 아니다? — 이스털린의 역설", "ty": "철학", "p": "경제학자 이스털린은 흥미로운 현상을 발견했다. 한 나라 안에서는 소득이 높은 사람이 대체로 더 행복하다고 답하지만, 국가 전체의 소득이 일정 수준을 넘어서면 경제가 더 성장해도 국민의 평균 행복도는 거의 오르지 않는다는 것이다. 우리나라도 지난 수십 년간 소득이 몇 배로 늘었지만, 삶의 만족도 조사에서는 OECD 하위권을 벗어나지 못하고 있다.\n\n이 역설의 원인으로는 두 가지가 꼽힌다. 하나는 적응이다. 사람은 좋아진 조건에 금세 익숙해져 만족의 기준 자체가 올라간다. 다른 하나는 비교다. 행복이 절대적인 형편보다 남과의 비교에서 오는 사회에서는, 모두의 소득이 함께 올라도 상대적 위치는 그대로이므로 행복도 제자리다. 그래서 일부 학자들은 일정 수준 이후의 행복은 소득이 아니라 관계의 질, 건강, 시간의 여유, 일의 의미에서 온다고 말한다.", "q": ["이스털린의 역설을 설명하고, 우리나라의 삶의 만족도가 낮은 이유를 제시문의 개념(적응·비교)으로 분석해 보세요.", "자신이 생각하는 행복의 조건을 말하고, 그것을 위해 실천하는 것이 있다면 소개해 보세요."], "guide": "【제시문 분석】 역설의 정확한 구조 — 개인 간 비교에서는 소득∝행복이 성립하지만, 국가의 시간 축에서는 성립하지 않음. 원인 개념은 '적응'(기준의 상승)과 '비교'(상대적 위치). 한국 사회 분석에는 '비교' 개념이 특히 강력합니다.\n【답변 구성】 [1] ① 역설 설명(두 층위 구분) → ② 한국 적용: 비교 문화(서열화된 교육·SNS)와 적응 → ③ 함의 [2] ① 자기 행복론 → ② 구체적 실천 → ③ 정리", "a": ["이스털린의 역설은, 한 사회 안에서는 부유한 사람이 더 행복하지만 사회 전체가 부유해진다고 해서 그 사회가 더 행복해지지는 않는다는 발견입니다. 개인의 차원과 사회의 차원에서 소득과 행복의 관계가 다르게 나타나는 것입니다. 우리나라에 적용하면, 저는 '비교'의 개념이 특히 강하게 작동한다고 분석합니다. 우리 사회는 성적의 등수부터 대학 서열, 아파트 브랜드까지 삶의 많은 영역이 한 줄로 세워져 있어서, 행복의 기준이 '내 형편'이 아니라 '남과의 거리'가 되기 쉽습니다. 모두의 소득이 올라도 등수는 그대로이니 행복이 늘지 않는 것입니다. 여기에 SNS가 비교의 범위를 전 국민으로 넓혔고, '적응'도 겹칩니다. 더 넓은 집과 새 스마트폰의 기쁨은 몇 주면 당연함이 되어, 만족의 기준만 계속 올라갑니다. 결국 문제는 소득의 크기가 아니라 행복을 재는 잣대가 바깥에 있다는 것이라고 생각합니다.", "저는 행복의 조건을 '비교하지 않아도 되는 나만의 영역을 갖는 것'이라고 생각합니다. 등수가 매겨지는 영역에서만 살면 행복이 늘 남의 손에 있게 되기 때문입니다. 그래서 제가 실천하는 것은 두 가지입니다. 첫째, 등수가 없는 활동을 하나 지키는 것입니다. 저에게는 달리기가 그렇습니다. 기록을 남과 비교하지 않고 지난달의 저와만 비교하는데, 이 시간이 있어서 성적에 흔들린 날에도 마음이 회복됩니다. 둘째, 잘된 일 세 가지를 적는 습관입니다. 자기 전에 그날 좋았던 일을 짧게 적으면, 뇌가 부족한 것 대신 가진 것을 보는 연습이 된다고 해서 시작했는데, 실제로 사소한 좋은 일들을 발견하는 눈이 생겼습니다. 물론 저도 성적과 입시에서 자유롭지 않습니다. 하지만 경쟁의 영역과 저만의 영역을 구분해 두는 것이, 경쟁 속에서도 무너지지 않는 저의 방법입니다."], "tips": ["역설의 '두 층위'(개인 간/사회 전체)를 구분해 설명하는 것이 정확한 이해의 증거입니다.", "한국 사회 분석에서 교육·SNS는 좋은 소재지만, 냉소로 흐르지 않게 담담하게 분석하세요.", "행복론은 관념적으로 흐르기 쉽습니다. 반드시 실천 중인 습관 하나로 착지시키세요."]}, {"t": "소유냐 존재냐 — 갖는 삶과 되는 삶", "ty": "철학", "p": "철학자 에리히 프롬은 삶의 두 양식을 구분했다. '소유의 양식'은 재산, 지식, 지위, 심지어 사람까지 무엇이든 '갖는 것'에서 자신의 가치를 찾는 삶이다. 이 양식에서 나의 정체성은 내가 가진 것들의 목록이며, 가진 것을 잃을까 하는 불안이 삶을 따라다닌다. 반면 '존재의 양식'은 무엇이 '되는 것', 즉 경험하고 성장하고 사랑하고 나누는 활동 자체에서 의미를 찾는 삶이다.\n\n프롬은 공부를 예로 든다. 소유 양식의 학생은 지식을 시험을 위해 저장해야 할 재산으로 여기고, 배운 것이 자신의 생각과 부딪히면 불안해한다. 존재 양식의 학생은 수업에서 들은 것에 질문을 던지고 자신의 생각과 부딪혀 보며, 수업이 끝났을 때 이전과 다른 사람이 되어 있다. 소비사회는 끊임없이 '더 가지라'고 속삭이지만, 프롬은 행복이 소유의 크기가 아니라 존재의 충만함에서 온다고 보았다.", "q": ["소유 양식과 존재 양식의 차이를 '공부'를 예로 들어 설명하고, 자신의 공부는 어느 쪽에 가까운지 성찰해 말해 보세요."], "guide": "【제시문 분석】 두 양식의 대비 — 갖기(저장·불안) vs 되기(활동·성장). 공부 사례가 이미 제시문에 있으므로, 답변의 승부처는 요약이 아니라 '자기 성찰의 정직함'과 구체성입니다.\n【답변 구성】 ① 두 양식 설명(공부 사례로) → ② 자기 공부의 정직한 진단(둘이 섞여 있음을 인정) → ③ 존재 양식이었던 순간의 구체적 경험 → ④ 앞으로의 방향 → ⑤ 정리", "a": ["소유 양식의 공부는 지식을 재산처럼 쌓는 공부입니다. 시험을 위해 저장하고, 점수로 잔고를 확인하며, 배운 것이 내 생각과 다르면 불안해서 외면합니다. 존재 양식의 공부는 지식과 부딪히며 내가 달라지는 공부입니다. 질문을 던지고, 내 생각이 틀렸음을 발견하는 것을 손실이 아니라 성장으로 여깁니다. 같은 교실에 앉아 있어도 한 사람은 지식을 갖고, 한 사람은 다른 사람이 되는 것입니다.\n\n정직하게 성찰하면, 저의 공부는 두 양식이 섞여 있습니다. 시험 기간의 저는 분명히 소유 양식입니다. 점수를 모으고, 틀린 문제에 불안해합니다. 입시가 있는 현실에서 이것을 완전히 벗어나기는 어렵다고 생각합니다. 하지만 존재 양식의 공부를 경험한 순간들도 있습니다. 역사 수업에서 배운 사건의 다른 해석이 궁금해 도서관에서 관련 책을 찾아 읽고, 원래 알던 해석과 비교하는 글을 써 본 적이 있습니다. 시험에는 한 문제도 나오지 않았지만, 그 일주일 동안 '역사는 외우는 것'이라던 저의 생각 자체가 바뀌었습니다. 지식이 늘어난 것이 아니라 지식을 대하는 제가 달라진, 프롬이 말한 존재의 경험이었다고 생각합니다.\n\n앞으로의 방향은 소유의 공부를 버리는 것이 아니라, 존재의 공부가 차지하는 비율을 늘리는 것입니다. 시험공부는 성실히 하되, 일주일에 한 번은 시험과 무관한 '질문의 공부'를 위한 시간을 지키려고 합니다. 결국 좋은 공부란 성적표에 남는 공부가 아니라 사람에 남는 공부라고 생각합니다."], "tips": ["'둘 다 섞여 있다'는 정직한 성찰이 '저는 존재 양식입니다'라는 모범생 연기보다 훨씬 좋은 평가를 받습니다.", "존재 양식의 경험은 '시험에 안 나오는데 파고든 일'을 찾으면 됩니다. 자기주도학습 전형의 핵심 소재입니다.", "'성적표에 남는 공부 vs 사람에 남는 공부' 같은 대구를 마무리로 준비하세요."]}, {"t": "기본값의 힘 — 옵트인과 옵트아웃", "ty": "개념적용", "p": "장기기증 동의율은 나라마다 극적으로 다르다. 독일의 동의율이 10%대인 반면 이웃 오스트리아는 99%에 이른다. 두 나라 국민의 생명 윤리 의식이 그렇게 다른 것일까. 비밀은 제도의 '기본값'에 있다. 독일은 원하는 사람이 서류를 내서 기증에 동의하는 '옵트인' 방식이고, 오스트리아는 모든 국민이 기증자로 간주되며 원하지 않는 사람이 거부 의사를 밝히는 '옵트아웃' 방식이다. 사람들은 어느 쪽이든 기본값을 잘 바꾸지 않는다.\n\n행동경제학은 이를 '넛지(nudge)'라고 부른다. 금지나 강요 없이 선택의 설계를 바꿔 행동을 유도하는 것이다. 구내식당에서 채소를 눈높이에 놓으면 채소 선택이 늘고, 연금 자동 가입을 기본값으로 하면 노후 대비율이 올라간다. 그러나 비판도 있다. 본인이 의식하지 못하는 사이에 선택을 조종하는 것은 은밀한 간섭이며, 기업이 해지 버튼을 찾기 어렵게 숨기는 '다크 패턴'처럼 악용될 수 있다는 것이다.", "q": ["독일과 오스트리아의 동의율 차이가 보여 주는 인간 행동의 특성을 설명해 보세요.", "넛지를 '좋은 개입'과 '나쁜 조종'으로 가르는 기준은 무엇이라고 생각하는지, 학교나 일상에 넛지를 적용할 아이디어와 함께 말해 보세요."], "guide": "【제시문 분석】 핵심 개념: 기본값 효과(사람은 기본값에 머문다)와 넛지(선택 설계). 89%p의 차이가 '가치관'이 아니라 '설계'에서 나왔다는 것이 통찰의 핵심. 다크 패턴은 반대 사례로 기준 설정에 활용합니다.\n【답변 구성】 [1] ① 차이의 원인(기본값) → ② 인간 행동의 특성(관성, 인지적 절약) → ③ 함의(제도 설계의 책임) [2] ① 기준(투명성, 당사자 이익, 거부의 용이성) → ② 적용 아이디어 → ③ 정리", "a": ["두 나라의 차이가 보여 주는 것은, 인간의 선택이 가치관보다 설계에 좌우되는 경우가 많다는 사실입니다. 독일인과 오스트리아인의 윤리 의식이 89%포인트나 다를 리는 없습니다. 다른 것은 기본값뿐입니다. 사람은 기본값을 바꾸는 데 필요한 작은 수고조차 미루는 관성을 갖고 있고, 기본값을 '사회가 권장하는 표준'으로 받아들이는 경향도 있습니다. 이 특성이 주는 함의는 무겁다고 생각합니다. 제도를 설계하는 사람은 '중립적인 설계'란 사실상 불가능하며, 어떤 기본값을 고르든 이미 사람들의 행동에 개입하고 있다는 책임을 인식해야 한다는 것입니다.", "저는 좋은 개입과 나쁜 조종을 가르는 기준이 세 가지라고 생각합니다. 첫째, 투명성입니다. 좋은 넛지는 설계를 공개해도 효과가 유지되지만, 다크 패턴은 들키는 순간 분노를 삽니다. 둘째, 누구의 이익을 위한 것인가입니다. 채소를 눈높이에 두는 것은 당사자의 건강을 위한 것이지만, 해지 버튼을 숨기는 것은 기업의 이익을 위해 당사자에게 손해를 입히는 것입니다. 셋째, 거부의 용이성입니다. 언제든 쉽게 다른 선택을 할 수 있어야 넛지이고, 빠져나가기 어렵게 만들면 조종입니다. 이 기준으로 학교에 적용할 아이디어를 하나 내자면, 급식 잔반을 줄이기 위해 '기본 배식량을 약간 적게 하고, 더 먹고 싶은 사람은 자유롭게 추가 배식을 받는' 설계를 제안하고 싶습니다. 강요 없이 기본값만 바꾸는 것이고, 추가 배식이 쉬우니 거부도 용이하며, 목적도 학생과 환경의 이익입니다. 작은 설계가 규칙과 훈계보다 힘이 셀 수 있다는 것이 이 개념에서 배운 점입니다."], "tips": ["'가치관의 차이가 아니라 설계의 차이'라는 반전을 첫 문장에 배치하면 강렬합니다.", "기준 제시형 답변은 세 개의 기준에 각각 사례를 붙이는 구조가 안정적입니다.", "자기 학교에 적용할 넛지 아이디어를 하나 만들어 두면 창의성 문항에도 씁니다."]}, {"t": "깨진 유리창 이론과 학교", "ty": "개념적용", "p": "건물의 깨진 유리창 하나를 방치하면, 사람들은 그 건물을 아무도 관리하지 않는다고 여겨 다른 유리창도 깨뜨리고, 결국 그 일대의 무질서와 범죄가 늘어난다. 이것이 '깨진 유리창 이론'이다. 1990년대 뉴욕시는 이 이론에 따라 지하철 낙서 지우기, 무임승차 단속 같은 작은 무질서부터 잡는 정책을 폈고, 이 시기 뉴욕의 범죄율은 크게 떨어졌다.\n\n그러나 이 이론에는 반론도 있다. 같은 시기 다른 도시들도 범죄율이 함께 하락해, 뉴욕의 성과가 이 정책 덕분인지 불분명하다는 것이다. 또한 '무질서의 싹을 자른다'는 명분이 노숙인, 빈곤층 같은 사회적 약자에 대한 과잉 단속으로 변질되었다는 비판도 제기되었다. 사소한 잘못을 저지른 사람을 잠재적 범죄자로 취급하는 것은 낙인이 될 수 있기 때문이다.", "q": ["깨진 유리창 이론의 핵심 원리를 설명하고, 학교 생활에 적용할 수 있는 사례를 제시해 보세요.", "이 이론의 한계나 부작용을 고려할 때, 적용에서 주의해야 할 점은 무엇인지 말해 보세요."], "guide": "【제시문 분석】 원리: 작은 무질서가 '아무도 신경 쓰지 않는다'는 신호가 되어 큰 무질서를 부른다(환경→심리→행동의 연쇄). 반론 두 가지(인과의 불확실성, 약자 과잉 단속)를 2번 답변에 반드시 반영해야 합니다.\n【답변 구성】 [1] ① 원리(신호 이론으로 설명) → ② 학교 적용 사례(교실 환경, 온라인 공간) [2] ① 한계 1: 상관≠인과 → ② 한계 2: 낙인과 과잉 단속 → ③ 적용 원칙(사람이 아니라 환경을 단속)", "a": ["깨진 유리창 이론의 핵심 원리는, 작은 무질서가 그 자체로 해로워서가 아니라 '여기는 아무도 신경 쓰지 않는다'는 신호가 되기 때문에 위험하다는 것입니다. 환경이 보내는 신호가 사람들의 심리를 바꾸고, 심리가 행동을 바꾸는 연쇄입니다. 학교에 적용하면, 교실 뒤 사물함 위에 쓰레기가 하나 놓인 채 며칠이 지나면 그 위에 쓰레기가 쌓이기 시작하고, 낙서 하나가 지워지지 않은 책상은 금세 낙서로 덮입니다. 반대로 학급 게시판이 늘 깔끔하게 관리되는 반에서는 함부로 훼손하는 일 자체가 드뭅니다. 온라인 공간도 마찬가지여서, 학급 단체방에서 처음 나온 비하성 농담을 아무도 짚지 않으면 그것이 그 방의 기본값이 됩니다. 그래서 저는 '첫 번째 유리창'이 깨졌을 때의 빠른 복구, 즉 첫 쓰레기를 치우고 첫 농담에 '그건 아니지 않아?'라고 말하는 것이 공동체의 분위기를 지키는 핵심이라고 생각합니다.", "적용에서 주의할 점은 두 가지입니다. 첫째, 이 이론의 효과를 과신하면 안 됩니다. 제시문처럼 뉴욕의 범죄율 하락은 다른 도시에서도 나타났으므로, 무질서 단속이 원인이라고 단정할 수 없습니다. 작은 질서 관리는 필요조건일 수는 있어도 문제의 뿌리, 예를 들어 학교폭력의 근본 원인까지 해결해 주지는 않습니다. 둘째, 더 중요한 주의점은 단속의 대상이 '환경'이어야지 '사람'이 되어서는 안 된다는 것입니다. 뉴욕에서 이 이론이 약자에 대한 과잉 단속으로 변질된 것처럼, 학교에서도 사소한 규칙 위반을 한 학생을 문제아로 낙인찍는 방식이 되면, 질서는 얻고 사람을 잃게 됩니다. 깨진 유리창을 갈아 끼우라는 이론이지, 유리창을 깬 아이를 잠재적 범죄자로 보라는 이론이 아니기 때문입니다. 그래서 저는 이 이론의 학교 버전을 '빠르게 복구하되, 조용히 복구한다'로 정리하고 싶습니다. 훼손은 신속히 되돌리고, 사람에 대한 비난은 최소화하는 것입니다."], "tips": ["이론 적용 문항은 '원리 설명 → 적용 → 한계'의 3단이 완성형입니다. 한계를 빼먹지 마세요.", "'환경을 단속하되 사람을 낙인찍지 않는다'는 구분이 이 문항의 급소입니다.", "상관관계와 인과관계의 구분은 모든 이론·통계 문항에서 쓸 수 있는 무기입니다."]}, {"t": "기회비용과 매몰비용 — 선택의 경제학", "ty": "개념적용", "p": "모든 선택에는 두 개의 비용이 따라다닌다. 하나는 '기회비용'이다. 무언가를 선택하는 순간 포기하게 되는 다른 선택지의 가치다. 토요일 오후를 게임에 쓰면, 그 시간에 할 수 있었던 운동이나 독서의 가치가 게임의 기회비용이 된다. 돈이 들지 않는 선택에도 기회비용은 항상 존재한다.\n\n다른 하나는 '매몰비용'이다. 이미 지불해서 되돌릴 수 없는 비용이다. 합리적인 판단이라면 매몰비용은 무시해야 한다. 이미 산 영화표가 아깝다고 재미없는 영화를 두 시간 견디는 것은, 되돌릴 수 없는 표값에 소중한 두 시간까지 얹어 버리는 일이다. 그러나 사람들은 '지금까지 들인 게 아까워서' 실패한 프로젝트에 돈을 더 붓고, 맞지 않는 진로를 계속 붙잡는다. 국가도 마찬가지여서, 타당성을 잃은 대형 사업이 '이미 쓴 예산' 때문에 중단되지 못하는 일이 반복된다.", "q": ["기회비용과 매몰비용의 개념을 자신의 사례로 설명해 보세요.", "'들인 노력이 아까워서 그만두지 못하는' 매몰비용의 함정에 빠지지 않으려면 어떤 판단 기준이 필요한지 말해 보세요."], "guide": "【제시문 분석】 두 개념의 대비 — 기회비용은 '앞으로 포기할 것'(선택 시 반드시 고려), 매몰비용은 '이미 사라진 것'(판단에서 배제). 사람들은 정반대로 행동한다(기회비용은 무시, 매몰비용에 집착)는 것이 함정의 구조입니다.\n【답변 구성】 [1] ① 두 개념 정의 → ② 자기 사례 각 1개(시간 사용, 학습 선택 등) [2] ① 기준: 과거가 아니라 미래를 묻는 질문법 → ② 단서: 끈기와의 구분 → ③ 정리", "a": ["기회비용은 어떤 선택 때문에 포기하게 되는 다른 선택지의 가치이고, 매몰비용은 이미 지불해서 되돌릴 수 없는 비용입니다. 저의 사례로 설명해 보겠습니다. 기회비용을 실감한 것은 시험 전 주말이었습니다. 친구 생일 모임에 가는 선택의 진짜 비용은 교통비가 아니라 그 다섯 시간의 공부였고, 반대로 모임에 안 가는 선택의 비용은 친구와의 관계에서 잃는 것이었습니다. 돈이 오가지 않아도 모든 선택에 값이 매겨져 있다는 것을 그때 알았습니다. 매몰비용의 함정은 문제집에서 경험했습니다. 저와 맞지 않는 어려운 문제집을 '절반이나 풀었는데 아까워서' 끝까지 붙잡았는데, 돌아보면 이미 푼 절반은 어차피 돌아오지 않는 비용이었고, 저는 거기에 남은 한 달이라는 새 비용을 더 얹은 셈이었습니다.", "매몰비용의 함정을 피하는 저의 기준은 질문을 바꾸는 것입니다. '지금까지 얼마나 들였나'가 아니라 '오늘 처음 시작한다면 이 선택을 하겠는가'라고 묻는 것입니다. 과거의 비용은 어떤 결정을 해도 돌아오지 않으므로, 판단의 재료는 오직 앞으로의 비용과 효과여야 하기 때문입니다. 문제집 사례에서 이 질문을 던졌더라면, '오늘 새로 고른다면 이 책을 사지 않겠다'는 답이 나왔을 것이고 저는 한 달을 아꼈을 것입니다. 다만 이 기준에는 단서가 필요하다고 생각합니다. 힘들다고 그만두는 것과 매몰비용을 끊는 것은 다릅니다. 그래서 저는 '목표 자체가 여전히 유효한가'를 먼저 묻습니다. 목표가 유효한데 과정이 힘든 것이라면 끈기의 영역이고, 목표나 수단 자체가 잘못됐다면 빨리 끊는 것이 용기의 영역입니다. 포기하지 않는 힘과 잘 포기하는 힘이 모두 필요하다는 것이, 이 개념에서 배운 점입니다."], "tips": ["경제 개념은 교과서 예시 대신 자기 생활의 사례로 설명해야 '적용 능력'으로 인정받습니다.", "'오늘 처음 시작한다면?'이라는 질문법은 실제로 쓸 수 있는 판단 도구입니다. 자기 것으로 만드세요.", "'잘 포기하는 힘'과 '끈기'의 구분은 꼬리질문(그럼 끈기는 필요 없나요?)에 대한 선제 방어입니다."]}, {"t": "확증편향 — 보고 싶은 것만 보는 마음", "ty": "개념적용", "p": "사람은 자신의 믿음과 일치하는 정보는 쉽게 받아들이고, 어긋나는 정보는 의심하거나 무시하는 경향이 있다. 심리학은 이를 '확증편향'이라 부른다. 한 실험에서 사형제에 대해 상반된 입장을 가진 사람들에게 똑같은 연구 자료를 보여 주자, 양쪽 모두 '이 자료가 내 입장을 지지한다'고 해석했고, 오히려 양측의 확신이 더 강해졌다. 같은 증거가 반대의 결론을 강화한 것이다.\n\n확증편향은 게으름이 아니라 본성에 가깝다. 자신의 세계관이 흔들리는 것은 불쾌하고, 뇌는 그 불쾌를 피하는 쪽으로 정보를 처리한다. 문제는 인터넷 검색과 SNS가 이 본성을 증폭시킨다는 점이다. 내 입장을 확인해 주는 근거는 검색 몇 초면 무한히 공급되고, 알고리즘은 내가 좋아할 정보만 골라 준다. 과학이 이 본성에 맞서기 위해 만든 장치가 바로 '반증'이다. 좋은 과학자는 자기 가설을 지지하는 증거가 아니라, 가설이 틀렸음을 보여 줄 증거를 먼저 찾는다.", "q": ["같은 자료를 보고도 양쪽의 확신이 강해진 실험 결과를 확증편향 개념으로 설명해 보세요.", "자신이 확증편향에 빠졌던 경험과, 이를 줄이기 위한 자신만의 장치를 말해 보세요."], "guide": "【제시문 분석】 실험의 포인트: 정보 부족이 아니라 '해석의 편향'이 문제이므로, 정보를 더 줘도 갈등은 해소되지 않고 오히려 심화됨. 해법의 실마리는 과학의 '반증' 태도(틀렸을 증거를 먼저 찾기)입니다.\n【답변 구성】 [1] ① 개념 정의 → ② 실험 해석(같은 자료 → 선택적 수용·이중 잣대) → ③ 함의(정보 제공만으로 설득 불가) [2] ① 자기 경험(솔직하게) → ② 장치(반대 근거 찾기, 신뢰하는 반대자 두기) → ③ 정리", "a": ["확증편향은 자신의 믿음에 맞는 정보는 쉽게 통과시키고 어긋나는 정보에는 엄격한 잣대를 들이대는, 정보 처리의 이중 기준입니다. 실험 결과를 이 개념으로 설명하면, 양측은 같은 자료에서 서로 다른 부분을 '증거'로 채택한 것입니다. 자기 입장을 지지하는 대목은 그대로 받아들이고, 반대되는 대목은 '연구 방법에 문제가 있다'며 깎아내립니다. 그 결과 자료를 읽기 전보다 확신이 오히려 강해집니다. 이 실험의 무서운 함의는, 사회 갈등이 정보가 부족해서 생기는 것이 아니라는 점입니다. 정보를 아무리 공급해도 해석의 필터가 편향되어 있으면, 더 많은 정보는 더 강한 확신과 더 깊은 분열을 낳을 뿐입니다. 갈등 해결의 열쇠가 '무엇을 보여 줄 것인가'가 아니라 '어떻게 읽게 할 것인가'에 있다는 뜻이라고 생각합니다.", "저의 경험을 솔직히 말씀드리면, 학급 회의에서 어떤 행사 방식을 두고 친구와 논쟁하면서, 저는 제 안을 지지해 줄 근거만 열심히 검색했습니다. 반대 의견 글은 제목만 보고 '이건 우리 상황과 달라'라며 넘겼습니다. 나중에 그 친구의 방식으로 진행된 행사가 잘되는 것을 보고, 제가 진 것이 아니라 제가 처음부터 공정하게 검토하지 않았다는 것을 깨달았습니다. 그 뒤로 두 가지 장치를 쓰고 있습니다. 첫째, 과학의 반증 태도를 흉내 내는 것입니다. 어떤 입장이 서면 '내가 틀렸다면 어떤 증거가 있을까'를 먼저 검색해 봅니다. 확신이 강할수록 일부러 반대편의 가장 논리적인 글을 찾아 읽습니다. 둘째, 신뢰하는 반대자를 두는 것입니다. 저와 생각이 자주 다르지만 존중하는 친구에게 제 생각을 먼저 검증받는 것인데, 그 친구가 수긍하는 논리는 어디 가서도 통했습니다. 확증편향은 없앨 수 없는 본성이라고 하니, 본성을 이기는 습관과 사람을 곁에 두는 것이 저의 방법입니다."], "tips": ["'정보를 더 줘도 갈등이 깊어진다'는 함의까지 읽어 내면 실험 해석의 최고 수준입니다.", "자기 편향의 경험은 사소하고 구체적일수록 진정성이 삽니다. 모범적 실패담을 준비하세요.", "'신뢰하는 반대자' 같은 실행 가능한 장치는 면접관이 기억하는 답변 포인트가 됩니다."]}, {"t": "공유지의 비극과 우리 교실", "ty": "개념적용", "p": "마을의 공동 목초지는 누구나 소를 풀어놓을 수 있다. 목초지가 견딜 수 있는 소의 수는 정해져 있지만, 각 농부의 입장에서는 소를 한 마리 더 풀어놓는 것이 이득이다. 이익은 온전히 자신의 것이고, 목초지의 훼손이라는 비용은 마을 전체가 나눠 지기 때문이다. 모두가 이렇게 '합리적으로' 행동한 결과, 목초지는 황폐해지고 모든 농부가 손해를 본다. 생태학자 하딘이 말한 '공유지의 비극'이다.\n\n공유지의 비극은 목초지만의 이야기가 아니다. 남획으로 텅 빈 어장, 미세먼지로 뒤덮인 대기, 붐비는 도로가 모두 같은 구조다. 해법으로는 국가가 규제하는 방법과 소유권을 나눠 주는 방법이 논의되어 왔다. 그런데 경제학자 오스트롬은 제3의 길을 발견해 노벨상을 받았다. 세계 곳곳의 마을 공동체들이 정부도 시장도 아닌 '스스로 만든 규칙과 상호 감시'로 수백 년간 공유 자원을 지켜 온 사례들을 실증한 것이다.", "q": ["공유지의 비극이 발생하는 구조를 설명하고, 학교 생활에서 같은 구조를 가진 사례를 찾아 분석해 보세요.", "오스트롬의 '제3의 길'을 참고하여, 그 사례를 해결할 학생 자치의 규칙을 설계해 보세요."], "guide": "【제시문 분석】 비극의 구조: 이익의 사유화 + 비용의 공유화 → 개인의 합리성이 집단의 비극으로. 오스트롬의 발견은 '정부 규제 vs 사유화'의 이분법을 깨는 공동체 자치의 가능성입니다. 학교 사례 발굴이 적용력의 승부처입니다.\n【답변 구성】 [1] ① 구조 설명(이익과 비용의 비대칭) → ② 학교 사례(학급 공용 물품, 단체방, 도서관 등) 구조 분석 [2] ① 자치 규칙 설계(규칙 제정 참여, 상호 감시, 단계적 제재) → ② 오스트롬 원리와의 연결 → ③ 정리", "a": ["공유지의 비극이 발생하는 구조는 이익과 비용의 비대칭입니다. 소 한 마리를 더 풀어놓은 이익은 그 농부가 독차지하지만, 목초지 훼손이라는 비용은 모두에게 분산됩니다. 그래서 각자에게는 더 쓰는 것이 합리적인데, 모두의 합리가 모이면 자원이 무너지는 집단의 비극이 됩니다. 학교에서 같은 구조를 찾자면 학급 공용 물품이 정확히 그렇습니다. 공용 보드마카나 청소도구를 아껴 쓸 이유가 개인에게는 없습니다. 험하게 써서 얻는 편리함은 내 것이고, 망가진 뒤의 불편은 반 전체가 나누기 때문입니다. 그 결과 학기 말이면 공용 물품은 늘 부족하거나 망가져 있습니다. 교실 뒤 공용 공간이 지저분해지는 것, 모둠 활동에서 발언 시간을 독점하는 것도 '모두의 것이어서 아무의 것도 아닌' 같은 구조라고 분석할 수 있습니다.", "오스트롬의 발견에서 제가 주목한 것은, 성공한 공동체들이 외부의 규제가 아니라 이용자 스스로 규칙을 만들고 서로 감시했다는 점입니다. 이를 참고해 학급 공용 물품 규칙을 설계해 보겠습니다. 첫째, 규칙은 학급 회의에서 사용 당사자인 우리가 직접 정합니다. 선생님이 내려 주신 규칙은 어겨도 되는 남의 규칙처럼 느껴지지만, 내가 손 들어 정한 규칙은 다릅니다. 둘째, 관리를 보이게 만듭니다. 주번이 물품 상태를 간단히 기록해 게시하는 것만으로 '아무도 안 본다'는 익명성이 사라집니다. 셋째, 제재는 단계적으로 합니다. 처음은 가벼운 주의, 반복되면 일정 기간 사용 제한처럼, 오스트롬이 관찰한 공동체들도 위반의 크기에 비례한 제재를 두었다고 합니다. 마지막으로 잘 관리된 학기에는 남은 학급비로 모두가 원하는 물품을 사는 보상을 연결해, 공유지를 지키는 것이 손해가 아니라 이익이 되게 만들겠습니다. 이 설계의 핵심은 감시가 아니라 주인의식의 구조화라고 생각합니다."], "tips": ["'이익의 사유화, 비용의 공유화'라는 구조 한 문장이 개념 이해의 증명입니다.", "학교 사례 발굴이 이 문항의 변별력입니다. 공용 물품·단체방·모둠 무임승차 등에서 구조가 같은 것을 고르세요.", "오스트롬의 자치 원리(당사자 규칙 제정, 상호 감시, 단계적 제재)는 학급 자치 문항 전반에 응용됩니다."]}, {"t": "평균의 함정 — 숫자가 감추는 것", "ty": "개념적용", "p": "어느 회사의 평균 연봉이 8천만 원이라고 하자. 좋은 직장처럼 보이지만, 실상은 임원 몇 명이 수십억 원을 받고 대부분의 직원은 3천만 원대를 받는 회사일 수 있다. 극단값이 평균을 끌어올린 것이다. 그래서 통계학자들은 소득처럼 쏠림이 있는 자료에서는 '평균'이 아니라 한가운데 값인 '중앙값'을 함께 봐야 한다고 말한다. 실제로 우리나라의 평균 소득과 중앙값 소득 사이에는 상당한 차이가 있다.\n\n평균은 다른 방식으로도 우리를 속인다. '1인당 국민소득 3만 달러'는 4인 가족 소득 12만 달러를 뜻하지 않으며, 성장률의 평균이 좋아도 그 과실이 어디에 쌓였는지는 말해 주지 않는다. 한 통계학자는 '한 손은 얼음물에, 한 손은 끓는 물에 담그고 평균 온도는 적당하다고 말하는 격'이라고 꼬집었다. 숫자는 거짓말을 하지 않지만, 숫자를 고르는 사람은 보여 주고 싶은 숫자를 고를 수 있다.", "q": ["평균이 현실을 왜곡할 수 있는 이유를 제시문의 사례로 설명해 보세요.", "통계나 수치를 접할 때 속지 않기 위해 어떤 질문을 던져야 하는지, 자신의 '통계 점검 목록'을 만들어 말해 보세요."], "guide": "【제시문 분석】 평균의 두 함정 — ① 극단값의 왜곡(평균≠보통 사람, 중앙값의 필요) ② 분포의 은폐(평균은 격차를 지움). 마지막 문장 '숫자를 고르는 사람'이 통계 리터러시의 핵심 통찰입니다.\n【답변 구성】 [1] ① 극단값 사례(연봉) 설명 → ② 분포 은폐(얼음물·끓는 물 비유) → ③ 함의 [2] 점검 질문 3~4개를 목록으로(누가 냈나, 평균인가 중앙값인가, 분포는, 비교 기준은) → 실제 적용 사례 하나", "a": ["평균이 현실을 왜곡하는 첫 번째 이유는 극단값에 끌려가기 때문입니다. 평균 연봉 8천만 원인 회사의 사례처럼, 소수의 매우 큰 값이 평균을 끌어올리면 평균은 '보통 구성원'의 현실과 동떨어진 숫자가 됩니다. 그래서 쏠림이 있는 자료에서는 한가운데 값인 중앙값을 함께 봐야 실제에 가까워집니다. 두 번째 이유는 평균이 분포를 지워 버리기 때문입니다. 한 손은 얼음물에, 한 손은 끓는 물에 담그고 평균은 적당하다고 말하는 비유처럼, 평균은 그 안의 격차와 고통을 보이지 않게 만듭니다. 국민소득 평균이 올라도 그 과실이 한쪽에만 쌓였다면, 평균의 상승은 다수의 삶과 무관할 수 있습니다. 결국 평균은 거짓이 아니지만 전부도 아니며, 어떤 숫자를 보여 줄지 고르는 사람의 의도까지 읽어야 한다는 것이 제시문의 핵심이라고 생각합니다.", "저의 통계 점검 목록은 네 가지 질문입니다. 첫째, '누가 왜 이 숫자를 냈는가'입니다. 통계의 출처와 조사 주체의 이해관계를 먼저 봅니다. 둘째, '평균인가 중앙값인가, 분포는 어떤가'입니다. 대표값 하나만 제시된 자료는 일단 반쪽짜리로 간주합니다. 셋째, '무엇과 비교한 숫자인가'입니다. '두 배 증가'도 원래 값이 아주 작았다면 의미가 다르고, 비교 시점을 유리하게 고른 그래프도 많기 때문입니다. 넷째, '이 숫자가 보여 주지 않는 것은 무엇인가'입니다. 실제로 적용해 본 적이 있는데, '청소년 평균 공부 시간'이라는 기사를 보고 저와 너무 달라 이상해서 찾아보니, 조사 대상과 방식에 따라 수치가 크게 다른 자료들이 있었습니다. 그 뒤로 숫자는 결론이 아니라 질문의 시작이라고 생각하게 되었습니다. 통계를 의심하는 것은 통계를 무시하는 것이 아니라, 통계를 제대로 쓰기 위한 예의라고 생각합니다."], "tips": ["'평균 vs 중앙값'은 자료해석형 문항 전반에서 쓸 수 있는 기본 무기입니다.", "점검 목록형 답변은 질문 형태로 만들면 실용성이 살아납니다.", "'숫자는 결론이 아니라 질문의 시작'처럼 태도를 요약하는 문장으로 마무리하세요."]}, {"t": "님비를 넘어 — 기피 시설의 입지", "ty": "개념적용", "p": "쓰레기 소각장, 하수처리장, 장애인 특수학교, 심지어 소방서까지. 모두에게 필요하지만 내 집 앞에는 안 된다는 반대에 부딪히는 시설들이다. 이런 태도를 '님비(NIMBY, Not In My Back Yard)'라고 부른다. 반대 주민들을 이기적이라고 비난하기는 쉽다. 그러나 시설의 편익은 도시 전체가 누리는데 소음, 냄새, 집값 하락 같은 비용은 그 동네만 지는 구조라면, 반대는 이기심이 아니라 불공정에 대한 항의일 수 있다.\n\n실제로 갈등을 푼 사례들은 비용과 편익의 균형을 맞추는 데서 출발했다. 경기도의 한 소각장은 굴뚝에 전망대와 카페를 만들고 주민에게 난방비를 지원해 지역의 명소가 되었고, 어떤 지역은 기피 시설 유치를 주민 투표로 결정하되 충분한 보상과 감시 권한을 함께 부여했다. 하남시의 한 지하 하수처리장 위에는 공원이 들어섰다. 시설 자체가 아니라 '결정의 방식'과 '부담의 배분'이 문제였던 것이다.", "q": ["님비 현상을 '이기심'으로만 볼 수 없는 이유를 제시문을 바탕으로 설명해 보세요.", "우리 동네에 기피 시설이 들어온다면, 갈등을 줄이는 절차를 어떻게 설계할지 제안해 보세요."], "guide": "【제시문 분석】 관점의 전환이 핵심 — 님비는 도덕(이기심)의 문제가 아니라 구조(편익의 공유 vs 비용의 집중)의 문제. 성공 사례들의 공통점은 보상(비용의 재배분)과 절차(결정 참여, 감시 권한)입니다.\n【답변 구성】 [1] ① 비용-편익의 비대칭 구조 설명 → ② '이기심 비난'이 해결을 막는 이유 [2] ① 절차 설계: 정보 공개 → 주민 참여 결정 → 실질 보상 → 감시 권한 → ② 사례 연결 → ③ 정리", "a": ["님비를 이기심으로만 볼 수 없는 이유는, 그 밑에 실제로 불공정한 구조가 있기 때문입니다. 소각장의 편익은 도시 전체가 누리지만 소음과 냄새, 집값 하락이라는 비용은 그 동네 주민만 집니다. 다수를 위해 소수가 일방적으로 희생하는 구조라면, 반대는 공동체 의식의 부족이 아니라 '왜 우리만 부담하는가'라는 정당한 항의일 수 있습니다. 오히려 반대 주민을 이기적이라고 비난하는 프레임이 문제 해결을 막는다고 생각합니다. 비난은 주민들의 태도를 더 강경하게 만들고, 정작 풀어야 할 비용 배분의 문제를 도덕 공방으로 바꿔 버리기 때문입니다. 제시문의 성공 사례들이 보여 주듯, 문제는 시설이 아니라 결정의 방식과 부담의 배분이었습니다.", "제가 절차를 설계한다면 네 단계로 만들겠습니다. 첫째, 결정 전의 완전한 정보 공개입니다. 시설의 필요성, 환경 영향 자료, 후보지 선정 기준을 처음부터 투명하게 공개해야 합니다. 몰래 추진하다 들통나는 순간 내용과 무관하게 신뢰가 무너지기 때문입니다. 둘째, 주민이 참여하는 결정입니다. 후보지 주민이 참여하는 공론화와 주민 투표를 거치면, 결과에 대한 수용성이 달라집니다. 셋째, 실질적인 보상입니다. 일회성 지원금보다 난방비 지원이나 시설 수익의 지역 환원처럼 지속적인 편익으로, 비용을 지는 지역이 편익도 더 누리게 만들어야 합니다. 경기도 소각장이 전망대와 카페로 명소가 된 사례처럼, 기피 시설을 지역의 자산으로 바꾸는 설계도 가능합니다. 넷째, 운영 감시 권한을 주민에게 주는 것입니다. 오염도 측정과 점검에 주민 대표가 참여하면 막연한 불안이 관리 가능한 위험으로 바뀝니다. 이 절차의 원칙을 한 문장으로 하면 '희생을 요구하지 말고 거래를 공정하게 하라'입니다."], "tips": ["'도덕 문제를 구조 문제로 전환'하는 시각이 이 문항 최고의 득점 포인트입니다.", "특수학교·소방서 같은 사례는 님비의 스펙트럼이 넓음을 보여 줄 때 유용합니다.", "절차 설계는 '정보→참여→보상→감시'의 4단 틀로 기억해 두면 갈등 조정 문항 전반에 씁니다."]}, {"t": "바우어새의 둥지 — 스스로 만드는 탐구", "ty": "자기주도", "p": "오스트레일리아에 사는 바우어새 수컷은 놀라운 건축가다. 나뭇가지로 정자 모양의 구조물을 짓고, 그 앞마당을 파란 병뚜껑, 꽃잎, 조개껍데기 같은 물건들로 장식한다. 같은 종이라도 새마다 모으는 물건과 배치가 달라, 연구자들은 저마다의 '작품'이라고 부른다. 어린 수컷은 여러 해 동안 어른 새들의 둥지를 관찰하고 흉내 내고 실패하면서 자신만의 양식을 만들어 간다. 누가 정해 준 설계도는 없다.\n\n바우어새의 학습에는 세 가지가 있다. 오래 관찰하는 것, 직접 지어 보는 것, 그리고 무너지면 다시 짓는 것이다. 완성된 둥지를 베끼는 새는 없다. 관찰은 재료일 뿐, 자기 둥지는 자기 시행착오로만 완성되기 때문이다.", "q": ["바우어새의 학습 방식이 인간의 공부에 주는 시사점을 말해 보세요.", "자신이 '설계도 없이' 스스로 계획하고 시행착오를 거쳐 완성한 학습이나 탐구 경험을 구체적으로 말해 보세요."], "guide": "【제시문 분석】 바우어새 학습의 3요소 — 관찰(모방은 재료), 실행(직접 짓기), 재구성(실패 후 다시). '완성본을 베끼지 않는다'는 것이 자기주도학습의 은유입니다. 2번은 자기주도학습 전형의 핵심 질문과 동일합니다.\n【답변 구성】 [1] ① 3요소 추출 → ② 인간 공부로 번역(강의 시청≠공부, 자기 방식의 구축) [2] ① 경험을 동기→계획→시행착오→수정→결과→배움의 순서로 → ② 시행착오 부분을 가장 구체적으로", "a": ["바우어새의 학습이 주는 시사점은 세 가지라고 생각합니다. 첫째, 관찰과 모방은 공부의 재료이지 공부 자체가 아니라는 것입니다. 어린 새가 어른의 둥지를 오래 관찰하듯 우리도 강의를 듣고 남의 필기를 보지만, 그것만으로는 아무 둥지도 지어지지 않습니다. 둘째, 자기 손으로 지어 봐야 한다는 것입니다. 개념을 이해했다는 느낌과 문제를 풀 수 있는 능력 사이의 거리는, 직접 지어 본 새와 구경만 한 새의 차이와 같습니다. 셋째, 무너짐이 학습 과정의 일부라는 것입니다. 바우어새는 무너진 둥지 앞에서 좌절하는 것이 아니라 다시 지으면서 자기 양식을 갖게 됩니다. 오답과 실패가 기록되고 수정될 때만 '나만의 공부법'이라는 둥지가 완성된다고 생각합니다.", "저의 경험으로 영어 단어 암기법을 스스로 만든 과정을 말씀드리고 싶습니다. 처음에는 남들이 하듯 단어장을 순서대로 외웠는데, 시험 때는 기억나던 단어가 독해에서는 떠오르지 않았습니다. 첫 번째 시행착오였습니다. 원인을 생각해 보니 단어를 뜻과 일대일로만 외워서 문장 속에서 쓰이는 모습을 모르는 것이 문제였습니다. 그래서 두 번째 방법으로 단어마다 예문을 통째로 외웠는데, 이번에는 시간이 너무 걸려 분량을 소화하지 못했습니다. 두 번의 실패를 거쳐 만든 저의 방식은, 독해 지문에서 모르는 단어를 만나면 그 문장을 그대로 오려 나만의 단어 노트에 붙이고, 사흘 뒤와 일주일 뒤에 그 문장으로 복습하는 것입니다. 제가 실제로 읽다가 막힌 문장이라 기억의 고리가 강했고, 복습 간격을 두니 장기 기억으로 넘어갔습니다. 이 방법으로 독해 속도가 눈에 띄게 빨라졌고, 무엇보다 '방법이 안 맞으면 방법을 바꾸면 된다'는 자신감을 얻었습니다. 이 태도가 제가 바우어새처럼 지어 낸 저의 둥지라고 생각합니다."], "tips": ["자기주도학습 전형의 사실상 직접 질문입니다. 2번 경험담은 반드시 실제 자기 것으로 준비하세요.", "시행착오는 최소 두 번의 실패와 수정 과정을 말해야 '과정'이 보입니다.", "'이해한 느낌과 풀 수 있는 능력의 거리'라는 구분은 학습 관련 모든 문항에 쓸 수 있습니다."]}, {"t": "9,000번의 실패 — 마이클 조던의 고백", "ty": "자기주도", "p": "농구 황제 마이클 조던은 이렇게 말했다. \"나는 선수 생활 동안 9,000개가 넘는 슛을 실패했다. 300번의 경기에서 졌다. 경기를 뒤집을 결정적인 슛을 맡고도 26번 실패했다. 나는 살아오면서 실패하고, 실패하고, 또 실패했다. 그것이 내가 성공한 이유다.\" 그는 고등학교 시절 대표팀 명단에서 탈락한 경험을 평생의 동력으로 삼았다고 말한다.\n\n심리학자 캐럴 드웩은 사람들이 능력을 대하는 두 가지 태도를 발견했다. 능력이 타고나 고정되어 있다고 믿는 '고정 마인드셋'의 사람은 실패를 자신의 한계가 드러난 증거로 여겨 도전을 피한다. 능력이 노력으로 자란다고 믿는 '성장 마인드셋'의 사람은 실패를 아직 완성되지 않았다는 정보로 여겨 다시 시도한다. 같은 실패가 누군가에게는 사형선고이고, 누군가에게는 데이터인 것이다.", "q": ["조던의 고백을 드웩의 두 마인드셋 개념으로 해석해 보세요.", "자신의 실패 경험 중 '데이터'가 되어 준 실패를 하나 소개하고, 그 실패가 자신을 어떻게 바꿨는지 말해 보세요."], "guide": "【제시문 분석】 조던의 역설('실패했다, 그것이 성공의 이유다')을 드웩의 개념(실패=한계의 증거 vs 성장의 데이터)으로 풀어내는 개념 연결형 문항입니다. '같은 실패가 사형선고 또는 데이터'라는 마지막 문장이 해석의 열쇠입니다.\n【답변 구성】 [1] ① 조던의 역설 지적 → ② 성장 마인드셋으로 해석(실패를 정보로 처리) → ③ 탈락 경험의 재해석 [2] ① 실패 경험(구체적) → ② 그 실패에서 얻은 데이터 → ③ 바뀐 행동과 결과", "a": ["조던의 고백은 표면적으로 역설입니다. 실패의 목록이 성공의 이유라고 말하기 때문입니다. 드웩의 개념으로 해석하면 이 역설이 풀립니다. 고정 마인드셋에게 9,000번의 실패는 '나는 안 되는 사람'이라는 증거 9,000개가 되어 그를 코트에서 떠나게 했을 것입니다. 그러나 성장 마인드셋의 조던에게 각각의 실패는 '이 각도, 이 상황에서는 이렇게 하면 안 된다'는 데이터 9,000개였습니다. 결정적 슛을 26번 실패하고도 다시 그 슛을 맡겠다고 나선 것은, 실패를 자신의 정체성이 아니라 기술의 현재 상태에 대한 정보로 분리해서 받아들였기 때문입니다. 고등학교 대표팀 탈락도 마찬가지입니다. 고정 마인드셋이라면 재능의 판결문으로 읽었을 사건을, 그는 연습량을 늘리라는 처방전으로 읽었습니다. 결국 두 마인드셋을 가르는 것은 실패의 유무가 아니라 실패라는 같은 사건에 붙이는 해석이라고 생각합니다.", "저에게 데이터가 된 실패는 학급 임원 선거의 낙선입니다. 저는 준비한 공약을 잘 발표했다고 생각했는데 큰 표 차이로 떨어졌고, 처음에는 '나는 리더 타입이 아닌가 보다'라고 저 자신에 대한 판결로 받아들였습니다. 그런데 시간이 지나 친구들에게 솔직한 이유를 물어보니, 공약이 문제가 아니라 '평소에 나서서 도와준 기억이 없다'는 답이 돌아왔습니다. 그 말이 저의 데이터였습니다. 리더십은 발표 3분이 아니라 평소 300일에서 나온다는 것입니다. 그 뒤로 저는 직책 없이 할 수 있는 일부터 했습니다. 모둠 활동에서 정리를 도맡고, 힘들어하는 친구의 이야기를 들었습니다. 다음 해 선거에서는 당선되었지만, 사실 더 큰 변화는 당선이 아니라 '실패를 나에 대한 판결이 아니라 다음 행동에 대한 정보로 읽는 습관'이 생긴 것입니다. 그 습관 덕분에 지금은 성적이든 관계든, 결과가 나쁜 날에 '나는 왜 이럴까' 대신 '여기서 얻을 데이터가 뭘까'를 먼저 묻게 되었습니다."], "tips": ["개념(마인드셋)으로 사례(조던)를 해석하는 구조를 지키세요. 조던 이야기의 감상적 반복은 감점입니다.", "실패담은 '판결로 읽었다가 데이터로 다시 읽은' 전환의 순간이 드러나야 합니다.", "면접 단골 질문 '실패 경험을 말해 보세요'의 준비 답안을 이 문항으로 완성해 두세요."]}, {"t": "익명 대나무숲의 관리자라면", "ty": "인성상황", "p": "당신은 학생들이 익명으로 글을 올리는 학교 온라인 커뮤니티, 이른바 '대나무숲'의 관리자다. 평소에는 고민 상담과 학교에 대한 건의가 올라오지만, 오늘 특정 학생을 암시하는 저격 글이 올라왔다. 이름은 없지만 반과 특징이 적혀 있어 누구인지 짐작할 수 있고, 댓글에는 동조와 조롱이 붙기 시작했다. 글을 내리면 '불리한 글만 검열한다'는 반발이 예상되고, 두면 피해 학생의 상처가 커진다.\n\n익명 공간은 약자의 목소리를 지켜 주는 곳이기도 하고, 책임 없는 공격이 자라는 곳이기도 하다. 관리자의 결정 하나가 이 공간의 성격을 정한다.", "q": ["관리자로서 이 글을 어떻게 처리할지, 그 기준과 함께 말해 보세요.", "이런 일이 반복되지 않도록 커뮤니티 운영 원칙을 만든다면 어떤 내용을 담을지 제안해 보세요."], "guide": "【제시문 분석】 충돌 가치: 표현의 자유·검열 반발 vs 피해자 보호. 판단의 축은 '내용의 비판성'이 아니라 '특정인 식별 가능성 + 공격성'입니다. 사후 처리(1번)와 사전 예방 구조(2번)를 구분해 설계하세요.\n【답변 구성】 [1] ① 즉시 조치(삭제 또는 블라인드)와 그 기준 → ② 피해 학생 보호 → ③ 반발에 대한 설명 책임 [2] ① 사전 공지된 원칙(식별 가능 저격 금지) → ② 절차(신고·심의) → ③ 커뮤니티 문화", "a": ["저는 그 글을 즉시 가리고(블라인드), 삭제 사유를 공개적으로 안내하겠습니다. 기준은 명확합니다. 학교에 대한 비판은 아무리 날카로워도 보호받아야 할 목소리지만, 특정인을 알아볼 수 있는 저격은 의견이 아니라 공격이기 때문입니다. 이름이 없어도 반과 특징으로 짐작이 가능하다면 익명성은 글쓴이만 보호하고 피해자는 공개된 상태이므로, 익명 공간의 취지에도 어긋납니다. 동시에 두 가지를 함께 하겠습니다. 첫째, 짐작되는 피해 학생이 이미 글을 봤을 가능성이 크므로, 담임 선생님이나 상담 선생님께 상황을 알려 보호가 시작되게 하겠습니다. 둘째, '불리한 글 검열'이라는 반발에는 숨지 않고 답하겠습니다. 삭제된 것은 학교에 불리한 글이 아니라 사람을 겨눈 글이며, 같은 기준이 누구에게나 적용된다는 것을 공지로 밝히는 것입니다. 관리자의 권한은 마음대로 지우는 힘이 아니라, 미리 밝힌 기준을 일관되게 지키는 책임이라고 생각합니다.", "운영 원칙에는 세 가지를 담겠습니다. 첫째, 금지선의 사전 공지입니다. '학교·제도 비판은 자유, 특정인이 식별되는 글과 혐오 표현은 금지'라는 기준을 커뮤니티 첫 화면에 상시 게시해, 삭제가 자의적 검열이 아니라 예고된 규칙의 집행이 되게 합니다. 둘째, 절차의 투명화입니다. 신고 버튼을 만들고, 애매한 글은 관리자 혼자가 아니라 학생 자율 심의단이 함께 판단하게 해 권한을 분산합니다. 삭제 시에는 사유를 남겨 기록이 쌓이게 합니다. 셋째, 문화의 설계입니다. 규칙만으로는 부족하므로, 좋은 건의가 실제로 학교를 바꾼 사례를 관리자가 정리해 공유하겠습니다. 이 공간에서 글을 쓰면 조롱이 아니라 변화가 돌아온다는 경험이 쌓일 때, 대나무숲은 저격의 숲이 아니라 목소리의 숲이 된다고 생각합니다."], "tips": ["'비판과 공격의 구분'이라는 기준을 첫머리에 세우면 판단 전체가 안정됩니다.", "피해자 보호 조치를 빠뜨리기 쉽습니다. 글 처리와 사람 보호는 별개의 행동입니다.", "권한을 '힘'이 아니라 '책임'으로 정의하는 태도가 리더십 평가의 핵심입니다."]}, {"t": "혼자 앉는 아이와 반장인 나", "ty": "인성상황", "p": "당신은 반장이다. 학기 초부터 한 친구가 점심을 늘 혼자 먹고, 모둠을 짤 때마다 마지막까지 이름이 불리지 않는다. 노골적인 괴롭힘은 없지만, 아이들은 자연스럽게 그 친구를 피하고 그 친구도 점점 말이 없어진다. 어느 날 담임 선생님이 조용히 묻는다. \"반장이 보기에 우리 반 괜찮니?\"\n\n당신은 그 친구와 특별히 친하지 않고, 섣불리 나서면 '착한 척한다'는 시선이나 그 친구의 부담스러워하는 반응이 돌아올 수도 있다. 그러나 모른 척하기에는 마음이 걸린다.", "q": ["선생님의 질문에 어떻게 답하고, 이후 반장으로서 어떻게 행동할지 구체적으로 말해 보세요."], "guide": "【제시문 분석】 노골적 폭력이 없는 '조용한 배제'가 핵심 상황입니다. 개입의 딜레마(시혜적 접근의 역효과, 착한 척 시선)를 인식한 위에서, 티 나지 않는 구조적 개입을 설계하는 것이 답의 수준을 가릅니다.\n【답변 구성】 ① 선생님께의 답변(사실대로, 단 낙인 없이) → ② 직접 개입: 자연스러운 접점 만들기 → ③ 구조 개입: 모둠 구성 방식 개선 → ④ 하지 말아야 할 것의 인식 → ⑤ 목표 상태", "a": ["선생님께는 사실대로 말씀드리겠습니다. 다만 '그 애가 왕따예요'라는 식의 낙인이 아니라, '겉으로 문제는 없지만 늘 혼자가 되는 친구가 있고, 반 전체가 자연스럽게 그렇게 굳어지는 것 같아 마음이 쓰입니다'라고 상황을 전하겠습니다. 담임 선생님만이 할 수 있는 역할이 있기 때문에 알리는 것이 반장의 책임이라고 생각합니다.\n\n이후 저의 행동은 두 방향입니다. 먼저 개인적인 접근입니다. 갑자기 다가가 '같이 밥 먹자'고 하면 그 친구도 부담스럽고 저도 착한 척이라는 시선을 받을 수 있으므로, 자연스러운 접점을 만들겠습니다. 준비물을 물어보거나 과제 이야기처럼 사소한 대화를 며칠에 걸쳐 쌓고, 그 친구가 잘하는 것을 발견하면 도움을 요청하는 방식입니다. 도움을 받는 관계가 도움을 주는 관계보다 상대의 자존감을 지켜 주기 때문입니다. 다음으로 구조적인 접근입니다. 이 문제의 절반은 '마지막까지 이름이 불리지 않는' 모둠 구성 방식에 있으므로, 선생님께 자유 구성 대신 추첨이나 순환 방식을 건의하겠습니다. 누구도 선택받기를 기다리지 않아도 되는 구조가 되면, 배제는 눈에 띄게 줄어듭니다.\n\n하지 말아야 할 것도 알고 있습니다. 반 아이들 앞에서 '우리 ○○이랑도 놀아 주자'는 식의 공개적 언급은 도움이 아니라 공개 처형이 됩니다. 제 목표는 그 친구를 제가 챙기는 것이 아니라, 그 친구가 저 없이도 섞일 수 있는 반의 공기를 만드는 것입니다."], "tips": ["'도와준다'가 아니라 '구조를 바꾼다'는 접근이 들어가야 반장다운 답변이 됩니다.", "'하지 말아야 할 것'(공개적 시혜)을 아는 모습이 공감 능력의 깊이를 보여 줍니다.", "기숙사형 학교 면접에서는 이 문항이 룸메이트·공동체 적응 판단 자료로 읽힙니다."]}, {"t": "식당에서 뛰어다니는 아이", "ty": "인성상황", "p": "가족과 식사하러 간 식당에서 옆 테이블의 아이 둘이 소리를 지르며 테이블 사이를 뛰어다닌다. 뜨거운 음식을 나르는 종업원과 부딪힐 뻔한 순간도 있었다. 아이의 부모는 스마트폰을 보며 제지하지 않는다. 주위 손님들은 눈살을 찌푸리지만 아무도 말하지 않고, 몇몇은 '그러니까 노키즈존이 생기지'라고 수군거린다.\n\n당신이라면 어떻게 하겠는가. 직접 말하자니 다툼이 될까 조심스럽고, 참자니 위험해 보이고, 종업원에게 말하자니 그 사람만 곤란해질 것 같다.", "q": ["이 상황에서 자신이 취할 행동을 이유와 함께 말하고, 이 상황이 '노키즈존 논쟁'과 어떻게 연결되는지 말해 보세요."], "guide": "【제시문 분석】 판단 요소: 위험의 급박성(안전사고 직전), 개입의 주체(당사자 직접 vs 매장 책임자), 갈등 최소화. '아이·부모 비난'과 '방관' 사이의 성숙한 제3의 길을 찾는 것이 평가 지점입니다.\n【답변 구성】 ① 행동(안전 기준으로 단계 설정: 급박하면 즉시, 아니면 매장 통해) → ② 이유(권한과 책임의 소재) → ③ 노키즈존 연결(개별 갈등의 실패가 제도적 배제로) → ④ 정리", "a": ["저의 행동 기준은 '안전'입니다. 아이가 뜨거운 음식을 든 종업원과 부딪히기 직전 같은 급박한 순간이라면, 예의를 따질 새 없이 즉시 아이를 멈춰 세우거나 큰 소리로 위험을 알리겠습니다. 사고는 되돌릴 수 없기 때문입니다. 그런 급박함이 아니라면, 저는 부모에게 직접 항의하기보다 매장 책임자에게 정중히 요청하는 길을 택하겠습니다. '아이들이 위험해 보이니 매장에서 안내해 주시면 좋겠다'고요. 이유는 두 가지입니다. 첫째, 매장 안의 안전을 관리할 권한과 책임은 매장에 있고, 같은 말도 손님이 하면 시비가 되기 쉽지만 직원이 하면 안내가 됩니다. 둘째, 제 목적은 부모의 잘못을 따지는 것이 아니라 위험한 행동을 멈추는 것이므로, 목적을 이루는 가장 마찰이 적은 경로를 고르는 것입니다. 다만 종업원 개인이 곤란해지지 않도록, 담당 직원이 아니라 책임자에게 말하는 배려는 필요하다고 생각합니다.\n\n이 상황은 노키즈존 논쟁의 축소판이라고 생각합니다. 손님들이 '그러니까 노키즈존이 생기지'라고 수군거리는 장면이 보여 주듯, 개별 상황에서의 조정이 실패할 때 사회는 손쉬운 일괄 배제로 기울게 됩니다. 즉 노키즈존은 이런 순간들에 아무도 말하지 않고, 부모는 책임지지 않고, 매장은 기준이 없었던 결과이기도 합니다. 반대로 말하면, 그 자리에서 어른들이 정중하게 문제를 제기하고 매장이 명확한 안전 규칙으로 대응하는 경험이 쌓이면, 통째로 배제하지 않고도 공존이 가능하다는 뜻입니다. 저는 그날의 작은 용기 있는 한마디가 노키즈존이라는 큰 벽을 줄이는 방법이라고 생각합니다."], "tips": ["행동 문항에는 '기준(안전) → 단계(급박/일반) → 경로(누구를 통해)'의 구조로 답하세요.", "분노 표출도 방관도 아닌 '목적 중심의 경로 선택'이 성숙함의 증거입니다.", "개별 상황을 사회 제도 논쟁과 연결하라는 요구는 국제고형 문항의 특징입니다. 연결 고리를 명시적으로 말하세요."]}, {"t": "기대보다 낮은 성적표를 받았을 때", "ty": "인성상황", "p": "중학교에서 늘 상위권이던 학생이 원하던 고등학교에 진학한 뒤 첫 시험에서 중위권 아래의 성적표를 받았다. 전국에서 모인 우수한 학생들 사이에서 처음 겪는 위치다. 그는 '여기서 나는 평범하구나'라는 생각에 잠을 설치고, 부모님께 성적을 말하기가 두려우며, 자신보다 잘하는 친구를 보면 위축된다. 일부 학생은 이 시기를 견디지 못하고 자신감을 잃거나 전학을 고민하기도 한다.\n\n심리학자들은 이런 현상을 '큰 물고기, 작은 연못 효과'로 설명한다. 같은 실력이라도 작은 연못의 큰 물고기였던 사람이 큰 연못으로 옮기면 자기 평가가 급격히 낮아진다는 것이다. 문제는 실력이 아니라 비교의 기준이 바뀌었다는 데 있다.", "q": ["이 학생에게 조언한다면 어떤 이야기를 해 주고 싶은지 말해 보세요.", "진학 후 같은 상황이 자신에게 온다면 어떻게 대처할지, 자신의 경험을 바탕으로 말해 보세요."], "guide": "【제시문 분석】 '큰 물고기, 작은 연못 효과'가 분석 도구로 제공됩니다. 핵심 통찰: 떨어진 것은 실력이 아니라 상대적 위치이며, 문제는 비교 기준의 변화. 조언(1번)과 자기 대처(2번) 모두 이 개념을 활용해야 합니다.\n【답변 구성】 [1] ① 감정의 인정부터 → ② 개념으로 상황 재해석(실력은 그대로) → ③ 비교 대상의 전환(등수→성장) 제안 [2] ① 예상되는 나의 감정 솔직히 → ② 대처 원칙(기준 재설정, 도움 요청) → ③ 과거 경험 근거", "a": ["먼저 그 마음이 이상한 것이 아니라고 말해 주고 싶습니다. 잘하던 사람이 처음으로 평범해지는 경험은 누구에게나 아픕니다. 그 감정을 부정하는 위로보다, 두 가지 사실을 함께 보자고 하겠습니다. 첫째, 네 실력은 성적표가 나온 날에도 어제와 똑같다는 것입니다. 제시문의 개념처럼 바뀐 것은 연못의 크기, 즉 비교 기준이지 물고기가 아닙니다. 오히려 전국의 잘하는 친구들이 모인 곳에서의 중위권은, 예전 기준으로는 여전히 높은 위치입니다. 둘째, 이 학교를 선택한 이유를 기억하자는 것입니다. 편하게 1등 하러 온 것이 아니라 더 큰 물에서 배우러 왔다면, 지금의 위축감은 선택이 잘못됐다는 증거가 아니라 선택이 작동하기 시작했다는 증거입니다. 그리고 비교의 대상을 바꾸자고 제안하겠습니다. 등수는 남과의 비교라 내 노력으로 통제할 수 없지만, 지난달의 나와의 비교는 온전히 내 것이기 때문입니다.", "저에게 같은 상황이 온다면, 솔직히 저도 흔들릴 것이라고 생각합니다. 그래서 미리 두 가지 원칙을 세워 두었습니다. 첫째, 첫 시험 성적을 '판결'이 아니라 '진단'으로 쓰는 것입니다. 등수에 며칠 아파하는 것은 허용하되, 그다음에는 어느 과목의 어느 부분에서 격차가 났는지 분석해 공부 방법을 조정하는 재료로 삼겠습니다. 둘째, 혼자 앓지 않는 것입니다. 실제로 중학교 때 자신 있던 수학에서 크게 미끄러진 적이 있는데, 그때 혼자 끙끙대던 몇 주보다 선생님께 찾아가 방법을 상담한 한 시간이 더 도움이 되었습니다. 그 경험 이후 저는 도움을 요청하는 것이 약함이 아니라 전략이라는 것을 배웠습니다. 마지막으로, 잘하는 친구를 위협이 아니라 자원으로 삼고 싶습니다. 저보다 잘하는 친구가 많은 환경은 자존심에는 손해지만 성장에는 최고의 조건이기 때문에, 그 친구들의 공부 방식을 배우고 모르는 것을 묻는 관계를 만드는 것이 제가 준비한 대처입니다."], "tips": ["위로형 답변은 '감정 인정 → 사실 재해석 → 행동 제안'의 순서를 지키세요. 사실부터 들이대면 차갑게 들립니다.", "'판결이 아니라 진단'이라는 프레임 전환이 이 문항의 핵심입니다.", "자사고·특목고 면접에서 이 질문은 사실상 '우리 학교에서 버틸 수 있는가'를 묻는 것입니다. 구체적 대처 전략이 있어야 합니다."]}, {"t": "시험 중 부정행위를 목격했다면", "ty": "인성상황", "p": "중간고사 시험 시간, 옆 분단의 친한 친구가 미리 준비한 쪽지를 보는 장면을 목격했다. 감독 선생님은 눈치채지 못했다. 그 친구는 최근 성적 때문에 부모님과 심하게 갈등을 겪고 있다는 것을 당신은 알고 있다. 시험이 끝난 뒤 그 친구는 아무 일 없었다는 듯 웃으며 다가온다.\n\n말하자니 친구를 잃고 '고자질쟁이'가 될까 두렵고, 모른 척하자니 정직하게 시험을 본 다른 친구들이 떠오른다. 당신의 선택은 무엇인가.", "q": ["이 상황에서 자신은 어떻게 행동할지, 그 이유와 함께 단계적으로 말해 보세요."], "guide": "【제시문 분석】 충돌 가치: 우정 vs 공정성(정직하게 응시한 다수의 권리). 함정은 양극단 — 즉시 신고(관계·맥락 무시)와 완전한 침묵(공정성 포기). 친구에게 먼저 기회를 주는 중간 경로와, 그 경로의 한계선을 설정하는 것이 핵심입니다.\n【답변 구성】 ① 판단의 원칙 선언(모른 척은 선택지가 아님) → ② 1단계: 친구와의 직접 대화(자진 신고 권유) → ③ 2단계: 거부 시의 행동과 그 근거 → ④ 친구의 사정(부모 갈등)에 대한 별도의 배려 → ⑤ 정리", "a": ["저에게 '완전히 모른 척한다'는 선택지는 없다고 생각합니다. 부정행위는 그 친구와 저만의 문제가 아니라, 정직하게 시험을 본 반 전체 친구들의 노력을 훔치는 일이기 때문입니다. 다만 어떻게 행동할지는 단계를 밟겠습니다.\n\n1단계로, 시험이 끝난 뒤 그 친구와 단둘이 이야기하겠습니다. 추궁이 아니라 '나 그거 봤어. 네가 요즘 많이 힘든 것도 알아. 그런데 이건 아닌 것 같아'라고 사실과 걱정을 함께 전하고, 스스로 선생님께 말씀드릴 기회를 주겠습니다. 자진해서 밝히는 것과 들켜서 밝혀지는 것은 처벌도, 그 친구의 자존감도 다르기 때문입니다. 2단계로, 친구가 거부하고 같은 일이 반복될 조짐이 보이면, 저는 선생님께 알리겠습니다. 그 순간은 고자질이 아니라, 제가 먼저 준 기회를 그 친구가 저버린 뒤의 정당한 절차라고 생각합니다. 우정이라는 이름으로 부정을 덮어 주는 것은 친구를 아끼는 것이 아니라, 그 친구가 더 큰 잘못으로 가는 길에 동행해 주는 것이기 때문입니다.\n\n마지막으로, 이 문제와 별개로 그 친구의 진짜 문제를 돕고 싶습니다. 부정행위는 성적을 둘러싼 부모님과의 갈등이라는 뿌리에서 나온 증상이므로, 상담 선생님과 이야기해 보도록 권하고 시험공부를 같이 하자고 제안하겠습니다. 잘못은 잘못대로 바로잡되 사람은 포기하지 않는 것이, 제가 생각하는 친구의 도리입니다."], "tips": ["'즉시 신고'와 '침묵' 모두 감점 요인입니다. 기회를 주는 단계적 접근이 표준 답안 구조입니다.", "'우정으로 덮는 것은 동행이 아니라 방조'라는 논리를 자기 말로 준비하세요.", "증상(부정행위)과 뿌리(가정 갈등)를 구분해 사람에 대한 돌봄까지 말하면 최상위 답변입니다."]}, {"t": "단톡방 뒷담화에 초대되었을 때", "ty": "인성상황", "p": "친한 친구들 다섯 명이 있는 단체 대화방에서 어느 날부터 같은 반 한 친구에 대한 험담이 시작됐다. 처음에는 사소한 불평이었지만 점점 외모 비하와 조롱 섞인 사진 합성으로 수위가 높아진다. 누군가 '너도 웃기지 않냐'며 당신의 동의를 구하고, 대화방의 분위기는 웃음 이모티콘으로 가득하다.\n\n반대하면 분위기를 깨는 사람이 되고, 어쩌면 다음 표적이 될지도 모른다. 가만히 있으면 동의한 것이 되고, 웃는 이모티콘 하나를 누르는 순간 가담자가 된다. 침묵과 동조와 저항 사이, 당신은 어디에 서겠는가.", "q": ["이 상황에서 자신의 행동을 구체적으로 말해 보세요.", "'가만히 있는 것도 가담'이라는 말에 동의하는지, 방관자의 책임에 대한 자신의 생각을 말해 보세요."], "guide": "【제시문 분석】 동조 압력 상황의 전형입니다. 평가 포인트는 용기의 선언이 아니라 '실행 가능한 저항의 기술'(분위기를 깨지 않으면서 흐름을 끊는 방법, 단계적 대응)과 방관자 책임에 대한 사유의 깊이입니다.\n【답변 구성】 [1] ① 최소 저항(동조 거부, 화제 전환) → ② 개인 채널로 주동 친구 설득 → ③ 수위가 범죄 수준(합성·유포)이면 어른에게 → ④ 피해 친구 지지 [2] ① 입장 → ② 근거(방관이 폭력의 연료) → ③ 책임의 층위 구분", "a": ["저는 세 단계로 행동하겠습니다. 첫째, 그 자리에서 최소한 동조하지 않겠습니다. '너도 웃기지 않냐'는 물음에 웃음으로 답하지 않고, '난 잘 모르겠는데' 정도로 흐름을 끊거나 화제를 돌리겠습니다. 작아 보이지만, 만장일치처럼 보이던 분위기에 한 명의 이탈이 생기는 순간 다른 친구들도 눈치를 보기 시작하기 때문입니다. 둘째, 단체방이 아닌 개인 대화로 주도하는 친구에게 말하겠습니다. 모두가 보는 곳에서 지적하면 그 친구의 자존심이 방어적으로 굳어지지만, 따로 '요즘 그 방 분위기 좀 그렇지 않아? 사진 합성은 진짜 위험해'라고 말하면 들을 여지가 생깁니다. 특히 사진 합성은 장난이 아니라 처벌받는 범죄라는 사실을 알려 주는 것 자체가 브레이크가 됩니다. 셋째, 그래도 멈추지 않고 수위가 높아진다면, 저는 어른에게 알리는 것을 망설이지 않겠습니다. 그리고 이 모든 과정과 별개로, 표적이 된 친구에게는 평소처럼 대하고 곁을 지키겠습니다. 가해를 멈추는 것만큼, 피해자가 혼자가 아니라고 느끼게 하는 것이 중요하기 때문입니다.", "저는 그 말에 동의합니다. 다만 책임의 무게는 구분하고 싶습니다. 직접 조롱한 사람과 옆에서 웃은 사람, 침묵한 사람의 책임이 같지는 않습니다. 그러나 방관에 책임이 없는 것은 아닙니다. 단체방의 괴롭힘은 청중이 있어야 작동하는 공연과 같아서, 웃어 주는 사람과 말없이 봐 주는 사람들이 곧 무대이기 때문입니다. 방관자들이 하나둘 반응을 멈추면 공연은 이어질 수 없습니다. 저 역시 다음 표적이 될지 모른다는 두려움이 얼마나 현실적인지 압니다. 그래서 방관자의 책임이란 '영웅이 되라'는 요구가 아니라, 자기가 감당할 수 있는 최소한의 이탈, 즉 웃지 않기, 화제 돌리기, 따로 말하기, 알리기 중 하나라도 하라는 요구라고 생각합니다. 폭력을 지탱하는 것이 다수의 침묵이라면, 폭력을 무너뜨리는 것도 결국 한 사람씩의 작은 이탈에서 시작된다고 믿습니다."], "tips": ["'단체방에서 정면 반박'만이 용기가 아닙니다. 실행 가능한 저항의 목록을 보여 주는 것이 오히려 신뢰를 줍니다.", "사진 합성=딥페이크 범죄라는 법적 인식을 한 문장 넣으면 시사 감각까지 전달됩니다.", "책임의 층위 구분(가해>동조>방관)은 사유의 정밀함을 보여 주는 지점입니다."]}, {"t": "보이지 않는 폭력 — 관계를 무기로 쓸 때", "ty": "인성상황", "p": "폭력에는 때리는 폭력만 있는 것이 아니다. 한 학생이 어느 날부터 이유를 모른 채 무리에서 밀려난다. 단체방에서 그의 말에만 아무도 답하지 않고, 그가 오면 대화가 끊기며, 생일 모임에 그만 초대받지 못한다. 따진다면 '우리가 뭘 했는데?'라는 답이 돌아올 것이다. 실제로 아무도 '한 일'은 없다. 하지 않은 일들이 쌓여 한 사람을 무너뜨리고 있을 뿐이다.\n\n심리학자들은 이런 '관계적 폭력'이 신체 폭력 못지않은 상처를 남긴다고 말한다. 소속에서 배제당하는 고통은 뇌에서 신체적 고통과 같은 부위를 활성화한다는 연구도 있다. 그러나 증거가 없고 가해자가 불분명해서, 관계적 폭력은 학교폭력 중 가장 대응하기 어려운 유형으로 꼽힌다.", "q": ["관계적 폭력이 대응하기 어려운 이유를 제시문을 바탕으로 정리하고, 이런 폭력을 줄이기 위해 학급 차원에서 할 수 있는 일을 제안해 보세요.", "자신이 배제의 분위기에 휩쓸려 본 적이 있는지 성찰하고, 그 경험에서 배운 것을 말해 보세요."], "guide": "【제시문 분석】 관계적 폭력의 특징: 행위가 아니라 '행위의 부재'로 이루어짐 → 증거 없음, 가해자 불분명, 처벌 규정 적용 곤란. 뇌 연구(사회적 고통=신체적 고통)는 심각성의 근거입니다. 2번은 정직한 자기 성찰이 관건입니다.\n【답변 구성】 [1] ① 대응이 어려운 이유(부작위성, 증거·가해자 불분명) → ② 학급 차원 제안(구조 만들기, 감수성 교육, 조기 감지) [2] ① 솔직한 성찰(휩쓸린 경험 인정) → ② 그때의 심리 → ③ 배운 것과 달라진 행동", "a": ["관계적 폭력이 대응하기 어려운 이유는 그것이 '한 일'이 아니라 '하지 않은 일들'로 이루어지기 때문입니다. 답하지 않기, 초대하지 않기, 눈 마주치지 않기는 각각으로는 처벌은커녕 지적조차 하기 어렵습니다. 증거가 남지 않고, '우리가 뭘 했는데?'라는 항변처럼 가해자도 특정되지 않습니다. 그러나 배제의 고통이 신체적 고통과 같은 뇌 부위를 활성화한다는 연구처럼 상처는 실재합니다. 학급 차원에서 저는 세 가지를 제안합니다. 첫째, 소속이 선택에 좌우되지 않는 구조를 만드는 것입니다. 모둠과 짝을 자율에만 맡기지 않고 순환·추첨제를 섞으면, 배제가 작동할 공간 자체가 줄어듭니다. 둘째, '하지 않는 것도 폭력이 될 수 있다'는 감수성 교육입니다. 관계적 폭력의 가해자들 상당수는 자신이 가해자라는 인식조차 없기 때문입니다. 셋째, 조기 감지 장치입니다. 혼자 밥 먹는 친구, 단체방에서 답을 받지 못하는 친구를 알아차리는 것은 담임 선생님보다 학생들이 빠르므로, 익명으로 학급 분위기를 점검하는 정기 설문 같은 통로가 필요하다고 생각합니다.", "정직하게 성찰하면, 저도 휩쓸려 본 적이 있습니다. 무리에서 한 친구가 서서히 밀려나던 시기에, 저는 적극적으로 배제하지는 않았지만 그 친구에게 먼저 말을 걸지도 않았습니다. 무리의 분위기를 거스르는 것이 불편했고, '내가 괴롭히는 건 아니잖아'라는 생각으로 저 자신을 안심시켰습니다. 시간이 지나 그 친구가 힘들었다는 이야기를 전해 들었을 때, 제가 한 일이 없다는 사실이 변명이 되지 않는다는 것을 알았습니다. 저의 침묵과 무행동도 그 친구가 느낀 벽의 벽돌 하나였기 때문입니다. 그 경험에서 배운 것은, 관계적 폭력 앞에서 중립은 없다는 것입니다. 그 후로 저는 무리의 분위기와 상관없이 인사와 사소한 말 걸기만큼은 모든 친구에게 유지하려고 합니다. 대단한 저항은 아니지만, '하지 않은 일들'이 무기가 되는 폭력에서는 '계속하는 작은 일들'이 방패가 된다고 믿게 되었습니다."], "tips": ["'부작위(하지 않음)의 폭력'이라는 개념을 정확히 짚는 것이 독해력의 증거입니다.", "2번에서 '저는 그런 적 없습니다'는 최악의 답입니다. 정직한 성찰 + 변화가 정답 구조입니다.", "'작은 일들이 방패가 된다'처럼 자기 경험에서 뽑은 결론 문장을 준비하세요."]}, {"t": "룸메이트와의 갈등", "ty": "인성상황", "p": "기숙사 학교에 진학한 당신은 낯선 룸메이트와 한 방을 쓰게 되었다. 한 달이 지나자 문제가 쌓인다. 룸메이트는 새벽 1시까지 스탠드를 켜고 공부하고, 당신은 일찍 자고 새벽에 일어나는 유형이다. 알람을 여러 개 맞춰 놓고 잘 끄지도 않는다. 몇 번 참다가 짜증 섞인 말이 오갔고, 이제는 방에서 서로 말을 하지 않는 어색한 사이가 되었다.\n\n기숙사 생활에서 룸메이트 갈등은 가장 흔한 문제다. 사감 선생님께 방 교체를 요청할 수도 있지만, 새 룸메이트와도 다른 문제가 생길 수 있다. 3년을 함께 살아야 하는 공간에서, 당신은 이 관계를 어떻게 풀겠는가.", "q": ["이 갈등을 해결하기 위한 자신의 방법을 단계적으로 말해 보세요.", "생활 습관이 다른 사람과 함께 살기 위해 가장 중요한 것은 무엇이라고 생각하는지 말해 보세요."], "guide": "【제시문 분석】 기숙형 학교의 단골 문항입니다. 갈등의 원인이 '악의'가 아니라 '습관의 차이'라는 점을 인식하는지, 감정이 쌓인 뒤의 관계 회복 기술(타이밍, 대화법, 규칙화)을 갖고 있는지를 봅니다.\n【답변 구성】 [1] ① 관계 회복의 첫 수(감정이 없는 시간에 대화 제안) → ② 문제를 사람이 아닌 상황으로 정의 → ③ 상호 규칙 만들기(양보의 교환) → ④ 그래도 안 되면 중재 요청 [2] 핵심 가치 하나(예: 다름을 잘못으로 여기지 않기)와 근거", "a": ["저는 네 단계로 풀겠습니다. 첫째, 대화의 타이밍을 다시 잡겠습니다. 갈등이 터지는 순간, 즉 새벽에 알람이 울릴 때 하는 말은 대화가 아니라 공격이 됩니다. 주말 낮처럼 둘 다 감정이 없는 시간에 '우리 방 생활 이야기 좀 하자'고 먼저 제안하겠습니다. 어색해진 사이에서 먼저 말을 거는 것이 지는 것 같지만, 3년을 살 방에서는 자존심보다 관계가 중요합니다. 둘째, 문제를 '너'가 아니라 '상황'으로 정의하겠습니다. '너 때문에 못 자'가 아니라 '우리 생활 리듬이 반대라서 둘 다 손해를 보고 있어'라고요. 상대도 제 새벽 기상 소리에 불편했을 수 있으므로, 먼저 저의 문제를 묻는 것으로 시작하겠습니다. 셋째, 감정이 아니라 규칙으로 해결하겠습니다. 밤 12시 이후에는 스탠드 대신 무드등과 이어폰, 저는 새벽에 준비물을 미리 챙겨 소음 줄이기, 알람은 진동으로 하고 머리맡에 두기처럼, 서로 하나씩 양보를 교환하는 눈에 보이는 약속을 만들겠습니다. 넷째, 규칙을 성실히 시도했는데도 지켜지지 않으면 그때는 사감 선생님께 중재를 요청하겠습니다. 방 교체는 문제 해결이 아니라 문제 회피이기 쉬우므로 마지막 선택지로 두겠습니다.", "가장 중요한 것은 '다름을 잘못으로 여기지 않는 태도'라고 생각합니다. 늦게 자는 것도 일찍 일어나는 것도 잘못이 아니라 그저 다른 리듬인데, 함께 살다 보면 나와 다른 것이 곧 나에 대한 무례처럼 느껴지기 시작합니다. 그 순간부터 상대의 모든 행동이 미워 보이고, 습관의 문제가 인격의 문제로 번집니다. 저는 집에서 가족과 살면서도 생활 습관 차이로 부딪혀 본 경험이 있어서, 사람은 고쳐 쓰는 대상이 아니라 맞춰 가는 상대라는 것을 배웠습니다. 다름을 인정하는 것이 출발이라면, 완성은 그 다름을 조정하는 구체적인 약속입니다. 좋은 룸메이트란 잘 맞는 사람이 아니라, 잘 맞춰 본 경험을 함께 쌓은 사람이라고 생각합니다."], "tips": ["기숙형 자사고·외고 면접의 최다 빈출 인성 문항입니다. 자기 버전의 답을 완성해 두세요.", "'사람이 아니라 상황을 문제 삼는 화법'은 모든 갈등 문항의 공통 열쇠입니다.", "방 교체 요청을 첫 수로 두면 회피형으로 읽힙니다. 마지막 선택지로 배치하세요."]}, {"t": "거짓말은 습관이 된다", "ty": "인성상황", "p": "프랑스의 사상가 몽테뉴는 '거짓말은 제2의 천성'이라고 경고했다. 한 번의 거짓말은 그것을 덮기 위한 다음 거짓말을 부르고, 반복되면 거짓말이 불편하지 않은 상태, 즉 천성처럼 굳어진다는 것이다. 실제로 한 뇌 연구에서는 사람들이 작은 거짓말을 반복할수록 거짓에 반응하던 뇌 부위의 활동이 점점 무뎌지는 것이 관찰되었다. 거짓말에도 '내성'이 생기는 셈이다.\n\n그러나 일상에는 회색지대가 있다. 친구가 정성껏 준비한 선물이 마음에 들지 않을 때, 아픈 사람에게 안색이 좋다고 말할 때, 우리는 상대를 위한 '하얀 거짓말'을 한다. 모든 거짓말이 같은 무게일까. 정직과 배려가 부딪힐 때 우리는 어디에 서야 할까.", "q": ["'거짓말은 제2의 천성'이라는 말의 의미를 뇌 연구 결과와 연결해 설명해 보세요.", "하얀 거짓말은 허용될 수 있다고 생각하는지, 자신의 기준과 경험을 말해 보세요."], "guide": "【제시문 분석】 몽테뉴의 경고(거짓의 습관화)를 뇌 과학(둔감화)이 뒷받침하는 구조입니다. 2번의 함정: '하얀 거짓말 무조건 옹호'는 1번의 논리와 충돌합니다. 허용 기준(누구의 이익인가, 되돌릴 수 있는가)을 세워 일관성을 지키세요.\n【답변 구성】 [1] ① 문장의 의미(거짓→거짓의 연쇄→둔감화) → ② 뇌 연구와 연결(내성의 생물학적 증거) [2] ① 기준 제시(상대의 이익 + 사소함 + 진실이 무의미한 경우) → ② 경험 → ③ 1번과의 일관성 유지하며 정리", "a": ["'거짓말은 제2의 천성'이라는 말은, 거짓이 한 번의 사건이 아니라 성품으로 굳어질 수 있다는 경고입니다. 그 과정은 두 단계입니다. 먼저 한 번의 거짓말은 들키지 않기 위해 다음 거짓말을 필요로 하므로 거짓은 연쇄적으로 자랍니다. 다음으로, 반복될수록 거짓에 대한 마음의 저항이 줄어듭니다. 제시문의 뇌 연구가 바로 이 두 번째 단계의 증거입니다. 거짓말을 할 때 불편함을 만들던 뇌 부위가 반복될수록 무뎌진다는 것은, 양심의 경보기가 물리적으로 둔감해진다는 뜻입니다. 처음에는 크게 울리던 경보가 나중에는 울리지 않게 되고, 그 상태가 바로 거짓이 천성이 된 상태입니다. 저는 이 연구가 '큰 거짓말을 조심하라'가 아니라 '작은 거짓말을 조심하라'는 교훈을 준다고 생각합니다. 천성을 만드는 것은 큰 거짓말 한 번이 아니라 작은 거짓말의 반복이기 때문입니다.", "저는 하얀 거짓말이 좁은 조건에서 허용될 수 있다고 생각합니다. 저의 기준은 세 가지입니다. 첫째, 오직 상대를 위한 것이어야 합니다. 저의 이익이나 편의가 조금이라도 섞이면 하얀색이 아니라고 생각합니다. 둘째, 진실을 말하는 것이 상대에게 아무 도움이 되지 않는 경우여야 합니다. 셋째, 상대의 판단이나 선택을 왜곡하지 않아야 합니다. 예를 들어 이미 받은 선물이 마음에 안 든다는 진실은 상대에게 상처만 주고 바꿀 수 있는 것도 없으므로 '고마워, 잘 쓸게'라고 말할 수 있지만, 친구의 발표 준비가 부족하다는 진실은 아직 고칠 시간이 있으므로 숨기는 것이 오히려 해가 됩니다. 실제로 저는 친구의 발표 자료에 대해 듣기 좋은 말만 했다가 친구가 낮은 평가를 받은 적이 있고, 그때 저의 배려가 사실은 저의 회피였다는 것을 깨달았습니다. 그 후 저의 원칙은 '결과를 바꿀 수 있는 진실은 반드시 말하되, 방식을 배려한다'입니다. 몽테뉴의 경고처럼 하얀 거짓말도 습관이 되면 회색으로 짙어지기 때문에, 허용의 문은 좁게 열어 두려고 합니다."], "tips": ["뇌 연구를 '양심의 경보기가 둔감해진다'처럼 자기 언어로 번역하면 이해의 증거가 됩니다.", "하얀 거짓말의 허용 기준을 묻는 것은 곧 원칙의 일관성을 시험하는 것입니다. 1번 답변과 모순되지 않게 하세요.", "'배려를 가장한 회피'를 구분하는 경험담이 이 문항의 백미입니다."]}, {"t": "학생회장 선거, 두 후보의 공약", "ty": "인성상황", "p": "학생회장 선거에 두 후보가 나왔다. A후보의 공약은 '매점 간식 종류 확대, 체육대회 상품 강화, 시험 기간 간식 배부'처럼 학생들이 당장 좋아할 것들이다. B후보의 공약은 '학생 의견이 실제 반영되는 학칙 개정 절차 마련, 학습 도우미 제도, 교실 환경 개선 예산 확보'처럼 눈에 덜 띄지만 구조를 바꾸는 것들이다. 여론은 A후보 쪽으로 기울고 있다. '어차피 공약은 공약일 뿐'이라는 냉소도 들린다.\n\n선거는 작은 민주주의의 훈련장이다. 무엇을 보고 뽑을 것인가, 그리고 뽑힌 사람은 무엇을 해야 하는가.", "q": ["두 후보의 공약을 평가하는 자신의 기준을 말하고, 누구에게 투표할지 근거와 함께 말해 보세요.", "자신이 학생회장이 된다면 임기 동안 꼭 이루고 싶은 일 하나와 그 실행 계획을 말해 보세요."], "guide": "【제시문 분석】 A(즉각적 만족, 인기)와 B(구조적 변화, 지속성)의 대비는 현실 정치의 축소판입니다. 평가 기준(실현 가능성, 수혜의 지속성, 학생회의 고유 역할)을 먼저 세우고 판정하는
