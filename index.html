·노동력→부양 부담) → ② 우선 분야 선택 → ③ 선택의 근거(원인의 뿌리를 겨냥)", "a": ["그래프에서 세 가지 사실을 확인할 수 있습니다. 첫째, 2000년 1.48명이었던 합계출산율이 2024년 0.75명으로 24년 사이 절반 수준으로 떨어졌습니다. 둘째, 인구 유지에 필요한 2.1명과 비교하면 현재 수치는 그 3분의 1 수준에 불과합니다. 셋째, 하락이 일정하지 않고 2015년 1.24명 이후 급격히 가팔라져, 10년도 되지 않아 0.5명 가까이 떨어졌습니다. 즉 문제는 하락 그 자체보다 하락의 속도가 빨라지고 있다는 점입니다.", "이 추세가 이어지면 20년 후에는 연쇄적인 변화가 나타날 것입니다. 지금 태어나는 아이들이 20대가 되는 시점이므로, 우선 대학과 군대, 노동시장에 진입하는 인구가 지금의 절반 수준으로 줄어듭니다. 학교와 지방 도시의 소멸이 가속화되고, 줄어든 생산인구가 늘어난 고령 인구를 부양해야 하므로 세금과 연금 부담이 커지며, 내수 시장도 축소될 것입니다. 가장 시급한 대응 분야로 저는 '일·가정 양립', 그중에서도 노동시간과 돌봄 체계의 개혁을 꼽고 싶습니다. 그 이유는 주거·사교육 등 여러 원인 중에서 '아이를 키울 시간이 없다'는 문제가 가장 뿌리에 있다고 보기 때문입니다. 현금성 지원을 20년간 확대했어도 효과가 없었다는 것은, 돈보다 시간과 구조의 문제라는 뜻입니다. 부모가 눈치 보지 않고 육아휴직을 쓰고 정시에 퇴근할 수 있는 노동 환경이 만들어져야, 다른 지원책들도 비로소 효과를 낼 수 있다고 생각합니다."], "tips": ["자료해석의 1단계는 '사실 진술'입니다. 자신의 의견을 섞지 말고 수치·추세·비교만 정확히 말하세요.", "수치 인용은 시작값·끝값·변곡점 등 1~3개면 충분합니다. 모든 숫자를 읽으면 오히려 요점이 흐려집니다.", "'하락'보다 '하락 속도의 가속'을 짚으면 자료를 깊이 읽었다는 평가를 받습니다."], "chart": "<svg viewBox=\"0 0 560 250\" style=\"width:100%;max-width:560px;background:#fff;border:1px solid #e3e9f2;border-radius:8px\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"46\" y1=\"16.0\" x2=\"550\" y2=\"16.0\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"20.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">1.6<\/text><line x1=\"46\" y1=\"63.5\" x2=\"550\" y2=\"63.5\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"67.5\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">1.2<\/text><line x1=\"46\" y1=\"111.0\" x2=\"550\" y2=\"111.0\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"115.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">0.8<\/text><line x1=\"46\" y1=\"158.5\" x2=\"550\" y2=\"158.5\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"162.5\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">0.4<\/text><line x1=\"46\" y1=\"206.0\" x2=\"550\" y2=\"206.0\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"210.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">0<\/text><text x=\"46.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2000<\/text><text x=\"116.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2005<\/text><text x=\"186.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2010<\/text><text x=\"256.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2015<\/text><text x=\"326.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2018<\/text><text x=\"396.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2020<\/text><text x=\"466.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2022<\/text><text x=\"536.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2024<\/text><polyline points=\"46.0,30.3 116.0,76.6 186.0,59.9 256.0,58.8 326.0,89.6 396.0,106.3 466.0,113.4 536.0,116.9\" fill=\"none\" stroke=\"#2f6fb4\" stroke-width=\"2.5\"/><circle cx=\"46.0\" cy=\"30.3\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"46.0\" y=\"22.3\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">1.48<\/text><circle cx=\"116.0\" cy=\"76.6\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"116.0\" y=\"68.6\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">1.09<\/text><circle cx=\"186.0\" cy=\"59.9\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"186.0\" y=\"51.9\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">1.23<\/text><circle cx=\"256.0\" cy=\"58.8\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"256.0\" y=\"50.8\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">1.24<\/text><circle cx=\"326.0\" cy=\"89.6\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"326.0\" y=\"81.6\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">0.98<\/text><circle cx=\"396.0\" cy=\"106.3\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"396.0\" y=\"98.3\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">0.84<\/text><circle cx=\"466.0\" cy=\"113.4\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"466.0\" y=\"105.4\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">0.78<\/text><circle cx=\"536.0\" cy=\"116.9\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"536.0\" y=\"108.9\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">0.75<\/text><text x=\"550\" y=\"244\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">단위: 명 · 예시 자료<\/text><\/svg>"}, {"t": "청소년 매체 이용 시간 분석", "ty": "자료해석", "p": "다음은 우리나라 청소년의 하루 평균 매체 이용 시간을 조사한 자료다. 숏폼 영상은 1분 내외의 짧은 동영상으로, 최근 청소년이 가장 오래 이용하는 매체가 되었다.\n\n숏폼 영상은 시청자의 반응 데이터를 실시간으로 학습해 좋아할 만한 다음 영상을 자동으로 이어 보여 준다. 이 때문에 이용자가 시청 시간을 스스로 통제하기 어렵다는 지적이 나온다. 반면 종이책 독서 시간은 하루 20분에도 미치지 못해, 짧고 자극적인 콘텐츠와 길고 깊은 텍스트 사이의 격차가 점점 벌어지고 있다.", "q": ["자료에서 발견할 수 있는 특징을 말하고, 그런 결과가 나타난 원인을 분석해 보세요.", "숏폼 위주의 매체 소비가 학습에 미치는 영향을 말하고, 자신의 매체 사용 원칙을 소개해 보세요."], "guide": "【자료 분석】 막대그래프는 '순위'와 '격차'를 봅니다. 1위(숏폼 92분)와 최하위(독서 17분)의 대비, 그리고 상위 항목들의 공통점(짧은 호흡, 즉각적 자극)을 묶어 내면 해석이 됩니다.\n【답변 구성】 [1] ① 특징(숏폼 1위, 독서와 5배 이상 격차) → ② 원인을 기술적 요인(추천 알고리즘)과 심리적 요인(즉각 보상)으로 나눠 분석 [2] ① 학습에 미치는 영향(집중 지속력·문해력) → ② 실천 중인 원칙 → ③ 효과", "a": ["자료의 가장 큰 특징은 숏폼 영상이 하루 92분으로 1위인 반면 종이책 독서는 17분으로 최하위여서, 둘 사이에 다섯 배가 넘는 격차가 있다는 점입니다. 또 상위 항목인 숏폼, 메신저, 게임은 모두 짧은 호흡으로 즉각적인 반응을 주는 매체라는 공통점이 있습니다. 원인은 두 층위로 나눌 수 있습니다. 기술적으로는, 제시문처럼 숏폼이 개인의 반응을 학습해 다음 영상을 자동으로 이어 주기 때문에 '그만 보는 결정' 자체를 하기 어렵게 설계되어 있습니다. 심리적으로는, 청소년기의 뇌가 즉각적 보상에 민감한데 숏폼은 몇 초마다 새로운 자극을 주는 반면 독서는 보상이 느리게 오기 때문에, 통제력이 아직 자라는 시기에는 자연스럽게 숏폼 쪽으로 기울게 됩니다.", "숏폼 위주의 소비는 학습에 두 가지 영향을 준다고 생각합니다. 첫째, 긴 글을 붙잡고 있는 집중 지속력이 약해집니다. 공부는 본질적으로 느린 보상을 견디는 활동인데, 몇 초 단위의 자극에 익숙해지면 교과서 한 페이지가 견디기 어려워집니다. 둘째, 정보를 영상으로만 받으면 글을 읽고 구조를 파악하는 문해력이 자랄 기회가 줄어듭니다. 그래서 저는 두 가지 원칙을 실천하고 있습니다. 하나는 숏폼 앱의 알림을 끄고 하루 사용 시간을 정해 두는 것이고, 다른 하나는 자기 전 마지막 30분은 화면 대신 책을 읽는 것입니다. 처음에는 책에 집중이 잘 안 됐지만, 몇 주가 지나자 긴 글을 읽는 지구력이 조금씩 돌아오는 것을 느꼈습니다. 매체를 끊는 것이 아니라 매체 사용의 주도권을 제가 갖는 것이 목표입니다."], "tips": ["막대그래프는 '1위와 꼴찌의 대비'와 '상위 항목의 공통점'을 말하면 깔끔하게 정리됩니다.", "원인 분석은 '기술적 요인/심리적 요인'처럼 층위를 나누면 분석력이 돋보입니다.", "자신도 이용자라는 점을 숨기지 말고, 통제의 경험을 근거로 쓰세요."], "chart": "<svg viewBox=\"0 0 560 240\" style=\"width:100%;max-width:560px;background:#fff;border:1px solid #e3e9f2;border-radius:8px\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"46\" y1=\"16.0\" x2=\"550\" y2=\"16.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"20.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">105.8<\/text><line x1=\"46\" y1=\"62.0\" x2=\"550\" y2=\"62.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"66.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">79.35<\/text><line x1=\"46\" y1=\"108.0\" x2=\"550\" y2=\"108.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"112.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">52.9<\/text><line x1=\"46\" y1=\"154.0\" x2=\"550\" y2=\"154.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"158.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">26.45<\/text><line x1=\"46\" y1=\"200.0\" x2=\"550\" y2=\"200.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"204.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">0<\/text><rect x=\"63.8\" y=\"40.0\" width=\"63.2\" height=\"160.0\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"95.4\" y=\"35.0\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">92<\/text><text x=\"95.4\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">숏폼 영상<\/text><rect x=\"162.6\" y=\"71.3\" width=\"63.2\" height=\"128.7\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"194.2\" y=\"66.3\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">74<\/text><text x=\"194.2\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">메신저·SNS<\/text><rect x=\"261.4\" y=\"93.9\" width=\"63.2\" height=\"106.1\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"293.0\" y=\"88.9\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">61<\/text><text x=\"293.0\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">게임<\/text><rect x=\"360.2\" y=\"116.5\" width=\"63.2\" height=\"83.5\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"391.8\" y=\"111.5\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">48<\/text><text x=\"391.8\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">TV·OTT<\/text><rect x=\"459.0\" y=\"170.4\" width=\"63.2\" height=\"29.6\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"490.6\" y=\"165.4\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">17<\/text><text x=\"490.6\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">종이책 독서<\/text><text x=\"550\" y=\"234\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">단위: 분 · 예시 자료<\/text><\/svg>"}, {"t": "온실가스 배출 구조와 감축 우선순위", "ty": "자료해석", "p": "다음은 한 나라의 부문별 온실가스 배출 비중을 나타낸 자료다. 이 나라는 2030년까지 전체 배출량을 2018년 대비 40% 감축한다는 국가 목표를 세웠다.\n\n에너지·발전 부문이 37%로 가장 큰 비중을 차지하는데, 이는 전기를 만들 때 석탄 등 화석연료에 의존하는 비중이 높기 때문이다. 산업 부문(26%)은 철강·석유화학 등 제조업의 공정에서, 수송 부문(15%)은 자동차·항공 등의 연료에서 배출된다. 감축 목표 달성까지 남은 시간은 길지 않지만, 각 부문의 감축 비용과 기술적 난이도는 서로 다르다.", "q": ["감축 목표를 달성하려면 어느 부문에 우선 투자해야 할지, 자료를 근거로 자신의 판단을 말해 보세요.", "기후 대응에서 '개인의 실천은 의미가 없고 구조를 바꿔야 한다'는 주장에 대한 자신의 생각을 말해 보세요."], "guide": "【자료 분석】 비중 자료에서 우선순위를 정할 때는 '비중의 크기'와 '감축의 용이성'을 함께 따져야 합니다. 에너지·발전(37%)은 비중이 가장 크고, 발전소는 수가 적어 정책 효과가 집중되는 부문임을 추론할 수 있습니다.\n【답변 구성】 [1] ① 우선 부문 선택 → ② 근거 1(비중 최대: 37%) → ③ 근거 2(소수의 발전소 → 정책 집중 가능, 전기화의 파급) → ④ 보완(산업 부문 병행) [2] ① 양쪽 논리 정리 → ② 개인 실천의 재해석(소비자·유권자로서의 신호) → ③ 종합", "a": ["저는 에너지·발전 부문에 우선 투자해야 한다고 판단합니다. 근거는 세 가지입니다. 첫째, 자료에서 이 부문의 비중이 37%로 가장 커서, 같은 비율을 감축해도 절대량의 효과가 가장 큽니다. 40% 감축이라는 목표를 달성하려면 가장 큰 덩어리를 움직이지 않고는 산술적으로 불가능합니다. 둘째, 발전 부문은 감축의 실행 단위가 상대적으로 단순합니다. 수천만 대의 자동차나 수많은 공장을 바꾸는 것보다, 소수의 발전소를 재생에너지와 저탄소 전원으로 전환하는 것이 정책을 집중하기에 유리합니다. 셋째, 파급 효과입니다. 전기가 깨끗해지면 전기차와 전기 설비를 쓰는 수송·산업·건물 부문의 배출까지 함께 줄어들어, 발전 부문 투자는 다른 부문 감축의 기반이 됩니다. 다만 26%를 차지하는 산업 부문은 기술 개발에 시간이 오래 걸리므로, 투자 순서는 발전이 먼저더라도 연구개발은 지금부터 병행해야 한다고 생각합니다.", "저는 그 주장이 절반만 옳다고 생각합니다. 배출 구조를 보면 개인이 아무리 아껴도 발전소와 공장을 바꾸지 않으면 감축 목표는 달성될 수 없으므로, '구조가 본질'이라는 지적은 맞습니다. 하지만 개인의 실천이 무의미하다는 결론에는 동의하지 않습니다. 구조를 바꾸는 힘이 바로 개인들에게서 나오기 때문입니다. 소비자가 저탄소 제품을 선택하면 기업이 움직이고, 유권자가 기후 정책을 기준으로 투표하면 정부가 움직입니다. 즉 개인의 실천은 배출량 감소 효과보다 '구조를 바꾸라는 신호'로서 더 큰 의미가 있다고 생각합니다. 텀블러를 쓰는 한 사람의 절감량은 작지만, 그런 사람이 수백만 명이라는 사실이 확인되는 순간 기업과 정치의 계산이 달라집니다. 그래서 저는 개인의 실천과 구조의 개혁을 대립시키지 않고, 실천을 구조 변화를 요구하는 참여의 한 형태로 이어 가야 한다고 생각합니다."], "tips": ["우선순위 판단은 '비중이 크다'만으로는 부족합니다. 실행 가능성·파급 효과까지 근거를 겹치세요.", "'개인 대 구조' 논쟁은 기후·환경 단골 꼬리질문입니다. '실천은 신호다'라는 재해석을 기억해 두세요.", "37%, 40% 같은 핵심 수치 두 개만 정확히 쓰면 자료 활용 점수는 충분합니다."], "chart": "<svg viewBox=\"0 0 560 240\" style=\"width:100%;max-width:560px;background:#fff;border:1px solid #e3e9f2;border-radius:8px\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"46\" y1=\"16.0\" x2=\"550\" y2=\"16.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"20.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">42.55<\/text><line x1=\"46\" y1=\"62.0\" x2=\"550\" y2=\"62.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"66.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">31.9125<\/text><line x1=\"46\" y1=\"108.0\" x2=\"550\" y2=\"108.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"112.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">21.275<\/text><line x1=\"46\" y1=\"154.0\" x2=\"550\" y2=\"154.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"158.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">10.6375<\/text><line x1=\"46\" y1=\"200.0\" x2=\"550\" y2=\"200.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"204.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">0<\/text><rect x=\"60.8\" y=\"40.0\" width=\"52.7\" height=\"160.0\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"87.2\" y=\"35.0\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">37<\/text><text x=\"87.2\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">에너지·발전<\/text><rect x=\"143.2\" y=\"87.6\" width=\"52.7\" height=\"112.4\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"169.5\" y=\"82.6\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">26<\/text><text x=\"169.5\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">산업<\/text><rect x=\"225.5\" y=\"135.1\" width=\"52.7\" height=\"64.9\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"251.8\" y=\"130.1\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">15<\/text><text x=\"251.8\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">수송<\/text><rect x=\"307.8\" y=\"148.1\" width=\"52.7\" height=\"51.9\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"334.2\" y=\"143.1\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">12<\/text><text x=\"334.2\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">건물<\/text><rect x=\"390.2\" y=\"169.7\" width=\"52.7\" height=\"30.3\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"416.5\" y=\"164.7\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">7<\/text><text x=\"416.5\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">농축산<\/text><rect x=\"472.5\" y=\"187.0\" width=\"52.7\" height=\"13.0\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"498.8\" y=\"182.0\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">3<\/text><text x=\"498.8\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">폐기물<\/text><text x=\"550\" y=\"234\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">단위: % · 예시 자료<\/text><\/svg>"}, {"t": "1인 가구 시대의 도래", "ty": "자료해석", "p": "다음은 우리나라 전체 가구 중 1인 가구가 차지하는 비중의 변화를 나타낸 자료다. 1인 가구는 이미 가장 흔한 가구 형태가 되어, '4인 가족'을 표준으로 설계된 기존의 제도·주택·산업과의 불일치가 커지고 있다.\n\n1인 가구의 증가는 하나의 원인이 아니라 세대별로 다른 이유가 겹친 결과다. 청년층에서는 학업·취업을 위한 이동과 비혼의 증가, 중장년층에서는 이혼과 기러기 가구의 증가, 노년층에서는 배우자와의 사별과 자녀 분가가 주된 배경으로 꼽힌다. 혼자 사는 삶이 보편화되면서 소형 주택, 소포장 식품, 1인 외식업 같은 '솔로 이코노미'가 성장하는 한편, 고립과 고독사 같은 새로운 사회 문제도 함께 커지고 있다.", "q": ["자료의 추세를 설명하고, 1인 가구 증가의 원인을 연령대별로 나누어 분석해 보세요.", "이 변화가 만들어 낼 사회적 과제와 산업적 기회를 각각 한 가지 이상 제시해 보세요."], "guide": "【자료 분석】 2000년 15.5%에서 2024년 35.5%로, 비중이 20%p 이상 증가해 '세 집 중 한 집'이 된 변화입니다. 제시문 2문단이 연령대별 원인의 힌트를 담고 있으므로, 자료(추세)와 제시문(원인)을 결합해 답하는 문제입니다.\n【답변 구성】 [1] ① 추세를 수치로 요약 → ② 청년·중장년·노년으로 나눈 원인 분석 [2] ① 사회적 과제(고립·주거) → ② 산업적 기회(솔로 이코노미) → ③ 과제와 기회를 연결하는 시각", "a": ["자료를 보면 1인 가구 비중은 2000년 15.5%에서 2024년 35.5%로 24년 동안 20%포인트 넘게 늘었고, 증가세가 꺾이지 않고 계속되고 있습니다. 이제 세 집 중 한 집이 1인 가구인 셈입니다. 원인은 연령대별로 다릅니다. 청년층에서는 진학과 취업을 위해 가족과 떨어져 사는 경우와 결혼을 선택하지 않는 비혼의 증가가 겹쳐 있습니다. 중장년층에서는 이혼의 증가가, 노년층에서는 평균수명이 길어지면서 배우자와 사별한 후 혼자 사는 기간이 늘어난 것이 주된 원인입니다. 즉 1인 가구 증가는 어떤 한 세대의 선택이 아니라, 생애주기 전체에 걸친 사회 변화가 겹쳐진 구조적 현상이라고 분석할 수 있습니다.", "사회적 과제로는 '고립'을 가장 먼저 꼽고 싶습니다. 가족이 수행하던 돌봄과 안전망의 기능을 혼자 사는 사람은 갖기 어렵습니다. 특히 노년 1인 가구의 고독사, 청년 1인 가구의 사회적 단절은 이미 나타나고 있는 문제이므로, 이웃과 지역이 가족의 기능을 일부 대신하는 공동체 돌봄 체계가 필요합니다. 산업적 기회로는 솔로 이코노미의 성장을 들 수 있습니다. 소형 주택과 가전, 1인분 식품과 구독 서비스, 반려동물 산업까지 혼자 사는 삶을 위한 시장이 커지고 있습니다. 다만 저는 이 둘을 연결해서 보고 싶습니다. 예를 들어 1인 가구 밀집 지역의 공유 주방이나 커뮤니티형 주택은 사업이면서 동시에 고립을 줄이는 장치가 됩니다. 사회 문제를 해결하는 방향의 산업이야말로 이 변화가 주는 가장 큰 기회라고 생각합니다."], "tips": ["'연령대별로 나누어'라는 지시가 있으면 반드시 청년/중장년/노년의 구조로 답하세요. 지시 이행 자체가 채점 기준입니다.", "%와 %포인트를 구분해서 쓰면 통계 감각을 보여 줄 수 있습니다.", "'과제와 기회를 연결'하는 마지막 한 문단이 이 답변의 차별화 포인트입니다."], "chart": "<svg viewBox=\"0 0 560 250\" style=\"width:100%;max-width:560px;background:#fff;border:1px solid #e3e9f2;border-radius:8px\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"46\" y1=\"16.0\" x2=\"550\" y2=\"16.0\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"20.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">40<\/text><line x1=\"46\" y1=\"63.5\" x2=\"550\" y2=\"63.5\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"67.5\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">30<\/text><line x1=\"46\" y1=\"111.0\" x2=\"550\" y2=\"111.0\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"115.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">20<\/text><line x1=\"46\" y1=\"158.5\" x2=\"550\" y2=\"158.5\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"162.5\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">10<\/text><line x1=\"46\" y1=\"206.0\" x2=\"550\" y2=\"206.0\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"210.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">0<\/text><text x=\"46.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2000<\/text><text x=\"144.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2005<\/text><text x=\"242.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2010<\/text><text x=\"340.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2015<\/text><text x=\"438.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2020<\/text><text x=\"536.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2024<\/text><polyline points=\"46.0,132.4 144.0,111.0 242.0,92.5 340.0,76.8 438.0,55.4 536.0,37.4\" fill=\"none\" stroke=\"#2f6fb4\" stroke-width=\"2.5\"/><circle cx=\"46.0\" cy=\"132.4\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"46.0\" y=\"124.4\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">15.5<\/text><circle cx=\"144.0\" cy=\"111.0\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"144.0\" y=\"103.0\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">20<\/text><circle cx=\"242.0\" cy=\"92.5\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"242.0\" y=\"84.5\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">23.9<\/text><circle cx=\"340.0\" cy=\"76.8\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"340.0\" y=\"68.8\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">27.2<\/text><circle cx=\"438.0\" cy=\"55.4\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"438.0\" y=\"47.4\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">31.7<\/text><circle cx=\"536.0\" cy=\"37.4\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"536.0\" y=\"29.4\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">35.5<\/text><text x=\"550\" y=\"244\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">단위: % · 예시 자료<\/text><\/svg>"}, {"t": "학교폭력 양상의 변화", "ty": "자료해석", "p": "다음은 교육부 학교폭력 실태조사에 나타난 피해 유형별 비중의 변화를 정리한 자료다. 조사 기간 동안 학교폭력의 전체 양상이 눈에 띄게 달라졌다.\n\n신체폭력과 금품갈취처럼 눈에 보이는 폭력의 비중은 줄어든 반면, 언어폭력과 사이버폭력처럼 눈에 보이지 않는 폭력의 비중이 커졌다. 특히 사이버폭력은 단체 대화방에서의 따돌림, 저격 글, 허위 소문 유포, 최근에는 딥페이크 합성물까지 형태가 다양해지고 있다. 사이버 공간의 폭력은 시간과 장소의 제한이 없어 피해자가 벗어날 곳이 없고, 기록이 복제되어 피해가 반복된다는 특징이 있다.", "q": ["표에서 나타나는 학교폭력의 변화 추세를 요약하고, 그러한 변화가 나타난 배경을 분석해 보세요.", "비중이 커진 유형의 폭력에 대해 학교와 학생이 각각 할 수 있는 효과적인 대응 방안을 제시해 보세요."], "guide": "【자료 분석】 표는 '증가 항목'과 '감소 항목'을 묶어서 보아야 합니다. 증가: 언어(33.3→39.4%)·사이버(9.2→17.1%), 감소: 신체·금품. '보이는 폭력에서 보이지 않는 폭력으로'라는 한 문장으로 압축하는 것이 핵심입니다.\n【답변 구성】 [1] ① 추세 요약(한 문장 압축) → ② 배경 분석(관계의 온라인화, 처벌·감시 강화의 풍선효과) [2] ① 학교 차원(예방 교육의 방향 전환, 신고·회복 시스템) → ② 학생 차원(방관자에서 방어자로) → ③ 정리", "a": ["표의 변화는 한 문장으로 '보이는 폭력에서 보이지 않는 폭력으로'라고 요약할 수 있습니다. 신체폭력은 11.9%에서 7.3%로, 금품갈취도 줄어든 반면, 언어폭력은 33.3%에서 39.4%로 늘어 가장 큰 비중을 차지했고 사이버폭력은 9.2%에서 17.1%로 거의 두 배가 되었습니다. 배경은 두 가지로 분석할 수 있습니다. 첫째, 청소년 관계 자체가 온라인으로 옮겨 갔기 때문입니다. 관계가 SNS와 단체 대화방에서 이루어지니 갈등과 폭력도 그 공간에서 일어나는 것입니다. 둘째, CCTV 설치와 처벌 강화로 물리적 폭력의 위험 부담이 커지자, 폭력이 어른들의 눈에 덜 띄는 언어와 온라인 공간으로 이동한 풍선효과의 측면도 있다고 생각합니다. 폭력의 총량이 줄었다기보다 형태가 교묘해진 것일 수 있어, 수치의 감소를 그대로 안심할 수는 없습니다.", "학교 차원에서는 예방 교육의 방향을 바꿔야 한다고 생각합니다. '폭력은 나쁘다'는 당위 교육보다, 단체방 캡처가 증거가 되고 사이버폭력도 처벌된다는 것, 그리고 피해를 입었을 때의 신고 경로를 구체적으로 가르치는 실용적 교육이 효과적입니다. 또 사이버폭력은 담임 선생님이 발견하기 어려우므로 익명 신고 시스템과 발견 즉시의 분리·상담 체계가 필요합니다. 학생 차원에서 가장 중요한 것은 방관자의 역할이라고 생각합니다. 단체방 따돌림은 다수의 침묵을 연료로 삼는데, 동조하지 않고 '그만하자'는 한마디를 하거나 최소한 피해자에게 개인적으로 연락해 혼자가 아님을 알려 주는 것만으로도 폭력의 동력이 약해집니다. 저는 폭력의 형태가 바뀌었어도 해법의 본질은 같다고 생각합니다. 폭력이 숨을 곳을 줄이고, 피해자가 기댈 곳을 늘리는 것입니다."], "tips": ["표 해석은 '증가 그룹 vs 감소 그룹'으로 묶고, 변화를 한 문장으로 압축하는 훈련을 하세요.", "'수치 감소 = 문제 해결'로 단정하지 않는 비판적 시각(풍선효과 가능성)이 고득점 포인트입니다.", "대응 방안을 '학교/학생'처럼 주체별로 나누라는 지시는 그대로 구조로 옮기세요."], "chart": "<table style=\"width:100%;max-width:560px;border-collapse:collapse;background:#fff;font-size:13px\"><tr><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">피해 유형<\/th><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">2015년<\/th><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">2024년<\/th><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">언어폭력<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">33.3%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">39.4%<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">집단따돌림<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">17.3%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">18.5%<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">사이버폭력<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">9.2%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">17.1%<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">신체폭력<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">11.9%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">7.3%<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">금품갈취<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">7.2%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">4.5%<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">기타<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">21.1%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">13.2%<\/td><\/tr><\/table><div style=\"font-size:10.5px;color:#8896aa;margin-top:3px\">※ 예시 자료<\/div>"}, {"t": "독서율 하락과 문해력", "ty": "자료해석", "p": "다음은 1년에 책을 한 권 이상 읽은 사람의 비율인 '연간 독서율'을 학생과 성인으로 나누어 나타낸 자료다. 문화체육관광부의 국민 독서실태조사에 따르면 성인 독서율은 조사할 때마다 역대 최저치를 갈아치우고 있다.\n\n학생 독서율은 90%대를 유지하는 반면 성인 독서율은 10년 사이 71.4%에서 43%까지 떨어져, 성인 열 명 중 여섯 명이 1년에 책을 한 권도 읽지 않는다. 성인들이 밝힌 독서의 가장 큰 장애물은 '일 때문에 시간이 없어서'와 '책 이외의 매체를 이용해서'였다. 한편 긴 글을 읽고 이해하는 능력의 저하가 사회 문제로 떠오르면서, 독서율 하락을 개인의 취향 변화가 아니라 사회적 문해력의 위기로 보아야 한다는 지적도 나온다.", "q": ["두 집단의 추이를 비교하고, 학생과 성인의 독서율 격차가 큰 이유를 분석해 보세요.", "'학생 때는 읽지만 어른이 되면 읽지 않는' 현상을 막으려면 학교 독서교육이 어떻게 달라져야 할지 제안해 보세요."], "guide": "【자료 분석】 두 선의 대비가 핵심입니다. 학생은 90%대 유지, 성인은 71.4%→43%로 급락. 격차의 이유를 '학생 독서의 성격'(과제·입시로 유지되는 비자발적 독서)에서 찾으면 두 번째 질문과 자연스럽게 연결됩니다.\n【답변 구성】 [1] ① 두 추이 비교 → ② 격차 분석(학생 독서는 제도가 떠받친 독서라는 가설) [2] ① 진단에 근거한 방향 전환(의무에서 즐거움으로) → ② 구체안 2~3가지 → ③ 기대 효과", "a": ["학생 독서율은 조사 기간 내내 90% 이상을 유지한 반면, 성인 독서율은 71.4%에서 43%로 10년 사이 28%포인트나 떨어졌습니다. 두 집단의 격차가 이렇게 큰 이유를 저는 학생 독서의 성격에서 찾고 싶습니다. 학생의 독서는 상당 부분 수행평가와 필독서, 학교 프로그램이 떠받치고 있는 '제도화된 독서'입니다. 즉 학생들이 책을 좋아해서 읽는다기보다, 읽게 만드는 장치 속에 있는 것입니다. 그 장치가 사라지는 졸업과 동시에 독서가 끊어진다는 것은, 학창 시절의 독서가 습관과 즐거움으로 내면화되지 못했다는 뜻입니다. 여기에 성인의 장시간 노동과 스마트폰 등 대체 매체의 확산이 겹쳐 하락을 가속한 것으로 분석할 수 있습니다.", "저는 독서교육의 목표를 '읽게 하는 것'에서 '읽고 싶게 만드는 것'으로 바꿔야 한다고 생각합니다. 지금의 독서교육이 독후감 제출과 권수 채우기로 독서를 과제로 만들었다면, 졸업 후 독서가 끊기는 것은 당연한 결과이기 때문입니다. 구체적으로 세 가지를 제안합니다. 첫째, 책 선택권을 학생에게 주는 것입니다. 필독서 목록보다 자신이 고른 책 한 권이 독서를 자기 것으로 만듭니다. 둘째, 결과물 평가를 줄이고 대화를 늘리는 것입니다. 독후감 검사 대신 친구들과 책 수다를 떠는 동아리형 활동이 독서를 즐거운 기억으로 남깁니다. 셋째, 짧은 글이라도 완독하는 경험을 자주 주는 것입니다. 두꺼운 책의 부담보다 단편과 칼럼으로 '끝까지 읽어 낸 성취감'을 쌓는 것이 습관의 씨앗이 됩니다. 결국 학교가 심어야 할 것은 독서 이력이 아니라, 어른이 되어서도 스스로 책을 찾게 하는 독서의 즐거움이라고 생각합니다."], "tips": ["두 선 그래프는 반드시 '비교'로 답을 시작하세요. 한 집단만 설명하면 자료의 절반을 버린 것입니다.", "'제도가 떠받친 독서'라는 가설 설정처럼, 표면의 수치에서 숨은 원인을 추론하는 모습이 핵심 평가 요소입니다.", "자신의 독서 경험(즐거웠던 책 한 권)을 한 문장 곁들이면 진정성이 살아납니다."], "chart": "<svg viewBox=\"0 0 560 250\" style=\"width:100%;max-width:560px;background:#fff;border:1px solid #e3e9f2;border-radius:8px\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"46\" y1=\"16.0\" x2=\"550\" y2=\"16.0\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"20.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">100<\/text><line x1=\"46\" y1=\"63.5\" x2=\"550\" y2=\"63.5\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"67.5\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">75<\/text><line x1=\"46\" y1=\"111.0\" x2=\"550\" y2=\"111.0\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"115.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">50<\/text><line x1=\"46\" y1=\"158.5\" x2=\"550\" y2=\"158.5\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"162.5\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">25<\/text><line x1=\"46\" y1=\"206.0\" x2=\"550\" y2=\"206.0\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"210.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">0<\/text><text x=\"46.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2013<\/text><text x=\"144.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2015<\/text><text x=\"242.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2017<\/text><text x=\"340.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2019<\/text><text x=\"438.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2021<\/text><text x=\"536.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2023<\/text><polyline points=\"46.0,23.6 144.0,25.7 242.0,31.8 340.0,33.7 438.0,32.3 536.0,24.0\" fill=\"none\" stroke=\"#2f6fb4\" stroke-width=\"2.5\"/><circle cx=\"46.0\" cy=\"23.6\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"46.0\" y=\"15.6\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">96<\/text><circle cx=\"144.0\" cy=\"25.7\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"144.0\" y=\"17.7\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">94.9<\/text><circle cx=\"242.0\" cy=\"31.8\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"242.0\" y=\"23.8\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">91.7<\/text><circle cx=\"340.0\" cy=\"33.7\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"340.0\" y=\"25.7\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">90.7<\/text><circle cx=\"438.0\" cy=\"32.3\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"438.0\" y=\"24.3\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">91.4<\/text><circle cx=\"536.0\" cy=\"24.0\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"536.0\" y=\"16.0\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">95.8<\/text><rect x=\"54\" y=\"234\" width=\"10\" height=\"10\" fill=\"#2f6fb4\" rx=\"2\"/><text x=\"68\" y=\"243\" font-size=\"10.5\" fill=\"#445\">학생(%)<\/text><polyline points=\"46.0,70.3 144.0,81.9 242.0,92.2 340.0,107.0 438.0,115.8 536.0,124.3\" fill=\"none\" stroke=\"#c0703a\" stroke-width=\"2.5\"/><circle cx=\"46.0\" cy=\"70.3\" r=\"3.4\" fill=\"#c0703a\"/><text x=\"46.0\" y=\"62.3\" font-size=\"10\" font-weight=\"700\" fill=\"#c0703a\" text-anchor=\"middle\">71.4<\/text><circle cx=\"144.0\" cy=\"81.9\" r=\"3.4\" fill=\"#c0703a\"/><text x=\"144.0\" y=\"73.9\" font-size=\"10\" font-weight=\"700\" fill=\"#c0703a\" text-anchor=\"middle\">65.3<\/text><circle cx=\"242.0\" cy=\"92.2\" r=\"3.4\" fill=\"#c0703a\"/><text x=\"242.0\" y=\"84.2\" font-size=\"10\" font-weight=\"700\" fill=\"#c0703a\" text-anchor=\"middle\">59.9<\/text><circle cx=\"340.0\" cy=\"107.0\" r=\"3.4\" fill=\"#c0703a\"/><text x=\"340.0\" y=\"99.0\" font-size=\"10\" font-weight=\"700\" fill=\"#c0703a\" text-anchor=\"middle\">52.1<\/text><circle cx=\"438.0\" cy=\"115.8\" r=\"3.4\" fill=\"#c0703a\"/><text x=\"438.0\" y=\"107.8\" font-size=\"10\" font-weight=\"700\" fill=\"#c0703a\" text-anchor=\"middle\">47.5<\/text><circle cx=\"536.0\" cy=\"124.3\" r=\"3.4\" fill=\"#c0703a\"/><text x=\"536.0\" y=\"116.3\" font-size=\"10\" font-weight=\"700\" fill=\"#c0703a\" text-anchor=\"middle\">43<\/text><rect x=\"174\" y=\"234\" width=\"10\" height=\"10\" fill=\"#c0703a\" rx=\"2\"/><text x=\"188\" y=\"243\" font-size=\"10.5\" fill=\"#445\">성인(%)<\/text><text x=\"550\" y=\"244\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">단위: % · 예시 자료<\/text><\/svg>"}, {"t": "청소년 수면 시간 국제 비교", "ty": "자료해석", "p": "다음은 주요국 고등학생의 평일 평균 수면 시간을 비교한 자료다. 미국 수면재단 등 전문가들이 권장하는 청소년의 수면 시간은 하루 8~10시간이다.\n\n수면은 단순한 휴식이 아니다. 수면 중에 뇌는 낮에 학습한 내용을 장기 기억으로 옮기고, 감정을 조절하는 기능을 회복한다. 연구에 따르면 수면이 부족한 청소년은 집중력과 기억력이 떨어질 뿐 아니라 우울감과 충동성이 높아진다. 그럼에도 한국의 고등학생들은 학원과 야간 자율학습, 스마트폰 사용으로 권장 시간에 크게 못 미치는 잠을 자고 있으며, '잠을 줄여 공부하는 것'이 성실함의 증거처럼 여겨지는 문화도 여전하다.", "q": ["자료를 해석하고, 한국 청소년의 수면 부족이 초래하는 문제를 제시문의 근거를 활용해 말해 보세요.", "'잠을 줄여 공부하는 것'의 효율에 대한 자신의 생각과, 실제 자신의 수면 관리 경험을 말해 보세요."], "guide": "【자료 분석】 한국 6.1시간은 비교국 중 최하위이며, 권장 하한선인 8시간과 약 2시간의 격차가 있습니다. '다른 나라보다 적다'와 '권장 기준에 못 미친다'는 두 개의 비교축을 모두 쓰세요.\n【답변 구성】 [1] ① 두 비교축으로 해석 → ② 문제를 학습 측면(기억 이전)과 정서 측면(우울·충동)으로 나눠 진술 [2] ① 효율에 대한 입장(시간의 양 vs 시간의 질) → ② 자기 경험 → ③ 결론", "a": ["자료를 보면 한국 고등학생의 평일 수면 시간은 6.1시간으로 비교 대상국 중 가장 짧습니다. 미국의 7.4시간, 프랑스의 7.9시간보다 1시간 이상 짧고, 전문가 권장 기준의 하한선인 8시간과 비교하면 매일 2시간 가까이 부족한 상태입니다. 즉 한국 청소년의 수면 부족은 개인차가 아니라 집단적이고 만성적인 현상입니다. 이것이 초래하는 문제는 두 방향입니다. 학습 면에서, 제시문에 따르면 뇌는 수면 중에 낮에 배운 것을 장기 기억으로 옮기므로, 잠을 줄인 공부는 입력만 하고 저장을 못 하는 공부가 됩니다. 정서 면에서는 우울감과 충동성이 높아진다고 했는데, 이는 성적의 문제를 넘어 학교폭력이나 청소년 정신건강 문제와도 연결될 수 있는 심각한 신호라고 생각합니다.", "저는 잠을 줄여 공부하는 것이 장기적으로는 비효율이라고 생각합니다. 공부의 성과는 책상에 앉아 있는 시간이 아니라 뇌에 남는 양으로 측정해야 하는데, 수면을 깎으면 다음 날의 집중력까지 함께 깎여서 결국 같은 내용을 더 오래 붙잡게 되기 때문입니다. 저도 시험 기간에 새벽까지 공부해 본 적이 있는데, 다음 날 수업 내용이 거의 기억나지 않는 것을 겪고 나서 방식을 바꿨습니다. 지금은 시험 기간에도 취침 시간을 지키는 대신, 잠들기 전 30분에 그날 배운 것을 요약 정리하는 습관을 들였습니다. 자는 동안 기억이 정리된다는 것을 알게 된 뒤로는 잠을 공부의 적이 아니라 공부의 마지막 단계로 생각하게 되었습니다. 성실함은 잠을 참는 것이 아니라 깨어 있는 시간의 밀도를 높이는 것이라고 생각합니다."], "tips": ["국제 비교 자료는 '국가 간 비교'와 '기준선과의 비교'라는 두 축을 모두 언급하세요.", "'입력만 하고 저장을 못 하는 공부'처럼 과학적 사실을 자기 언어로 번역하는 능력이 돋보입니다.", "자기주도학습 전형에서는 이 문항의 두 번째 답변이 곧 학습 태도 평가입니다. 실제 습관을 준비하세요."], "chart": "<svg viewBox=\"0 0 560 240\" style=\"width:100%;max-width:560px;background:#fff;border:1px solid #e3e9f2;border-radius:8px\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"46\" y1=\"16.0\" x2=\"550\" y2=\"16.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"20.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">9.085<\/text><line x1=\"46\" y1=\"62.0\" x2=\"550\" y2=\"62.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"66.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">6.81375<\/text><line x1=\"46\" y1=\"108.0\" x2=\"550\" y2=\"108.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"112.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">4.5425<\/text><line x1=\"46\" y1=\"154.0\" x2=\"550\" y2=\"154.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"158.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">2.27125<\/text><line x1=\"46\" y1=\"200.0\" x2=\"550\" y2=\"200.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"204.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">0<\/text><rect x=\"68.2\" y=\"50.1\" width=\"79.0\" height=\"149.9\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"107.8\" y=\"45.1\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">7.4<\/text><text x=\"107.8\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">미국<\/text><rect x=\"191.7\" y=\"40.0\" width=\"79.0\" height=\"160.0\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"231.2\" y=\"35.0\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">7.9<\/text><text x=\"231.2\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">프랑스<\/text><rect x=\"315.2\" y=\"62.3\" width=\"79.0\" height=\"137.7\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"354.8\" y=\"57.3\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">6.8<\/text><text x=\"354.8\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">일본<\/text><rect x=\"438.7\" y=\"76.5\" width=\"79.0\" height=\"123.5\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"478.2\" y=\"71.5\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">6.1<\/text><text x=\"478.2\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">한국<\/text><text x=\"550\" y=\"234\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">단위: 시간 · 예시 자료<\/text><\/svg>"}, {"t": "노인 부양 부담의 미래", "ty": "자료해석", "p": "다음은 생산가능인구(15~64세) 100명이 부양해야 하는 65세 이상 인구의 수를 나타내는 '노년부양비'의 전망 자료다. 통계청 장래인구추계에 따르면 우리나라의 고령화 속도는 세계에서 가장 빠른 수준이다.\n\n2010년에는 일하는 사람 100명이 노인 15명 정도를 부양했지만, 2050년에는 약 79명을 부양해야 할 것으로 전망된다. 생산가능인구 1.3명이 노인 1명을 책임지는 셈이다. 이 부담은 국민연금과 건강보험료, 세금의 형태로 미래 세대에게 돌아가며, 연금 고갈 시점을 둘러싼 세대 간 갈등도 이미 시작되었다. 한편 오늘날의 노인은 과거보다 건강하고 교육 수준이 높아, 노인을 '부양의 대상'으로만 보는 관점 자체를 바꿔야 한다는 목소리도 커지고 있다.", "q": ["자료의 의미를 설명하고, 2050년의 수치가 현실이 될 때 예상되는 사회 변화를 말해 보세요.", "이 문제의 해결 방향을 '부담을 줄이는 방법'과 '부담을 감당할 능력을 키우는 방법'으로 나누어 제안해 보세요."], "guide": "【자료 분석】 노년부양비의 정의(생산인구 100명당 노인 수)를 자기 말로 풀 수 있어야 합니다. 2010년 15.4 → 2050년 78.6이라는 5배 증가, 그리고 '1.3명이 1명 부양'이라는 환산이 자료 해석의 핵심입니다.\n【답변 구성】 [1] ① 지표의 의미 설명 → ② 수치의 극적 변화 → ③ 사회 변화 예측(재정·세대 갈등·노동시장) [2] '분자 줄이기(정년·노인 재정의)'와 '분모 키우기(출산·이민·생산성)'의 틀로 구조화", "a": ["노년부양비는 일하는 나이의 인구 100명이 몇 명의 노인을 부양하는지를 나타내는 지표입니다. 자료를 보면 이 수치가 2010년 15.4명에서 2050년 78.6명으로, 40년 사이에 다섯 배가 됩니다. 2050년에는 생산가능인구 1.3명이 노인 1명을 책임져야 한다는 뜻입니다. 이 수치가 현실이 되면 세 가지 변화가 예상됩니다. 첫째, 연금과 건강보험 지출이 급증해 젊은 세대의 보험료와 세금 부담이 크게 늘어납니다. 둘째, 그 부담의 크기를 둘러싸고 '내는 세대'와 '받는 세대' 사이의 갈등이 정치적 쟁점이 될 것입니다. 셋째, 일할 사람이 부족해지면서 정년 연장과 외국인 노동자 수용이 선택이 아니라 필수가 되고, 노동시장의 모습 자체가 달라질 것입니다.", "해결 방향을 두 갈래로 나누어 제안하겠습니다. 먼저 부담 자체를 줄이는 방법입니다. 핵심은 '노인 = 부양 대상'이라는 등식을 깨는 것입니다. 제시문처럼 오늘날의 노인은 과거보다 건강하고 교육 수준이 높으므로, 정년을 단계적으로 연장하고 노인 일자리를 복지형이 아닌 경력 활용형으로 바꾸면, 부양받던 사람이 부양비의 분자에서 빠져 오히려 생산 인구로 이동합니다. 건강수명을 늘리는 예방 의료 투자도 장기적으로 의료비 부담을 줄입니다. 다음으로 부담을 감당할 능력을 키우는 방법입니다. 저출산 대응으로 미래의 생산인구를 늘리는 것이 근본책이지만 효과가 20년 뒤에 나타나므로, 그 사이에는 한 사람이 만드는 가치를 키우는 수밖에 없습니다. AI와 자동화로 생산성을 높이고, 여성과 외국인 인재의 경제 참여를 넓히는 것입니다. 정리하면, 이 문제는 '누가 낼 것인가'의 싸움이 아니라 '부양이라는 개념 자체를 다시 설계하는' 문제라고 생각합니다."], "tips": ["지표형 자료는 정의를 자기 말로 풀어 주는 것부터 시작하세요. 정의를 모르면 해석 전체가 무너집니다.", "'분자 줄이기/분모 키우기' 같은 수학적 구조화는 사회 문제 해결안을 논리적으로 보이게 합니다.", "세대 갈등을 말할 때는 특정 세대를 탓하는 표현을 피하고 구조의 문제로 서술하세요."], "chart": "<svg viewBox=\"0 0 560 250\" style=\"width:100%;max-width:560px;background:#fff;border:1px solid #e3e9f2;border-radius:8px\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"46\" y1=\"16.0\" x2=\"550\" y2=\"16.0\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"20.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">90<\/text><line x1=\"46\" y1=\"63.5\" x2=\"550\" y2=\"63.5\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"67.5\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">67.5<\/text><line x1=\"46\" y1=\"111.0\" x2=\"550\" y2=\"111.0\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"115.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">45<\/text><line x1=\"46\" y1=\"158.5\" x2=\"550\" y2=\"158.5\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"162.5\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">22.5<\/text><line x1=\"46\" y1=\"206.0\" x2=\"550\" y2=\"206.0\" stroke=\"#eef2f8\"/><text x=\"40\" y=\"210.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">0<\/text><text x=\"46.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2010<\/text><text x=\"168.5\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2020<\/text><text x=\"291.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2030<\/text><text x=\"413.5\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2040<\/text><text x=\"536.0\" y=\"222\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">2050<\/text><polyline points=\"46.0,173.5 168.5,160.0 291.0,124.5 413.5,78.3 536.0,40.1\" fill=\"none\" stroke=\"#2f6fb4\" stroke-width=\"2.5\"/><circle cx=\"46.0\" cy=\"173.5\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"46.0\" y=\"165.5\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">15.4<\/text><circle cx=\"168.5\" cy=\"160.0\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"168.5\" y=\"152.0\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">21.8<\/text><circle cx=\"291.0\" cy=\"124.5\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"291.0\" y=\"116.5\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">38.6<\/text><circle cx=\"413.5\" cy=\"78.3\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"413.5\" y=\"70.3\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">60.5<\/text><circle cx=\"536.0\" cy=\"40.1\" r=\"3.4\" fill=\"#2f6fb4\"/><text x=\"536.0\" y=\"32.1\" font-size=\"10\" font-weight=\"700\" fill=\"#2f6fb4\" text-anchor=\"middle\">78.6<\/text><text x=\"550\" y=\"244\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">단위: 명 · 예시 자료<\/text><\/svg>"}, {"t": "급식 잔반 데이터로 보는 문제 해결", "ty": "자료해석", "p": "다음은 한 중학교 학생회가 일주일간 직접 조사한 요일별 급식 잔반량과 그날의 주요 메뉴를 정리한 자료다. 이 학교의 하루 평균 잔반 처리 비용은 잔반 1kg당 약 500원이다.\n\n전국적으로 학교 급식에서 버려지는 음식물은 연간 수만 톤에 이르며, 처리 비용뿐 아니라 처리 과정에서 발생하는 온실가스도 상당하다. 잔반 문제는 흔히 '학생들의 편식' 탓으로 여겨지지만, 메뉴 구성과 배식 방식, 식사 시간의 길이 등 시스템의 문제가 겹쳐 있는 경우가 많다. 학생회는 이 데이터를 근거로 학교에 개선안을 제안하려고 한다.", "q": ["표에서 발견되는 패턴을 말하고, 잔반이 발생하는 원인을 여러 관점에서 분석해 보세요.", "학생회장이라면 이 데이터를 근거로 학교에 어떤 개선안을 제안할지, 실행 가능한 방안을 말해 보세요."], "guide": "【자료 분석】 잔반량과 메뉴의 '상관관계'를 읽는 문제입니다. 잔반이 많은 날(월 42kg·수 35kg)과 적은 날(화 18kg)의 메뉴를 비교하면 '학생 선호와 메뉴의 불일치'라는 패턴이 보입니다. 다만 상관관계가 곧 인과는 아니므로 다른 요인도 함께 검토하세요.\n【답변 구성】 [1] ① 패턴 발견(선호 메뉴일수록 잔반 감소) → ② 원인을 학생·메뉴·시스템의 세 관점으로 분석 [2] ① 데이터 기반 제안 2~3개 → ② 비용 근거(kg당 500원) 활용 → ③ 실행 계획과 검증 방법", "a": ["표에서 발견되는 패턴은 잔반량이 메뉴에 따라 두 배 이상 차이 난다는 것입니다. 나물 비빔밥이 나온 월요일은 42kg, 생선구이가 나온 수요일은 35kg인 반면, 치킨이 나온 화요일은 18kg에 그쳤습니다. 학생들이 선호하는 메뉴일수록 잔반이 줄어드는 뚜렷한 상관관계가 보입니다. 다만 원인을 학생의 편식으로만 돌릴 수는 없다고 생각합니다. 세 관점에서 보면, 첫째 학생 관점에서는 익숙하지 않은 메뉴에 대한 거부감이 있고, 둘째 메뉴 관점에서는 같은 나물류라도 조리법에 따라 선호가 갈리는데 개선 없이 반복 제공되는 문제가 있으며, 셋째 시스템 관점에서는 모든 학생에게 같은 양을 배식해서 처음부터 먹지 못할 양을 받는 구조적 낭비가 있습니다.", "학생회장이라면 세 가지를 제안하겠습니다. 첫째, '양 선택 배식제'입니다. 배식대에서 적게·보통·많이 중 선택하게 하면 먹지 않을 음식이 식판에 오르는 것 자체를 줄일 수 있습니다. 둘째, 잔반이 많았던 메뉴의 개선입니다. 나물류를 없애는 것이 아니라 학생 선호를 반영한 조리법으로 바꾸도록 설문과 시식회를 거쳐 영양 선생님께 데이터를 전달하겠습니다. 영양 기준을 지키면서도 맛의 개선 여지는 충분하다고 생각합니다. 셋째, 절감 효과의 공유입니다. 잔반 1kg에 500원의 처리 비용이 들므로, 주간 잔반량을 급식실 앞에 게시하고 줄어든 비용만큼 인기 메뉴의 날을 늘리는 데 쓰자고 제안하면 학생들의 참여 동기가 생깁니다. 그리고 한 달 뒤 같은 방식으로 잔반량을 다시 측정해 효과를 검증하겠습니다. 데이터로 시작한 제안은 데이터로 끝맺어야 설득력이 유지된다고 생각합니다."], "tips": ["생활 데이터 문제는 '패턴 발견 → 다각도 원인 → 실행안 → 검증'의 흐름이 정석입니다.", "원인 분석에서 '학생 탓'으로 끝내지 않는 균형이 중요합니다. 시스템 요인을 반드시 포함하세요.", "'한 달 뒤 재측정으로 검증'처럼 제안의 사후 검증까지 말하면 탐구 역량이 돋보입니다."], "chart": "<table style=\"width:100%;max-width:560px;border-collapse:collapse;background:#fff;font-size:13px\"><tr><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">요일<\/th><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">잔반량(kg)<\/th><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">주요 메뉴<\/th><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">월<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">42<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">나물 비빔밥·국<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">화<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">18<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">치킨·볶음밥<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">수<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">35<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">생선구이·미역국<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">목<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">21<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">돈까스·스파게티<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">금<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">39<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">제육볶음·콩나물국<\/td><\/tr><\/table><div style=\"font-size:10.5px;color:#8896aa;margin-top:3px\">※ 예시 자료<\/div>"}, {"t": "재생에너지 전환의 현주소", "ty": "자료해석", "p": "다음은 주요국의 전체 발전량 가운데 태양광·풍력·수력 등 재생에너지가 차지하는 비중을 비교한 자료다. 유럽 주요국이 40~50%대에 이른 반면 한국은 한 자릿수에 머물러 있다.\n\n한국의 재생에너지 확대가 더딘 데는 여러 요인이 있다. 국토가 좁고 산지가 많아 대규모 태양광·풍력 부지를 확보하기 어렵고, 발전 시설이 들어서는 지역 주민들의 반대도 적지 않다. 전력 수요가 많은 수도권과 발전 적지인 지방 사이의 송전망 문제도 있다. 그러나 유럽연합 등이 제품 생산 과정의 탄소 배출량을 무역 규제와 연결하기 시작하면서, 재생에너지 전환은 환경 문제를 넘어 수출 기업의 생존이 걸린 경제 문제가 되고 있다.", "q": ["자료에서 한국의 위치를 해석하고, 한국의 재생에너지 확대가 어려운 이유를 분석해 보세요.", "에너지 전환 과정에서 발생하는 지역 주민과의 갈등을 어떻게 조정해야 할지 자신의 방안을 말해 보세요."], "guide": "【자료 분석】 한국 9%는 1위 독일(52%)의 5분의 1 수준이자 비교국 중 최하위입니다. 제시문이 원인(지리·수용성·송전망)과 새로운 변수(탄소 무역규제)를 제공하므로, 자료의 '현상'과 제시문의 '맥락'을 결합하세요.\n【답변 구성】 [1] ① 위치 해석(최하위, 격차의 크기) → ② 원인을 지리적·사회적·기술적 요인으로 구조화 → ③ '환경 문제에서 경제 문제로'라는 성격 변화 지적 [2] ① 갈등의 원인 진단(비용은 지역에, 이익은 외부에) → ② 이익 공유 방안 → ③ 절차적 방안", "a": ["자료에서 한국의 재생에너지 비중은 9%로 비교 대상국 중 가장 낮고, 1위인 독일의 52%와 비교하면 5분의 1 수준입니다. 일본의 24%와 비교해도 절반에 못 미쳐, 산업 구조가 비슷한 나라와 견줘도 낮다는 점이 뼈아픕니다. 확대가 어려운 이유는 세 층위로 분석할 수 있습니다. 지리적으로는 좁은 국토와 산지 때문에 대규모 부지 확보가 어렵고, 사회적으로는 발전 시설 주변 지역의 반대, 즉 수용성의 문제가 있으며, 기술적으로는 발전 적지와 소비지가 떨어져 있는 송전망의 한계가 있습니다. 중요한 것은 제시문의 마지막 부분입니다. 탄소 배출이 무역 규제와 연결되면서, 재생에너지 부족은 이제 환경의 문제가 아니라 수출로 먹고사는 우리 경제의 생존 문제가 되었다는 점에서 대응의 시급성이 커졌다고 해석할 수 있습니다.", "갈등의 뿌리는 비용과 이익의 불일치에 있다고 생각합니다. 풍력 단지의 소음과 경관 훼손 같은 비용은 지역 주민이 지는데, 전기와 이익은 수도권과 발전 사업자가 가져가는 구조라면 반대는 당연한 반응입니다. 그래서 저는 두 방향의 조정안을 제안합니다. 첫째, 이익 공유입니다. 주민이 발전 사업의 지분에 참여해 배당을 받거나 전기요금을 할인받는 '주민 참여형 발전'으로 만들면, 발전소가 혐오 시설이 아니라 마을의 자산이 됩니다. 실제로 주민 참여형으로 추진된 사업일수록 갈등이 적었던 사례가 있습니다. 둘째, 절차의 개선입니다. 부지 선정 단계부터 주민이 참여하는 공론화를 거치고, 환경 영향 정보를 투명하게 공개해야 합니다. 결정된 뒤에 통보받는 주민은 내용과 무관하게 반대하게 되기 때문입니다. 정리하면, 에너지 전환의 속도는 기술이 아니라 '이익과 절차의 공정함'이 결정한다고 생각합니다."], "tips": ["국제 비교에서는 '몇 위인가'보다 '격차가 몇 배인가'를 말하는 것이 더 인상적입니다.", "제시문 마지막에 새로 등장하는 정보(탄소 무역규제)는 출제자가 심어 둔 힌트일 가능성이 높습니다. 반드시 활용하세요.", "갈등 조정 문제는 '이익 공유 + 절차 참여'의 두 축으로 답하면 대부분 통합니다."], "chart": "<svg viewBox=\"0 0 560 240\" style=\"width:100%;max-width:560px;background:#fff;border:1px solid #e3e9f2;border-radius:8px\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"46\" y1=\"16.0\" x2=\"550\" y2=\"16.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"20.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">59.8<\/text><line x1=\"46\" y1=\"62.0\" x2=\"550\" y2=\"62.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"66.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">44.85<\/text><line x1=\"46\" y1=\"108.0\" x2=\"550\" y2=\"108.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"112.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">29.9<\/text><line x1=\"46\" y1=\"154.0\" x2=\"550\" y2=\"154.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"158.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">14.95<\/text><line x1=\"46\" y1=\"200.0\" x2=\"550\" y2=\"200.0\" stroke=\"#eef2f8\" stroke-width=\"1\"/><text x=\"40\" y=\"204.0\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">0<\/text><rect x=\"60.8\" y=\"40.0\" width=\"52.7\" height=\"160.0\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"87.2\" y=\"35.0\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">52<\/text><text x=\"87.2\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">독일<\/text><rect x=\"143.2\" y=\"67.7\" width=\"52.7\" height=\"132.3\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"169.5\" y=\"62.7\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">43<\/text><text x=\"169.5\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">영국<\/text><rect x=\"225.5\" y=\"104.6\" width=\"52.7\" height=\"95.4\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"251.8\" y=\"99.6\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">31<\/text><text x=\"251.8\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">중국<\/text><rect x=\"307.8\" y=\"126.2\" width=\"52.7\" height=\"73.8\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"334.2\" y=\"121.2\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">24<\/text><text x=\"334.2\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">일본<\/text><rect x=\"390.2\" y=\"129.2\" width=\"52.7\" height=\"70.8\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"416.5\" y=\"124.2\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">23<\/text><text x=\"416.5\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">미국<\/text><rect x=\"472.5\" y=\"172.3\" width=\"52.7\" height=\"27.7\" rx=\"3\" fill=\"#2f6fb4\"/><text x=\"498.8\" y=\"167.3\" font-size=\"11\" font-weight=\"700\" fill=\"#1c3c66\" text-anchor=\"middle\">9<\/text><text x=\"498.8\" y=\"216\" font-size=\"10.5\" fill=\"#445\" text-anchor=\"middle\">한국<\/text><text x=\"550\" y=\"234\" font-size=\"10\" fill=\"#8896aa\" text-anchor=\"end\">단위: % · 예시 자료<\/text><\/svg>"}, {"t": "다문화 학생 증가와 교육의 과제", "ty": "자료해석", "p": "다음은 우리나라 초·중·고 다문화 학생 수의 변화를 나타낸 자료다. 다문화 학생은 국제결혼 가정과 외국인 가정의 자녀를 말한다.\n\n전체 학생 수는 저출산의 영향으로 빠르게 줄어드는 반면 다문화 학생 수는 10년 사이 두 배 이상으로 늘어, 일부 지역의 초등학교에서는 다문화 학생 비중이 절반을 넘는 곳도 나타났다. 그러나 다문화 학생의 고교 진학률과 학업 성취는 전체 평균보다 낮고, 언어 지원과 교사 연수 등 교육 시스템의 준비는 변화의 속도를 따라가지 못하고 있다는 지적이 나온다.", "q": ["표에서 두 지표의 상반된 추세를 설명하고, 그 의미를 해석해 보세요.", "다문화 학생과 함께 성장하는 학교를 만들기 위해 필요한 정책과 학생 차원의 노력을 각각 제안해 보세요."], "guide": "【자료 분석】 이 표의 핵심은 '반대 방향의 두 추세'입니다. 전체 학생은 609만→513만으로 감소, 다문화 학생은 8.3만→20.1만으로 2.4배 증가. 두 추세가 겹치면 비중(1.4→3.9%)의 증가가 가속된다는 구조를 읽어야 합니다.\n【답변 구성】 [1] ① 두 추세를 각각 수치로 진술 → ② 교차 해석(비중 가속) → ③ 의미 부여(다문화는 예외가 아니라 표준이 되는 중) [2] ① 정책(언어·교사·분리 아닌 통합) → ② 학생 차원(동료 시민의 태도) → ③ 관점 전환으로 마무리", "a": ["표에는 반대 방향으로 움직이는 두 추세가 있습니다. 전체 학생 수는 2015년 609만 명에서 2025년 513만 명으로 약 96만 명 줄어든 반면, 다문화 학생은 8.3만 명에서 20.1만 명으로 두 배 이상 늘었습니다. 분모는 줄고 분자는 커지니 비중은 1.4%에서 3.9%로 빠르게 상승했고, 이 구조라면 앞으로 비중 증가는 더 가속될 것입니다. 저는 이 자료의 의미를 '다문화가 더 이상 예외가 아니라 우리 교실의 표준적인 모습이 되어 간다'로 해석하고 싶습니다. 특히 저출산으로 학생이 줄어드는 시대에 다문화 학생은 우리 사회의 소중한 미래 구성원인데, 진학률과 성취가 평균보다 낮다는 것은 개인의 손실을 넘어 사회 전체의 손실이 되고 있다는 뜻입니다.", "정책 차원에서는 세 가지가 필요하다고 생각합니다. 첫째, 한국어가 서툰 학생을 위한 입학 초기의 집중 언어 지원입니다. 언어는 모든 과목의 기초라서 초기에 지원하지 않으면 격차가 누적됩니다. 둘째, 모든 교사에 대한 다문화 교육 연수입니다. 셋째, 다문화 학생만 따로 모으는 분리형 프로그램보다 함께 배우는 통합형 프로그램을 원칙으로 해야 합니다. 분리는 지원이면서 동시에 낙인이 될 수 있기 때문입니다. 학생 차원에서는 '도와주는 대상'이 아니라 '함께 배우는 동료'로 대하는 태도가 가장 중요하다고 생각합니다. 예를 들어 짝 활동에서 자연스럽게 어울리고, 그 친구의 문화나 언어를 오히려 배울 기회로 삼는 것입니다. 이중 언어와 두 문화를 가진 친구는 교실의 부담이 아니라 자원입니다. 다문화 교육의 목표는 그들을 우리처럼 만드는 것이 아니라, 서로 다른 우리가 함께 사는 법을 배우는 것이라고 생각합니다."], "tips": ["두 지표가 반대로 움직이는 표는 '분자·분모' 구조로 설명하면 수리적 사고력을 보여 줄 수 있습니다.", "'예외에서 표준으로'처럼 자료의 의미를 한 문장으로 개념화하는 연습을 하세요.", "'도와주기'식 시혜적 표현을 조심하세요. '동료 시민'의 관점이 국제고·외고가 원하는 인재상에 부합합니다."], "chart": "<div style=\"overflow-x:auto\"><table style=\"width:100%;max-width:560px;border-collapse:collapse;background:#fff;font-size:13px\"><tr><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">구분<\/th><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">2015년<\/th><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">2020년<\/th><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">2025년<\/th><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">다문화 학생 수<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">8.3만 명<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">14.7만 명<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">20.1만 명<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">전체 학생 중 비중<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">1.4%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">2.8%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">3.9%<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">전체 학생 수<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">609만 명<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">535만 명<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">513만 명<\/td><\/tr><\/table><\/div><div style=\"font-size:11px;color:#8896aa;margin-top:4px;text-align:right\">단위: 명·% (예시 자료)<\/div>"}, {"t": "스마트폰 과의존 위험군 분석", "ty": "자료해석", "p": "다음은 연령대별 스마트폰 과의존 위험군 비율의 변화를 나타낸 자료다. 과의존 위험군이란 스마트폰 사용을 스스로 조절하는 능력이 떨어져 일상생활에 문제를 겪는 집단을 말한다.\n\n조사 기간 동안 다른 연령대의 수치가 정체되거나 감소한 것과 달리, 청소년만 35.8%에서 42.6%로 뚜렷하게 상승해 열 명 중 네 명이 위험군에 속하는 것으로 나타났다. 같은 기간 청소년의 주 이용 콘텐츠는 게임에서 숏폼 영상으로 이동했다. 과의존은 수면 부족, 학업 성취 저하뿐 아니라 우울·불안과의 상관관계도 보고되고 있다.", "q": ["자료에서 청소년 집단의 특징을 다른 연령대와 비교하여 설명하고, 그 원인을 추론해 보세요.", "청소년 과의존 문제를 해결하기 위한 방안을 '개인·가정·사회' 세 층위로 나누어 제안해 보세요."], "guide": "【자료 분석】 비교의 핵심은 '방향의 차이'입니다. 유아동·노년은 감소, 성인은 정체인데 청소년만 6.8%p 상승. '왜 청소년만?'이라는 질문을 세우고 시기(콘텐츠의 숏폼화)와 발달 특성(자기조절 능력 발달 중)으로 추론하세요.\n【답변 구성】 [1] ① 타 연령대와 방향 비교 → ② 수치 인용 → ③ 원인 추론 2가지(콘텐츠 변화 + 발달적 취약성) [2] 개인(사용 규칙)·가정(공동 규칙)·사회(설계 규제) 층위별 1~2개씩 제안", "a": ["이 자료의 특징은 청소년만 다른 방향으로 움직였다는 점입니다. 유아동은 27.3%에서 25%로, 60대 이상은 16.8%에서 13.5%로 줄었고 성인은 큰 변화가 없는데, 청소년만 35.8%에서 42.6%로 6.8%포인트 상승해 전 연령대 중 가장 높습니다. 원인은 두 가지로 추론할 수 있습니다. 첫째, 제시문에 나온 콘텐츠의 변화입니다. 같은 기간 주 이용 콘텐츠가 게임에서 숏폼으로 바뀌었는데, 게임은 한 판의 끝이 있지만 숏폼은 끝이 없이 자동으로 이어지도록 설계되어 있어 조절이 훨씬 어렵습니다. 둘째, 발달적 취약성입니다. 청소년기는 자기조절을 담당하는 뇌 기능이 아직 발달 중인 시기여서, 같은 자극에도 성인보다 크게 흔들립니다. 즉 '가장 취약한 시기의 집단'과 '가장 조절하기 어려운 콘텐츠'가 만난 결과로 해석할 수 있습니다.", "세 층위로 제안하겠습니다. 개인 차원에서는 사용을 의지에 맡기지 않고 구조로 만드는 것이 핵심입니다. 알림 끄기, 공부할 때 스마트폰을 물리적으로 멀리 두기, 스크린타임 앱으로 자신의 사용량을 눈으로 확인하기 같은 방법입니다. 저도 알림을 끈 뒤 사용 시간이 눈에 띄게 줄어드는 경험을 했습니다. 가정 차원에서는 자녀만 통제하는 규칙보다 '식사 시간에는 모두 스마트폰을 두고 온다'처럼 부모가 함께 지키는 공동 규칙이 효과적이라고 생각합니다. 사회 차원에서는 이용자 교육을 넘어 서비스의 설계 자체를 다루어야 합니다. 자동 연속 재생의 기본값을 끄게 하거나 청소년 계정에 시청 시간 알림을 의무화하는 것처럼, 조절을 어렵게 만드는 설계에 책임을 묻는 규제가 필요합니다. 개인의 노력과 환경의 개선이 함께 가야 42.6%라는 수치를 되돌릴 수 있다고 생각합니다."], "tips": ["여러 집단 비교표는 '혼자 다른 방향으로 움직이는 집단'을 찾는 것이 독해의 출발점입니다.", "'취약한 집단과 강력한 자극의 만남'처럼 두 요인의 결합으로 설명하면 분석이 입체적이 됩니다.", "층위 구분(개인·가정·사회)을 지시받으면 각 층위의 답이 서로 겹치지 않게 하세요."], "chart": "<div style=\"overflow-x:auto\"><table style=\"width:100%;max-width:560px;border-collapse:collapse;background:#fff;font-size:13px\"><tr><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">연령대<\/th><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">2020년<\/th><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">2024년<\/th><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">유·아동(3~9세)<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">27.3%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">25.0%<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">청소년(10~19세)<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">35.8%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">42.6%<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">성인(20~59세)<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">22.2%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">23.4%<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">60대 이상<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">16.8%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">13.5%<\/td><\/tr><\/table><\/div><div style=\"font-size:11px;color:#8896aa;margin-top:4px;text-align:right\">스마트폰 과의존 위험군 비율 · 단위: % (예시 자료)<\/div>"}, {"t": "세대별 뉴스 소비와 신뢰의 위기", "ty": "자료해석", "p": "다음은 세대별로 뉴스를 접하는 주된 경로와 뉴스 신뢰도를 조사한 자료다. 젊은 세대일수록 언론사가 편집한 뉴스보다 유튜브와 SNS의 알고리즘이 골라 주는 뉴스를 소비하는 비중이 높다.\n\n알고리즘 추천은 이용자가 좋아할 만한 것을 보여 주기 때문에, 자신의 생각과 비슷한 뉴스만 반복해서 접하는 '필터버블' 현상을 낳을 수 있다. 같은 사건을 두고 세대별로 전혀 다른 정보를 접하게 되면, 사실 자체에 대한 합의가 어려워져 세대 갈등이 깊어진다는 우려도 나온다. 한편 모든 세대에서 뉴스 신뢰도가 절반에 미치지 못한다는 점은 언론 전반의 위기를 보여 준다.", "q": ["자료에서 발견되는 세대 간 차이와 세대 공통의 문제를 각각 말해 보세요.", "서로 다른 정보 세계에 사는 세대들이 소통하기 위해 필요한 것은 무엇인지 자신의 경험을 포함해 말해 보세요."], "guide": "【자료 분석】 이 표는 '차이'와 '공통'을 모두 읽어야 합니다. 차이: 뉴스 경로가 세대별로 완전히 다름(SNS 58% vs TV 61%). 공통: 신뢰도가 모든 세대에서 50% 미만(31~45%). 두 발견을 분리해 말하는 것이 문제의 요구입니다.\n【답변 구성】 [1] ① 차이(정보 경로의 분화) → ② 공통(신뢰의 위기) → ③ 두 사실의 결합이 의미하는 것(공유된 사실의 붕괴) [2] ① 필요한 것 제시(공통의 사실 기반, 경로 넘나들기) → ② 가족 경험 연결 → ③ 정리", "a": ["자료에서 두 가지를 발견할 수 있습니다. 먼저 세대 간 차이로, 뉴스를 접하는 경로가 세대별로 완전히 갈라져 있습니다. 10~20대의 58%는 유튜브와 SNS로, 60대 이상의 61%는 TV로 뉴스를 접해, 사실상 서로 다른 창으로 세상을 보고 있습니다. 다음으로 세대 공통의 문제는 신뢰의 위기입니다. 뉴스를 신뢰한다는 응답이 31%에서 45%로, 모든 세대에서 절반에 못 미칩니다. 저는 이 두 사실이 결합될 때 더 심각한 문제가 생긴다고 해석합니다. 경로가 갈라진 상태에서 신뢰까지 낮으면, 사람들은 각자 자기 경로의 정보만 믿고 다른 경로의 정보는 의심하게 됩니다. 결국 의견이 다른 것을 넘어 '사실 자체'가 세대마다 달라지는, 공유된 현실의 붕괴로 이어질 수 있습니다.", "저는 두 가지가 필요하다고 생각합니다. 첫째는 상대의 정보 세계를 직접 들여다보는 노력입니다. 저의 경험을 말씀드리면, 한 사회 이슈를 두고 부모님과 의견이 크게 부딪힌 적이 있는데, 이야기해 보니 저는 SNS 요약 게시물을, 부모님은 TV 뉴스를 근거로 하고 있어서 알고 있는 사실 자체가 달랐습니다. 그래서 서로가 본 것을 바꿔서 보고 다시 이야기했더니, 의견 차이는 남았지만 '상대가 이상한 게 아니라 본 것이 달랐구나'라는 이해가 생겼습니다. 둘째는 어떤 경로로 접했든 사실 여부를 확인하는 공통의 습관, 즉 미디어 리터러시입니다. 출처를 확인하고 교차 검증하는 습관이 세대 공통의 기본기가 되면, 최소한 사실의 기반은 공유할 수 있습니다. 세대 소통의 출발은 상대를 설득하는 것이 아니라, 같은 사실 위에 서는 것이라고 생각합니다."], "tips": ["'차이와 공통을 각각'이라는 지시는 답변을 두 부분으로 나누라는 설계입니다. 구조를 그대로 따르세요.", "가족과의 실제 경험은 이 주제에서 가장 강력한 사례입니다. 갈등보다 '이해에 도달한 과정'을 강조하세요.", "'의견의 차이'와 '사실의 차이'를 구분하는 것이 이 문항의 핵심 개념입니다."], "chart": "<div style=\"overflow-x:auto\"><table style=\"width:100%;max-width:560px;border-collapse:collapse;background:#fff;font-size:13px\"><tr><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">구분<\/th><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">10~20대<\/th><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">40~50대<\/th><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">60대 이상<\/th><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">주 뉴스 경로 1위<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">유튜브·SNS (58%)<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">포털 뉴스 (46%)<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">TV (61%)<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">종이신문·방송 뉴스 이용<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">12%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">33%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">64%<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">'뉴스를 대체로 신뢰한다'<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">31%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">38%<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">45%<\/td><\/tr><\/table><\/div><div style=\"font-size:11px;color:#8896aa;margin-top:4px;text-align:right\">세대별 뉴스 이용 경로와 신뢰도 · 단위: % (예시 자료)<\/div>"}, {"t": "플라스틱 재활용의 현실", "ty": "자료해석", "p": "다음은 가정에서 분리배출된 플라스틱이 실제로 재활용되기까지의 단계별 흐름을 나타낸 자료다. 시민들이 열심히 분리배출을 해도, 최종적으로 새 제품의 원료가 되는 비율은 30%에 못 미친다.\n\n중간에 사라지는 플라스틱의 사정은 다양하다. 여러 재질이 섞인 복합 재질 포장재, 음식물이 묻은 용기, 색이 들어간 페트병은 선별 단계에서 탈락해 소각되거나 매립된다. 재생원료가 새 플라스틱보다 비싼 경우가 많아 기업이 사용을 꺼리는 경제적인 문제도 있다. 이 때문에 '재활용을 잘하자'는 캠페인만으로는 한계가 있으며, 생산 단계에서부터 재활용이 쉽게 설계되어야 한다는 지적이 나온다.", "q": ["자료에서 가장 큰 손실이 일어나는 단계를 찾고, 그 원인을 제시문을 활용해 분석해 보세요.", "플라스틱 문제 해결을 위해 소비자·기업·정부가 각각 해야 할 일을 자료에 근거해 제안해 보세요."], "guide": "【자료 분석】 깔때기형 자료입니다. 100→55(선별 탈락 45%p), 55→27(재활용 공정 탈락 28%p)로, 가장 큰 손실은 선별 단계입니다. 각 단계의 손실 원인을 제시문(복합 재질, 오염, 경제성)과 짝지어 분석하세요.\n【답변 구성】 [1] ① 최대 손실 단계 지목(수치로) → ② 원인 분석(재질 설계·오염·경제성) → ③ '배출의 문제가 아니라 설계의 문제'라는 재정의 [2] 주체별 제안: 소비자(올바른 배출)·기업(재질 단순화)·정부(재생원료 의무화) → 상호 연결로 마무리", "a": ["가장 큰 손실은 선별 단계에서 일어납니다. 분리배출된 100% 가운데 45%포인트가 선별장에서 탈락해 절반 가까이가 이 단계에서 사라지고, 실제 재생원료가 되는 것은 27%, 고품질 재활용은 10%도 되지 않습니다. 원인을 제시문에서 찾으면 세 가지입니다. 첫째, 여러 재질이 섞인 복합 포장재나 색이 든 페트병은 아무리 잘 배출해도 기술적으로 재활용이 어렵습니다. 둘째, 음식물 오염처럼 배출 품질의 문제가 있습니다. 셋째, 선별을 통과해도 재생원료가 새 원료보다 비싸면 수요가 없어 재활용이 완성되지 않습니다. 이 분석에서 중요한 결론은, 플라스틱 문제의 병목이 시민의 배출 단계가 아니라 제품의 설계와 경제 구조에 있다는 점입니다. '분리배출을 잘하자'는 호소만으로 해결될 수 없는 이유가 자료에 그대로 드러나 있습니다.", "주체별로 제안하겠습니다. 소비자는 재활용의 품질을 결정합니다. 용기를 헹궈서 배출하고 라벨을 제거하는 것은 선별 탈락률을 낮추는 실질적인 기여입니다. 다만 자료에서 보듯 소비자 노력의 효과에는 한계가 있으므로, 더 중요한 것은 기업입니다. 기업은 생산 단계에서 재활용을 설계해야 합니다. 복합 재질을 단일 재질로 바꾸고 무색 페트병을 쓰는 것만으로 선별 통과율이 크게 올라갑니다. 정부는 경제성의 문제를 풀어야 합니다. 신제품에 재생원료를 일정 비율 이상 쓰도록 의무화하면 재생원료의 수요가 생겨 재활용 산업이 돌아가기 시작합니다. 실제로 EU는 페트병에 재생원료 사용을 의무화하는 규제를 도입했습니다. 정리하면, 소비자의 실천이 헛되지 않으려면 기업의 설계와 정부의 제도가 그 뒤를 받쳐 주는 구조가 만들어져야 한다고 생각합니다."], "tips": ["깔때기형(단계 축소) 자료는 '어느 단계에서 몇 %p가 사라지는가'를 짚는 것이 정확한 독해입니다.", "'문제의 병목 재정의'(배출→설계)는 자료해석에서 통찰을 보여 주는 대표 기술입니다.", "주체별 제안은 서로 연결되게 마무리하세요. 각자 따로 놀면 나열에 그칩니다."], "chart": "<div style=\"overflow-x:auto\"><table style=\"width:100%;max-width:560px;border-collapse:collapse;background:#fff;font-size:13px\"><tr><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">단계<\/th><th style=\"border:1px solid #dbe3ef;background:#eef4fc;padding:7px 9px;color:#10366a\">비율<\/th><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">분리배출된 플라스틱<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">100%<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">선별장에서 재활용 가능 판정<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">약 55%<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">실제 재생원료로 재활용<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">약 27%<\/td><\/tr><tr><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">고품질 재생원료(보틀투보틀 등)<\/td><td style=\"border:1px solid #dbe3ef;padding:6px 9px;text-align:center\">약 10% 미만<\/td><\/tr><\/table><\/div><div style=\"font-size:11px;color:#8896aa;margin-top:4px;text-align:right\">분리배출 플라스틱의 단계별 처리 흐름 · 단위: % (예시 자료)<\/div>"}, {"t": "지방소멸 위기와 대응", "ty": "문제해결", "p": "행정안전부는 인구 감소로 소멸 위험에 처한 89개 시·군·구를 '인구감소지역'으로 지정했다. 전국 228개 기초지자체의 절반 이상이 소멸 위험 단계에 들어섰다는 분석도 있다. 청년이 일자리와 교육을 찾아 수도권으로 떠나면, 남은 지역은 학교와 병원, 상점이 문을 닫고, 생활이 불편해진 지역에서 더 많은 사람이 떠나는 악순환이 반복된다. 우리나라 국토의 12%인 수도권에 인구의 절반 이상이 모여 사는 것은 세계적으로도 이례적인 집중이다.\n\n정부와 지자체는 귀농 지원금, 출산 장려금, 공공기관 이전 등 다양한 정책을 시도해 왔지만 흐름을 바꾸지 못했다. 최근에는 주민등록 인구를 늘리는 대신, 관광·원격근무·워케이션 등으로 지역과 관계를 맺는 '생활인구'를 늘리자는 새로운 접근과, 모든 지역을 살리기보다 거점 도시에 기능을 모으자는 '압축 전략'도 논의되고 있다.", "q": ["지방소멸의 악순환 구조를 설명하고, 제시문에 나온 정책들이 효과를 내지 못한 이유를 분석해 보세요.", "자신이 인구감소지역의 정책 담당자라면 어떤 전략을 세울지, 우선순위와 근거를 들어 말해 보세요."], "guide": "【제시문 분석】 핵심은 '악순환 구조'(청년 유출→생활 기반 붕괴→추가 유출)와 기존 정책의 한계(돈으로 이주를 유도했지만 유출의 원인인 일자리·교육을 못 바꿈)입니다. 제시문 후반의 '생활인구'와 '압축 전략'은 답안에 쓸 재료로 제공된 것입니다.\n【답변 구성】 [1] ① 순환 고리를 화살표식으로 설명 → ② 정책 실패 원인(원인이 아닌 증상 겨냥, 지자체 간 제로섬 경쟁) [2] ① 전략의 대전제(모든 것을 다 할 수는 없음) → ② 우선순위 2~3개(거점화, 생활인구, 정주 여건) → ③ 근거", "a": ["지방소멸은 하나의 사건이 아니라 스스로 강해지는 악순환 구조입니다. 청년이 일자리와 교육을 찾아 떠나면 지역의 소비와 세수가 줄고, 그러면 학교·병원·상점 같은 생활 기반이 문을 닫으며, 생활이 불편해진 지역에서는 남아 있던 사람들마저 떠나게 됩니다. 한 바퀴 돌 때마다 유출의 이유가 더 커지는 구조입니다. 기존 정책이 실패한 이유는 이 구조의 원인이 아니라 증상을 겨냥했기 때문이라고 분석합니다. 출산 장려금과 귀농 지원금은 '오는 사람에게 주는 돈'인데, 떠나는 진짜 이유인 일자리와 교육·의료는 바뀌지 않았으므로 지원금이 끝나면 다시 떠나게 됩니다. 또 모든 지자체가 비슷한 지원금 경쟁을 벌이면 전체 인구가 늘지 않는 한 서로 뺏고 뺏기는 제로섬 게임이 될 뿐입니다.", "제가 정책 담당자라면 '모든 마을을 예전처럼 되돌린다'는 목표부터 버리겠습니다. 한정된 예산으로 모든 곳을 조금씩 지원하면 어느 곳도 살리지 못하기 때문입니다. 우선순위 첫째는 거점 압축 전략입니다. 지역 중심 도시에 병원·학교·문화시설을 집중시키고 주변 마을과는 교통망으로 연결해, 인구가 줄어도 삶의 질은 유지되는 구조를 만들겠습니다. 둘째는 생활인구 전략입니다. 주민등록 인구를 늘리는 경쟁 대신, 원격근무자와 워케이션, 관광객처럼 지역에 시간을 쓰고 돈을 쓰는 사람을 늘리는 것입니다. 빈집을 워케이션 시설로 바꾸는 것처럼 이미 있는 자원을 활용할 수 있어 현실적입니다. 셋째는 그 지역만의 산업과 대학을 연계한 청년 일자리입니다. 이 순서를 택한 근거는, 거점화로 '살 만한 기반'을 먼저 지켜야 생활인구도 일자리도 그 위에서 작동하기 때문입니다. 지방 정책의 목표는 인구수의 회복이 아니라 규모가 줄어도 지속 가능한 지역을 설계하는 것이라고 생각합니다."], "tips": ["악순환 구조는 'A→B→C→다시 A'의 고리로 말하면 구조적 사고가 명확히 전달됩니다.", "'증상이 아니라 원인을 겨냥해야 한다'는 정책 실패 분석의 기본 틀을 익혀 두세요.", "'모든 것을 지킬 수 없다'는 불편한 전제를 인정하는 용기가 오히려 현실 감각으로 평가받습니다."]}, {"t": "키오스크 시대의 디지털 소외", "ty": "문제해결", "p": "패스트푸드점과 카페, 병원, 기차역까지 무인 단말기(키오스크)가 빠르게 확산되고 있다. 국내 키오스크 수는 최근 몇 년 사이 몇 배로 늘었다. 인건비 상승과 비대면 선호가 맞물린 결과다. 그러나 한 조사에서 고령층의 상당수가 '키오스크 주문에 어려움을 겪어 매장을 그냥 나온 경험이 있다'고 답했다. 글자가 작고, 단계가 복잡하며, 뒤에 줄 선 사람들의 시선이 부담스럽기 때문이다.\n\n디지털 전환의 속도가 빨라질수록 그 속도를 따라가지 못하는 사람들의 일상은 오히려 좁아진다. 은행 점포가 줄면서 모바일 뱅킹을 못 쓰는 노인의 금융 접근성이 떨어지고, 식당 예약과 대기까지 앱으로 이루어지면서 '앱이 없으면 밥도 못 먹는' 상황이 생긴다. 기술은 다수를 편리하게 했지만, 소수에게는 새로운 장벽이 되었다.", "q": ["디지털 전환이 만들어 내는 소외의 구조를 설명하고, '기술의 발전은 필연적으로 소외를 낳는가'에 대한 자신의 생각을 말해 보세요.", "키오스크로 인한 고령층의 어려움을 줄일 수 있는 현실적인 방안을 기술적·사회적 측면에서 제안해 보세요."], "guide": "【제시문 분석】 구조의 핵심: 효율(인건비·비대면)을 위한 전환이 '기본값'이 되면서, 대안 수단(사람 응대)이 사라져 선택권 없는 소외가 발생. '기술 vs 사람'이 아니라 '설계의 문제'로 보는 관점이 열쇠입니다.\n【답변 구성】 [1] ① 소외의 구조(대안의 소멸) → ② 질문에 대한 입장: 필연이 아니라 설계의 선택 → ③ 근거 [2] ① 기술적(화면 설계, 음성 안내) → ② 사회적(교육, 유인 인력 병행) → ③ 원칙 제시로 마무리", "a": ["이 소외의 구조는 기술이 도입되는 것 자체가 아니라, 기술이 유일한 통로가 되면서 생깁니다. 키오스크가 놓이는 것은 문제가 아니지만, 직원 응대라는 기존의 길이 함께 사라지면 기술을 다루지 못하는 사람에게는 선택지가 없어집니다. 즉 디지털 소외는 '새로운 것이 생겨서'가 아니라 '원래 있던 대안이 없어져서' 발생합니다. 그래서 저는 기술의 발전이 필연적으로 소외를 낳는다고 생각하지 않습니다. 소외는 기술의 속성이 아니라 설계의 선택이기 때문입니다. 같은 키오스크라도 큰 글씨 모드와 음성 안내를 넣을지, 유인 창구를 하나 남길지는 기술이 아니라 사람이 결정합니다. 발전이 소외를 낳는 것이 아니라, 효율만을 기준으로 삼은 설계가 소외를 낳는다고 생각합니다.", "기술적 측면에서는 키오스크 자체를 약자 기준으로 설계하는 것입니다. 큰 글씨·음성 안내·단순 모드를 기본으로 제공하고, 공공장소 키오스크에는 접근성 기준을 의무화하는 것입니다. 장애인 접근성을 위한 설계가 결국 모두를 편하게 했던 것처럼, 노인이 쓰기 쉬운 화면은 모든 사람에게 쉬운 화면입니다. 사회적 측면에서는 두 가지를 제안합니다. 첫째, 실제 기기로 연습하는 디지털 교육입니다. 복지관 강의실이 아니라 실제 매장 환경처럼 연습할 수 있어야 하고, 학생들이 어르신께 사용법을 알려 드리는 세대 연계 봉사도 좋은 방법이라고 생각합니다. 둘째, '휴먼 백업'의 원칙입니다. 병원·역·은행처럼 필수 서비스에는 사람의 도움을 받을 수 있는 창구를 최소 하나 남기도록 하는 것입니다. 효율화로 아낀 비용의 일부를 가장 느린 사람을 위한 통로에 쓰는 것이, 기술 발전의 품격이라고 생각합니다."], "tips": ["'소외는 기술이 아니라 설계의 선택'이라는 재정의가 이 문항의 승부처입니다.", "해결안을 '기술적/사회적'으로 나누라는 지시를 구조에 그대로 반영하세요.", "조부모님 등 실제 관찰 경험이 있다면 한 문장으로 덧붙여 공감의 진정성을 더하세요."]}, {"t": "고령화 사회, 세대 상생의 길", "ty": "문제해결", "p": "우리나라는 2025년 65세 이상 인구가 전체의 20%를 넘는 초고령사회에 진입했다. 고령화는 연금·의료비 부담을 둘러싼 세대 갈등으로 번지고 있다. 온라인 공간에는 노인 세대를 향한 혐오 표현이 늘고, 반대로 청년 세대를 '노력하지 않는 세대'로 몰아붙이는 시선도 있다. 국민연금 개혁 논의에서는 '더 내고 늦게 받는' 부담을 어느 세대가 얼마나 질 것인지를 두고 첨예한 대립이 이어진다.\n\n그러나 세대 갈등의 상당 부분은 접촉의 부족에서 온다는 분석도 있다. 핵가족화와 도시화로 조부모와 함께 사는 가정이 드물어지면서, 청소년이 노인을 일상에서 만날 기회 자체가 사라졌다. 서로를 사람이 아니라 '집단'으로만 접하게 되면, 언론과 SNS가 보여 주는 극단적인 사례가 그 세대 전체의 이미지가 된다.", "q": ["세대 갈등이 심해지는 원인을 제시문을 바탕으로 구조적 차원과 심리적 차원으로 나누어 분석해 보세요.", "세대 상생을 위해 학교나 지역사회에서 실행할 수 있는 방안을 하나 설계하고, 기대 효과를 말해 보세요."], "guide": "【제시문 분석】 1문단은 구조적 원인(자원 배분: 연금·의료비 부담의 배분), 2문단은 심리적 원인(접촉 부족→집단화·낙인)입니다. 문단 구성 자체가 답의 구조를 알려 주는 제시문입니다.\n【답변 구성】 [1] 구조적 차원(한정된 자원의 세대 간 배분 갈등) + 심리적 차원(접촉 부족, 대표성 착각) [2] ① 방안 하나를 구체적으로 설계(대상·방식·내용) → ② 기대 효과를 두 차원과 연결 → ③ 한계 보완", "a": ["구조적 차원의 원인은 자원 배분의 문제입니다. 연금과 의료비라는 한정된 자원을 놓고 '내는 세대'와 '받는 세대'의 이해관계가 실제로 부딪히고 있고, 고령화가 빨라질수록 부담의 크기가 커져 갈등도 커집니다. 심리적 차원의 원인은 접촉의 부족입니다. 제시문처럼 조부모와 함께 사는 가정이 드물어지면서 세대가 서로를 일상의 '사람'으로 만나지 못하고 언론과 SNS 속 '집단'으로만 접하게 되었습니다. 그 결과 극단적 사례가 세대 전체의 이미지가 되는 착각이 생기고, 이 낙인이 구조적 갈등을 더 풀기 어렵게 만듭니다. 즉 구조의 갈등은 협상으로 풀어야 할 문제인데, 심리의 갈등이 그 협상 테이블 자체를 무너뜨리고 있는 상황이라고 분석합니다.", "저는 학교 단위의 '세대 협력 프로젝트'를 설계해 보고 싶습니다. 방식은 이렇습니다. 학생들이 지역 어르신들께 스마트폰과 키오스크 사용법을 알려 드리고, 어르신들은 학생들에게 지역의 역사나 살아온 이야기, 생활의 기술을 들려주는 상호 교환형 프로그램입니다. 한쪽이 일방적으로 봉사하는 구조가 아니라 서로가 서로의 선생님이 되는 구조라는 점이 핵심입니다. 기대 효과는 두 가지입니다. 심리적 차원에서는, 정기적으로 만나 이름을 알게 된 순간 '노인 집단'이 '김 할머니'가 되어 낙인이 무너집니다. 접촉 가설처럼 편견은 논리가 아니라 만남으로 줄어들기 때문입니다. 구조적 차원에서도, 서로의 처지를 이해한 세대는 연금 같은 문제에서 상대를 적이 아니라 협상 상대로 볼 수 있게 됩니다. 물론 한 번의 행사로는 효과가 없으므로, 학기 단위로 같은 짝이 꾸준히 만나는 지속성이 조건이라고 생각합니다."], "tips": ["'구조적/심리적'처럼 차원을 나누라는 지시는 제시문의 문단 구조에서 힌트를 얻으세요.", "방안 설계형 질문에는 대상·방식·지속 조건까지 말해야 '설계'가 됩니다. 아이디어 나열은 설계가 아닙니다.", "'상호 교환형'처럼 일방적 시혜를 피하는 설계가 인성과 사고력을 동시에 보여 줍니다."]}, {"t": "젠트리피케이션 — 뜨는 동네의 역설", "ty": "문제해결", "p": "낡은 골목에 개성 있는 카페와 공방이 들어서고 사람들이 모여들면, 그 동네의 임대료가 오르기 시작한다. 상권을 일군 원래의 소상공인과 예술가들은 치솟은 임대료를 감당하지 못해 떠나고, 그 자리는 자본력 있는 프랜차이즈가 채운다. 동네를 특별하게 만들었던 사람들이 동네의 성공 때문에 쫓겨나는 이 역설을 '젠트리피케이션'이라고 부른다. 서울의 서촌, 경리단길, 성수동 등이 대표적인 사례로 꼽힌다.\n\n건물주 입장에서 임대료 인상은 정당한 재산권 행사다. 그러나 상권의 가치는 건물주 혼자 만든 것이 아니라 상인들의 노력과 방문객의 문화가 함께 만든 것인데, 그 이익을 건물주가 독점하는 것이 공정한가라는 물음이 남는다. 일부 지역에서는 건물주와 상인이 임대료 인상 자제를 약속하는 상생협약을 맺거나, 지자체가 장기 저리 임대 상가를 운영하는 실험이 이루어지고 있다.", "q": ["젠트리피케이션이 '역설'이라고 불리는 이유를 설명하고, 이 현상에서 충돌하는 두 가치를 말해 보세요.", "상권을 지키면서 재산권도 존중하는 해법을 제시문의 사례를 참고하여 제안해 보세요."], "guide": "【제시문 분석】 역설의 구조: 성공의 주역이 성공의 비용을 치르고 퇴출됨. 충돌 가치: 재산권(임대료 인상의 자유) vs 상권 가치의 공정한 배분(가치를 만든 자의 몫). '가치를 누가 만들었는가'라는 질문이 분석의 중심입니다.\n【답변 구성】 [1] ① 역설의 구조 설명(원인과 결과의 뒤집힘) → ② 두 가치 명명 [2] ① 해법의 원칙(강제보다 이익 공유) → ② 상생협약·공공 상가 등 구체안 → ③ 한계와 보완", "a": ["젠트리피케이션이 역설인 이유는, 동네를 성공시킨 사람들이 바로 그 성공 때문에 쫓겨나기 때문입니다. 개성 있는 가게들이 골목의 가치를 올렸는데, 올라간 가치가 임대료 상승으로 돌아와 가치를 만든 당사자를 밀어냅니다. 성공의 원인이 자신을 제거하는 결과를 낳는 구조입니다. 여기서 충돌하는 두 가치는, 한쪽은 건물주의 재산권입니다. 자신의 건물 임대료를 시세에 맞게 받는 것은 정당한 권리 행사입니다. 다른 한쪽은 기여에 따른 공정한 배분입니다. 상권의 가치는 건물주 혼자가 아니라 상인의 노력과 방문객의 문화가 함께 만든 공동의 성과인데, 그 이익을 건물 소유자가 독점하는 것이 공정한가의 문제입니다.", "저는 재산권을 강제로 제한하기보다, 상생이 건물주에게도 이익이 되는 구조를 만드는 것이 지속 가능한 해법이라고 생각합니다. 첫째, 제시문의 상생협약을 발전시키는 방식입니다. 임대료 인상을 자제하는 건물주에게 지자체가 건물 수리비 지원이나 세금 감면을 제공하면, 협약이 선의가 아니라 합리적 선택이 됩니다. 둘째, 지자체가 운영하는 장기 저리 임대 상가를 상권의 핵심 위치에 확보해, 동네의 정체성을 만드는 가게들이 임대료 파도에 흔들리지 않는 닻의 역할을 하게 하는 것입니다. 셋째, 장기적으로는 상가 임대차 계약의 갱신 보장 기간을 현실화하는 제도 보완도 필요합니다. 다만 어떤 해법이든 프랜차이즈나 대형 자본을 악으로 모는 방식은 곤란하다고 생각합니다. 목표는 특정 가게를 지키는 것이 아니라, 가치를 만든 사람이 그 가치의 몫을 나눠 받는 공정한 규칙을 세우는 것이기 때문입니다."], "tips": ["'역설'의 구조(원인이 자신을 제거하는 결과를 낳음)를 한 문장으로 설명할 수 있으면 개념 이해가 증명됩니다.", "해법 제시에서 '건물주에게도 이익이 되는 설계'라는 관점이 현실 감각을 보여 줍니다.", "성수동 등 실제 지명을 하나 언급하면 시사 관심도가 드러납니다."]}, {"t": "학교 공동 과제 기한 연장 논쟁", "ty": "문제해결", "p": "○○중학교 2학년 전체 학생은 한 달 전부터 예고된 탐구보고서를 이번 주 금요일까지 제출하기로 되어 있다. 그런데 자료 수집과 작성에 어려움을 겪는 학생이 많아지자, 다수의 학생이 제출 기한을 일주일 연장해 달라고 학교에 요청했다. 반면 이미 과제를 끝냈거나 기한에 맞춰 계획을 세워 온 소수의 학생들은 연장에 반대하고 있다.\n\n학교는 기한을 연장할 경우 성실하게 준비한 학생들이 손해를 본다는 형평성의 문제와, 연장하지 않을 경우 다수의 학생이 부실한 보고서를 내게 된다는 교육 효과의 문제 사이에서 고민하고 있다.", "q": ["학교는 어떤 결정을 내리는 것이 바람직한지, 근거를 들어 자신의 판단을 말해 보세요."], "guide": "【제시문 분석】 표면은 '연장이냐 아니냐'의 양자택일이지만, 실제 쟁점은 두 가치의 조정입니다 — 약속(형평성) vs 교육 목적(과제의 본래 취지). 다수결로 정할 문제인지도 함께 검토할 지점입니다.\n【답변 구성】 ① 결정 제시(조건부 연장 등) → ② 근거 1(과제의 목적 기준) → ③ 근거 2(기한 준수자 보호 장치) → ④ 절차의 중요성(양측 의견 수렴) → ⑤ 정리", "a": ["저는 '기한을 일주일 연장하되, 기한을 지킨 학생이 손해 보지 않는 보완 장치를 함께 두는 결정'이 바람직하다고 생각합니다.\n\n첫 번째 근거는 과제의 목적입니다. 탐구보고서의 목적은 기한 준수 자체가 아니라 탐구의 경험을 완성하는 것입니다. 다수의 학생이 부실한 보고서를 내고 끝난다면 과제는 형식만 남고 교육 효과는 사라집니다. 목적을 기준으로 판단하면 충실한 완성의 기회를 주는 쪽이 옳습니다. 두 번째 근거는 형평성인데, 이것은 연장을 포기할 이유가 아니라 보완할 조건이라고 생각합니다. 이미 제출한 학생에게는 성실 제출 가산점을 주거나, 연장 기간에 자신의 보고서를 수정·보완해 다시 낼 기회를 주면, 연장이 오히려 모든 학생에게 이익이 되는 결정으로 바뀝니다.\n\n마지막으로 결정 못지않게 중요한 것이 절차라고 생각합니다. 연장을 결정하기 전에 반대하는 학생들의 의견을 공개적으로 듣고, 왜 이런 보완 장치를 두는지 설명하는 과정을 거쳐야 소수도 결과에 승복할 수 있습니다. 그리고 이번 일이 '요청하면 기한은 늘어난다'는 잘못된 학습이 되지 않도록, 연장은 이번에 한한 예외임을 분명히 하고 다음 과제부터는 중간 점검 일정을 두어 같은 상황을 예방하는 것까지가 학교의 몫이라고 생각합니다."], "tips": ["학교 상황 판단 문제는 '무엇이 이 제도의 목적인가'를 기준으로 세우면 판단이 흔들리지 않습니다.", "소수의 손해를 '어쩔 수 없다'로 넘기지 말고 보완 장치를 설계하는 것이 핵심 득점 요소입니다.", "'재발 방지'까지 언급하면 일회적 판단을 넘어 시스템적 사고를 보여 줄 수 있습니다."]}, {"t": "모둠 과제 무임승차 해결하기", "ty": "문제해결", "p": "4명이 한 모둠으로 진행하는 수행평가에서, 한 모둠원이 자료 조사를 맡기로 하고는 2주째 아무것도 하지 않고 있다. 연락하면 '미안, 곧 할게'라는 답만 돌아온다. 발표는 다음 주이고, 모둠 점수는 네 명이 똑같이 받는다. 다른 모둠원 한 명은 '그냥 우리끼리 하고 선생님께 말씀드리자'고 하고, 또 다른 한 명은 '괜히 일 키우지 말고 조용히 나눠서 하자'고 한다.\n\n무임승차 문제는 학교를 넘어 사회 곳곳에서 나타난다. 공동의 성과에서 개인의 기여가 구분되지 않을 때, 노력을 줄이는 것이 개인에게는 합리적 선택처럼 보이기 때문이다. 그러나 그 선택이 쌓이면 집단 전체의 성과와 신뢰가 무너진다.", "q": ["이 상황에서 자신이라면 어떻게 행동할지 단계적으로 말해 보세요.", "무임승차가 생기지 않는 모둠 활동의 규칙을 처음부터 설계한다면 어떻게 만들지 제안해 보세요."], "guide": "【제시문 분석】 인성 상황이자 시스템 설계 문제입니다. 1번은 '관계를 지키면서 문제를 해결하는 순서'(사정 확인→역할 재조정→최후의 보고)를, 2번은 '기여가 보이게 만드는 구조'(역할 명세, 중간 점검, 기여도 반영)를 묻습니다.\n【답변 구성】 [1] ① 1단계: 비난 아닌 사정 확인 → ② 2단계: 역할 축소·재배분 → ③ 3단계: 그래도 안 되면 기록을 근거로 교사와 상의 → ④ 각 단계의 이유 [2] 시작 단계(역할·기한 명문화) → 중간 단계(점검) → 평가 단계(기여도) 설계", "a": ["저라면 세 단계로 행동하겠습니다. 첫 단계는 비난이 아니라 사정을 확인하는 대화입니다. '왜 안 하냐'가 아니라 '혹시 무슨 일 있어? 어디에서 막혔어?'라고 따로 물어보겠습니다. 실제로는 게으름이 아니라 방법을 몰라서 시작을 못 하고 있거나, 집안 사정이 있는 경우도 있기 때문입니다. 두 번째 단계는 역할의 재조정입니다. 사정이 있다면 그 친구가 지금이라도 해낼 수 있는 작은 역할, 예를 들어 발표 자료의 디자인이나 자료 정리로 바꿔 주고 기한을 이틀 단위로 짧게 나누겠습니다. 2주짜리 약속은 미루기 쉽지만 이틀짜리 약속은 미루기 어렵습니다. 세 번째 단계는, 그래도 하지 않는다면 그동안의 연락 기록과 재조정 과정을 정리해 선생님께 상황을 말씀드리는 것입니다. 이것은 고자질이 아니라, 기여하지 않은 사람이 같은 점수를 받는 불공정을 바로잡는 정당한 절차라고 생각합니다. 순서가 중요한 이유는, 도움이 필요한 사람인지 책임을 피하는 사람인지 확인하기 전에 단정하면 사람도 과제도 모두 잃기 때문입니다.", "무임승차는 사람의 문제이기 전에 구조의 문제이므로, 규칙 설계로 상당 부분 예방할 수 있다고 생각합니다. 시작 단계에서는 역할과 결과물, 기한을 문서로 명확히 정하겠습니다. '자료 조사 담당'이 아니라 '수요일까지 참고 자료 5개와 요약 1쪽'처럼 결과물 단위로 정해야 책임이 분명해집니다. 중간 단계에서는 일주일에 한 번 5분씩 진행 상황을 공유하는 중간 점검을 두겠습니다. 문제를 발표 전날이 아니라 첫 주에 발견하는 것이 목적입니다. 평가 단계에서는 모둠 점수에 개인 기여도를 일부 반영하도록 시작할 때 모두의 동의를 받아 두겠습니다. 기여가 보이지 않는 구조에서는 성실한 사람이 손해를 보지만, 기여가 기록되는 구조에서는 성실함이 합리적 선택이 됩니다. 좋은 팀은 좋은 사람이 아니라 좋은 규칙이 만든다고 생각합니다."], "tips": ["갈등 해결은 반드시 '단계'로 말하세요. 바로 교사에게 가는 답도, 끝까지 덮는 답도 감점입니다.", "'사정 확인 먼저'는 인성 평가의 핵심입니다. 상대를 문제로 단정하지 않는 태도를 보여 주세요.", "기숙사형 학교는 공동체 갈등 해결 능력을 매우 중시합니다. 이 문항의 구조를 룸메이트 갈등에도 응용하세요."]}, {"t": "공유 전동킥보드, 편리함과 안전 사이", "ty": "문제해결", "p": "공유 전동킥보드는 짧은 거리를 빠르게 이동할 수 있어 청소년과 청년층에게 인기가 높다. 그러나 안전모 없이 두 명이 함께 타거나 인도를 질주하는 모습이 흔해지면서 사고가 급증했고, 아무 곳에나 세워진 킥보드가 보행자, 특히 시각장애인과 휠체어 이용자의 통행을 막는 문제도 심각해졌다. 결국 일부 도시는 공유 킥보드 운영을 아예 금지했고, 프랑스 파리는 시민 투표를 거쳐 2023년 공유 킥보드를 퇴출했다.\n\n한편 금지가 능사는 아니라는 반론도 있다. 킥보드는 자동차를 대체하는 친환경 이동수단이 될 수 있고, 대중교통이 닿지 않는 '마지막 1km'를 메우는 역할도 한다. 문제는 킥보드 자체가 아니라 이용 규칙과 인프라의 부재라는 것이다. 지정 주차 구역, 속도 제한 장치, 면허 확인 시스템 같은 관리 장치를 갖춘 도시에서는 사고와 민원이 줄었다는 사례도 있다.", "q": ["공유 킥보드 문제를 '금지'로 해결하는 방식의 장점과 한계를 분석해 보세요.", "금지 대신 '공존'을 선택한다면 어떤 규칙과 시스템이 필요할지, 이해관계자별로 나누어 설계해 보세요."], "guide": "【제시문 분석】 파리의 퇴출(금지 해법)과 관리 장치를 갖춘 도시(공존 해법)가 대비됩니다. '문제는 킥보드가 아니라 규칙의 부재'라는 문장이 제시문의 핵심 관점입니다.\n【답변 구성】 [1] 금지의 장점(즉각적·확실) vs 한계(편익 상실, 문제의 본질 회피) [2] 이용자(면허·안전모)·업체(주차 시스템·속도 제한)·행정(전용 인프라) 3주체 설계 → 책임 배분의 원칙으로 마무리", "a": ["금지의 장점은 확실하고 빠르다는 것입니다. 킥보드가 사라지면 킥보드 사고와 방치 문제도 즉시 사라지므로, 시민의 안전이 급박하게 위협받는 상황에서는 가장 강력한 대응입니다. 파리처럼 시민 투표를 거쳤다면 민주적 정당성도 갖춥니다. 하지만 한계도 뚜렷합니다. 첫째, 킥보드가 주던 편익, 즉 친환경 이동과 대중교통의 빈틈을 메우는 기능까지 함께 사라집니다. 둘째, 더 근본적으로는 문제의 본질을 비켜 갑니다. 제시문의 지적처럼 문제의 원인이 이동수단 자체가 아니라 규칙과 인프라의 부재라면, 금지는 원인을 해결한 것이 아니라 원인이 드러나는 무대를 치운 것에 불과합니다. 새로운 이동수단은 앞으로도 계속 등장할 텐데, 그때마다 금지할 수는 없기 때문입니다.", "공존을 선택한다면 세 주체에게 각각의 책임을 설계하겠습니다. 먼저 이용자에게는 자격과 안전의 책임입니다. 앱에서 면허나 안전교육 이수를 확인해야 대여할 수 있게 하고, 안전모 착용을 인증하면 요금을 할인해 주는 방식으로 규칙 준수가 이익이 되게 만들겠습니다. 다음으로 운영 업체에게는 기술적 책임입니다. 지정 구역에 반납해야만 결제가 종료되는 주차 시스템, 어린이 보호구역과 인도에서 자동으로 속도가 떨어지는 지오펜싱 기술은 이미 가능한 기술이므로 의무화해야 합니다. 방치 킥보드의 수거 책임과 비용도 업체가 지게 해야 합니다. 마지막으로 행정에게는 인프라의 책임입니다. 자전거·킥보드 겸용 도로와 주차 구역을 확보하지 않으면 이용자는 인도로 갈 수밖에 없기 때문입니다. 이렇게 책임을 나누는 원칙은 '이익을 얻는 자가 그에 따르는 위험을 관리한다'는 것입니다. 규칙 있는 공존이 금지보다 어렵지만, 도시가 새로운 기술을 받아들이는 성숙한 방식이라고 생각합니다."], "tips": ["'금지의 장점'을 먼저 성실하게 인정해야 한계 분석이 공정해 보입니다.", "이해관계자별 설계는 '누가-무엇을-왜'의 3요소를 갖추면 완성도가 높아집니다.", "'문제가 드러나는 무대를 치운 것'처럼 본질과 현상을 구분하는 표현이 사고력을 드러냅니다."]}, {"t": "학교 안 생성형 AI 사용 규칙 만들기", "ty": "문제해결", "p": "한 고등학교에서 생성형 AI를 둘러싼 갈등이 벌어졌다. 어떤 학생이 AI로 작성한 글을 그대로 수행평가 과제로 제출했다가 적발되었고, 학교는 재발 방지를 위해 'AI 사용 전면 금지'를 검토하고 있다. 그러자 다른 학생들은 '자료 조사와 아이디어 발상에 AI를 잘 활용해 왔는데, 일부의 부정행위 때문에 전체를 금지하는 것은 부당하다'고 반발했다. 교사들 사이에서도 'AI 판별이 사실상 불가능하므로 금지는 실효성이 없다'는 의견과 '허용하면 스스로 생각하는 훈련이 무너진다'는 의견이 맞선다.\n\n대학과 기업은 이미 AI를 업무의 기본 도구로 받아들이는 추세여서, 학교가 AI를 금지하면 오히려 사회와의 격차가 커진다는 지적도 있다. 문제는 금지냐 허용이냐의 양자택일이 아니라, 학습의 목적을 해치지 않는 사용의 경계를 어디에 긋느냐다.", "q": ["이 학교의 갈등에서 각 입장의 핵심 근거를 정리하고, 자신이 학생회 대표라면 어떤 'AI 사용 규칙'을 제안할지 구체적으로 말해 보세요."], "guide": "【제시문 분석】 입장 정리: 금지론(사고력 훈련 보호), 허용론(도구 활용은 정당, 연대책임 부당), 실효성론(판별 불가). 마지막 문장 '사용의 경계'가 답의 방향을 지시합니다. 과제의 '목적'별로 경계가 달라진다는 발상이 열쇠입니다.\n【답변 구성】 ① 세 입장의 근거 요약 → ② 규칙의 원칙 선언(전면 금지도 방임도 아닌 목적 기준) → ③ 구체 규칙 3가지(과제 유형별 허용 범위, 사용 표시 의무, 평가 방식 보완) → ④ 규칙의 실효성 확보 방안", "a": ["세 입장의 근거를 정리하면, 금지를 주장하는 쪽은 스스로 생각하는 훈련이라는 교육의 본질을 지키려 하고, 반발하는 학생들은 도구를 잘 쓰는 것과 부정행위는 다르며 일부의 잘못으로 전체를 벌하는 것은 부당하다고 말합니다. 실효성을 지적하는 쪽은 판별이 불가능한 규칙은 규칙이 아니라는 현실론입니다. 저는 세 입장 모두 일리가 있으므로, 규칙의 기준을 'AI 사용 여부'가 아니라 '과제의 목적'에 두어야 한다고 생각합니다.\n\n학생회 대표로서 세 가지 규칙을 제안하겠습니다. 첫째, 과제 유형별 신호등 규칙입니다. 글쓰기 실력 자체를 평가하는 과제는 AI 금지의 빨간불, 자료 조사와 아이디어 발상은 허용의 초록불, 초안 작성 후 AI 첨삭은 조건부의 노란불처럼, 과제마다 선생님이 색깔을 미리 공지하는 것입니다. 둘째, 사용 표시 의무입니다. AI를 어느 단계에서 어떻게 썼는지 과제 끝에 밝히면 부정행위가 아니라 도구 활용이 됩니다. 숨기는 것이 문제이지 쓰는 것이 문제가 아니라는 기준을 세우는 것입니다. 셋째, 판별 불가능성에 대한 보완으로, 중요한 평가는 과정 중심으로 바꾸는 것입니다. 초안과 수정본을 함께 내게 하거나 짧은 구술 확인을 더하면, 결과물만으로 판별할 필요 자체가 줄어듭니다. 이 규칙의 목표는 학생을 감시하는 것이 아니라, AI 시대에 '어디까지가 나의 생각인가'를 스스로 구분하는 능력을 기르는 것이라고 생각합니다."], "tips": ["여러 입장 정리를 요구받으면 각 입장을 한 문장씩 공정하게 요약한 뒤 자기 제안으로 넘어가세요.", "'신호등 규칙'처럼 이름 붙은 구체안은 기억에 남고, 실행 가능성을 보여 줍니다.", "이 주제는 실제 면접 단골입니다. 자신의 AI 사용 경험과 원칙을 꼬리질문으로 물을 수 있으니 준비하세요."]}, {"t": "알고리즘 추천과 필터버블", "ty": "독해·견해", "p": "동영상 플랫폼과 SNS는 이용자가 보고, 멈추고, 좋아요를 누른 모든 기록을 학습해 '다음에 볼 것'을 추천한다. 추천은 편리하다. 수억 개의 콘텐츠 중에서 내 취향을 정확히 찾아 주기 때문이다. 그러나 그 대가로 이용자는 점점 자신과 비슷한 생각, 비슷한 취향의 콘텐츠에만 둘러싸이게 된다. 인터넷 활동가 일라이 파리저는 이를 '필터버블', 즉 걸러진 정보의 거품 속에 갇히는 현상이라고 불렀다.\n\n필터버블이 위험한 이유는 그것이 눈에 보이지 않기 때문이다. 신문은 내가 어떤 신문을 고르는지 스스로 알지만, 알고리즘은 내가 무엇을 보지 못하고 있는지조차 알 수 없게 만든다. 비슷한 의견만 반복해서 접한 사람은 자신의 생각이 다수의 생각이라고 착각하게 되고, 다른 입장을 가진 사람을 이해할 수 없는 존재로 여기게 된다. 사회적 토론이 점점 거칠어지는 배경에 이 조용한 거품이 있다는 분석이 나온다.", "q": ["제시문의 핵심 내용을 요약하고, 필터버블이 민주주의에 미치는 영향에 대한 자신의 견해를 말해 보세요.", "필터버블에서 벗어나기 위해 자신이 실천할 수 있는 방법을 말해 보세요."], "guide": "【제시문 분석】 구조: 추천의 편리함(양보) → 필터버블의 정의 → 위험의 본질(비가시성 → 착각 → 타자의 이해 불가). '보이지 않는다'는 것이 왜 위험의 핵심인지 짚는 것이 독해의 포인트입니다.\n【답변 구성】 [1] ① 요약(편리함의 대가로 정보 거품에 갇힘) → ② 민주주의와의 연결(공론장의 전제 붕괴) → ③ 견해 [2] 정보 습관의 구체적 실천 2~3개", "a": ["제시문의 핵심은, 알고리즘 추천이 편리함의 대가로 이용자를 비슷한 정보의 거품 속에 가두며, 그 거품은 눈에 보이지 않기 때문에 더 위험하다는 것입니다. 내가 무엇을 못 보고 있는지조차 모르게 되고, 그 결과 내 생각을 다수의 생각으로 착각하며 다른 입장을 이해 불가능한 것으로 여기게 됩니다.\n\n저는 필터버블이 민주주의의 토대를 조용히 무너뜨린다고 생각합니다. 민주주의는 의견이 달라도 같은 사실 위에서 토론할 수 있다는 전제 위에 서 있는데, 필터버블은 사람들마다 접하는 사실 자체를 다르게 만들어 그 전제를 깨기 때문입니다. 토론이 거칠어지는 이유도 상대가 나빠서가 아니라, 서로 다른 정보 세계에 살다 보니 상대의 주장이 근거 없는 억지로만 보이기 때문이라고 생각합니다. 더 심각한 것은 이 과정에 강제가 없다는 점입니다. 검열은 저항이라도 부르지만, 필터버블은 내가 좋아하는 것만 보여 주므로 기꺼이 갇히게 됩니다. 그래서 저는 이것을 '편안한 감옥'이라고 부르고 싶습니다.", "저는 세 가지를 실천하려고 합니다. 첫째, 일부러 반대 입장의 콘텐츠를 찾아보는 것입니다. 어떤 이슈에 대해 제 생각이 굳어졌다고 느낄 때, 반대편의 가장 논리적인 글을 하나 찾아 읽는 습관입니다. 둘째, 추천이 아닌 경로로 정보를 얻는 시간을 확보하는 것입니다. 알고리즘이 골라 주는 피드 대신, 신문 지면이나 뉴스 홈페이지처럼 편집자가 배열한 화면을 보면 제 취향 밖의 세계를 만날 수 있습니다. 셋째, 제 추천 목록을 가끔 점검하는 것입니다. 추천된 영상들이 비슷한 방향으로만 쏠려 있다면 그것이 바로 거품의 증거이므로, 시청 기록을 지우거나 다른 분야를 의식적으로 검색해 알고리즘에 다른 신호를 주는 것입니다. 거품은 완전히 벗어날 수는 없어도, 거품이 있다는 것을 아는 사람과 모르는 사람의 차이는 크다고 생각합니다."], "tips": ["'편안한 감옥'처럼 현상의 본질을 압축하는 자기만의 한 구절을 만들어 보세요.", "민주주의와 연결할 때는 '의견의 차이'가 아니라 '사실의 분열'이 문제라는 층위를 짚으세요.", "실천 방법은 지금 당장 할 수 있는 수준으로 구체화해야 진정성이 전달됩니다."]}, {"t": "딥페이크 시대, 보는 것과 믿는 것", "ty": "독해·견해", "p": "AI로 사람의 얼굴과 목소리를 정교하게 합성하는 딥페이크 기술이 급속히 발전하고 있다. 2024년 홍콩에서는 한 회사의 직원이 딥페이크로 재현된 '가짜 임원들'과의 화상회의에 속아 약 340억 원을 송금하는 사건이 벌어졌다. 유명인의 얼굴을 합성한 가짜 광고와 음란물, 선거 직전 후보자의 가짜 연설 영상 등 피해의 형태도 다양해지고 있다. 우리나라에서도 청소년들 사이에서 지인의 사진을 합성하는 딥페이크 성범죄가 심각한 사회 문제로 떠올랐다.\n\n딥페이크가 위협하는 것은 개별 피해자만이 아니다. '눈으로 본 것은 믿을 수 있다'는 인간 사회의 오래된 전제 자체가 흔들린다. 어떤 영상이든 가짜일 수 있다면, 거꾸로 진짜 증거 영상을 '조작'이라고 잡아떼는 일도 가능해진다. 진실이 무엇인지 확인하는 비용은 커지고, 아무것도 믿지 않는 냉소가 퍼진다. 기술로 만든 문제를 기술로 잡는 탐지 기술의 경쟁, 워터마크 의무화 같은 제도, 그리고 시민의 미디어 리터러시가 함께 요구되는 이유다.", "q": ["딥페이크가 개인 피해를 넘어 사회 전체에 끼치는 해악을 제시문을 바탕으로 설명하고, 대응 방안에 대한 자신의 생각을 말해 보세요."], "guide": "【제시문 분석】 1문단은 피해 사례(사기·성범죄·선거), 2문단이 핵심 논지 — '보는 것=믿는 것'이라는 신뢰 기반의 붕괴, 그리고 역방향 악용(진짜를 가짜라 우기기)까지. 2문단의 추상적 해악을 자기 말로 풀 수 있는지가 독해력 평가 지점입니다.\n【답변 구성】 ① 개인 피해 요약(한두 문장) → ② 사회적 해악(증거 능력의 붕괴, 냉소의 확산) 상술 → ③ 대응을 기술·제도·교육 3축으로 제시 → ④ 청소년 당사자로서의 관점 추가", "a": ["딥페이크의 일차적 해악은 제시문의 사례처럼 금전 사기, 성범죄, 선거 조작 같은 개인과 공동체에 대한 직접 피해입니다. 그러나 더 근본적인 해악은 우리 사회가 서로를 믿는 방식 자체를 무너뜨린다는 데 있다고 생각합니다. 지금까지 영상은 가장 강력한 증거였습니다. 그런데 어떤 영상이든 가짜일 수 있게 되면 두 가지 일이 벌어집니다. 하나는 가짜에 속는 것이고, 다른 하나는 오히려 더 교묘한 문제로, 진짜 증거를 들이대도 '그거 딥페이크야'라고 잡아떼는 것이 가능해지는 것입니다. 결국 무엇이 진실인지 확인하는 비용이 사회 전체에 부과되고, 사람들은 확인을 포기한 채 아무것도 믿지 않거나 믿고 싶은 것만 믿게 됩니다.\n\n대응은 세 축이 함께 가야 한다고 생각합니다. 기술적으로는 AI 생성물에 워터마크를 새기고 탐지 기술을 키우는 것, 제도적으로는 딥페이크 제작·유포에 대한 처벌을 명확히 하고 플랫폼에 신속한 삭제 의무를 지우는 것입니다. 그러나 기술과 제도는 언제나 악용보다 반걸음 늦으므로, 마지막 방어선은 시민의 리터러시라고 생각합니다. 특히 저희 세대에게는 '충격적인 영상일수록 출처를 먼저 확인한다'는 습관과 함께, 합성물을 만들고 공유하는 것 자체가 놀이가 아니라 범죄라는 감각을 교육하는 것이 중요합니다. 같은 세대에서 벌어진 딥페이크 성범죄를 보며, 기술 윤리는 어른들의 문제가 아니라 바로 우리의 문제라고 느꼈습니다."], "tips": ["'진짜를 가짜라고 우기는 역방향 악용'까지 짚으면 제시문을 깊이 읽었다는 증거가 됩니다.", "청소년 딥페이크 범죄는 당사자 세대로서의 문제의식을 보여 줄 수 있는 지점입니다.", "대응 방안은 기술·제도·교육의 3축 구조가 표준입니다. 각 축의 한계까지 언급하면 최상위권입니다."]}, {"t": "욜로에서 요노로 — 소비문화 읽기", "ty": "독해·견해", "p": "몇 년 전까지 젊은 세대의 소비를 상징하는 말은 '욜로(YOLO)'였다. '인생은 한 번뿐(You Only Live Once)'이니 미래를 위해 현재를 희생하기보다 지금의 행복을 위해 아낌없이 쓰자는 태도다. 해외여행과 명품, '작은 사치'가 유행했고, 저축 대신 경험에 투자하는 것이 합리적이라는 인식이 퍼졌다.\n\n그런데 최근에는 '요노(YONO)'라는 말이 그 자리를 대신하고 있다. '필요한 것은 하나뿐(You Only Need One)'이라는 뜻으로, 꼭 필요한 것만 사고 불필요한 소비를 줄이는 실용적 태도를 가리킨다. 고물가와 고금리로 생활비 부담이 커지자 무지출 챌린지, 중고 거래, 소분 구매가 유행하기 시작했다. 두 흐름은 정반대처럼 보이지만, 모두 '한정된 자원으로 나의 만족을 극대화하려는 선택'이라는 공통점이 있다는 분석도 있다. 소비문화는 개인의 취향이기 이전에 그 시대의 경제 상황을 비추는 거울이라는 것이다.", "q": ["욜로에서 요노로의 변화가 보여 주는 사회경제적 배경을 분석해 보세요.", "'소비는 시대를 비추는 거울'이라는 관점에 동의하는지, 자신의 소비 태도와 함께 말해 보세요."], "guide": "【제시문 분석】 표면은 유행어의 교체지만, 심층은 경제 조건의 변화(저금리·성장기 → 고물가·고금리)가 소비 심리를 바꾼다는 구조입니다. 마지막 문단의 '공통점' 분석(둘 다 합리적 선택)을 놓치지 마세요.\n【답변 구성】 [1] ① 두 흐름의 대비 → ② 배경 분석(경제 조건의 변화) → ③ 공통점 포착(만족 극대화 전략의 변형) [2] ① 관점에 대한 입장 → ② 자기 소비 태도와 근거 → ③ 균형 잡힌 마무리", "a": ["욜로에서 요노로의 변화는 취향의 유행이 바뀐 것이 아니라 경제 환경이 바뀐 결과라고 분석합니다. 욜로가 유행하던 시기는 금리가 낮아 저축의 매력이 적고, 열심히 모아도 집을 사기 어렵다는 좌절이 컸던 때입니다. 미래의 보상이 불확실하니 확실한 현재의 행복에 쓰는 것이 나름의 합리적 선택이었습니다. 반면 고물가와 고금리가 닥치자 생활비 자체가 위협받게 되었고, 이제는 아끼는 것이 곧 생존의 합리성이 되어 요노가 등장했습니다. 흥미로운 것은 제시문의 지적처럼 두 태도의 공통점입니다. 둘 다 '한정된 자원으로 내 만족을 극대화한다'는 같은 원리가, 경제 조건에 따라 정반대의 모습으로 나타난 것입니다. 그래서 저는 이 변화를 세대의 가치관이 바뀌었다기보다, 같은 세대가 달라진 환경에 적응한 결과로 읽고 싶습니다.", "저는 그 관점에 대체로 동의합니다. 개인은 자유롭게 소비하는 것 같지만, 무엇이 유행하고 무엇이 합리적으로 느껴지는지는 시대의 경제 조건이 큰 틀을 정하기 때문입니다. 다만 거울이라는 표현에 하나를 덧붙이고 싶습니다. 소비는 시대를 비추기만 하는 것이 아니라, 시대를 바꾸는 신호이기도 합니다. 예를 들어 중고 거래와 무지출 챌린지가 퍼지면 기업은 과대 포장과 과시형 마케팅을 줄이게 됩니다. 저의 소비 태도는 요노에 가깝습니다. 사고 싶은 것이 생기면 장바구니에 넣고 일주일을 기다렸다가 그래도 필요하면 사는 규칙을 쓰는데, 대부분은 일주일 뒤에 필요 없어집니다. 다만 책이나 배움처럼 저를 성장시키는 지출에는 아끼지 않으려고 합니다. 무조건 아끼는 것이 아니라 무엇에 쓸 가치가 있는지 기준을 갖는 것이 성숙한 소비라고 생각합니다."], "tips": ["유행 현상 분석은 '표면의 유행 → 심층의 구조(경제·기술)'로 내려가는 것이 기본기입니다.", "'정반대 현상의 공통 원리'를 짚는 것은 비교 분석의 고급 기술입니다. 제시문이 힌트를 줬다면 반드시 쓰세요.", "자기 소비 태도는 규칙 하나(장바구니 일주일 등)를 구체적으로 말하면 살아 있는 답변이 됩니다."]}, {"t": "공정무역, 착한 소비의 명암", "ty": "독해·견해", "p": "초콜릿의 원료인 카카오 농가의 상당수는 하루 2달러 미만으로 생활하고, 그 농장에서는 아동 노동도 빈번하다. 초콜릿 한 개 가격에서 카카오 재배 농민에게 돌아가는 몫은 몇 퍼센트에 불과하다. 공정무역은 이런 구조를 바꾸기 위해 중간 상인을 줄이고 생산자에게 최저 가격과 공동체 발전 기금을 보장하는 거래 방식이다. 소비자는 조금 더 비싼 값을 치르고 '공정하게 생산된' 커피와 초콜릿을 선택한다.\n\n그러나 공정무역에도 그늘이 있다는 지적이 있다. 인증 비용이 비싸 정작 가장 가난한 소규모 농가는 인증을 받기 어렵고, 보장된 가격이 오히려 과잉 생산을 부추겨 비인증 농가의 가격을 떨어뜨릴 수 있다는 것이다. 소비자가 지불한 웃돈 중 실제로 농민에게 도달하는 비율이 기대보다 낮다는 연구도 있다. '착한 소비'가 소비자의 죄책감을 덜어 주는 마케팅으로 소비될 뿐, 구조는 그대로라는 냉정한 비판도 나온다.", "q": ["공정무역의 취지와 한계를 정리하고, '착한 소비'는 세상을 바꿀 수 있는지에 대한 자신의 견해를 말해 보세요."], "guide": "【제시문 분석】 1문단은 공정무역의 취지(구조적 불공정의 보정), 2문단은 세 가지 한계(인증의 문턱, 과잉 생산 유발, 전달률)와 근본 비판(구조는 그대로). '선의'와 '효과'를 분리해서 평가하는 것이 관건입니다.\n【답변 구성】 ① 취지 요약 → ② 한계 정리 → ③ 견해: 착한 소비의 가능성과 조건(신호로서의 소비, 제도와의 결합) → ④ 개인 실천의 재정의로 마무리", "a": ["공정무역의 취지는 초콜릿 가격의 극히 일부만 농민에게 돌아가는 불공정한 무역 구조를, 소비자의 선택으로 보정하려는 것입니다. 그러나 제시문은 세 가지 한계를 보여 줍니다. 비싼 인증 비용 때문에 정작 가장 가난한 농가가 배제되는 문턱의 역설, 보장 가격이 과잉 생산을 불러 비인증 농가를 더 어렵게 만드는 풍선효과, 그리고 소비자가 낸 웃돈이 농민에게 온전히 닿지 않는 전달의 비효율입니다.\n\n그럼에도 저는 착한 소비가 세상을 바꿀 수 있다고 생각합니다. 다만 바꾸는 방식에 대한 기대를 수정해야 합니다. 착한 소비의 힘은 내가 낸 웃돈 몇백 원이 농민에게 직접 전달되는 데 있다기보다, 시장에 신호를 보내는 데 있습니다. 공정한 상품을 찾는 소비자가 많다는 것이 데이터로 확인되면, 기업은 공급망 전체를 점검하게 되고 정부와 국제기구는 아동 노동 규제 같은 제도를 만들 명분을 얻습니다. 실제로 소비자 운동이 커진 뒤에 글로벌 기업들이 원료 조달 기준을 바꾼 사례들이 있습니다. 즉 착한 소비는 그 자체로 해결책이라기보다 제도 변화를 끌어내는 지렛대입니다. 그래서 저는 공정무역 상품을 고르는 일과 함께, 그 한계를 알고 더 나은 제도를 요구하는 일까지가 착한 소비의 완성이라고 생각합니다. 지갑으로 투표하되, 투표가 끝이 아니라는 것을 아는 소비자가 세상을 바꾼다고 생각합니다."], "tips": ["'취지와 한계'를 묻는 문제는 양쪽을 공정하게 정리한 뒤에 견해로 넘어가는 순서를 지키세요.", "'직접 효과'와 '신호 효과'의 구분은 개인 실천 관련 논쟁 전반에 쓸 수 있는 강력한 틀입니다.", "'지갑으로 투표한다'는 표현처럼 답변의 마지막을 응축하는 문장을 준비하세요."]}, {"t": "AI 번역 시대, 외국어를 배우는 이유", "ty": "독해·견해", "p": "AI 번역기의 성능이 비약적으로 좋아졌다. 수십 개 언어의 실시간 통역이 이어폰 하나로 가능해졌고, 해외여행과 간단한 업무에서 언어 장벽은 빠르게 낮아지고 있다. '10년 뒤에도 외국어를 힘들여 배울 필요가 있을까'라는
