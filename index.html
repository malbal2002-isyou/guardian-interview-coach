<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="면접 코치">
<meta name="theme-color" content="#1c2160">
<title>가디언어학원 고입 면접 코치 · 휴대폰 · 패드용</title>
<style>
:root{--ac:#1b1f6b;--ac2:#12154d;--soft:#eef1fb;--softl:#c9d1ee;--ink:#1c2230;--ink2:#48505f;--mut:#7b8494;--line:#e3e6ec;--bg:#f5f6f8;--card:#fff;--ok:#157a4a;--okbg:#e8f6ee;--warn:#9a5b00;--warnbg:#fff5df;--navy:#2e75b6;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;font-size:16px;line-height:1.6}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 60px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.top img{height:34px}
.top .tt{font-weight:800;font-size:18px;line-height:1.25}
.top .ts{font-size:12.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:999px;padding:9px 15px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 6px}
.card h3{font-size:15px;margin:14px 0 6px}
.lead{color:var(--ink2);font-size:14px;margin:0 0 10px}
.small{font-size:13px}.mut{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer}
.btn:hover{background:#fafafa}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.pri:hover{background:var(--ac2)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.big{padding:14px 20px;font-size:16.5px;border-radius:12px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
input[type=text],textarea,select{font:inherit;font-size:15px;border:1px solid #d3d8e0;border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:110px;line-height:1.65;resize:vertical}
select{width:auto}
label.fl{display:block;font-size:13.5px;font-weight:700;margin:10px 0 4px}
.qbox{background:var(--soft);border:1px solid var(--softl);border-radius:var(--r);padding:16px 18px}
.qkind{display:inline-block;font-size:12px;font-weight:800;color:var(--ac);background:#fff;border:1px solid var(--softl);border-radius:999px;padding:2px 10px;margin-bottom:6px}
.qtext{font-size:21px;font-weight:800;line-height:1.45;word-break:keep-all}
details{border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fff;margin-top:8px}
details summary{cursor:pointer;font-weight:700;font-size:14px}
details ol,details ul{margin:8px 0 4px;padding-left:20px;font-size:14.5px}
.tpl{background:#f7f8fa;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.75;margin-top:6px}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13.5px}
.okbox{background:var(--okbg);color:var(--ok);border-radius:10px;padding:9px 12px;font-size:13.5px}
.info{background:#eef3fb;color:#23406e;border-radius:10px;padding:9px 12px;font-size:13.5px}
.recbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clock{font-variant-numeric:tabular-nums;font-size:30px;font-weight:800;min-width:92px}
.clock.good{color:var(--ok)}.clock.over{color:#c0392b}
.meter{height:8px;background:#eceef2;border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.meter i{display:block;height:100%;width:0;background:#e0533d;transition:width .08s}
.interim{min-height:22px;color:var(--mut);font-size:14px;margin:6px 0}
.count{position:fixed;inset:0;background:rgba(20,24,34,.72);display:flex;align-items:center;justify-content:center;z-index:50;color:#fff;font-size:120px;font-weight:800;flex-direction:column}
.count small{font-size:18px;font-weight:600;opacity:.9}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stat span{background:#f3f4f7;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;color:var(--ink2)}
.stat span.bad{background:var(--warnbg);color:var(--warn)}.stat span.good{background:var(--okbg);color:var(--ok)}
table.rb{width:100%;border-collapse:collapse;font-size:13.5px}
table.rb th,table.rb td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.rb th{background:#f6f7f9;font-weight:800}
.sc{display:flex;gap:4px}
.sc button{width:34px;height:32px;border:1px solid #d3d8e0;background:#fff;border-radius:8px;font:inherit;font-weight:800;cursor:pointer}
.sc button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.total{font-size:22px;font-weight:800;color:var(--navy)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1c2230;color:#fff;border-radius:12px;padding:11px 18px;font-size:14.5px;font-weight:600;z-index:60;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.hist{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:#fff}
.hist .hq{font-weight:800}
.pre{white-space:pre-wrap;word-break:break-word}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:4px 0 10px 40px}
.steps li:before{content:counter(s);position:absolute;left:0;top:2px;width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.qtext{font-size:19px}.card{padding:14px}}
.print-only{display:none}
@media print{
  body{background:#fff;font-size:12.5px}
  .no-print,.tabs,.toast{display:none!important}
  .print-only{display:block}
  .wrap{max-width:none;padding:0}
  .card{border:none;padding:0;margin:0 0 10px}
  .rep{break-after:page}.rep:last-child{break-after:auto}
  .rq{break-inside:avoid}
}

.passage{background:#fff;border:1px solid var(--softl);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:15.5px;line-height:1.8;max-height:46vh;overflow:auto}
.chartwrap{margin:10px 0}
.chartwrap svg{max-width:100%;height:auto}
@media print{.passage{max-height:none}}

.ansq textarea{width:100%;min-height:150px;margin-top:8px}
.ansblank{display:none}
@media print{
  .pr-written .ans-empty{display:none!important}
  .pr-written .ansblank,.pr-blank .ansprint{display:none!important}
  .pr-blank .ansblank{display:block!important;height:210px;border:1px solid #999;border-radius:6px;margin-top:6px;background:repeating-linear-gradient(#fff,#fff 29px,#ccc 30px)}
  .ansq{border:none!important;border-bottom:1px solid #ccc!important;padding:8px 0!important}
  .ansprint{background:#fff!important;border:1px solid #bbb;font-size:13px;line-height:1.75}
}

/* ───── 휴대폰 · 패드용 ───── */
body.m{-webkit-text-size-adjust:100%}
body.m .wrap{padding:0 12px calc(96px + env(safe-area-inset-bottom))}
body.m .tabs{position:fixed;top:auto;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--softl);display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.06)}
body.m .tabs button{flex:1 0 auto;font-size:12.5px;padding:9px 10px;white-space:nowrap}
body.m textarea,body.m input[type=text],body.m input[type=number],body.m select{font-size:16px}
body.m .btn{min-height:44px}
body.m .btn.sm{min-height:38px}
body.m .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
body.m .chip{flex:0 0 auto;min-height:40px}
body.m .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
body.m .recbar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));z-index:6;background:#fff;border:1px solid var(--softl);border-radius:14px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
body.m .top img{height:30px}
@media(max-width:640px){body.m .btn.big{width:100%}body.m .row{gap:8px}body.m h2{font-size:18px}}
@media print{body.m .wrap{padding:0}}

</style>

<script>var DATA={"common": [{"q": "자기소개를 해보세요.", "short": "자기소개", "intent": "면접의 첫 1분입니다. 면접관은 여기서 들은 키워드로 다음 질문을 정합니다. 속뜻은 \"너의 강점과 진로가 궁금해\"입니다.", "frame": ["진로 한 문장: 어떤 꿈을 가진 사람인가", "핵심 역량 + 대표 활동 1~2개와 내가 맡은 역할", "강점 1~2개 + 그 강점이 드러난 경험(숫자 포함)", "지원 학교에서 하고 싶은 활동과 역할", "비전으로 마무리"], "tpl": "안녕하세요, 지원번호 【번호】번입니다. 저는 【어떤 진로】의 꿈을 가지고 중학교에서 【핵심 역량】을 기르기 위해 노력했습니다. 【활동명】에서 【내가 맡은 역할】을 하며 【역량】을 길렀습니다. 또한 저는 【강점】이 강점입니다. 【강점이 드러난 경험】이 이를 보여 줍니다. 【지원 학교】에 진학하면 【고교 활동】에서 【역할】을 해내고 싶습니다.", "tip": "40초~1분. 여기서 말한 활동이 곧 꼬리질문이 됩니다. 가장 깊이 말할 수 있는 활동을 넣으세요.", "bad": "이름·출신 중학교를 말하는 것(블라인드 위반), 경험 없이 형용사만 나열하는 자기소개"}, {"q": "자신의 장점을 이야기해보세요.", "short": "장점", "intent": "스스로를 근거를 들어 설명할 수 있는지 봅니다. 장점 1개 + 경험 1개가 가장 강합니다.", "frame": ["강점 이름(하나만)", "강점이 드러난 경험 1개: 상황 → 행동 → 결과", "고등학교에서 이 강점을 어떻게 쓸지"], "tpl": "제 강점은 【강점】입니다. 이 강점으로 【활동】을 성공적으로 해낸 경험이 있습니다. 【동기】 때문에 【활동】에 참여했고, 【어려움】이 있었지만 【강점을 쓴 행동】으로 극복했습니다. 고등학교에서도 【강점】을 살려 【활동】에서 제 역할을 해내겠습니다.", "tip": "첫 두 문장에 답이 다 들어가야 합니다. 그 뒤는 경험을 풀기만 하면 됩니다.", "bad": "장점을 3~4개 나열하고 근거가 없는 답변"}, {"q": "자신의 단점과 극복 경험을 이야기해보세요.", "short": "단점과 극복", "intent": "자신을 객관적으로 보는지, 약점을 스스로 고쳐 가는 학생인지 봅니다.", "frame": ["실제 단점(치명적이지 않은 것)", "그 단점 때문에 생긴 일 1개", "보완하려고 한 구체적 행동(방법·기간)", "지금 달라진 점"], "tpl": "저는 【단점】이 단점이었습니다. 【단점 때문에 생긴 일】을 겪은 뒤, 이를 고치려고 【구체적 행동】을 【기간】 동안 실천했습니다. 처음에는 【어려움】이 있었지만 지금은 【달라진 점】이 생겼습니다.", "tip": "단점은 \"극복 중인 과정\"으로 말하면 성장하는 학생으로 보입니다.", "bad": "\"단점이 없습니다\", 치명적 단점(거짓말·무책임) 고백, 극복 과정 없이 단점만 말하기"}, {"q": "자신의 꿈과 꿈을 가지게 된 계기 및 동기를 이야기해보세요.", "short": "꿈과 계기", "intent": "진로가 막연한 희망인지, 경험에서 출발한 목표인지 봅니다.", "frame": ["꿈 + 계기 + 동기를 한 문장으로", "계기: 언제, 어떤 경험(구체적 장면)", "관심을 키운 학습: 무엇을 더 찾아 공부했나", "동기: 왜 그 일을 하고 싶은가(누구를 위해, 무엇을 바꾸려)", "꼭 이루겠다는 다짐"], "tpl": "저는 【계기가 된 경험】을 계기로, 【동기】라는 생각에서 【어떤 ○○】의 꿈을 갖게 되었습니다. 【언제】 【구체적 장면】을 겪으며 【관심】이 생겼고, 이를 더 알고 싶어 【책·탐구·학습】을 했습니다. 그래서 【무엇을 하는】 【직업】이 되고 싶습니다.", "tip": "계기(사건)와 동기(이유)를 구분하세요. \"어릴 때부터 좋아서\"는 계기가 아닙니다.", "bad": "계기가 막연하거나, 동기(왜 하고 싶은가)가 빠진 답변"}, {"q": "고등학교 진학 후 활동 및 학습 계획을 이야기해보세요.", "short": "진학 후 계획", "intent": "학교를 제대로 알아봤는지, 3년을 스스로 설계할 수 있는지 봅니다.", "frame": ["비전 한 문장: 어떤 ○○이 되어 무엇을 하겠다", "고교 3년: 활동 1개(역할·결과) + 학습 1개(단원·주제)", "그 활동을 하려는 이유: 중학교 때의 아쉬움에서 출발", "가장 중요한 계획 1개를 시기·이유·도달 수준까지"], "tpl": "제 꿈은 【어떤】 【진로】가 되어 【비전】을 이루는 것입니다. 이를 위해 【지원 학교】에 진학하면 【학교 프로그램·동아리】에서 【역할】을 맡아 【구체적 활동】을 완성하겠습니다. 중학교 때 【아쉬움】이 있었기 때문입니다. 학습에서는 【과목·단원】을 집중적으로 공부하겠습니다.", "tip": "지원 학교에 실제로 있는 프로그램만 말합니다. 대학 이름은 \"○○학 계열\"로 바꿔 말합니다.", "bad": "프로그램 이름만 나열하고 \"왜·어떻게\"가 없는 계획, \"열심히 하겠습니다\"처럼 시기·행동이 없는 계획"}], "freq": ["○○라는 꿈을 이루기 위해 한 노력과 입학 후 노력할 것을 말해보세요.", "원하는 동아리에 가입하지 못하면 어떻게 할 것인가요?", "학업 스트레스를 어떻게 해결할 것인가요?", "가장 인상 깊게 읽은 책을 소개해보세요.", "심화 문제가 안 풀릴 때 어떻게 해결할 것인가요?", "본인 성격의 장점과 단점을 말해보세요.", "가장 좋아하는 과목의 분야와 그 이유를 말해보세요.", "가장 관심 있는 사회문제 2가지와 해결 방안을 말해보세요.", "인공지능의 위험성과 윤리적 문제를 말해보세요.", "진로 분야에서 가져야 할 중요한 역량 3가지를 우선순위를 들어 말해보세요.", "진로 분야가 미래에 어떻게 변하고 사회에 어떤 변화를 줄지 말해보세요.", "희망하는 성적을 받지 못한다면 어떻게 할 것인가요?", "앞으로의 독서 계획을 말해보세요.", "최근에 본 기사 중 인상 깊은 것 2개와 그 이유를 말해보세요.", "본인이 추구하는 리더십과 이를 적용한 경험을 말해보세요.", "본인의 좌우명과 이를 실천한 경험을 말해보세요.", "취약 과목을 극복한 방법을 말해보세요.", "왜 다른 학교가 아닌 우리 학교에 진학하려 하나요?", "궁극적으로 이루고자 하는 삶의 비전을 말해보세요.", "나만의 공부법을 소개해보세요.", "우리 학교에 대해 아는 것을 모두 말해보세요.", "자신을 나타내는 단어(사자성어) 하나와 그 이유를 말해보세요.", "발표를 준비한다면 어떤 절차로 준비할 것인가요?", "본인을 뽑아야 하는 이유 3가지를 말해보세요.", "중학교 때 진로와 연관하여 어떤 활동을 했나요?", "자신의 진로에서 가장 필요한 역량과, 그 역량을 기른 경험을 말해보세요.", "꿈을 이루기 위한 앞으로의 계획을 말해보세요.", "(외고) 왜 다른 과가 아닌 ○○어과에 지원했나요?"], "insung": [{"q": "룸메이트(짝꿍)와 갈등이 생기면 어떻게 해결하겠어요?", "guide": "답변 구성: ① 갈등을 자연스러운 일로 전제 → ② 해결 순서(감정 가라앉힘→따로 대화→규칙 합의→중재 요청) → ③ 경험 근거 한 줄", "tips": ["기숙사 학교 단골 1순위 질문입니다. '방 교체 요청'을 첫 수로 말하면 회피형으로 읽힙니다.", "'나 전달법'(나는 ~해서 힘들었다)을 실제 문장으로 시연하면 설득력이 커집니다."]}, {"q": "조별 활동에서 원하지 않는 역할을 맡게 되면 어떻게 하겠어요?", "guide": "답변 구성: ① 일단 수용의 원칙과 이유 → ② 단, 조정 시도(강점 어필, 역할 교환 제안) → ③ 맡은 뒤의 태도(그 역할에서 배울 것 찾기)", "tips": ["'참고 하겠다'로 끝나면 수동적, '조정 시도 후 수용 + 의미 발견'까지 가야 능동적입니다.", "원치 않던 역할에서 실제로 얻은 것 한 가지를 준비해 두세요."]}, {"q": "배려를 실천한 사례를 구체적으로 말해 보세요.", "guide": "답변 구성: ① 상대의 필요를 '발견'한 순간 → ② 티 나지 않게 한 행동 → ③ 배려에 대한 자기 정의로 마무리", "tips": ["'힘든 친구를 도와줬다' 수준의 뭉툭한 미담은 변별력이 없습니다. 배려의 '설계'가 드러나는 사례를 고르세요.", "배려에 대한 자기만의 정의 한 문장을 준비하면 마무리가 강해집니다."]}, {"q": "리더십을 발휘한 경험을 구체적으로 말해 보세요.", "guide": "답변 구성: ① 위기·과제 상황 → ② 리더로서의 판단과 행동(듣기→역할 배분→솔선) → ③ 결과 → ④ 자기 리더십의 정의", "tips": ["직책이 없어도 됩니다. '집단이 움직이지 않던 상황을 움직이게 만든 경험'이 곧 리더십 사례입니다.", "'솔선의 장면'(궂은일을 내가 맡음)을 하나 넣으면 진정성이 올라갑니다."]}, {"q": "모둠원이 무임승차를 하면 어떻게 해결하겠어요?", "guide": "답변 구성: ① 단정하지 않고 사정 확인 → ② 역할 재조정(작고 명확한 단위) → ③ 개선 없으면 기록을 근거로 교사 상의 → ④ 예방책", "tips": ["'대화→조정→보고'의 단계와, 마지막의 '구조적 예방'까지 말하면 완성형입니다.", "바로 선생님께 이르는 답과 끝까지 덮는 답 모두 감점 포인트입니다."]}, {"q": "학교 규칙이 자신의 가치관과 맞지 않으면 어떻게 하겠어요?", "guide": "답변 구성: ① 원칙 선언(지키면서 바꾼다) → ② 이유(공동체 질서 + 민주적 절차의 존재) → ③ 구체적 행동 경로(건의→공론화→개정)", "tips": ["'무조건 따른다'도 '어긴다'도 아닌 절차적 해결이 표준 답안입니다.", "실제로 건의해 본 경험이 있다면 한 문장 덧붙이세요. 답변의 급이 달라집니다."]}, {"q": "나눔(봉사)의 가치에 대해 자신의 생각을 말해 보세요.", "guide": "답변 구성: ① 교과서적 정의 대신 자기 경험에서 뽑은 정의 → ② 그 정의가 나온 경험 → ③ 나눔에 대한 오해(일방적 시혜) 교정", "tips": ["'더불어 사는 삶' 같은 교과서 문장 암송은 0점에 가깝습니다. 경험에서 귀납한 정의를 만드세요.", "'나눔의 반대말은 단절'처럼 재정의 한 문장이 기억에 남는 답을 만듭니다."]}, {"q": "학업 스트레스를 어떻게 관리하나요?", "guide": "답변 구성: ① 스트레스의 존재를 솔직히 인정 → ② 자신만의 관리 루틴(구체적) → ③ 스트레스에 대한 관점(신호로 활용)", "tips": ["'긍정적으로 생각한다' 같은 추상 답변 대신, 시연 가능한 루틴 2~3개를 말하세요.", "기숙형 학교는 이 질문으로 '자기 돌봄 능력'을 봅니다. 마지막 문장처럼 연결하면 좋습니다."]}, {"q": "열심히 했는데 원하는 성적(결과)이 나오지 않는다면 어떻게 하겠어요?", "guide": "답변 구성: ① 감정의 인정(실망은 자연스러움) → ② 결과를 '진단 자료'로 전환 → ③ 방법의 수정 경험 → ④ 장기적 관점", "tips": ["'더 열심히 하겠다'는 답은 분석 능력이 없다는 뜻으로 읽힙니다. 방법 수정의 구체 경험이 핵심입니다.", "'실망은 짧게, 분석은 길게' 같은 자기 원칙 문장을 준비하세요."]}, {"q": "자신의 성격의 장점과 단점을 말해 보세요.", "guide": "답변 구성: ① 장점 + 근거 장면 → ② 단점은 장점의 그림자로(같은 성질의 양면) → ③ 보완 행동(현재진행형)", "tips": ["단점을 '너무 완벽주의라서' 식으로 포장하면 역효과입니다. 장점의 그림자로 정직하게 제시하고 보완 장치로 마무리하세요.", "보완 행동은 과거형(고쳤다)보다 현재진행형(하고 있다)이 신뢰를 줍니다."]}, {"q": "자신을 나타내는 단어(사자성어) 하나와 그 이유를 말해 보세요.", "guide": "답변 구성: ① 단어 선언 → ② 그 단어를 증명하는 경험 1개 → ③ 그 단어의 '아직 부족한 부분'까지 → ④ 학교생활 연결", "tips": ["단어 선택보다 '경험 근거 + 그 단어의 한계 인식'이 답의 수준을 가릅니다.", "사자성어가 부담스러우면 일상어(축적형, 질문형)도 좋습니다. 정확한 뜻풀이가 우선입니다."]}, {"q": "친구들과 의견이 다를 때, 자신의 의견을 관철한 경험과 양보한 경험 중 하나를 말해 보세요.", "guide": "답변 구성: ① 상황과 쟁점 → ② 판단 기준(무엇이 팀에 더 나은가) → ③ 관철/양보의 과정(방식이 핵심) → ④ 결과와 배움", "tips": ["관철 경험보다 '기준을 세워 승복한 경험'이 오히려 성숙함을 보여 주는 경우가 많습니다.", "양보 후의 기여(상대 안을 보완)까지 말하면 뒤끝 없는 협력자로 읽힙니다."]}], "seoryu": [{"sec": "자율활동", "q": "학급(학생회) 임원으로서 가장 어려웠던 순간과 그것을 해결한 과정을 말해 보세요.", "point": "직책 자랑이 아니라 '갈등 상황 → 나의 판단 기준 → 행동 → 결과와 배움'의 문제 해결 서사를 요구하는 질문. 갈등의 상대를 악역으로 만들지 않는 서술이 중요.", "frame": "임기 중 가장 어려웠던 것은 ○○ 상황이었습니다. 양쪽 모두 일리가 있어서 저는 (판단 기준)을 기준으로 삼았고, 먼저 (경청/조사 행동)을 한 뒤 (구체적 조치)를 실행했습니다. 결과적으로 (변화)가 있었고, 이 경험으로 리더십은 결정하는 힘이 아니라 결정 전에 듣는 힘이라는 것을 배웠습니다.", "follow": ["그 결정에 반대하는 친구는 어떻게 설득했나요?", "다시 그 상황으로 돌아간다면 무엇을 다르게 하겠어요?"]}, {"sec": "자율활동", "q": "학급 활동 중 자신이 '직책 없이' 공동체에 기여한 일을 구체적으로 말해 보세요.", "point": "임원 경력이 없는 학생에게 특히 중요한 질문. 자발성(시킨 사람이 없음)과 지속성(일회성 아님)이 핵심 평가 요소. 사소한 일일수록 진정성이 살아남.", "frame": "저는 (발견한 문제)를 보고 (직접 한 행동)을 했습니다. 시킨 사람은 없었지만 (이유) 때문에 시작했고, (기간) 동안 계속했습니다. 눈에 띄는 일은 아니었지만 (작은 변화)가 생겼고, 공동체에 대한 기여는 직책이 아니라 눈에 밟히는 것을 지나치지 않는 데서 시작한다고 생각하게 되었습니다.", "follow": ["그 일을 아무도 알아주지 않았다면 계속했을까요?", "그 기여가 학급에 남긴 변화는 무엇인가요?"]}, {"sec": "자율활동", "q": "학교 행사(축제·체육대회·캠페인)에서 맡은 역할과, 계획대로 되지 않았던 부분을 어떻게 수습했는지 말해 보세요.", "point": "성공담이 아니라 '돌발 상황 대응력'을 보는 질문. 완벽했다는 답변은 오히려 감점. 문제 발생 → 즉석 판단 → 역할 재분배 → 사후 복기의 흐름이 정석.", "frame": "저는 ○○ 행사에서 (역할)을 맡았는데, 당일 (돌발 상황)이 생겼습니다. 당황했지만 우선순위를 (기준)으로 정해 (즉석 대응)을 했고, 친구들과 (역할 조정)으로 상황을 넘겼습니다. 끝난 뒤 (원인)을 복기해 보니 (교훈)을 얻었고, 그다음 행사에서는 (개선 행동)으로 같은 문제를 예방했습니다.", "follow": ["그 문제를 미리 막을 수는 없었을까요?", "함께한 친구들과 의견이 갈렸을 때는 어떻게 했나요?"]}, {"sec": "자율활동", "q": "자율활동 중 스스로 제안해서 시작된 활동이 있나요? 제안부터 실행까지의 과정을 말해 보세요.", "point": "주도성의 최고 증거는 '내 제안으로 생긴 것'. 제안의 계기(문제의식) → 설득 과정 → 실행의 장애물 → 결과의 순서로. 제안이 거절·수정된 경험도 좋은 소재.", "frame": "저는 (문제의식)을 느껴 (제안 내용)을 학급회의/선생님께 제안했습니다. 처음에는 (우려·반대)가 있었지만 (설득 근거·시범 운영)으로 동의를 얻었고, 실행 과정에서 (어려움)을 (해결 방법)으로 넘겼습니다. 이 경험으로 아이디어의 가치는 제안이 아니라 실행에서 증명된다는 것을 배웠습니다.", "follow": ["제안이 받아들여지지 않았다면 어떻게 했을까요?", "그 활동은 지금도 이어지고 있나요?"]}, {"sec": "자율활동", "q": "공동체 규칙과 개인의 자유가 부딪혔던 학급의 사례와, 그때 자신의 입장을 말해 보세요.", "point": "가치 판단과 공동체 감각을 동시에 보는 질문. 규칙 무조건 옹호도, 자유 무조건 옹호도 아닌 '절차를 통한 조정'의 태도가 핵심.", "frame": "저희 반에서 (규칙 관련 갈등)이 있었습니다. 저는 (입장)이었는데, 그 이유는 (규칙의 취지/자유의 가치) 때문이었습니다. 다만 반대편의 (타당한 지점)도 인정해서, 학급회의에서 (절충안)을 제안했습니다. 이 경험으로 규칙은 지키는 것 못지않게 함께 고쳐 가는 것이 중요하다고 배웠습니다.", "follow": ["소수 의견이 옳다고 생각될 때는 어떻게 해야 할까요?", "그 규칙은 결국 어떻게 되었나요?"]}, {"sec": "자율활동", "q": "우리 학교(지원 학교)의 자치 활동에 참여하게 된다면, 중학교 경험을 어떻게 발전시키고 싶나요?", "point": "과거 경험을 지원 학교의 구체적 프로그램과 연결하는 질문. 지원 학교의 자치기구·행사 이름을 하나라도 알고 있으면 강력한 차별화.", "frame": "중학교에서 (경험)을 통해 (배운 것)을 얻었습니다. ○○고의 (구체적 자치기구/프로그램)에 참여해서, 중학교 때 아쉬웠던 (한계)를 (발전 방향)으로 발전시키고 싶습니다. 특히 (학교 특색)과 연결해 (구체적 목표)에 기여하고 싶습니다.", "follow": ["우리 학교 학생회(자치기구)에 대해 알아본 것이 있나요?", "고등학교 자치는 중학교와 무엇이 달라야 한다고 생각하나요?"]}, {"sec": "동아리활동", "q": "동아리에서 한 활동(실험·탐구·프로젝트) 중 하나를 골라, 그 원리나 핵심 개념을 지금 설명해 보세요.", "point": "생기부 검증의 핵심 질문. 활동명을 아는 것과 내용을 아는 것은 다름. 개념을 중학생 눈높이의 자기 언어로 설명할 수 있어야 진짜 경험으로 인정받음.", "frame": "저는 (활동)에서 (핵심 개념)을 다뤘습니다. 이 개념을 쉽게 설명하면 (자기 언어의 설명)입니다. 실험에서는 (조건·과정)으로 진행했고, (결과)를 얻었습니다. 특히 (예상과 달랐던 점/어려웠던 점)이 있었는데, (원인 분석)을 통해 (추가로 알게 된 것)까지 배웠습니다.", "follow": ["그 실험에서 변수를 어떻게 통제했나요?", "예상과 다른 결과가 나왔다면 원인이 무엇이었을까요?"]}, {"sec": "동아리활동", "q": "동아리 활동 중 부원들과 의견이 달랐던 순간과 조율 과정을 말해 보세요.", "point": "협업 검증 질문. 내 의견의 관철이 아니라 '팀의 결과물'을 위한 조정 능력이 평가 대상. 자기 의견이 틀렸음을 인정한 경험은 오히려 최고의 소재.", "frame": "(활동)에서 (쟁점)을 두고 저는 A안, 친구는 B안이었습니다. 저희는 말싸움 대신 (검증 방법: 작게 시험, 기준 합의, 자료 확인)으로 판단하기로 했고, 결과적으로 (결론)이 되었습니다. 제 의견이 (채택/기각)되었지만, 기준을 세워 결정하면 진 사람이 없다는 것을 배웠습니다.", "follow": ["자신의 의견이 채택되지 않았을 때 어떻게 행동했나요?", "조율에 실패한 경험은 없나요?"]}, {"sec": "동아리활동", "q": "원하는 동아리에 들어가지 못했거나, 동아리 활동이 기대와 달랐던 경험이 있나요? 어떻게 대처했나요?", "point": "좌절 대응과 적응력을 보는 질문. '그래도 최선을 다했다'는 뭉툭한 답 대신, 주어진 환경에서 의미를 만들어 낸 구체적 행동이 필요. 자율동아리 개설 경험이 있다면 최고의 답.", "frame": "저는 (상황: 탈락/기대와 다름)을 겪었습니다. 처음에는 실망했지만, (전환의 계기)를 통해 (대신 한 행동: 다른 동아리에서 접점 찾기, 자율동아리 개설, 개인 탐구)를 했습니다. 돌아보면 이 경험은 (얻은 것)을 주었고, 환경이 계획과 다를 때 계획을 다시 세우는 힘을 길러 주었습니다.", "follow": ["고등학교에서 원하는 동아리가 없다면 어떻게 하겠어요?", "그 경험이 오히려 도움이 된 부분이 있나요?"]}, {"sec": "동아리활동", "q": "동아리 활동이 교과 공부나 진로와 연결된 지점을 구체적으로 말해 보세요.", "point": "활동의 확장성 질문. 동아리(경험)→교과(개념)→독서·탐구(심화)→진로(방향)의 연결 고리를 스스로 그릴 수 있는지 확인. 연결이 억지스럽지 않아야 함.", "frame": "(동아리 활동)을 하면서 (교과 개념)이 실제로 쓰이는 것을 경험했습니다. 궁금해져서 (책/자료)을 찾아봤고, (알게 된 것)을 배웠습니다. 이 과정에서 (진로 분야)에 대한 관심이 구체화되었고, 고등학교에서는 (과목·활동 계획)으로 이 흐름을 이어 가고 싶습니다.", "follow": ["그 연결을 위해 추가로 찾아본 자료나 책이 있나요?", "고등학교에서는 이것을 어떻게 심화하고 싶나요?"]}, {"sec": "동아리활동", "q": "동아리에서 후배나 새 부원에게 무언가를 가르쳐 본 경험이 있나요? 가르치면서 배운 것은 무엇인가요?", "point": "지식의 내면화와 이타성을 함께 보는 질문. '가르치려니 내가 제대로 몰랐다는 걸 알았다'는 메타 인지 경험이 최고의 답변 재료.", "frame": "저는 (상황)에서 후배에게 (내용)을 가르쳤습니다. 제가 안다고 생각했던 것을 설명하려니 막히는 부분이 있어서, (다시 공부/비유 개발)를 했습니다. 후배가 (이해의 순간)을 보였을 때 큰 보람을 느꼈고, 가르치는 것이 가장 깊은 배움이라는 것과, 아는 것과 설명할 수 있는 것은 다르다는 것을 배웠습니다.", "follow": ["설명해도 이해하지 못하는 후배가 있다면 어떻게 하겠어요?", "가르치는 것과 배우는 것 중 어느 쪽이 더 어렵던가요?"]}, {"sec": "동아리활동", "q": "동아리 발표(전시·대회 준비) 경험에서, 청중이나 심사자에게 전달이 잘 되도록 특별히 고민한 부분은 무엇인가요?", "point": "결과물이 아니라 '전달의 설계'를 묻는 질문. 청중 분석 → 구성 전략 → 리허설·수정의 과정이 드러나야 함. 받았던 질문을 기억하는지가 진위 검증 포인트.", "frame": "(발표)에서 저는 청중이 (특징)이라는 점을 고려해 (전달 전략: 비유, 시연, 시각 자료)를 준비했습니다. 리허설에서 (문제)를 발견해 (수정)했고, 발표 후 (질문)을 받았는데 (대응)했습니다. 이 경험으로 좋은 발표는 내가 아는 것을 말하는 것이 아니라 상대가 알아듣게 설계하는 것임을 배웠습니다.", "follow": ["발표에서 받은 가장 날카로운 질문은 무엇이었나요?", "다시 발표한다면 무엇을 바꾸겠어요?"]}, {"sec": "진로활동", "q": "지금의 진로 희망을 갖게 된 결정적 계기를 구체적으로 말해 보세요.", "point": "'어릴 때부터 꿈이었다'는 답은 검증 불가로 감점. 구체적 장면(사건·책·사람)과, 그 이후의 검증 활동(찾아보고 해 본 것)이 진정성의 증거.", "frame": "제 진로의 계기는 (구체적 장면)이었습니다. 그때 (느낀 것·질문)이 생겼고, 막연한 동경인지 확인하고 싶어서 (검증 활동: 책, 탐방, 관련 활동)을 해 봤습니다. 그 과정에서 (현실적 어려움)도 알게 됐지만, (그럼에도 끌리는 이유) 때문에 이 길을 구체화하게 되었습니다.", "follow": ["그 계기 이후에 스스로 확인해 본 활동이 있나요?", "그 직업의 힘든 점도 알아봤나요? 그래도 하고 싶은 이유는요?"]}, {"sec": "진로활동", "q": "진로 희망이 중간에 바뀌었다면(또는 아직 확정되지 않았다면), 그 과정을 솔직하게 말해 보세요.", "point": "진로 변경은 감점 요소가 아니라 탐색의 증거. '변덕'이 아니라 '탐색→발견→조정'의 서사로 재구성. 미확정이라면 방향성(분야·가치)과 탐색 계획으로 답변.", "frame": "처음에는 (이전 꿈)을 희망했지만, (경험·계기)를 통해 제가 진짜 좋아하는 것이 (본질적 관심)이라는 것을 알게 되었습니다. 그래서 지금은 (현재 방향)으로 조정했습니다. 이전 꿈에서 배운 (유효한 자산)은 지금도 이어지고 있고, 진로는 한 번의 결정이 아니라 계속되는 탐색이라고 생각합니다.", "follow": ["바뀌기 전의 꿈에서 얻은 것 중 지금도 유효한 것이 있나요?", "진로가 미확정인 상태로 고교 생활을 어떻게 설계하겠어요?"]}, {"sec": "진로활동", "q": "진로와 관련해 스스로 찾아서 한 탐구나 체험 중 가장 기억에 남는 것을 말해 보세요.", "point": "자기주도성의 직접 증거를 묻는 질문. '학교에서 시켜서 한 것'과 구분되는, 스스로 설계한 탐구가 필요. 과정의 구체성(자료, 방법, 시행착오)이 진위를 가름.", "frame": "저는 (궁금증)이 생겨 (탐구 주제)를 스스로 정하고, (방법: 자료 조사, 실험, 인터뷰)으로 탐구했습니다. 과정에서 (시행착오)가 있었고 (해결)했습니다. 결과를 (정리·발표 형태)로 만들었는데, 이 경험으로 (진로 관련 깨달음)과 함께 스스로 질문을 세우고 답을 찾는 방법을 배웠습니다.", "follow": ["그 탐구에서 사용한 자료의 출처는 어디였나요?", "탐구 결과를 어딘가에 발표하거나 활용했나요?"]}, {"sec": "진로활동", "q": "희망 진로 분야가 10년 뒤 어떻게 변할 것 같나요? 그 변화에 자신은 어떻게 대비하겠어요?", "point": "진로에 대한 시야의 크기를 보는 질문. 직업의 '이름'이 아니라 그 직업이 해결하는 '문제'에 초점을 두면 변화 대응 논리가 자연스러워짐.", "frame": "(분야)는 10년 뒤 (예상 변화: 기술·사회 요인)로 크게 달라질 것입니다. 하지만 이 직업의 본질이 (해결하는 문제)라면, 도구가 바뀌어도 그 역할은 남는다고 생각합니다. 저는 (대비: 기초 역량, 융합 학습)으로 준비하고, 변화를 위협이 아니라 (기회로 삼는 방향)으로 활용하고 싶습니다.", "follow": ["AI가 그 직업을 대체할 수 있다는 전망에 대해서는 어떻게 생각하나요?", "그 분야의 최근 이슈 중 아는 것을 말해 보세요."]}, {"sec": "진로활동", "q": "우리 학교가 지원자의 진로에 왜 필요한가요? 다른 학교가 아닌 이 학교여야 하는 이유를 말해 보세요.", "point": "지원 동기의 핵심 검증. 학교의 실제 프로그램(교육과정, 전공어, 특색 활동)과 자신의 진로를 구체적으로 연결해야 함. 홈페이지 수준의 정보라도 정확하게.", "frame": "제 진로인 (분야)에는 (필요 역량)이 필수인데, ○○고의 (구체적 프로그램·교육과정)이 바로 그것을 기를 수 있는 환경입니다. 저는 1학년 때 (계획), 2~3학년 때 (심화 계획)으로 3년을 설계했습니다. 이 학교의 (특색)은 제가 (활동 경험)에서 확인한 저의 (강점·관심)과 맞닿아 있다고 생각합니다.", "follow": ["우리 학교의 교육과정 중 구체적으로 아는 것이 있나요?", "입학 후 3년의 학업 계획을 간단히 말해 보세요."]}, {"sec": "진로활동", "q": "진로를 이루는 것과 별개로, 어떤 '사람'이 되고 싶은지 말해 보세요.", "point": "직업 목표 너머의 가치관을 보는 질문. 직업(무엇)과 삶의 태도(어떻게)를 구분해 답하면 성숙함이 드러남. 추상어(선한 영향력)는 반드시 구체적 실천과 함께.", "frame": "직업으로는 (진로)를 꿈꾸지만, 그보다 (가치: 예-끝까지 듣는 사람, 약속을 지키는 사람)이 되고 싶습니다. (계기)를 통해 이 가치의 중요성을 배웠고, 지금은 (작은 실천)을 하고 있습니다. 어떤 일을 하든 (가치)를 지키는 사람이라면, 직업이 바뀌어도 좋은 삶을 살 수 있다고 생각합니다.", "follow": ["그런 사람이 되기 위해 지금 실천하는 것이 있나요?", "존경하는 인물이 있다면 그 이유와 함께 말해 보세요."]}, {"sec": "세특(교과)", "q": "생기부에 적힌 ○○ 탐구(발표)에서 다룬 핵심 개념을 지금 설명해 볼 수 있나요?", "point": "세특 검증의 대표 질문. 발표 제목만 기억하면 탈락, 개념을 자기 언어와 새로운 예시로 설명하면 통과. 준비법: 자기 세특의 모든 개념을 '3문장 설명+새 예시 1개'로 정리.", "frame": "제가 다룬 (개념)은 한마디로 (한 줄 정의)입니다. 좀 더 설명하면 (원리 2~3문장)입니다. 수업에서는 (다룬 예시)로 배웠지만, 실생활에서는 (새로운 예시)에서도 같은 원리를 볼 수 있습니다. 탐구하면서 (남은 궁금증)이 생겼는데, 고등학교 (과목)에서 이어서 공부하고 싶습니다.", "follow": ["그 개념이 실생활에 적용되는 다른 예를 들어 보세요.", "그 주제에서 아직 해결하지 못한 궁금증이 있나요?"]}, {"sec": "세특(교과)", "q": "가장 좋아하는 과목과 그 이유를, 구체적인 단원이나 개념을 들어 말해 보세요.", "point": "'재미있어서'는 0점 답변. 특정 개념을 만났을 때의 지적 쾌감(연결되는 순간, 설명되는 순간)을 구체적으로 재현해야 함.", "frame": "저는 (과목)을 가장 좋아합니다. 특히 (구체적 단원·개념)을 배울 때 (지적 경험: 흩어진 것이 연결되는 순간)을 느꼈습니다. 예를 들어 (구체 사례)를 그 개념으로 설명할 수 있다는 것이 놀라웠습니다. 이 과목이 좋은 진짜 이유는 (본질: 세상을 보는 새로운 눈) 때문이고, 이것은 제 진로 (연결점)와도 이어집니다.", "follow": ["그 과목에서 가장 어려웠던 단원은 어떻게 극복했나요?", "좋아하는 과목과 진로가 다르다면 그 관계를 어떻게 설명하겠어요?"]}, {"sec": "세특(교과)", "q": "수업 시간에 배운 내용에 의문을 갖고 더 파고들어 본 경험을 말해 보세요.", "point": "수동적 수강생과 능동적 학습자를 가르는 질문. 의문의 발생 → 스스로의 탐색(책·자료·질문) → 잠정적 답 또는 더 깊은 질문의 구조. '아직 못 찾은 답'도 훌륭한 결말.", "frame": "(과목) 수업에서 (배운 내용)을 듣다가 '(의문)'이라는 질문이 생겼습니다. 교과서에는 답이 없어서 (탐색 행동)을 해 봤고, (알게 된 것)까지는 이해했지만 (남은 질문)은 아직 열려 있습니다. 이 경험으로 좋은 공부는 답을 외우는 것이 아니라 질문을 키우는 것임을 배웠습니다.", "follow": ["그 의문에 대한 답은 결국 찾았나요?", "선생님이나 친구에게 질문했을 때 어떤 반응이었나요?"]}, {"sec": "세특(교과)", "q": "취약했던 과목이나 단원을 극복한 자신만의 과정을 말해 보세요.", "point": "자기주도학습 전형의 핵심 질문. 노력의 양('열심히')이 아니라 방법의 전환(원인 진단→방법 수정→검증)이 답변의 뼈대여야 함.", "frame": "저는 (과목·단원)이 약했는데, 단순히 문제를 더 푸는 것으로는 나아지지 않았습니다. 원인을 분석해 보니 (진짜 원인: 개념 구멍, 복습 방식)이었고, (바꾼 방법)으로 전환했습니다. (기간) 동안 (과정)을 지속하자 (변화)가 나타났고, 이 경험은 (다른 과목·상황)에도 적용하는 저의 공부 원칙이 되었습니다.", "follow": ["그 방법이 다른 과목에도 통했나요?", "성적이 바로 오르지 않았을 때 어떻게 버텼나요?"]}, {"sec": "세특(교과)", "q": "교과 내용을 다른 과목이나 실생활과 연결해 본 경험이 있나요?", "point": "융합적 사고의 증거를 묻는 질문. 과목 A의 개념으로 과목 B의 현상을 설명한 경험, 뉴스·일상을 교과 개념으로 해석한 경험이 좋은 재료.", "frame": "(과목 A)에서 배운 (개념)이 (과목 B/실생활)의 (현상)과 연결된다는 것을 발견했습니다. 예를 들어 (구체적 연결 설명)입니다. 이 발견이 재미있어서 (정리·발표 행동)까지 해 봤습니다. 지식이 과목의 칸막이를 넘을 때 진짜 이해가 시작된다고 생각하게 되었고, 고등학교에서도 (융합 학습 계획)을 하고 싶습니다.", "follow": ["그 연결을 발표나 글로 정리해 본 적이 있나요?", "연결적 사고가 왜 중요하다고 생각하나요?"]}, {"sec": "세특(교과)", "q": "자신의 공부법 중 남에게 추천할 만한 것 하나와, 그 방법을 만들게 된 시행착오를 말해 보세요.", "point": "공부법 자체보다 '방법을 만들어 온 과정'(메타 인지)이 평가 대상. 실패한 방법 → 원인 분석 → 개선의 서사가 필수. 단점을 아는 것이 진짜 이해의 증거.", "frame": "제가 추천할 방법은 (공부법)입니다. 처음에는 (실패했던 방법)을 썼는데 (문제)가 있었고, 원인을 (분석)한 뒤 지금의 방법으로 바꿨습니다. 이 방법의 장점은 (효과)이지만, (한계·맞지 않는 경우)도 있다고 생각합니다. 고등학교의 늘어난 학습량에 맞게 (발전 방향)으로 조정할 계획입니다.", "follow": ["그 방법의 단점이나 맞지 않는 사람도 있을까요?", "고등학교에서는 그 방법을 어떻게 발전시키겠어요?"]}, {"sec": "행동특성·종합의견", "q": "선생님들이 지원자를 어떤 학생으로 기억할 것 같나요? 그렇게 생각하는 근거를 말해 보세요.", "point": "자기 객관화 질문. 생기부 행특 키워드와 일치하는 자기 인식 + 구체적 근거 장면이 필요. 겸손을 가장한 회피('잘 모르겠다')도, 근거 없는 자화자찬도 감점.", "frame": "선생님들은 저를 (키워드: 예-꾸준한 학생)으로 기억하실 것 같습니다. (근거 장면: 반복적으로 보여 준 행동)이 있었기 때문입니다. 다만 저 스스로는 (보완점)도 알고 있어서, (개선 노력)을 하고 있습니다. 남이 보는 저와 제가 아는 저를 함께 말씀드리는 것이 정직한 답이라고 생각합니다.", "follow": ["그 평가와 스스로의 평가가 다른 부분이 있나요?", "반대로, 고치고 싶은 모습으로 기억되는 부분은요?"]}, {"sec": "행동특성·종합의견", "q": "자신의 성격에서 가장 큰 강점과, 그것이 오히려 단점이 된 순간을 말해 보세요.", "point": "강점·단점을 따로 묻는 구식 질문의 진화형. 같은 특성의 양면(신중함↔결정 지연, 추진력↔독주)을 아는 것이 자기 이해의 깊이. 보완 행동은 현재진행형으로.", "frame": "저의 강점은 (특성)입니다. (강점이 발휘된 장면)이 있었습니다. 그런데 같은 특성이 (상황)에서는 (단점의 모습)으로 나타났습니다. 그 뒤로 저는 (보완 장치: 마감 정하기, 의견 먼저 묻기)를 실천하고 있습니다. 강점과 단점은 다른 것이 아니라 같은 성질의 두 얼굴이라서, 상황에 맞게 조절하는 것이 성장이라고 생각합니다.", "follow": ["그 단점을 보완하기 위해 실제로 하는 행동이 있나요?", "친구들은 지원자의 어떤 점을 좋아하나요?"]}, {"sec": "행동특성·종합의견", "q": "3년 동안 꾸준히 지속한 것이 있나요? 그것을 지속하게 한 힘은 무엇이었나요?", "point": "성실성의 검증. 화려한 활동보다 '지속' 자체가 증거. 지속의 동력(재미, 작은 성취, 기록, 함께하는 사람)을 분석적으로 말하면 자기 이해까지 증명됨.", "frame": "저는 (활동·습관)을 (기간) 동안 지속했습니다. 고비는 (시점·이유)였는데, (넘긴 방법)으로 이어 갔습니다. 지속의 힘은 의지보다 (구조: 작은 목표, 기록, 동료)에 있었다고 생각합니다. 이 경험으로 저는 꾸준함도 기술이라는 것을 배웠고, 고등학교에서는 (적용 계획)에 이 기술을 쓰려고 합니다.", "follow": ["그만두고 싶었던 고비는 언제였고 어떻게 넘겼나요?", "그 꾸준함을 고등학교에서는 무엇에 쓰고 싶나요?"]}, {"sec": "행동특성·종합의견", "q": "친구들과의 관계에서 자신이 주로 맡는 역할은 무엇인가요? 구체적 일화와 함께 말해 보세요.", "point": "공동체 속 자기 위치의 인식을 보는 질문. 리더형만 정답이 아님. 조정자, 분위기 메이커, 경청자, 마무리 담당 등 자기 역할의 가치를 논리적으로 설명하는 것이 핵심.", "frame": "저는 무리에서 주로 (역할)을 맡습니다. 예를 들어 (구체적 일화)가 있었습니다. 이 역할이 중요한 이유는 (팀에 주는 가치) 때문입니다. 물론 (부담·한계)도 있었지만 (대처)로 조절했습니다. 눈에 띄는 역할이 아니어도 팀에는 저마다의 자리가 있다는 것을 알기에, 제 역할에 자부심을 갖고 있습니다.", "follow": ["그 역할이 부담스러웠던 적은 없나요?", "반대 성향의 친구와는 어떻게 지내나요?"]}, {"sec": "행동특성·종합의견", "q": "최근 1년 사이 자신이 가장 크게 달라진 점은 무엇인가요?", "point": "성장 가능성을 보는 질문. 변화 전의 모습을 솔직히 인정하는 것이 출발점. '사건→깨달음→행동의 변화→유지'의 구조가 설득력을 만듦.", "frame": "1년 전의 저는 (이전 모습)이었습니다. 그런데 (계기)를 겪으면서 (깨달음)을 얻었고, (구체적으로 바뀐 행동)이 달라졌습니다. 처음에는 어색했지만 지금은 (변화의 정착 증거)까지 왔습니다. 이 변화가 저에게 소중한 이유는, 제가 마음먹으면 달라질 수 있는 사람이라는 증거이기 때문입니다.", "follow": ["그 변화를 주변 사람들도 느끼나요?", "변화의 계기가 된 사건이나 사람이 있나요?"]}, {"sec": "독서활동", "q": "가장 인상 깊게 읽은 책의 핵심 내용을 한두 문장으로 요약하고, 자신에게 남긴 질문을 말해 보세요.", "point": "독서 검증의 표준 질문. 줄거리 나열은 하수, 핵심의 압축 + 비판적 독해(동의하지 않는 지점) + 자기 질문이 상수. '책이 나에게 낸 숙제'를 말할 수 있어야 함.", "frame": "(책)의 핵심은 한마디로 (압축 요약)입니다. 저에게 가장 남은 것은 (인상 깊은 지점)이었고, 읽고 나서 '(자기 질문)'이라는 질문이 생겼습니다. 다만 (동의하기 어려운 부분)에는 의문이 들어 (자기 생각)이라고 생각했습니다. 이 책은 저에게 (변화·영향)을 남겼습니다.", "follow": ["그 책에서 동의하기 어려웠던 부분은 없었나요?", "그 책을 친구에게 추천한다면 뭐라고 소개하겠어요?"]}, {"sec": "독서활동", "q": "생기부의 독서 목록에서 자신의 진로·관심사와 연결되는 책 하나를 골라, 그 연결을 설명해 보세요.", "point": "독서의 확장성 질문. 책→생각의 변화→행동(탐구·활동)→다음 독서의 연쇄가 보이면 최상급. 진로와의 연결은 억지 없이, 관심의 자연스러운 흐름으로.", "frame": "(책)은 제 관심사인 (분야)와 (연결 지점)에서 만납니다. 이 책에서 (배운 관점)을 얻었고, 궁금해져서 (후속 행동: 탐구, 관련 책, 활동)으로 이어 갔습니다. 이 연쇄를 통해 (심화된 이해)에 도달했고, 독서가 진로 탐색의 가장 확실한 도구라는 것을 경험했습니다.", "follow": ["그 책을 읽고 실제로 해 본 활동이 있나요?", "같은 주제로 더 읽어 본 책이 있나요?"]}, {"sec": "독서활동", "q": "읽기 전과 후로 생각이 바뀐 책이 있나요? 무엇이 어떻게 바뀌었는지 말해 보세요.", "point": "독서의 영향력을 검증하는 질문. Before(이전의 생각)를 구체적으로 인정해야 After가 빛남. 꼬리질문(한 권으로 바뀌는 위험)에는 '바뀐 것은 결론이 아니라 질문'이라는 방어가 유효.", "frame": "(책)을 읽기 전 저는 (이전 생각)이라고 여겼습니다. 그런데 책의 (논거·장면)을 만나면서 (바뀐 생각)으로 달라졌습니다. 이후 (행동의 변화)까지 이어졌습니다. 물론 한 권의 책이 정답은 아니라고 생각해서, (반대 관점의 책·자료)도 찾아보며 균형을 잡으려고 했습니다.", "follow": ["그 바뀐 생각을 행동으로 옮긴 것이 있나요?", "책 한 권으로 생각이 바뀌는 것은 위험할 수도 있지 않을까요?"]}, {"sec": "독서활동", "q": "어렵거나 지루해서 중간에 멈춘 책이 있나요? 그 경험을 어떻게 처리했나요?", "point": "정직성과 독서 태도를 함께 보는 함정형 질문. '없다'는 답은 신뢰를 깎음. 멈춘 이유의 분석 + 재도전 또는 우회(쉬운 책부터) 전략이 좋은 답.", "frame": "솔직히 (책)은 (이유: 배경지식 부족, 추상적 문체)로 중간에 멈췄습니다. 다만 포기로 끝내지 않고 (대처: 입문서 먼저, 강연 영상, 일부만 정독)를 했고, (재도전 결과 또는 계획)입니다. 이 경험으로 독서에도 수준과 순서가 있다는 것, 못 읽는 책은 아직 못 읽는 책일 뿐이라는 것을 배웠습니다.", "follow": ["다시 도전한 책이 있나요?", "자신의 독서 수준을 어떻게 평가하나요?"]}, {"sec": "독서활동", "q": "앞으로의 독서 계획을 말해 보세요. 어떤 책을, 왜, 어떻게 읽을 계획인가요?", "point": "막연한 다독 선언은 무의미. 주제의 계열성(관심 분야의 단계적 심화) + 현실적인 방법(시간 확보 전략)이 있어야 계획으로 인정받음.", "frame": "저는 (관심 주제)를 중심으로 (단계: 입문서→고전→반대 관점)의 순서로 읽어 갈 계획입니다. 다음 책으로는 (구체적 책 또는 유형)을 정해 두었습니다. 시간은 (현실적 방법: 자투리 시간, 주말 고정)으로 확보하려 합니다. 양보다 '한 권을 통과시키는 깊이'를 목표로 하고, 읽은 것은 (기록 방법)으로 남기려고 합니다.", "follow": ["고등학교의 바쁜 일정에서 독서 시간을 어떻게 확보하겠어요?", "독서가 성적에 도움이 된다고 생각하나요?"]}, {"sec": "봉사활동", "q": "봉사활동 중 가장 기억에 남는 순간과, 그때 느낀 것을 솔직하게 말해 보세요.", "point": "미담 제조가 아니라 정서적 진실성을 보는 질문. '뿌듯했다'는 상투어 대신 구체적 장면과 복합적 감정(어색함, 놀라움, 부끄러움 포함)이 진짜의 증거.", "frame": "가장 기억에 남는 것은 (구체적 장면)입니다. 솔직히 처음에는 (솔직한 초기 감정: 어색함, 의무감)이었는데, (전환의 순간)을 겪으며 (달라진 마음)이 되었습니다. 특히 (봉사 대상에게 배운 것)은 예상하지 못한 배움이었습니다. 봉사는 주는 일인 줄 알았는데, 받는 것이 더 많은 일이었습니다.", "follow": ["봉사가 즐겁지 않았던 순간은 없었나요?", "봉사를 받는 분들에게 오히려 배운 것이 있나요?"]}, {"sec": "봉사활동", "q": "봉사를 지속하게 된(또는 지속하지 못한) 이유를 솔직하게 말해 보세요.", "point": "지속의 동기(관계, 보람, 책임감)를 분석적으로 말하는 것이 핵심. 의무제 꼬리질문에는 '시작은 의무여도 계기가 될 수 있다'는 균형 답변이 안전.", "frame": "제가 (봉사)를 지속한 이유는 처음의 거창한 사명감이 아니라 (구체적 동기: 기다리는 분, 눈에 보이는 변화) 때문이었습니다. 의무 시간을 채운 뒤에도 계속한 것은 (내적 이유)였습니다. 봉사시간 제도는 (균형 잡힌 평가)라고 생각합니다. 저에게는 의무로 시작한 문이 마음으로 다니는 길이 되었기 때문입니다.", "follow": ["봉사시간 의무제에 대해서는 어떻게 생각하나요?", "고등학교에서는 어떤 봉사를 하고 싶나요?"]}, {"sec": "봉사활동", "q": "봉사활동에서 예상과 달랐던 점이나 곤란했던 상황을 어떻게 대처했나요?", "point": "봉사를 '한 일'이 아니라 '겪은 일'로 말할 수 있는지 확인. 곤란함(소통 실패, 서툰 도움이 폐가 된 경험)과 그로부터의 배움이 내면화의 증거.", "frame": "(봉사)에서 (예상과 달랐던 상황)을 만났습니다. 저는 (당시 대처)를 했지만 (부족했던 점)도 있었습니다. 이 일로 좋은 마음만으로는 좋은 도움이 되지 않으며, 상대에게 필요한 방식을 먼저 묻는 것이 진짜 배려라는 것을 배웠습니다. 다음 봉사부터는 (달라진 행동)을 실천했습니다.", "follow": ["그 경험이 봉사에 대한 생각을 바꿨나요?", "준비 없이 간 봉사와 준비하고 간 봉사의 차이를 느꼈나요?"]}, {"sec": "봉사활동", "q": "'봉사의 가치'가 무엇이라고 생각하는지, 자신의 경험에서 뽑아낸 언어로 말해 보세요.", "point": "교과서적 정의('더불어 사는 삶')의 암송은 0점. 자기 경험에서 귀납한 한 문장의 정의가 필요. 자기만족 비판에는 '동기가 무엇이든 결과의 도움은 실재한다+관계로 성숙한다'는 방어.", "frame": "제 경험에서 뽑아낸 봉사의 가치는 (자기 언어의 정의: 예-'서로의 세계가 넓어지는 일')입니다. (그렇게 정의하게 된 경험)이 있었기 때문입니다. 봉사가 자기만족이라는 비판도 일리가 있지만, 저는 (반론: 시작이 자기만족이어도 관계가 쌓이면 책임이 된다)이라고 생각합니다. 중요한 것은 동기의 순수함보다 관계의 지속이라고 배웠습니다.", "follow": ["봉사가 자기만족일 뿐이라는 비판에 대해 어떻게 생각하나요?", "나눔과 봉사는 어떻게 다른가요?"]}, {"sec": "지원동기·학업계획", "q": "우리 학교에 지원한 이유를, 지원자의 경험과 연결해서 말해 보세요.", "point": "'명문이라서, 분위기가 좋아서'는 0점. 나의 경험·목표(구체) → 그것을 위해 필요한 환경(논리) → 이 학교의 실제 프로그램(사실)의 3단 연결이 정답 구조.", "frame": "저는 (경험)을 하면서 (목표·필요)를 갖게 되었습니다. 이것을 이루려면 (필요한 환경)이 있어야 하는데, ○○고의 (구체적 프로그램·교육과정·인재상)이 바로 그 환경이라고 판단했습니다. 특히 (학교 특색 하나)는 제가 (나의 강점·활동)에서 확인한 저와 잘 맞는 지점입니다.", "follow": ["우리 학교에 대해 아는 것을 말해 보세요.", "집에서 먼(기숙사) 생활인데 괜찮겠어요?"]}, {"sec": "지원동기·학업계획", "q": "입학 후 3년의 학업 계획과 학교생활 계획을 말해 보세요.", "point": "연도별 나열보다 '축'이 있는 계획(전공어 심화 축, 탐구 축, 공동체 축)이 인상적. 계획 실패 꼬리질문에는 자기 조정 경험으로 답하는 것이 정석.", "frame": "제 3년의 축은 두 가지입니다. 학업에서는 1학년에 (기초 계획), 2~3학년에 (심화·탐구 계획)으로 (진로 방향)를 향해 쌓아 가겠습니다. 공동체에서는 (동아리·활동 계획)에 참여해 (기여 목표)를 하고 싶습니다. 계획이 틀어질 수도 있지만, (과거의 조정 경험)처럼 계획은 지키는 것보다 고쳐 쓰는 것이 중요하다고 생각합니다.", "follow": ["계획대로 되지 않으면 어떻게 하겠어요?", "공부 외에 꼭 해 보고 싶은 활동은요?"]}, {"sec": "지원동기·학업계획", "q": "본인을 뽑아야 하는 이유를 세 가지로 말해 보세요.", "point": "세 가지는 서로 다른 영역(학업 역량/인성·공동체/성장 가능성)에서 골라야 겹치지 않음. 각 주장에는 반드시 근거 사례 1개씩. 자신감과 겸손의 균형이 어렵지만 중요.", "frame": "첫째, (학업 관련 강점)입니다. (근거 사례). 둘째, (공동체 관련 강점)입니다. (근거 사례). 셋째, (태도·성장 가능성)입니다. (근거 사례). 하나만 남긴다면 (선택)인데, 나머지 둘도 결국 여기서 나왔기 때문입니다. 완성된 학생이라서가 아니라, ○○고에서 가장 크게 자랄 학생이라서 저를 뽑으실 이유가 있다고 생각합니다.", "follow": ["그중 하나만 남긴다면 무엇인가요?", "반대로, 뽑기에 불안한 요소가 있다면 스스로 말해 보세요."]}, {"sec": "지원동기·학업계획", "q": "(외고·국제고) 왜 다른 과가 아닌 ○○어과인가요? 그 언어권에 대한 관심을 증명해 보세요.", "point": "언어 선택의 서사(계기→탐색→확신)와 증거(그 언어·문화와의 실제 접촉)가 필요. '취업에 유리해서'는 하수, 문화·사회에 대한 구체적 관심이 상수.", "frame": "제가 ○○어과를 선택한 계기는 (구체적 접촉 경험)입니다. 이후 (탐색 행동: 콘텐츠, 독학, 문화 탐구)를 하면서 관심이 (구체적 관심사)로 깊어졌습니다. 특히 (그 언어권의 이슈·문화 하나)에 관심이 있는데, ○○어를 도구로 (하고 싶은 것)을 하는 것이 저의 목표입니다.", "follow": ["그 언어로 된 콘텐츠(책·영화·뉴스)를 접해 본 것이 있나요?", "그 언어권의 최근 이슈 중 아는 것이 있나요?"]}, {"sec": "지원동기·학업계획", "q": "마지막으로 하고 싶은 말을 해 보세요.", "point": "준비된 30초 마무리가 필요한 순간. 새로운 자랑의 추가가 아니라, 면접 전체를 관통하는 자기 키워드 하나의 각인 + 진심의 표현이 정답. 암기 티가 나지 않게.", "frame": "오늘 말씀드린 저의 이야기를 하나로 모으면 (자기 키워드)입니다. 저는 (키워드를 증명하는 한 문장 요약)한 학생이었고, ○○고에서도 그렇게 배우고 성장하겠습니다. 부족한 점도 있지만 (보완 의지 한 문장). 긴 시간 들어 주셔서 감사합니다.", "follow": ["방금 말한 각오를 실천하기 위해 입학 전까지 구체적으로 무엇을 준비할 건가요?"]}], "jesi": [{"t": "AI 기술 발전과 규제의 균형", "ty": "시사찬반", "p": "2023년 영국에서 열린 제1회 인공지능(AI) 안전 정상회의에서 미국·중국·EU·한국 등 28개국은 고성능 AI의 잠재적 위험을 관리하기 위해 국제적으로 협력한다는 '블레츨리 선언'에 합의했다. AI의 위험 관리를 기업에만 맡기지 않고, 정부와 외부 전문기관이 함께 점검하겠다는 것이 핵심이다. EU는 2024년 세계 최초의 포괄적 AI 규제법인 'AI법(AI Act)'을 통과시켜, 위험 수준에 따라 AI를 네 단계로 나누고 고위험 AI에는 엄격한 의무를 부과하기로 했다.\n\n반면 일부 기업가와 연구자들은 성급한 규제가 기술 혁신을 가로막는다고 반박한다. 규제가 강한 지역의 기업은 개발 속도에서 뒤처지고, 그 격차는 결국 국가 경쟁력의 차이로 이어진다는 것이다. 실제로 일부 글로벌 기업은 규제가 강화된 지역에서 최신 AI 서비스 출시를 미루기도 했다. 이처럼 AI를 둘러싼 논쟁은 '안전을 위한 규제'와 '혁신을 위한 자율' 사이에서 계속되고 있다.", "q": ["AI 기술에 대한 규제 강화에 찬성하는지 반대하는지, 제시문의 내용을 활용하여 자신의 입장을 근거와 함께 말해 보세요."], "guide": "【제시문 분석】 1문단은 규제 강화의 흐름(블레츨리 선언, EU AI법), 2문단은 규제 반대 논리(혁신 저해, 경쟁력 격차)입니다. 두 입장의 핵심 근거를 각각 한 문장으로 정리한 뒤 시작하세요.\n【답변 구성】 ① 입장 선언(찬성/반대/조건부) → ② 근거 1(피해의 성격: 회복 가능성) → ③ 근거 2(제시문 속 사례 인용) → ④ 반대 입장의 타당한 부분 인정과 재반박 → ⑤ 보완책 제안으로 마무리", "a": ["저는 AI 기술에 대한 규제가 필요하다는 입장입니다. 다만 모든 AI를 똑같이 규제하는 것이 아니라, 위험이 큰 영역부터 단계적으로 규제해야 한다고 생각합니다.\n\n첫 번째 이유는 피해의 회복 가능성 때문입니다. 딥페이크로 만들어진 가짜 영상이나 개인정보 유출은 한번 퍼지면 되돌리기가 거의 불가능합니다. 피해가 즉각적이고 회복이 어려운 기술일수록, 문제가 생긴 뒤에 처벌하는 것보다 미리 안전장치를 두는 것이 합리적입니다. 두 번째 이유는 제시문의 EU AI법처럼 '위험 수준에 따라 차등을 두는 규제'가 이미 가능하다는 점입니다. 위험이 낮은 AI는 자유롭게 개발하게 하고 고위험 AI에만 의무를 부과한다면, 규제가 혁신을 막는다는 반대 측의 우려도 상당 부분 해소할 수 있습니다.\n\n물론 규제가 강한 지역의 기업이 개발 경쟁에서 뒤처질 수 있다는 지적은 타당합니다. 그래서 저는 블레츨리 선언처럼 여러 나라가 공통의 기준을 만드는 국제 협력이 중요하다고 생각합니다. 모두가 같은 규칙을 지키면 특정 국가만 손해 보는 일이 줄어들기 때문입니다. 정리하면, 저는 규제와 혁신을 대립으로 보지 않고, 고위험 영역에 집중된 규제가 오히려 AI에 대한 사회적 신뢰를 만들어 기술 발전을 돕는다고 생각합니다."], "tips": ["'전면 찬성/반대'보다 '어떤 조건에서 찬성하는가'를 밝히면 사고의 정교함이 드러납니다.", "제시문 속 고유명사(블레츨리 선언, EU AI법)를 한 번은 정확히 인용하세요. 제시문을 읽었다는 증거가 됩니다.", "반대 입장의 가장 강한 논거를 먼저 인정한 뒤 재반박하면 설득력이 크게 올라갑니다."]}, {"t": "AI 판사 도입 논쟁", "ty": "시사찬반", "p": "에스토니아는 소액 분쟁 사건의 일부를 AI가 1차로 판단하게 하는 방안을 검토했고, 중국의 일부 법원은 AI가 판결문 초안과 유사 판례를 제시하는 '스마트 법원' 시스템을 운영하고 있다. 우리나라 법원도 판결문 검색과 분석에 AI를 활용하는 방안을 연구하고 있다. AI 재판을 지지하는 사람들은 판사마다 형량이 달라지는 편차를 줄이고, 재판에 걸리는 시간과 비용을 크게 줄일 수 있다고 주장한다.\n\n그러나 반대하는 사람들은 AI가 과거의 판례 데이터를 학습하기 때문에 과거에 존재했던 차별과 편견까지 그대로 배울 수 있다고 우려한다. 실제로 미국의 한 재범 예측 프로그램은 특정 인종에게 불리한 판단을 내리는 경향이 있다는 분석이 나와 논란이 되었다. 또한 재판은 단순히 법 조항을 적용하는 일이 아니라 한 사람의 사정을 듣고 헤아리는 과정인데, AI가 그 역할을 대신할 수 있는지에 대한 근본적인 의문도 제기된다.", "q": ["AI 판사 도입에 대한 자신의 입장을 밝히고, 그 근거를 두 가지 이상 말해 보세요.", "AI에게 재판을 맡기더라도 반드시 사람이 남아서 해야 할 일은 무엇이라고 생각하는지 말해 보세요."], "guide": "【제시문 분석】 찬성 근거는 '일관성(형량 편차 감소)'과 '효율(시간·비용)', 반대 근거는 '편향 학습'과 '공감 불가능'입니다. 이 네 개의 키워드를 잡으면 제시문이 정리됩니다.\n【답변 구성】 [1] ① 입장 → ② 근거 두 가지(효율/일관성 vs 편향/공감) → ③ 절충안(보조 도구로 활용) → ④ 정리 [2] '판단의 최종 책임', '사정을 듣는 일'처럼 사람만이 할 수 있는 역할을 구체적으로 지목", "a": ["저는 AI를 판사의 보조 도구로 쓰는 것에는 찬성하지만, AI가 최종 판결을 내리는 것에는 반대합니다.\n\n반대하는 첫 번째 이유는 편향의 문제입니다. AI는 과거 판례를 학습하는데, 과거의 판결에 차별이 섞여 있었다면 AI는 그 차별을 '정답'으로 배우게 됩니다. 제시문에 나온 미국의 재범 예측 프로그램이 특정 인종에게 불리했다는 사례가 그 위험을 보여 줍니다. 두 번째 이유는 책임의 문제입니다. 판결이 잘못되었을 때 AI에게는 책임을 물을 수 없습니다. 사람의 인생을 좌우하는 결정에는 그 결정을 책임질 주체가 반드시 필요하다고 생각합니다. 다만 유사 판례를 찾고 형량의 편차를 점검하는 일은 AI가 사람보다 잘할 수 있으므로, 판사가 더 공정한 판단을 내리도록 돕는 도구로는 적극 활용해야 한다고 생각합니다.", "사람이 끝까지 맡아야 할 일은 두 가지라고 생각합니다. 첫째는 당사자의 사정을 직접 듣고 헤아리는 일입니다. 같은 절도라도 생계 때문이었는지 상습적이었는지에 따라 판단이 달라져야 하는데, 그 맥락을 읽는 것은 데이터만으로는 어렵습니다. 둘째는 최종 결정과 그에 대한 책임입니다. AI의 분석이 아무리 정확해도, '이 판단을 내린 사람은 나'라고 말할 수 있는 존재가 있어야 판결에 대한 신뢰가 유지됩니다. 결국 AI는 정보를 넓혀 주는 역할, 사람은 가치를 판단하고 책임지는 역할로 나뉘어야 한다고 생각합니다."], "tips": ["기술 찬반 문제는 '전면 도입 vs 전면 금지'가 아니라 '어디까지 허용할 것인가'로 답하면 균형 잡힌 인상을 줍니다.", "제시문 속 사례(재범 예측 프로그램)를 근거로 인용하면 자료 활용 능력을 보여 줄 수 있습니다.", "두 번째 질문은 첫 답변과 논리가 이어져야 합니다. 입장을 바꾸지 말고 심화하세요."]}, {"t": "촉법소년 연령 하향 논쟁", "ty": "시사찬반", "p": "우리나라에서 만 10세 이상 14세 미만의 청소년은 범죄를 저질러도 형사처벌을 받지 않고 보호처분을 받는다. 이들을 '촉법소년'이라고 부른다. 그런데 최근 촉법소년에 의한 강력범죄가 언론에 보도되고, 일부 청소년이 '나는 처벌받지 않는다'는 점을 악용하는 사례가 알려지면서, 촉법소년의 상한 연령을 만 13세로 낮추자는 법 개정 논의가 이어지고 있다. 찬성 측은 청소년의 신체적·정신적 성숙이 과거보다 빨라졌고, 피해자의 고통에 비해 가해자가 지는 책임이 지나치게 가볍다고 주장한다.\n\n반대 측은 처벌의 강화가 실제로 소년 범죄를 줄인다는 뚜렷한 증거가 없다는 점을 지적한다. 소년 범죄의 상당수는 가정 해체, 빈곤, 학대 같은 환경에서 비롯되므로, 어린 나이에 전과자라는 낙인을 찍으면 오히려 사회 복귀가 어려워져 재범 가능성이 커진다는 것이다. 이들은 처벌 연령을 낮추는 것보다 보호처분 제도를 내실화하고 교화 프로그램을 강화하는 것이 먼저라고 주장한다.", "q": ["촉법소년 연령 하향에 대한 자신의 입장을 정하고, 예상되는 반론에 대한 재반박까지 포함하여 말해 보세요."], "guide": "【제시문 분석】 찬성의 핵심어는 '책임과 성숙', 반대의 핵심어는 '낙인과 교화'입니다. 쟁점은 '처벌이 범죄 예방에 효과가 있는가'라는 사실 판단과 '피해자와 가해자 중 누구의 관점에 설 것인가'라는 가치 판단, 두 층위로 나뉩니다.\n【답변 구성】 ① 입장 → ② 근거 1(효과성 또는 책임성) → ③ 근거 2 → ④ 예상 반론 제시 → ⑤ 재반박 → ⑥ 보완책 덧붙이며 정리", "a": ["저는 촉법소년 연령을 낮추는 것만으로는 문제를 해결할 수 없으며, 신중해야 한다는 입장입니다.\n\n첫째, 제시문에 나온 것처럼 처벌 강화가 소년 범죄를 줄인다는 증거가 분명하지 않기 때문입니다. 범죄를 저지르는 청소년의 상당수는 가정 해체나 학대 같은 환경 속에 있는데, 처벌 연령만 낮추는 것은 원인을 그대로 둔 채 결과만 벌하는 것이라고 생각합니다. 둘째, 어린 나이의 전과 기록은 학업과 취업의 기회를 막아 오히려 재범으로 이어질 위험이 있습니다. 사회 전체로 보면 더 큰 비용이 돌아오는 셈입니다.\n\n물론 '피해자의 고통을 생각하면 가해자의 나이를 따지는 것이 한가한 이야기'라는 반론이 있을 수 있고, 저는 그 분노에 충분히 공감합니다. 그래서 저는 연령 하향에 반대하는 대신, 고의적이고 잔혹한 소수의 강력범죄에 한해서는 예외적으로 형사처벌을 검토하고, 나머지 다수에게는 보호처분과 교화 프로그램을 지금보다 훨씬 내실 있게 운영하는 '이원적 접근'이 필요하다고 생각합니다. 모든 촉법소년을 똑같이 다루는 것이 아니라 사안의 심각성에 따라 대응을 달리하는 것이, 피해자 보호와 청소년 교화라는 두 가치를 함께 지키는 길이라고 생각합니다."], "tips": ["감정이 격해지기 쉬운 주제일수록 차분하게 '사실 근거'부터 말하면 오히려 돋보입니다.", "피해자에 대한 공감을 반드시 한 문장 넣으세요. 논리만 앞세우면 차갑다는 인상을 줄 수 있습니다.", "'전부 아니면 전무'가 아닌 이원적·단계적 대안을 제시하는 것이 고입 면접에서 가장 좋은 평가를 받는 유형의 답변입니다."]}, {"t": "기본소득 도입 논쟁", "ty": "시사찬반", "p": "기본소득은 재산이나 소득, 취업 여부를 따지지 않고 모든 국민에게 일정 금액을 정기적으로 지급하는 제도이다. AI와 자동화로 일자리가 줄어들 것이라는 전망이 나오면서, 기본소득은 미래 사회의 대안으로 세계적인 주목을 받았다. 핀란드는 2017년부터 2년간 실업자 2,000명에게 매달 약 560유로를 지급하는 실험을 진행했는데, 수급자들의 행복감과 삶의 안정감은 높아졌지만 고용 증가 효과는 뚜렷하지 않았다는 결과가 나왔다.\n\n찬성 측은 기본소득이 복잡한 복지제도의 사각지대를 없애고, 사람들이 생계 걱정 없이 교육과 창업 등 새로운 도전을 할 수 있게 한다고 주장한다. 반대 측은 막대한 재원이 필요하다는 점을 지적한다. 전 국민에게 매달 50만 원씩 지급하려면 연간 약 300조 원이 필요한데, 이는 우리나라 1년 예산의 절반에 가까운 규모다. 또한 일할 의욕을 떨어뜨릴 수 있고, 도움이 절실한 취약계층에게 집중해야 할 재원이 분산된다는 비판도 있다.", "q": ["기본소득 도입에 대한 자신의 입장을 제시문의 근거를 활용해 말해 보세요.", "기본소득처럼 '모두에게 똑같이'와 선별복지처럼 '필요한 사람에게 더 많이' 중 어느 원칙이 더 공정하다고 생각하는지 말해 보세요."], "guide": "【제시문 분석】 핀란드 실험 결과가 핵심 자료입니다. '행복감 상승, 고용 효과 불분명'이라는 양면적 결과는 찬성·반대 어느 쪽 근거로도 쓸 수 있습니다. 재정 규모(연 300조 원)는 반대 측의 가장 강력한 수치입니다.\n【답변 구성】 [1] ① 입장 → ② 실험 결과 해석 → ③ 재정 현실성 검토 → ④ 조건부 대안 [2] 공정의 두 기준(동등 대우 vs 필요 대응)을 정의하고 자신의 기준 선택", "a": ["저는 지금 단계에서 전면적인 기본소득 도입에는 반대하지만, 그 문제의식에는 동의합니다.\n\n반대하는 가장 큰 이유는 재정의 현실성입니다. 제시문처럼 전 국민에게 월 50만 원을 주려면 연간 약 300조 원, 나라 예산의 절반이 필요합니다. 그 돈을 마련하려면 세금을 크게 올리거나 기존 복지를 줄여야 하는데, 그 부담이 결국 취약계층 지원 축소로 이어질 수 있습니다. 또 핀란드 실험에서 행복감은 높아졌지만 고용 효과는 뚜렷하지 않았다는 결과는, 기본소득이 '일자리 감소의 해법'이라는 기대만큼 작동하지 않을 수 있음을 보여 줍니다. 다만 AI 시대에 일자리 구조가 실제로 크게 바뀐다면 논의 자체는 필요하다고 생각합니다. 그래서 저는 전면 도입 대신 청년이나 농어촌처럼 대상을 정해 소규모로 실험하고, 그 데이터를 보고 확대 여부를 결정하는 단계적 접근을 지지합니다.", "저는 기본적으로 '필요한 사람에게 더 많이'가 공정하다고 생각합니다. 공정이란 모두를 기계적으로 똑같이 대하는 것이 아니라, 출발선이 다른 사람들의 차이를 고려하는 것이라고 보기 때문입니다. 한정된 재원을 모두에게 나누면 정작 절실한 사람에게 돌아가는 몫이 작아집니다. 다만 선별복지는 대상을 가려내는 과정에서 수급자에게 낙인을 찍거나, 서류상 기준 때문에 사각지대를 만드는 단점이 있습니다. 그래서 저는 원칙은 선별로 하되, 신청주의를 개선해 지원이 필요한 사람을 행정이 먼저 찾아가는 방식으로 사각지대를 줄여야 한다고 생각합니다."], "tips": ["수치 인용은 한두 개면 충분합니다. 300조 원처럼 규모를 보여 주는 숫자를 골라 정확히 말하세요.", "핀란드 실험처럼 결과가 양면적인 자료는 '자신의 입장에 유리하게 해석하되 반대 해석도 가능함을 인정'하면 좋은 점수를 받습니다.", "복지 논쟁에서는 '공정'이라는 단어의 정의를 스스로 내리고 시작하면 답변의 격이 달라집니다."]}, {"t": "노키즈존 확산 논쟁", "ty": "시사찬반", "p": "어린이의 출입을 제한하는 '노키즈존' 카페와 식당이 전국적으로 늘고 있다. 한 조사에 따르면 국내 노키즈존은 500곳이 넘는 것으로 추정된다. 업주들은 어린이 안전사고가 났을 때 법원이 업주에게 배상 책임을 물었던 판례, 다른 손님들의 불편 호소 등을 이유로 든다. 영업의 자유가 있는 만큼 가게의 분위기와 손님층을 선택하는 것도 업주의 권리라는 주장이다.\n\n그러나 국가인권위원회는 2017년 노키즈존이 나이를 이유로 한 차별에 해당한다는 의견을 밝혔다. 아이가 시끄럽게 할 '가능성'만으로 모든 어린이와 그 부모의 출입을 막는 것은, 일부의 문제를 집단 전체의 문제로 확대하는 일반화라는 것이다. 저출산 시대에 아이 동반 가족이 갈 수 있는 공간이 줄어드는 것은 '아이 키우기 어려운 사회' 분위기를 더 굳힌다는 우려도 있다. 최근에는 아이의 출입을 환영하되 보호자의 관리 책임을 명확히 하는 '예스키즈존'을 선언하는 가게도 생기고 있다.", "q": ["노키즈존 확산에 대한 자신의 입장을 '영업의 자유'와 '차별 금지'라는 두 가치를 모두 언급하며 말해 보세요."], "guide": "【제시문 분석】 이 문제는 '영업의 자유(사적 권리)'와 '차별 금지(공적 가치)'가 충돌하는 구조입니다. 1문단은 업주의 논리(안전사고 책임, 영업의 자유), 2문단은 반대 논리(일반화의 오류, 저출산 시대의 사회적 메시지)입니다.\n【답변 구성】 ① 두 가치의 충돌임을 먼저 규정 → ② 자신의 입장 → ③ 근거(일반화의 문제 또는 책임의 문제) → ④ 상대 가치를 존중하는 절충안(예스키즈존, 매너 규정) → ⑤ 정리", "a": ["이 문제는 업주의 영업의 자유와 어린이에 대한 차별 금지라는 두 가치가 부딪히는 문제라고 생각합니다. 저는 노키즈존이 법으로 금지할 일은 아니지만, 바람직한 방향도 아니라고 생각합니다.\n\n먼저 업주의 사정에도 이해되는 부분이 있습니다. 안전사고가 났을 때 업주가 배상 책임을 진 판례가 있는 만큼, 노키즈존은 단순한 혐오가 아니라 위험 관리의 결과이기도 합니다. 하지만 그럼에도 반대하는 이유는, 노키즈존이 '일부 아이가 소란을 피울 가능성'을 근거로 모든 아이와 부모를 막는 일반화이기 때문입니다. 같은 논리라면 시끄러운 어른이 있다는 이유로 특정 집단 전체를 막는 것도 정당화될 수 있습니다. 문제의 원인은 나이가 아니라 행동인데, 나이로 선을 긋는 것은 정확한 해결이 아닙니다.\n\n그래서 저는 출입을 막는 대신 '이용 규칙'을 세우는 방식이 옳다고 생각합니다. 제시문의 예스키즈존처럼 아이를 환영하되 보호자의 관리 책임을 분명히 하고, 소란 시 퇴장을 요청할 수 있게 하면 업주의 부담과 차별의 문제를 동시에 줄일 수 있습니다. 저출산 시대에 우리 사회가 아이에게 어떤 신호를 보내는가까지 생각하면, '배제'보다 '공존의 규칙'이 더 성숙한 답이라고 생각합니다."], "tips": ["'차별이냐 아니냐'로 단순화하지 말고, 두 가치의 충돌 구조를 먼저 말하면 분석력이 드러납니다.", "'문제는 나이가 아니라 행동'처럼 논점을 한 문장으로 압축하는 표현을 준비하세요.", "비슷한 구조의 문제(노시니어존, 노스터디존)로 꼬리질문이 올 수 있으니 원칙을 일관되게 유지하세요."]}, {"t": "AI가 만든 창작물의 저작권", "ty": "시사찬반", "p": "2022년 미국의 한 미술전에서 생성형 AI로 만든 그림 '스페이스 오페라 극장'이 디지털 아트 부문 1위를 차지하면서 세계적인 논쟁이 벌어졌다. 화가들은 'AI는 수많은 화가의 그림을 허락 없이 학습했으므로 그 결과물은 창작이 아니라 정교한 도용'이라고 반발했다. 미국 저작권청은 인간의 창작적 기여가 없는 AI 생성물에는 저작권을 인정하지 않는다는 입장을 밝혀 왔다.\n\n반면 AI를 새로운 도구로 봐야 한다는 입장도 있다. 사진기가 처음 나왔을 때도 '기계가 찍은 것이 예술이냐'는 논쟁이 있었지만, 지금 사진은 당당한 예술 장르가 되었다. 어떤 장면을 어떤 명령어로 만들어 낼지 구상하고 수백 번 수정하는 과정에는 인간의 창작적 판단이 들어 있다는 것이다. 한편 AI 학습에 사용된 원작자들에게 아무런 보상이 없다는 문제는 여전히 남아 있어, 각국은 학습 데이터에 대한 보상 제도와 AI 생성물 표시 의무 등을 논의하고 있다.", "q": ["AI가 만든 그림의 수상이 정당한지에 대한 자신의 입장을 말해 보세요.", "AI 시대에 '창작'의 의미가 어떻게 달라져야 한다고 생각하는지 사진기의 사례를 활용해 말해 보세요."], "guide": "【제시문 분석】 쟁점은 세 층위입니다. ① 학습 데이터의 정당성(허락 없는 학습) ② 창작의 주체(도구인가 작가인가) ③ 제도(보상·표시 의무). 사진기 비유는 'AI 옹호' 논리의 핵심 무기입니다.\n【답변 구성】 [1] ① 입장 → ② 경쟁의 공정성 관점 → ③ 원작자 보상 문제 → ④ 조건 제시 [2] 사진기 비유의 타당한 점과 한계를 각각 짚은 뒤 '창작 = 선택과 판단'으로 재정의", "a": ["저는 그 수상이 공정하지 않았다고 생각합니다. 작품 자체의 완성도와는 별개로, 경쟁의 규칙이 공평하지 않았기 때문입니다.\n\n첫째, 그 그림을 만든 AI는 수많은 화가의 그림을 허락 없이 학습했습니다. 원작자들의 노력 위에서 만들어진 결과물이 원작자들과 같은 무대에서 경쟁하는 것은, 출발선이 다른 경주라고 생각합니다. 둘째, 당시 심사위원들은 그 작품이 AI로 만들어졌다는 사실을 충분히 알지 못한 채 심사했습니다. 정보가 가려진 상태의 평가는 공정한 평가라고 보기 어렵습니다. 다만 저는 AI로 그림을 만드는 행위 자체를 부정하지는 않습니다. AI 부문을 따로 만들거나 AI 사용 사실을 표시하게 한다면, 새로운 창작 방식으로 충분히 인정받을 수 있다고 생각합니다.", "사진기의 사례는 '새로운 도구는 처음엔 배척당하지만 결국 예술이 된다'는 점을 잘 보여 줍니다. 사진이 예술이 된 이유는 기계가 아니라 사람이 무엇을, 언제, 어떤 시선으로 찍을지 '선택'했기 때문입니다. 저는 AI 시대의 창작도 같은 기준으로 다시 정의해야 한다고 생각합니다. 손으로 직접 그렸는가가 아니라, 그 결과물에 그 사람만의 의도와 선택, 수정의 과정이 담겨 있는가가 창작의 기준이 되어야 합니다. 다만 사진기와 AI 사이에는 중요한 차이가 하나 있습니다. 사진기는 다른 작가의 작품을 재료로 쓰지 않지만, AI는 기존 작품들을 학습해야만 작동합니다. 그래서 AI 시대의 창작 개념에는 '재료가 된 원작자들에 대한 보상과 표시'라는 윤리가 반드시 함께 들어가야 한다고 생각합니다."], "tips": ["비유(사진기)가 제시문에 나오면 반드시 '타당한 점 + 한계'를 함께 검토하세요. 비유의 허점을 짚는 순간 상위권 답변이 됩니다.", "'작품의 질'과 '경쟁의 공정성'을 분리해서 판단하면 논점이 선명해집니다.", "자신이 그림·글쓰기에서 AI를 써 본 경험이 있다면 한 문장으로 연결해도 좋습니다."]}, {"t": "청소년 스마트폰 사용 제한", "ty": "시사찬반", "p": "2024년 호주는 세계 최초로 16세 미만 청소년의 소셜미디어(SNS) 계정 가입을 금지하는 법을 통과시켰다. 프랑스는 수업 중 휴대전화 사용을 법으로 금지했고, 우리나라에서도 2025년부터 초·중·고 수업 중 휴대전화 사용을 원칙적으로 제한하는 법이 시행된다. 여성가족부 조사에서 우리나라 청소년의 스마트폰 과의존 위험군은 약 40%에 이르는 것으로 나타났다.\n\n규제를 지지하는 사람들은 청소년기의 뇌가 즉각적인 보상에 특히 취약하며, SNS 사용 시간과 우울·불안의 상관관계를 보여 주는 연구들이 쌓이고 있다고 말한다. 반면 반대하는 사람들은 일률적인 금지가 청소년의 자기결정권과 소통의 권리를 침해하고, 금지된 것을 더 원하게 되는 풍선효과만 낳을 수 있다고 지적한다. 스마트폰은 이미 학습과 관계의 도구이기도 하므로, 금지보다 스스로 조절하는 능력을 길러 주는 교육이 먼저라는 것이다.", "q": ["국가가 법으로 청소년의 SNS·스마트폰 사용을 제한하는 것에 대한 자신의 입장을 말해 보세요.", "자신의 스마트폰 사용 습관을 돌아보고, 스스로 세운 조절 원칙이 있다면 소개해 보세요."], "guide": "【제시문 분석】 이 문제의 특수성은 '답하는 나 자신이 규제의 대상'이라는 점입니다. 규제 근거(뇌 발달, 과의존 40%)와 반대 근거(자기결정권, 풍선효과, 교육 우선)를 정리하되, 당사자로서의 경험을 논거로 쓸 수 있습니다.\n【답변 구성】 [1] ① 입장 → ② 근거(발달적 취약성 vs 자기결정권) → ③ 당사자 경험 연결 → ④ 절충(연령·장소별 차등) [2] 솔직한 현실 인정 → 구체적 원칙 → 효과와 한계", "a": ["저는 수업 중 사용 제한처럼 시간과 장소를 정한 규제에는 찬성하지만, 호주처럼 연령 전체를 일괄 금지하는 것에는 신중해야 한다고 생각합니다.\n\n부분 규제에 찬성하는 이유는, 저 자신을 포함한 청소년이 스마트폰 앞에서 늘 합리적이지는 않다는 것을 경험으로 알기 때문입니다. 숏폼 영상은 한 개만 보려고 해도 삼십 분이 지나 있는 경우가 많은데, 이것은 의지의 문제라기보다 즉각적 보상에 취약한 청소년기 뇌의 특성을 겨냥해 설계된 서비스의 문제이기도 합니다. 개인의 절제에만 맡기기 어려운 부분은 규칙이 도와줄 필요가 있습니다. 그러나 전면 금지에 신중한 이유는 풍선효과 때문입니다. 금지는 사용을 숨게 만들 뿐 조절 능력을 길러 주지 못하고, 성인이 되는 순간 준비 없이 노출됩니다. 결국 규제는 '보호가 꼭 필요한 시간과 장소'에 집중하고, 그 바깥에서는 스스로 조절하는 힘을 기르는 교육이 함께 가야 한다고 생각합니다.", "솔직히 말씀드리면 저도 시험 기간에 스마트폰 때문에 흔들린 경험이 있습니다. 그래서 두 가지 원칙을 세웠습니다. 첫째, 공부할 때는 스마트폰을 다른 방에 두는 '물리적 거리 두기'입니다. 의지로 참는 것보다 손이 닿지 않게 하는 것이 훨씬 효과적이었습니다. 둘째, SNS 알림을 모두 끄고 제가 정한 시간에만 확인하는 것입니다. 이 원칙을 지키면서 하루 사용 시간이 눈에 띄게 줄었고, 무엇보다 '내가 폰을 쓰는지, 폰이 나를 쓰는지'를 의식하게 된 것이 가장 큰 변화였습니다. 물론 완벽하게 지키지 못하는 날도 있지만, 규칙이 있다는 것 자체가 저를 다시 돌아오게 해 준다고 생각합니다."], "tips": ["당사자성이 있는 주제이므로 자신의 경험을 근거로 쓰면 진정성과 논리를 동시에 잡을 수 있습니다.", "두 번째 질문에서 '저는 문제없습니다'라는 답은 피하세요. 솔직한 인정 + 구체적 관리 방법이 훨씬 좋은 인상을 줍니다.", "'의지의 문제가 아니라 설계의 문제'라는 관점을 언급하면 사회적 시야를 보여 줄 수 있습니다."]}, {"t": "학교 급식 '채식의 날' 운영", "ty": "시사찬반", "p": "여러 시·도 교육청이 매주 또는 격주로 고기 없는 급식을 제공하는 '채식의 날'을 운영하고 있다. 도입 취지는 두 가지다. 하나는 기후위기 대응이다. 유엔식량농업기구에 따르면 축산업은 전 세계 온실가스 배출의 약 15%를 차지하며, 소고기 1kg을 생산하는 데는 물 약 15,000L가 필요하다. 다른 하나는 학생들에게 다양한 식습관과 생태적 감수성을 길러 준다는 교육적 목적이다.\n\n그러나 반발도 있다. 학생들 사이에서는 '먹기 싫은 메뉴를 강요당한다'는 불만이 나오고, 실제로 채식의 날에 잔반량이 크게 늘었다는 학교도 있다. 성장기 청소년에게 필요한 단백질 섭취를 걱정하는 학부모도 있다. 급식은 선택할 수 없는 단일 메뉴이므로, 좋은 취지라도 사실상 강제가 된다는 점이 논쟁의 핵심이다. 이에 일부 학교는 채식 메뉴와 일반 메뉴를 함께 제공하는 선택형으로 운영 방식을 바꾸고 있다.", "q": ["학교 급식 채식의 날 운영에 대한 자신의 입장을 밝히고, 운영 방식에 대한 개선안까지 제안해 보세요."], "guide": "【제시문 분석】 취지(기후·교육)와 부작용(강제성, 잔반 증가)이 대비되는 구조입니다. 핵심 쟁점은 '좋은 취지의 정책이 강제성을 가질 때 정당한가'이며, 마지막 문장의 '선택형'이 개선안의 실마리입니다.\n【답변 구성】 ① 취지에 대한 평가 → ② 문제점 진단(강제성·실효성) → ③ 입장 → ④ 구체적 개선안 2가지 → ⑤ 기대 효과로 마무리", "a": ["저는 채식의 날의 취지에는 찬성하지만, 지금처럼 선택권 없이 운영하는 방식은 바꿔야 한다고 생각합니다.\n\n취지 자체는 의미가 있습니다. 축산업이 전 세계 온실가스의 약 15%를 차지한다는 것을 생각하면, 일주일에 한 끼의 변화도 전국 단위로 모이면 실질적인 감축 효과가 있고, 무엇보다 음식과 환경의 연결을 몸으로 배우는 교육이 됩니다. 하지만 현재 방식의 문제는 그 취지가 학생에게 '설득'되지 않고 '강제'된다는 점입니다. 채식의 날에 잔반이 오히려 늘었다면, 고기를 줄인 효과가 음식물 쓰레기로 상쇄되는 셈이어서 환경적으로도 손해입니다.\n\n그래서 두 가지 개선안을 제안하고 싶습니다. 첫째, 채식 메뉴와 일반 메뉴를 함께 두는 선택형 운영입니다. 스스로 선택한 채식이어야 교육 효과도 생긴다고 생각합니다. 둘째, 메뉴의 질을 높이는 것입니다. '고기를 뺀 급식'이 아니라 학생들이 먹고 싶어 하는 맛있는 채식 요리를 개발하고, 그 메뉴가 왜 나오는지 데이터와 함께 알려 주는 것입니다. 강제 없이도 채식 메뉴를 고르는 학생이 늘어난다면, 그것이야말로 이 정책이 성공했다는 증거가 될 것입니다."], "tips": ["정책 평가 문제는 '취지 평가 → 실행 방식 평가'를 분리하면 논리가 선명해집니다.", "'잔반 증가로 환경 효과가 상쇄된다'처럼 상대의 목표(환경)를 기준으로 문제를 지적하면 반박이 강력해집니다.", "개선안은 반드시 실행 가능한 수준으로 구체화하세요. '홍보를 강화한다' 같은 막연한 답은 감점 요인입니다."]}, {"t": "청소년 참정권 확대", "ty": "시사찬반", "p": "우리나라는 2019년 선거법 개정으로 선거 연령을 만 19세에서 만 18세로 낮췄고, 2022년부터는 만 16세부터 정당에 가입할 수 있게 되었다. 오스트리아·브라질 등 일부 국가는 이미 만 16세부터 투표권을 부여하고 있으며, 우리나라에서도 교육감 선거만이라도 만 16세부터 투표하게 하자는 논의가 있다. 찬성 측은 청소년이 교육 정책의 직접 당사자인데도 정작 결정 과정에서 배제되어 있다는 점, 디지털 환경에서 자란 지금의 청소년은 과거보다 훨씬 많은 정보를 접하고 있다는 점을 근거로 든다.\n\n반대 측은 청소년이 아직 정치적 판단에 필요한 경험이 부족하고, 부모나 교사, 유튜브 알고리즘 등 주변의 영향에 휘둘리기 쉽다고 주장한다. 교실이 정치적 논쟁의 공간이 되어 갈등이 생길 것이라는 우려도 있다. 이에 대해 찬성 측은 '어른들은 모두 합리적으로 투표하는가'라고 되물으며, 판단 능력의 부족은 나이의 문제가 아니라 교육의 문제라고 반박한다.", "q": ["교육감 선거의 선거 연령을 만 16세로 낮추는 것에 대한 자신의 입장을 근거와 함께 말해 보세요."], "guide": "【제시문 분석】 찬성의 핵심은 '당사자성'(교육 정책의 직접 당사자), 반대의 핵심은 '판단 능력과 외부 영향'입니다. 찬성 측의 재반박('어른은 모두 합리적인가')은 반대 논거의 기준을 뒤집는 논법으로, 활용 가치가 높습니다.\n【답변 구성】 ① 입장 → ② 근거 1(당사자성 원칙) → ③ 근거 2(교육감 선거의 특수성) → ④ 반대 우려(미성숙) 인정과 재반박 → ⑤ 전제 조건 제시로 마무리", "a": ["저는 교육감 선거에 한해 만 16세부터 투표권을 주는 것에 찬성합니다.\n\n첫 번째 근거는 당사자성입니다. 민주주의의 기본 원칙은 어떤 결정의 영향을 받는 사람이 그 결정에 참여하는 것입니다. 교육감은 등교 시간, 평가 방식, 급식까지 학생의 일상을 직접 결정하는 자리인데, 정작 그 정책을 매일 몸으로 겪는 학생에게 발언권이 없다는 것은 원칙에 맞지 않습니다. 두 번째 근거는, 참정권이야말로 가장 좋은 시민교육이라는 점입니다. 사회 교과서로 민주주의를 배우는 것보다, 내 한 표가 학교를 바꾸는 경험이 훨씬 깊은 배움을 준다고 생각합니다.\n\n물론 청소년이 주변의 영향에 휘둘리기 쉽다는 우려는 저도 인정합니다. 하지만 제시문의 반박처럼, 어른도 알고리즘과 진영 논리에 휘둘리기는 마찬가지입니다. 판단 능력은 나이가 아니라 연습으로 길러지는 것이고, 연습의 기회를 주지 않으면서 미성숙을 이유로 배제하는 것은 순환 논리라고 생각합니다. 다만 이 제도가 성공하려면 학교에서 특정 입장을 주입하지 않는 균형 잡힌 선거 교육이 반드시 함께 이루어져야 한다는 조건을 붙이고 싶습니다."], "tips": ["'당사자가 결정에 참여한다'는 민주주의 원칙을 근거의 뿌리로 삼으면 답변의 격이 올라갑니다.", "자신이 청소년이므로 '저희 세대'의 경험을 한 번 언급하면 설득력이 커지지만, 감정적 호소가 되지 않게 절제하세요.", "'순환 논리'처럼 상대 논증의 구조적 약점을 짚는 표현을 하나쯤 준비해 두세요."]}, {"t": "난민 수용 논쟁", "ty": "시사찬반", "p": "2018년 예멘 내전을 피해 500여 명의 난민이 제주도에 입국을 신청하면서, 우리 사회에서 난민 수용 논쟁이 본격적으로 시작되었다. 당시 난민 수용에 반대하는 국민청원에 70만 명이 넘게 참여했다. 우리나라는 1992년 유엔 난민협약에 가입했고 2013년에는 아시아 최초로 독립된 난민법을 만들었지만, 실제 난민 인정률은 1~2% 수준으로 세계 평균에 크게 못 미친다.\n\n수용에 신중한 입장은 문화와 종교의 차이에서 오는 사회 갈등, 일자리 경쟁, 범죄에 대한 불안을 이유로 든다. 수용에 적극적인 입장은 우리나라도 한국전쟁 때 국제사회의 도움을 받았던 나라이며, 국제사회의 일원으로서 책임을 나눠야 한다고 주장한다. 또한 난민에 대한 불안의 상당 부분은 검증되지 않은 정보에서 비롯되며, 심사를 통과한 난민이 저지르는 범죄율이 특별히 높다는 근거는 없다고 반박한다.", "q": ["난민 수용에 대한 자신의 입장을 밝히고, 수용에 따르는 사회적 불안을 줄일 수 있는 방안을 함께 제시해 보세요."], "guide": "【제시문 분석】 반대 논거(갈등·경쟁·불안)는 대부분 '심리적 불안'이고, 찬성 논거는 '역사적 경험과 국제적 책임'입니다. 난민 인정률 1~2%라는 수치는 '이미 매우 좁은 문'이라는 현실 근거로 쓸 수 있습니다.\n【답변 구성】 ① 입장(원칙적 수용 + 엄격한 심사) → ② 근거 1(상호성: 도움받았던 역사) → ③ 근거 2(불안과 사실의 구분) → ④ 불안 해소 방안 2가지 → ⑤ 정리", "a": ["저는 심사를 거친 난민은 수용해야 한다는 입장입니다.\n\n첫 번째 이유는 우리 자신의 역사 때문입니다. 한국전쟁 당시 수많은 우리 국민이 피란민이 되었고 국제사회의 도움으로 살아남았습니다. 도움을 받아 일어선 나라가 도움이 필요한 사람에게 문을 닫는 것은 떳떳하지 못하다고 생각합니다. 두 번째 이유는 불안과 사실을 구분해야 하기 때문입니다. 제시문에 나오듯 난민의 범죄율이 특별히 높다는 근거는 없고, 우리나라의 난민 인정률은 이미 1~2%로 매우 엄격합니다. 검증된 위험이 아니라 막연한 불안 때문에 협약국의 책임을 저버리는 것은 옳지 않다고 생각합니다.\n\n다만 국민들의 불안 자체를 무시해서는 안 되므로 두 가지 방안을 함께 제안하고 싶습니다. 첫째, 심사 과정을 투명하게 공개해 '누가 어떤 기준으로 인정되는지'를 국민이 알 수 있게 해야 합니다. 불안은 정보의 공백에서 자라기 때문입니다. 둘째, 수용 이후의 통합 프로그램입니다. 언어 교육과 취업 지원으로 난민이 지역사회에 기여하는 구성원이 되도록 돕고, 그 성공 사례가 알려지면 인식도 바뀔 것입니다. 결국 중요한 것은 '받을 것인가 말 것인가'를 넘어 '어떻게 함께 살 것인가'를 설계하는 일이라고 생각합니다."], "tips": ["국제 이슈는 '우리의 역사적 경험'과 연결하면 공허하지 않은 근거가 됩니다.", "반대 여론(청원 70만)을 '무지한 사람들'로 몰지 마세요. 불안을 존중하되 사실로 답하는 태도가 성숙해 보입니다.", "마지막을 '찬반'이 아니라 '어떻게'의 차원으로 끌어올리면 사고의 확장을 보여 줄 수 있습니다."]}, {"t": "약탈 문화재 반환 논쟁", "ty": "시사찬반", "p": "프랑스 파리의 루브르 박물관과 영국의 대영박물관에는 과거 식민 지배와 전쟁 과정에서 가져간 다른 나라의 문화재가 수만 점 전시되어 있다. 그리스는 대영박물관에 있는 파르테논 신전 조각의 반환을 200년 가까이 요구하고 있고, 우리나라의 외규장각 의궤는 프랑스와의 오랜 협상 끝에 2011년 '5년 단위 갱신 대여' 형식으로 돌아왔다. 소유권은 여전히 프랑스에 있다.\n\n반환에 반대하는 쪽은 이렇게 주장한다. 첫째, 당시의 반출이 모두 불법이었다고 단정하기 어렵고, 둘째, 대형 박물관은 인류 전체의 유산을 한곳에서 보존·연구·전시하는 '세계 박물관'의 역할을 하며, 셋째, 반환을 시작하면 박물관이 텅 비게 된다는 것이다. 반환을 요구하는 쪽은 문화재는 그것이 만들어진 땅과 공동체의 역사 속에 있을 때 온전한 의미를 가지며, 약탈의 결과를 계속 보유하는 것은 과거의 불의를 현재까지 연장하는 일이라고 반박한다.", "q": ["약탈 문화재는 원래 국가로 반환되어야 하는지에 대한 자신의 입장을 밝히고, 반대 측의 논리 중 하나를 골라 반박해 보세요."], "guide": "【제시문 분석】 반대 논리는 세 개(합법성 불명확, 세계 박물관론, 연쇄 반환 우려)로 명확히 나뉘어 있습니다. 문제가 '반대 논리 중 하나를 골라 반박하라'고 요구하므로, 가장 반박하기 쉬운 논리를 전략적으로 선택하세요.\n【답변 구성】 ① 입장 → ② 원칙적 근거(문화재의 장소성, 정의의 회복) → ③ 반대 논리 중 하나 지목 → ④ 집중 반박 → ⑤ 현실적 절충(디지털 공유, 순회 전시) 언급하며 정리", "a": ["저는 약탈이 확인된 문화재는 원래 국가로 반환하는 것이 원칙이라고 생각합니다.\n\n근거는 두 가지입니다. 첫째, 문화재는 단순한 전시품이 아니라 그 공동체의 기억이 담긴 물건입니다. 외규장각 의궤가 프랑스 서고에 있을 때는 연구 대상에 불과했지만, 우리에게는 조선 왕실의 기록 문화를 증명하는 살아 있는 역사입니다. 둘째, 잘못된 방법으로 가져간 것을 돌려주는 일은 시혜가 아니라 정의의 회복이기 때문입니다.\n\n반대 논리 중 '세계 박물관론'을 반박하고 싶습니다. 인류의 유산을 한곳에서 보존하고 연구한다는 취지는 그럴듯하지만, 두 가지 문제가 있습니다. 우선 그 '한곳'이 왜 하필 과거에 약탈을 한 나라여야 하는지 설명하지 못합니다. 보존 기술이 이유라면 기술을 공유하면 될 일이지, 소유를 정당화할 근거는 되지 않습니다. 또한 오늘날에는 디지털 기술과 국제 순회 전시로 얼마든지 전 세계가 유산을 함께 누릴 수 있으므로, '모두의 유산이니 우리가 갖는다'는 논리는 시대에 맞지 않습니다. 다만 현실적으로 모든 반환이 한 번에 이루어지기는 어려우므로, 의궤 사례처럼 대여나 공동 관리부터 시작해 단계적으로 소유권 반환까지 나아가는 것이 실현 가능한 길이라고 생각합니다."], "tips": ["'하나를 골라 반박하라'는 요구를 놓치면 감점입니다. 문제의 지시 사항을 답변 구조에 그대로 반영하세요.", "외규장각 의궤처럼 우리나라 사례를 활용하면 관심의 깊이를 보여 줄 수 있습니다.", "원칙(반환)과 현실(단계적 접근)을 구분해 말하면 이상적이면서도 실현 가능한 답이 됩니다."]}, {"t": "가짜뉴스 규제와 표현의 자유", "ty": "시사찬반", "p": "허위 정보가 SNS를 타고 퍼지는 속도는 진실보다 빠르다. 미국 MIT 연구진이 트위터의 12만 개 뉴스 전파 경로를 분석한 결과, 거짓 뉴스는 진짜 뉴스보다 6배 빨리, 더 많은 사람에게 퍼지는 것으로 나타났다. 거짓이 더 새롭고 자극적이어서 사람들의 공유 심리를 자극하기 때문이다. 선거 기간의 가짜뉴스는 민주주의의 근간인 유권자의 판단을 왜곡할 수 있어, 독일은 혐오 발언과 허위 정보를 24시간 내에 삭제하지 않는 플랫폼에 거액의 벌금을 물리는 법을 시행하고 있다.\n\n그러나 국가가 '무엇이 가짜인지'를 판정하는 것 자체가 위험하다는 반론도 강하다. 권력을 비판하는 보도가 '가짜뉴스'로 낙인찍혀 탄압받은 사례는 역사에 많다. 진실과 거짓의 경계가 불분명한 영역도 많아서, 처벌이 두려운 언론과 시민이 스스로 입을 닫는 '위축 효과'가 생길 수 있다. 이 때문에 규제보다는 팩트체크 시스템과 미디어 리터러시 교육으로 시민의 판별력을 키우는 것이 근본 해법이라는 주장이 나온다.", "q": ["가짜뉴스에 대한 법적 규제와 표현의 자유 중 무엇을 더 우선해야 하는지 자신의 입장을 말해 보세요.", "정보가 진짜인지 판별하기 위해 자신이 실제로 사용하는 방법을 말해 보세요."], "guide": "【제시문 분석】 규제 찬성의 근거는 '전파 속도의 비대칭(6배)'과 '민주주의 훼손', 반대의 근거는 '판정 주체의 위험'과 '위축 효과'입니다. 핵심 질문은 '누가 진실을 판정할 자격이 있는가'입니다.\n【답변 구성】 [1] ① 입장 → ② 판정 주체의 위험성 검토 → ③ 규제가 필요한 최소 영역 한정 → ④ 근본 해법(리터러시) [2] 실제 사용하는 검증 습관을 2~3단계로 구체화", "a": ["저는 표현의 자유를 원칙으로 두고, 법적 규제는 최소한의 영역에만 적용해야 한다고 생각합니다.\n\n가장 큰 이유는 '누가 가짜를 판정하는가'의 문제입니다. 국가가 진실의 심판자가 되면, 권력에 불리한 보도가 가짜뉴스로 몰릴 위험이 생깁니다. 역사적으로 표현의 자유가 위축된 사회에서 가장 먼저 사라진 것은 거짓이 아니라 권력에 대한 비판이었습니다. 또 처벌이 무서워 시민들이 스스로 말을 아끼는 위축 효과는 민주주의에 가짜뉴스만큼 해롭다고 생각합니다. 다만 저는 모든 규제에 반대하지는 않습니다. 선거 기간의 조작된 딥페이크 영상처럼 고의성과 피해가 명백한 경우는 신속한 삭제와 처벌이 필요합니다. 즉 '내용이 틀린 말'이 아니라 '속이려고 조작한 증거물'에 규제를 한정하자는 것입니다. 그 바깥의 영역은 팩트체크와 시민의 판별력으로 걸러 내는 것이 옳다고 생각합니다.", "저는 세 단계로 확인합니다. 첫째, 출처를 봅니다. 어느 언론사인지, 기자 이름이 있는지, 아니면 출처 없이 캡처만 도는 글인지 확인합니다. 둘째, 교차 검증입니다. 충격적인 내용일수록 다른 언론에서도 다루는지 검색해 보고, 한 곳에서만 나오는 이야기는 판단을 보류합니다. 셋째, 저 자신의 감정을 점검합니다. 제시문에서 거짓이 6배 빨리 퍼지는 이유가 자극성 때문이라고 했는데, 제가 지금 화가 나서 공유하고 싶어진다면 오히려 한 번 더 의심해야 한다는 신호로 삼습니다. 완벽한 방법은 아니지만, '공유 전 10초 멈춤'만으로도 거짓 확산에 가담할 확률을 크게 줄일 수 있다고 생각합니다."], "tips": ["'6배'라는 수치는 이 제시문의 핵심 데이터입니다. 반드시 한 번 인용하세요.", "'무엇을 규제할 것인가'의 기준(내용의 진위가 아니라 조작의 고의성)을 스스로 세우면 최상위 답변이 됩니다.", "두 번째 질문은 지식이 아니라 습관을 묻는 것입니다. 실제로 하는 행동처럼 구체적으로 말하세요."]}, {"t": "착한 사마리아인 법 도입", "ty": "시사찬반", "p": "'착한 사마리아인 법'은 위험에 처한 사람을 큰 부담 없이 도울 수 있는데도 외면한 사람을 처벌하는 법이다. 프랑스는 위험에 처한 사람을 구조하지 않으면 최대 5년의 징역형에 처할 수 있고, 독일·핀란드 등도 유사한 규정을 두고 있다. 우리나라에는 아직 일반적인 구조 의무 조항이 없으며, 다만 응급 환자를 선의로 돕다가 생긴 결과에 대해 책임을 감면해 주는 '선한 사마리아인 조항'이 응급의료법에 있을 뿐이다.\n\n도입을 찬성하는 쪽은 생명이 위급한 순간의 외면은 단순한 무관심이 아니라 사회 공동체에 대한 배신이며, 법이 최소한의 연대 의식을 지켜 줘야 한다고 주장한다. 반대하는 쪽은 도덕의 영역까지 법이 개입하면 선행마저 처벌이 두려워서 하는 행동이 되어 도덕의 자율성이 훼손되고, '구할 수 있었는가'를 사후에 판정하기도 어렵다고 반박한다. 남을 돕다가 오히려 해를 입거나 소송에 휘말릴 것을 걱정하는 사회 분위기도 쟁점이다.", "q": ["착한 사마리아인 법 도입에 대한 자신의 입장을 '법과 도덕의 관계'를 언급하며 말해 보세요."], "guide": "【제시문 분석】 표면 쟁점은 법 도입 찬반이지만, 심층 쟁점은 '법이 도덕을 강제할 수 있는가'입니다. 찬성은 '최소한의 도덕은 법이 될 수 있다', 반대는 '강제된 선행은 선행이 아니다'로 요약됩니다.\n【답변 구성】 ① 법과 도덕의 관계에 대한 자기 기준 제시 → ② 입장 선언 → ③ 근거(생명이라는 가치의 특수성 등) → ④ 반대 논거 검토(판정의 어려움) → ⑤ 조건·보완책(선의의 구조자 보호 우선)으로 정리", "a": ["법과 도덕의 관계에 대해 저는 '모든 도덕을 법으로 만들 수는 없지만, 최소한의 도덕은 법이 될 수 있다'고 생각합니다. 그 기준에서 착한 사마리아인 법 도입에 신중한 찬성 입장입니다.\n\n찬성하는 이유는 이 법이 지키려는 가치가 '생명'이기 때문입니다. 물에 빠진 사람 옆에서 구조 요청 전화 한 통이면 살릴 수 있는데도 외면하는 것은, 개인의 자유라고 하기에는 공동체의 존립 기반을 무너뜨리는 행동입니다. 생명 앞에서의 최소한의 행동 의무는 법으로 정할 만한 '최소 도덕'에 해당한다고 생각합니다.\n\n다만 반대 측의 우려 중 '구할 수 있었는지를 사후에 판정하기 어렵다'는 지적은 무겁게 받아들여야 합니다. 그래서 저는 두 가지 조건을 달고 싶습니다. 첫째, 처벌 대상은 '자신에게 위험 부담이 거의 없는데도 신고조차 하지 않은 명백한 외면'으로 좁게 한정해야 합니다. 둘째, 처벌 조항보다 먼저 돕다가 생긴 결과에 대한 면책, 즉 선한 사마리아인 보호를 강화해야 합니다. 돕는 사람이 손해 보지 않는 사회를 먼저 만들고, 그다음에 외면을 처벌하는 것이 올바른 순서라고 생각합니다."], "tips": ["'법은 최소한의 도덕'이라는 명제를 알고 있으면 이 유형 전체에 응용할 수 있습니다.", "처벌 신설 논쟁에서는 '처벌보다 먼저 할 일(보호 장치)'을 짚으면 사려 깊다는 평가를 받습니다.", "프랑스 등 해외 사례는 '이미 시행하는 나라가 있다' 수준으로 짧게만 인용하세요."]}, {"t": "이상기후 시대, 기후 대응 비용의 분담", "ty": "시사찬반", "p": "산업화 이후 지구의 평균기온은 약 1.1도 상승했고, 2015년 파리협정에서 세계 각국은 상승 폭을 1.5도 이내로 억제하기로 합의했다. 문제는 비용의 분담이다. 지금까지 누적된 온실가스의 대부분은 미국·유럽 등 선진국의 산업화 과정에서 배출되었지만, 폭염·가뭄·해수면 상승의 피해는 배출 책임이 거의 없는 저개발 국가에 집중되고 있다. 이에 2022년 유엔 기후변화협약 총회에서는 기후 피해를 입은 개발도상국을 지원하는 '손실과 피해 기금'설립이 합의되었다.\n\n그러나 각론에서는 갈등이 계속된다. 선진국은 '현재 배출량 1위는 중국이며, 과거 세대의 행위를 현재 세대가 배상하는 것은 부당하다'고 주장한다. 개발도상국은 '선진국은 배출로 부유해졌고 우리는 발전의 기회조차 갖기 전에 규제부터 받는다'며, 역사적 책임에 비례한 부담을 요구한다. 우리나라는 누적 배출 기준 세계 상위권이면서 제조업 중심 경제라는 점에서, 이 논쟁의 한가운데에 있다.", "q": ["기후 대응 비용은 어떤 원칙으로 분담해야 공정한지, '역사적 책임'과 '현재의 배출량' 중 어디에 무게를 두어야 하는지 말해 보세요."], "guide": "【제시문 분석】 '배출의 책임'과 '피해의 분포'가 어긋나 있다는 것이 이 제시문의 핵심 구조입니다. 선진국 논리(현재 기준, 세대 단절)와 개도국 논리(역사적 책임, 발전권)의 근거를 각각 정리하세요.\n【답변 구성】 ① 공정한 분담의 원칙 선언 → ② 역사적 책임을 중시하는 이유(수익자 부담) → ③ 현재 기준의 타당성도 수용(중국 등 신흥 배출국) → ④ 절충 원칙(능력·책임 비례) → ⑤ 한국의 위치에 대한 언급으로 마무리", "a": ["저는 역사적 책임에 무게를 두되, 현재의 배출량과 경제적 능력을 함께 반영하는 혼합 원칙이 공정하다고 생각합니다.\n\n역사적 책임을 기본으로 삼는 이유는 '수익자 부담'의 원칙 때문입니다. 선진국은 온실가스를 배출하는 과정에서 지금의 부를 쌓았습니다. 이익은 자신이 갖고 비용은 피해국에 떠넘긴다면, 그것은 공정한 게임이 아닙니다. '과거 세대의 일을 왜 현재 세대가 책임지느냐'는 반론이 있지만, 현재 세대는 과거 배출로 만들어진 사회기반과 부를 그대로 물려받아 누리고 있으므로, 유산을 상속받으면서 부채만 거부할 수는 없다고 생각합니다.\n\n다만 역사적 책임만 따지면 현재 배출량 1위인 중국 같은 나라가 책임을 피해 가는 문제가 생깁니다. 그래서 저는 '누적 배출량, 현재 배출량, 지불 능력'이라는 세 가지 기준을 함께 반영해 분담금을 정하는 방식이 현실적이라고 생각합니다. 우리나라는 누적 배출 상위권이면서 기후 기술도 가진 나라이므로, 부담을 피하는 쪽이 아니라 기술 지원과 기금 기여로 신뢰를 쌓는 쪽이 장기적으로 국익에도 맞는 길이라고 생각합니다."], "tips": ["'수익자 부담 원칙'처럼 논거에 이름을 붙이면 기억에 남는 답변이 됩니다.", "국제 문제에서 마지막에 '한국의 역할'을 언급하면 세계시민 의식과 주인 의식을 함께 보여 줍니다.", "1.5도, 1.1도 같은 기본 수치는 정확하게 외워 두세요. 숫자가 틀리면 오히려 역효과입니다."]}, {"t": "우주개발 투자 논쟁", "ty": "시사찬반", "p": "2022년 우리나라는 자체 개발한 발사체 누리호 발사에 성공했고, 달 궤도선 다누리를 쏘아 올려 세계 7번째 달 탐사국이 되었다. 2024년에는 우주항공청이 설립되어 2045년 화성 착륙이라는 장기 목표를 발표했다. 세계 우주 산업 규모는 2040년까지 1조 달러 이상으로 성장할 것으로 전망되며, 위성통신·GPS·일기예보 등 우주 기술은 이미 일상의 기반이 되어 있다.\n\n그러나 '지구의 문제도 해결하지 못하면서 우주에 막대한 세금을 쓰는 것이 옳은가'라는 비판은 우주개발의 역사만큼 오래되었다. 1970년 잠비아의 수녀 유켄다는 화성 탐사를 준비하던 미국 항공우주국(NASA)에 '굶주리는 아이들이 있는데 왜 화성에 수십억 달러를 쓰느냐'는 편지를 보냈다. 당시 NASA의 과학자 슈투링거는 답장에서 '현미경을 연구하던 사람을 후원한 덕분에 훗날 전염병을 이기게 된 것처럼, 우주 연구는 돌고 돌아 지구의 문제를 해결하는 기술이 된다'고 답했다.", "q": ["복지와 우주개발 중 국가 예산의 우선순위에 대한 자신의 입장을 말하고, 슈투링거의 답장 논리를 평가해 보세요."], "guide": "【제시문 분석】 유켄다의 논리는 '긴급한 필요 우선', 슈투링거의 논리는 '장기 투자의 파급 효과'입니다. 이 문제는 둘 중 하나를 고르는 것이 아니라 '단기적 필요와 장기적 투자의 균형'을 어떻게 잡을지 묻는 문제입니다.\n【답변 구성】 ① 입장(이분법 거부 + 균형점 제시) → ② 슈투링거 논리의 타당성(스핀오프 기술) → ③ 그 논리의 한계(모든 지출을 정당화할 수는 없음) → ④ 우선순위 판단 기준 제시 → ⑤ 정리", "a": ["저는 이 문제를 '복지냐 우주냐'의 양자택일로 보지 않고, 국가 예산에는 오늘을 지키는 돈과 내일을 여는 돈이 모두 필요하다고 생각합니다. 다만 생존이 걸린 긴급한 복지가 흔들리지 않는 선에서 우주개발에 투자해야 한다는 입장입니다.\n\n슈투링거의 논리에는 타당한 부분이 많습니다. 실제로 우주 기술은 GPS와 일기예보, 위성통신처럼 돌고 돌아 모든 사람의 일상을 바꿨습니다. 당장 쓸모가 보이지 않는 연구가 훗날 가장 큰 쓸모를 만든 사례는 과학사에 반복해서 나타납니다. 하지만 이 논리에도 한계가 있습니다. '언젠가 도움이 된다'는 말은 어떤 지출에도 붙일 수 있어서, 그 자체로는 우선순위를 정하는 기준이 되지 못합니다. 굶주리는 아이에게 '30년 뒤의 파급 효과'는 답이 될 수 없기 때문입니다.\n\n그래서 저는 두 가지 기준을 제안하고 싶습니다. 첫째, 생명과 직결된 복지는 우주개발보다 항상 앞서는 최우선 지출로 보호해야 합니다. 둘째, 우주개발은 '남는 돈으로 하는 사치'가 아니라 통신·안보·산업의 미래가 걸린 전략 투자로 보고, 전체 예산의 일정 비율을 꾸준히 유지하는 것입니다. 오늘의 빵과 내일의 씨앗은 서로 빼앗는 관계가 아니라 함께 심어야 하는 관계라고 생각합니다."], "tips": ["유명한 딜레마 제시문은 '양자택일을 거부하고 판단 기준을 세우는' 답변이 정석입니다.", "슈투링거 논리를 평가할 때 타당성과 한계를 반드시 둘 다 말하세요. 한쪽만 말하면 절반의 답입니다.", "누리호·다누리 같은 우리나라 사례를 아는 것만으로도 시사 감각을 보여 줄 수 있습니다."]}, {"t": "능력주의와 불평등", "ty": "두제시문비교", "p": "(가) 한 사회의 불평등이 지나치게 커지면 구성원들의 불안과 스트레스가 커지고 사회 통합이 어려워진다. 연구에 따르면 불평등이 심한 사회일수록 범죄율과 정신 질환 비율이 높고 구성원 간의 신뢰가 낮다. 그런데 '능력이 지위를 결정한다'는 능력주의의 믿음은 이러한 불평등을 정당한 것으로 보이게 만든다. 성공한 사람은 자신의 능력 덕분에, 실패한 사람은 능력이 부족한 탓에 그렇게 되었다고 여기게 하기 때문이다. 그러나 개인의 능력은 타고난 재능, 부모의 지원, 교육 환경, 그리고 운이 함께 만들어 낸 결과이기도 하다.\n\n(나) \"나의 성공은 오로지 내 능력과 노력 덕분이다. 능력에 따라 보상이 달라지는 것은 당연하며, 능력 차이로 인한 불평등은 사람들이 더 노력하게 만드는 성장의 원동력이다. 결과를 똑같이 맞추려는 시도야말로 열심히 노력한 사람에 대한 역차별이다.\"", "q": ["(가)의 입장에서 (나) 화자의 주장을 평가하고, (가)에 대한 자신의 생각을 학습 경험이나 관찰 경험을 활용해 말해 보세요.", "우리 사회의 갈등 해소를 위해 자신이 기여하고 싶은 부분과 고등학교 진학 후의 학업 계획을 말해 보세요."], "guide": "【제시문 분석】 (가)의 핵심은 두 가지 — '지나친 불평등은 사회 전체에 해롭다'와 '능력은 온전히 내 것이 아니다(환경과 운의 산물)'입니다. (나)는 능력주의를 대표하는 목소리입니다. '(가)의 입장에서 평가하라'는 지시이므로 내 생각이 아니라 (가)의 논리로 (나)를 비판하는 것이 1단계입니다.\n【답변 구성】 [1] ① (가)의 관점 요약 → ② 그 관점에서 (나)의 허점 두 가지 지적 → ③ 이어서 (가)에 대한 내 입장 → ④ 경험 연결 [2] ① 기여하고 싶은 역할 → ② 그 이유(1번 답변과 연결) → ③ 구체적 학업 계획", "a": ["(가)의 입장에서 보면 (나) 화자의 주장은 두 가지 점에서 비판받게 됩니다. 첫째, '성공은 오로지 내 능력과 노력 덕분'이라는 생각은 능력이 만들어지는 과정을 놓치고 있습니다. (가)에 따르면 능력은 타고난 재능과 부모의 지원, 교육 환경, 운이 함께 만든 결과이므로, 성공을 온전히 개인의 공으로만 돌리는 것은 착각입니다. 둘째, 불평등을 성장의 원동력으로만 보는 시각은 지나친 불평등이 불안과 불신, 사회 통합의 훼손으로 이어진다는 (가)의 경고를 간과합니다. 저는 (가)의 문제의식에 공감합니다. 학교에서 멘토링 활동을 하며, 같은 시간을 노력해도 학원의 도움을 받을 수 있는 친구와 그렇지 못한 친구의 성과 차이가 큰 것을 보았습니다. 그때 노력의 결과처럼 보이는 것에도 보이지 않는 출발선의 차이가 숨어 있다는 것을 실감했습니다. 그래서 저는 노력에 따른 차등 보상은 인정하되, 교육 기회의 격차처럼 출발선의 차이를 보정하는 장치가 함께 있어야 경쟁 자체가 공정해진다고 생각합니다.", "저는 서로 다른 배경을 가진 사람들 사이의 '통역자' 역할로 갈등 해소에 기여하고 싶습니다. 앞서 말씀드린 것처럼 갈등의 상당 부분은 상대의 사정을 모르는 데서 시작된다고 생각하기 때문입니다. 중학교에서 학습 멘토링을 하며 서로 다른 처지의 친구들을 이어 본 경험이 있고, 진학 후에는 이것을 더 깊은 공부로 발전시키고 싶습니다. 구체적으로는 사회·경제 교과를 심화 학습하면서 불평등과 복지 제도를 주제로 탐구 보고서를 쓰고, 토론 동아리에서 능력주의 논쟁처럼 입장이 갈리는 주제로 서로의 논리를 검증하는 훈련을 하려고 합니다. 궁극적으로는 통계와 데이터로 사회 문제를 분석하는 힘을 길러, 감정이 아니라 근거로 갈등을 조정하는 사람이 되고 싶습니다."], "tips": ["'(가)의 입장에서'라는 조건을 지키는 것이 최우선입니다. 내 견해부터 말하면 문제를 잘못 읽은 것이 됩니다.", "경험은 거창할 필요 없이 '관찰한 것 + 그때 깨달은 것' 구조면 충분합니다.", "2번 문항은 1번과 논리적으로 이어져야 합니다. 갑자기 다른 사람이 된 것처럼 답하지 마세요."]}, {"t": "생성형 AI와 창의적 사고", "ty": "두제시문비교", "p": "(가) A학교는 생성형 AI가 학생들의 창의적 사고를 방해한다고 판단하여 교내에서 생성형 AI 사용을 차단하기로 했다. 스스로 고민해야 할 과정을 AI가 대신해 버리면 사고력이 자라지 않는다는 이유였다. 반면 B학교는 창의적 사고를 키우는 데 오히려 도움이 된다고 보고 생성형 AI 활용을 적극 장려하기로 했다. 아이디어를 넓히고 반복 작업을 줄여 더 높은 수준의 사고에 집중할 수 있다는 이유였다.\n\n(나) 창의적 사고란 무엇인가에 대해 갑과 을은 다르게 말한다. 갑: \"창의적 사고란 이미 존재하는 정보들 사이에서 남들이 보지 못한 새로운 관련성을 발견하는 능력이다.\" 을: \"창의적 사고란 누구나 당연하게 여기는 기존의 상식과 관습을 낯선 눈으로 다시 바라보고, 거기에 새로운 의미를 부여하는 능력이다.\"", "q": ["A학교와 B학교 중 지지하는 입장을 (나)의 창의적 사고 개념과 연관지어 말해 보세요.", "갑과 을 중 더 공감하는 의견을 이유와 자신의 경험과 함께 말해 보세요."], "guide": "【제시문 분석】 이 문제의 열쇠는 (가)와 (나)를 연결하는 것입니다. 갑의 개념(정보 간의 연결)을 택하면 B학교(AI는 연결의 재료를 넓혀 줌)와, 을의 개념(낯설게 보기)을 택하면 A학교(스스로 의심하는 과정이 핵심)와 자연스럽게 이어집니다. 어느 조합이든 '개념→학교 정책'의 연결 고리를 명시적으로 말해야 합니다.\n【답변 구성】 [1] ① 지지 학교 선언 → ② (나)의 개념 인용 → ③ 개념과 정책의 연결 논증 → ④ 부작용 방지 조건 [2] ① 선택 → ② 이유 → ③ 구체적 경험 → ④ 그 경험이 준 변화", "a": ["저는 B학교의 입장을 지지합니다. 그 근거를 (나)의 갑이 말한 창의적 사고 개념에서 찾고 싶습니다. 갑에 따르면 창의적 사고는 이미 존재하는 정보들 사이에서 새로운 관련성을 발견하는 능력입니다. 그렇다면 생성형 AI는 창의성을 대신하는 기계가 아니라, 연결할 수 있는 정보의 재료를 폭발적으로 넓혀 주는 도구가 됩니다. 혼자서는 만나지 못했을 분야의 지식을 AI를 통해 접하고, 그것들을 어떻게 연결할지는 결국 사람이 결정하기 때문입니다. 다만 A학교의 우려도 근거가 있습니다. AI가 내놓은 답을 그대로 받아쓰면 사고 과정 자체가 외주화되어, 연결을 발견하는 훈련의 기회가 사라집니다. 그래서 저는 B학교의 방향에 조건을 붙이고 싶습니다. AI에게 결과물을 요구하는 것이 아니라 질문을 던지고 검증하는 도구로 쓰도록 사용 규칙을 함께 가르쳐야, 장려가 창의성의 확장으로 이어진다고 생각합니다.", "저는 을의 의견에 더 공감합니다. 새로운 연결도 결국 '이것이 정말 당연한가'라는 의심에서 시작된다고 생각하기 때문입니다. 저의 경험을 말씀드리면, 매일 지나던 등굣길 횡단보도의 신호 대기 시간이 유난히 길다는 것을 어느 날 문득 낯설게 느낀 적이 있습니다. 늘 있던 일이라 아무도 궁금해하지 않았지만, '왜 이 길목만 다를까'라는 질문을 붙잡고 등교 시간대의 차량 흐름을 직접 세어 보았고, 그 결과를 정리해 교통 흐름에 관한 탐구 보고서로 발전시켰습니다. 이 경험에서 배운 것은, 창의성은 특별한 재능이 아니라 익숙한 것을 다시 바라보는 습관에서 나온다는 것입니다. 그 뒤로 저는 당연해 보이는 것에 '왜'를 붙여 보는 습관을 기르려고 노력하고 있고, 이것이 국제고에서 하고 싶은 사회 탐구의 출발점이라고 생각합니다."], "tips": ["(가)와 (나)를 따로 답하면 평범한 답변, 개념과 정책을 연결하면 상위권 답변입니다.", "경험은 '아주 작은 일상 관찰'이 오히려 좋습니다. 대단한 성과보다 사고의 과정이 드러나는 사례를 고르세요.", "1번에서 B를 골랐다면 2번에서 갑을, A를 골랐다면 을을 고르는 것이 논리적으로 자연스럽지만, 교차 선택도 연결 논리만 있으면 가능합니다."]}, {"t": "벌금의 두 방식 — 정액제와 소득비례제", "ty": "두제시문비교", "p": "(가) 우리나라의 벌금과 과태료는 위반 행위의 종류에 따라 금액이 정해져 있는 '정액제'다. 같은 신호 위반이면 누구나 같은 금액을 낸다. 법 앞의 평등이란 같은 행위를 같은 기준으로 처벌하는 것이며, 재산이 많다는 이유로 더 큰 벌을 받는다면 그것이야말로 차별이라는 논리가 바탕에 있다.\n\n(나) 핀란드의 속도위반 벌금은 위반자의 소득에 비례해 부과되는 '일수벌금제'다. 2023년 핀란드의 한 기업가는 과속으로 약 12만 유로, 우리 돈 1억 7천만 원이 넘는 벌금을 낸 적이 있다. 벌금의 목적이 '처벌의 고통을 통한 재발 방지'라면, 하루 생활비가 아쉬운 사람의 10만 원과 억만장자의 10만 원은 전혀 다른 무게를 갖는다. 같은 금액이 아니라 같은 고통이어야 진짜 평등이라는 논리다.", "q": ["(가)와 (나)에 담긴 '평등'에 대한 관점의 차이를 설명하고, 어느 방식이 더 정의롭다고 생각하는지 말해 보세요."], "guide": "【제시문 분석】 (가)는 형식적 평등(같은 행위 = 같은 금액), (나)는 실질적 평등(같은 행위 = 같은 고통)입니다. 두 입장 모두 '평등'을 내세운다는 점이 이 문제의 묘미입니다. 벌금의 '목적'(응보인가 예방인가)을 기준으로 판단하면 논리가 섭니다.\n【답변 구성】 ① 두 관점의 차이를 '형식적 평등 vs 실질적 평등'으로 개념화 → ② 판단 기준 제시(벌금의 목적) → ③ 입장 선언과 근거 → ④ 예상되는 부작용 검토 → ⑤ 절충 정리", "a": ["(가)와 (나)는 모두 평등을 말하지만 그 의미가 다릅니다. (가)는 같은 행위에 같은 금액을 매기는 형식적 평등을, (나)는 같은 행위에 같은 고통을 매기는 실질적 평등을 주장합니다. 즉 (가)는 '기준의 동일함'을, (나)는 '효과의 동일함'을 평등이라고 봅니다.\n\n어느 쪽이 정의로운지는 벌금의 목적이 무엇인지에 달려 있다고 생각합니다. 벌금의 목적은 국가의 수입이 아니라 잘못된 행동의 재발을 막는 것입니다. 그 기준에서 저는 (나)의 소득비례제가 더 정의롭다고 생각합니다. 정액제 아래에서 벌금은 부유한 사람에게 사실상 '위반할 수 있는 요금'이 됩니다. 10만 원이 아무렇지 않은 사람에게 10만 원짜리 벌금은 억제 효과가 없고, 결국 같은 법이 어떤 사람에게는 금지로, 어떤 사람에게는 가격표로 작동하게 됩니다. 이것이야말로 법 적용의 실질적 불평등이라고 생각합니다.\n\n다만 소득비례제에도 보완할 점이 있습니다. 소득 파악이 정확하지 않으면 오히려 불공정해지고, 벌금이 지나치게 커지면 행위에 비해 과도한 처벌이 될 수 있습니다. 그래서 상한선을 두고, 우선은 과속처럼 반복성이 강한 위반부터 단계적으로 도입하는 것이 현실적이라고 생각합니다. 정리하면, 평등은 겉모습의 동일함이 아니라 법이 모든 사람에게 같은 무게로 작동하는 것이라고 생각합니다."], "tips": ["'형식적 평등 vs 실질적 평등'이라는 개념어로 두 관점을 명명하면 비교 문제의 절반은 성공입니다.", "'벌금이 부자에게는 가격표가 된다'처럼 핵심을 찌르는 한 문장을 준비하세요.", "비교 문제에서 판단 기준(벌금의 목적)을 먼저 세우고 판정하는 순서를 지키면 논리적이라는 평가를 받습니다."]}, {"t": "다수결은 언제나 옳은가 — 두 개의 시선", "ty": "두제시문비교", "p": "(가) 고대 아테네의 철학자 플라톤은 민주주의를 경계했다. 배를 조종하는 일은 항해술을 아는 선장이 해야 하는데, 민주주의는 항해술을 모르는 승객 다수의 투표로 뱃길을 정하는 것과 같다는 것이다. 다수는 전문 지식이 아니라 감정과 눈앞의 이익에 따라 판단하기 쉬우며, 실제로 아테네의 민회는 선동가의 말에 휩쓸려 스승 소크라테스에게 사형을 선고했다.\n\n(나) 아리스토텔레스는 다르게 보았다. 한 사람 한 사람은 부족해도, 여럿이 모이면 각자가 가진 부분적인 지혜와 경험이 합쳐져 소수의 전문가보다 나은 판단에 이를 수 있다는 것이다. 여러 사람이 낸 음식이 한 사람이 차린 잔치보다 풍성한 것과 같다. 현대의 연구들도 다양한 배경의 사람들이 모인 집단이 동질적인 전문가 집단보다 예측과 문제 해결에서 더 나은 성과를 내는 경우가 많다는 것을 보여 준다.", "q": ["(가)와 (나)의 관점 차이를 설명하고, 다수의 판단이 실패하지 않기 위해 필요한 조건을 자신의 경험과 함께 말해 보세요."], "guide": "【제시문 분석】 (가)는 다수의 판단을 '무지와 감정'으로, (나)는 '집단 지성'으로 봅니다. 쟁점은 다수결 자체의 옳고 그름이 아니라 '어떤 조건에서 다수가 현명해지는가'입니다. 문제도 그 조건을 물으므로, 두 제시문을 종합하는 방향으로 설계된 문항입니다.\n【답변 구성】 ① 두 관점의 차이 요약(판단 재료: 감정 vs 집합된 지혜) → ② 종합: 다수는 조건에 따라 우매해지기도 현명해지기도 함 → ③ 조건 2~3가지 제시(정보 공유, 자유로운 반대, 다양성) → ④ 경험 연결 → ⑤ 정리", "a": ["(가)는 다수를 전문 지식 없이 감정에 휩쓸리는 존재로 보고, (나)는 각자의 부분적 지혜가 모이면 전문가를 넘어설 수 있는 존재로 봅니다. 같은 '다수'를 놓고 (가)는 최악의 모습을, (나)는 최선의 모습을 그리고 있는 셈입니다.\n\n저는 두 제시문이 모순이 아니라 조건의 차이를 보여 준다고 생각합니다. 다수는 언제나 옳지도, 언제나 어리석지도 않으며, 어떤 조건에서 판단하느냐에 따라 소크라테스를 죽인 군중이 되기도 하고 집단 지성이 되기도 합니다. 다수의 판단이 실패하지 않으려면 세 가지 조건이 필요하다고 생각합니다. 첫째, 판단에 필요한 정보가 모두에게 충분히 공유되어야 합니다. 둘째, 반대 의견을 말해도 불이익이 없는 분위기가 있어야 합니다. 셋째, 비슷한 사람들만 모여 있지 않아야 합니다. 다양성이 없으면 여러 명이 있어도 사실상 한 사람의 생각과 같기 때문입니다.\n\n저의 경험으로, 학급 회의에서 체육대회 종목을 정할 때 처음에는 목소리 큰 몇 명의 의견으로 기울었지만, 담임 선생님이 무기명 사전 조사와 찬반 토론을 거치게 하자 전혀 다른 결론이 나왔고 만족도도 훨씬 높았습니다. 같은 다수결이라도 절차가 판단의 질을 바꾼다는 것을 그때 배웠습니다. 결국 민주주의의 수준은 다수결의 유무가 아니라 다수결 앞에 놓인 토론과 정보의 질이 결정한다고 생각합니다."], "tips": ["두 제시문을 '모순'이 아니라 '조건의 차이'로 종합하는 순간, 비교 문제의 최상위 답변이 됩니다.", "학급 회의, 모둠 활동 등 작은 경험이 이 주제와 정확히 연결됩니다. 미리 하나 정리해 두세요.", "소크라테스 사형처럼 제시문 속 역사적 사례를 한 번 인용하면 독해의 깊이가 드러납니다."]}, {"t": "영어 공용어화 논쟁", "ty": "두제시문비교", "p": "(가) \"세계 학술 논문의 대부분과 인터넷 정보의 절반 가까이가 영어로 생산된다. 영어를 공용어로 쓰면 지식 접근의 격차가 줄고, 국제 무대에서 우리 인재들의 경쟁력이 높아진다. 싱가포르는 영어를 공용어로 채택해 국제 금융과 물류의 중심지가 되었다. 언어는 도구일 뿐이며, 더 유용한 도구를 택하는 것은 실용적인 선택이다.\"\n\n(나) \"언어는 단순한 도구가 아니라 공동체의 기억과 사고방식이 담긴 그릇이다. '정(情)'이나 '한(恨)'처럼 다른 언어로 옮기기 어려운 말에는 그 공동체만의 세계관이 담겨 있다. 언어학자들은 21세기 말까지 세계 언어의 절반이 사라질 것으로 전망하는데, 언어가 사라지면 그 언어로만 표현되던 생각의 방식도 함께 사라진다. 모국어의 힘이 약해진 사회에서는 깊은 사고와 창작도 함께 약해진다.\"", "q": ["(가)와 (나)의 언어관 차이를 비교하고, 영어 공용어화에 대한 자신의 입장을 말해 보세요.", "외국어를 배우는 진짜 목적은 무엇이라고 생각하는지 자신의 언어 학습 경험과 함께 말해 보세요."], "guide": "【제시문 분석】 (가)의 언어관은 '도구'(효율·경쟁력), (나)의 언어관은 '정체성의 그릇'(세계관·사고)입니다. 이 대비를 먼저 명확히 말한 뒤 입장을 정하세요. 외고·국제고 지원자라면 이 주제는 지원 동기와도 연결되는 핵심 문항입니다.\n【답변 구성】 [1] ① 두 언어관 비교(도구 vs 그릇) → ② 입장 → ③ 근거 → ④ 상대 관점 수용(영어 교육 강화와 공용어화는 다른 문제) [2] ① 목적에 대한 자기 정의 → ② 경험 → ③ 배움의 확장", "a": ["(가)는 언어를 지식과 기회에 접근하는 도구로 보고, (나)는 언어를 공동체의 사고방식이 담긴 그릇으로 봅니다. 도구라면 더 좋은 것으로 바꾸면 되지만, 그릇이라면 바꾸는 순간 담겨 있던 것을 잃게 됩니다.\n\n저는 영어 공용어화에 반대합니다. 다만 (가)가 말하는 영어 능력의 중요성 자체는 인정합니다. 제가 반대하는 이유는, 영어를 '잘하는 것'과 영어를 '공용어로 삼는 것'은 전혀 다른 문제이기 때문입니다. 공용어화는 행정과 교육의 언어를 바꾸는 일이고, 그 순간 한국어는 공적 영역에서 밀려나 (나)가 경고한 언어 축소의 길을 걷게 됩니다. 또 모두가 영어를 잘하게 되기보다는, 영어 능력에 따라 새로운 계층이 생기는 부작용이 먼저 올 가능성이 큽니다. 싱가포르의 성공은 여러 민족을 묶을 중립어가 필요했던 특수한 역사적 조건의 결과이므로 우리에게 그대로 적용하기 어렵습니다. 결론적으로 저는 '한국어로 깊이 사고하고 영어로 넓게 소통하는' 이중의 능력을 기르는 것이 공용어화보다 나은 길이라고 생각합니다.", "저는 외국어를 배우는 진짜 목적이 '다른 방식으로 생각해 보는 것'이라고 생각합니다. 처음에는 저도 시험과 경쟁력 때문에 영어를 공부했습니다. 그런데 영어 원서를 읽으면서, 같은 상황을 한국어와 영어가 전혀 다르게 표현한다는 것을 발견했습니다. 예를 들어 우리말의 '눈치'에 딱 맞는 영어 단어가 없다는 것을 알았을 때, 언어마다 세상을 자르는 방식이 다르다는 (나)의 말이 실감 났습니다. 그 뒤로 외국어 공부가 단어 암기가 아니라 다른 문화의 사고방식을 여행하는 일로 느껴졌고, 표현 하나를 배울 때도 '이 말을 쓰는 사람들은 세상을 어떻게 보는 걸까'를 생각하게 되었습니다. 이렇게 언어를 통해 관점을 넓히는 공부를 국제고에서 더 깊게 하고 싶습니다."], "tips": ["외고·국제고 면접에서 언어관 문항은 지원 동기와 연결되는 기회입니다. 마지막 한 문장으로 자연스럽게 연결하세요.", "'영어 능력 강화'와 '공용어화'를 구분하는 것이 이 논쟁의 급소입니다.", "'눈치', '정'처럼 번역이 어려운 우리말 사례를 하나 준비해 두면 여러 문항에 활용할 수 있습니다."]}, {"t": "자연을 보는 두 관점 — 지배와 공존", "ty": "두제시문비교", "p": "(가) 근대 과학의 아버지로 불리는 베이컨은 \"아는 것이 힘\"이라며, 인간은 자연을 관찰하고 실험하여 그 법칙을 알아내고, 그 지식으로 자연을 인간의 삶에 봉사하도록 만들어야 한다고 보았다. 이러한 자연관 위에서 인류는 질병을 정복하고 식량을 늘리며 눈부신 문명을 건설했다. 자연은 인간이 개발하고 이용해야 할 자원의 창고였다.\n\n(나) 생태학자 레오폴드는 '대지 윤리'를 주장했다. 인간은 자연의 정복자가 아니라 흙과 물, 동식물과 함께 살아가는 대지 공동체의 한 구성원일 뿐이며, 공동체의 다른 구성원을 대하듯 자연을 존중해야 한다는 것이다. 그는 \"어떤 행동이 생명 공동체의 온전함과 아름다움을 지키면 옳고, 그렇지 않으면 그르다\"고 말했다. 기후위기와 생물 다양성 감소는 (가)의 자연관이 낳은 청구서라는 반성도 이 관점에서 나온다.", "q": ["(가)와 (나)의 자연관을 비교하고, 기후위기 시대에 어떤 관점이 필요한지 자신의 견해를 말해 보세요."], "guide": "【제시문 분석】 (가)는 인간중심주의(자연=자원), (나)는 생태중심주의(자연=공동체)입니다. 단순히 (나)가 착해 보인다고 고르지 말고, (가)가 인류에게 준 것(의학·식량)도 공정하게 평가한 뒤 종합하는 것이 고득점 전략입니다.\n【답변 구성】 ① 두 자연관 비교(자원 vs 공동체) → ② (가)의 공과 한계 평가 → ③ 자신의 관점 → ④ 관점이 실제 행동을 어떻게 바꾸는지 사례 → ⑤ 정리", "a": ["(가)는 자연을 인간이 알아내고 이용해야 할 자원으로 보는 인간 중심의 관점이고, (나)는 인간을 자연이라는 공동체의 한 구성원으로 보는 생태 중심의 관점입니다. (가)에서 자연은 수단이지만, (나)에서 자연은 함께 사는 이웃입니다.\n\n저는 (가)를 무조건 버려야 할 낡은 생각으로 보지는 않습니다. 질병을 이기고 굶주림을 줄인 것은 분명히 (가)의 자연관이 이룬 성취이기 때문입니다. 문제는 그 관점이 '자연은 무한하다'는 잘못된 전제 위에 서 있었다는 점입니다. 기후위기와 생물 다양성 감소는 그 전제가 틀렸다는 것을 보여 주는 청구서라고 생각합니다. 그래서 저는 기후위기 시대에는 (나)의 관점을 기본으로 삼되, (가)가 발전시킨 과학의 힘을 자연 정복이 아니라 공존의 기술로 돌려 쓰는 태도가 필요하다고 생각합니다. 예를 들어 같은 과학기술이라도 갯벌을 매립하는 데 쓰일 수도 있고, 갯벌의 탄소 흡수량을 측정해 보전의 근거를 만드는 데 쓰일 수도 있습니다. 관점이 바뀌면 같은 지식의 쓰임이 바뀝니다. 결국 필요한 것은 과학을 버리는 것이 아니라, 과학의 방향을 정하는 윤리를 (나)에서 가져오는 것이라고 생각합니다."], "tips": ["비교 문제에서 한쪽을 악역으로 만들면 사고가 단순해 보입니다. (가)의 공로를 먼저 인정하세요.", "'같은 기술도 관점에 따라 쓰임이 달라진다'는 구도는 과학기술 관련 문항 전반에 응용됩니다.", "레오폴드의 '대지 공동체' 같은 제시문 속 핵심 용어는 그대로 인용하는 것이 좋습니다."]}, {"t": "경쟁과 협력, 무엇이 성장을 만드는가", "ty": "두제시문비교", "p": "(가) \"경쟁은 발전의 엔진이다. 시장에서 기업들이 경쟁하기에 더 좋은 제품이 나오고, 운동선수들은 경쟁자가 있기에 기록을 단축한다. 경쟁이 없는 조직은 긴장을 잃고 정체된다. 적절한 경쟁 상대의 존재야말로 개인이 자신의 한계를 넘게 만드는 가장 확실한 자극이다.\"\n\n(나) \"인류가 다른 종을 압도한 비결은 경쟁이 아니라 협력이다. 인간은 낯선 사람과도 규칙을 만들어 대규모로 협력할 수 있는 유일한 동물이다. 지나친 경쟁은 구성원을 소진시키고, 정보를 감추게 하며, 동료를 잠재적 적으로 만든다. 오늘날의 과학 연구와 기업 프로젝트는 한 명의 천재가 아니라 팀의 협업으로 이루어진다.\"", "q": ["(가)와 (나)의 주장을 비교하고, 경쟁과 협력의 바람직한 관계에 대한 자신의 생각을 학교생활의 사례를 들어 말해 보세요."], "guide": "【제시문 분석】 (가)는 경쟁을 성장의 자극으로, (나)는 협력을 인류의 본질적 힘으로 봅니다. 이 문제는 양자택일이 아니라 '두 원리의 관계 설정'을 요구합니다. '경쟁의 단위'(개인 간 경쟁 vs 팀 간 경쟁)라는 틀을 쓰면 종합이 쉬워집니다.\n【답변 구성】 ① 두 관점 요약 → ② 관계 설정(대립이 아니라 층위가 다름) → ③ 자기 원칙 제시 → ④ 학교생활 사례 → ⑤ 진학 후 태도로 연결", "a": ["(가)는 경쟁이 개인을 한계 너머로 밀어 올리는 자극이라고 보고, (나)는 협력이야말로 인간의 가장 큰 힘이며 지나친 경쟁은 공동체를 갉아먹는다고 봅니다.\n\n저는 두 주장이 대립한다기보다 작동하는 층위가 다르다고 생각합니다. 저의 원칙은 '팀 안에서는 협력, 목표와는 경쟁'입니다. 경쟁의 상대를 옆 사람이 아니라 어제의 나와 더 높은 기준으로 설정하면, 경쟁의 자극과 협력의 힘을 동시에 얻을 수 있기 때문입니다.\n\n실제로 중학교 과학 모둠 발표에서 이것을 경험했습니다. 처음에 저희 모둠은 발표 잘하는 친구에게 의존하고 나머지는 소극적이었는데, 반 대항 평가라는 '팀 바깥의 경쟁'이 생기자 오히려 모둠 안에서 역할을 나누고 자료를 공유하는 협력이 살아났습니다. 반대로 수행평가 점수를 두고 모둠 안에서 서로 견제했던 다른 활동에서는 정보를 감추느라 결과물의 질이 떨어졌습니다. 이 경험으로 저는 경쟁을 어디에 두느냐가 조직의 분위기를 결정한다는 것을 배웠습니다. 진학 후에도 성적 경쟁이 치열하겠지만, 친구를 이겨야 할 상대가 아니라 함께 기준을 높이는 동료로 삼는 태도를 지키고 싶습니다. 그것이 결국 저 자신의 성장에도 가장 유리한 전략이라고 생각합니다."], "tips": ["'어제의 나와 경쟁한다'는 상투적 표현은 사례가 뒷받침될 때만 힘을 갖습니다. 반드시 구체적 경험과 함께 쓰세요.", "'경쟁의 단위(개인/팀)'라는 분석 틀은 기숙사 생활, 동아리 등 인성 문항에도 응용됩니다.", "자사고·기숙형 학교라면 이 답변이 공동체 적응력의 증거로 읽힌다는 점을 의식하세요."]}, {"t": "자유와 평등은 충돌하는가", "ty": "두제시문비교", "p": "(가) \"자유를 앞세우면 평등이 무너진다. 각자가 자유롭게 재산을 모으고 경쟁하도록 두면, 출발점의 차이와 운의 차이가 쌓여 격차는 점점 벌어진다. 자유 시장을 가장 강조한 사회들에서 상위 1%로의 부의 집중이 가장 빠르게 진행되었다. 평등은 저절로 오지 않으며, 자유의 일부를 제한하는 제도를 통해서만 지켜진다.\"\n\n(나) \"평등을 앞세우면 자유가 무너진다. 결과를 똑같이 만들려는 시도는 필연적으로 더 열심히 일한 사람의 몫을 강제로 떼어 내야 하고, 그 과정에서 국가의 개입은 점점 커진다. 개인의 선택과 노력의 의미가 사라진 사회에서는 창의도 활력도 사라진다. 역사상 완전한 평등을 약속했던 체제들은 예외 없이 자유의 억압으로 끝났다.\"", "q": ["(가)와 (나)가 각각 경계하는 것이 무엇인지 설명하고, 자유와 평등의 관계를 자신의 관점으로 정리해 말해 보세요."], "guide": "【제시문 분석】 (가)는 '방치된 자유가 낳는 불평등'을, (나)는 '강제된 평등이 낳는 억압'을 경계합니다. 양쪽 모두 극단의 위험을 말하고 있으므로, 종합의 열쇠는 '어떤 평등인가'를 구분하는 것입니다(기회의 평등 vs 결과의 평등).\n【답변 구성】 ① 두 제시문이 경계하는 극단 정리 → ② 개념 구분 도입(기회/결과의 평등) → ③ 자기 관점: 자유와 평등의 상호 보완 관계 논증 → ④ 사례 → ⑤ 정리", "a": ["(가)가 경계하는 것은 자유방임이 낳는 격차의 누적이고, (나)가 경계하는 것은 결과의 평등을 강제할 때 커지는 국가의 억압입니다. 두 제시문은 서로 다른 극단의 실패를 보여 주고 있습니다.\n\n저는 이 긴장을 푸는 열쇠가 '어떤 평등을 말하는가'의 구분에 있다고 생각합니다. (나)가 비판하는 것은 결과의 평등입니다. 노력과 상관없이 몫을 똑같이 맞추는 것은 실제로 자유와 활력을 해칩니다. 그러나 (가)가 요구하는 것을 기회의 평등으로 읽으면 이야기가 달라집니다. 출발선이 지나치게 다르면 경주 자체가 무의미해지듯, 기회의 평등이 없는 자유는 강자만의 자유가 되기 때문입니다.\n\n그래서 저는 자유와 평등이 적이 아니라 서로의 조건이라고 생각합니다. 기회의 평등은 모든 사람의 자유를 실질적인 것으로 만들어 주고, 자유로운 경쟁은 평등한 기회가 있을 때에만 정당성을 얻습니다. 예를 들어 의무교육 제도는 개인의 자유를 일부 제한하고 세금을 쓰지만, 그 덕분에 모든 아이가 자신의 삶을 선택할 자유를 갖게 됩니다. 결론적으로 저는 결과의 평등이 아닌 기회의 평등을 지키는 선에서 자유를 최대한 보장하는 것이, 두 가치를 함께 살리는 길이라고 생각합니다."], "tips": ["'기회의 평등 vs 결과의 평등' 구분은 사회 논술·면접의 만능열쇠입니다. 정확히 익혀 두세요.", "의무교육처럼 두 가치가 함께 실현된 제도 사례를 들면 추상적 논의가 단단해집니다.", "두 제시문 모두 '극단'을 비판한다는 공통점을 발견하면 독해력 점수가 올라갑니다."]}, {"t": "성장이 먼저인가, 분배가 먼저인가", "ty": "두제시문비교", "p": "(가) \"파이를 키우는 것이 먼저다. 나눌 것이 없는데 나누는 방법부터 논의하는 것은 순서가 틀렸다. 경제가 성장하면 일자리가 늘고 세금 수입이 증가해 복지에 쓸 재원도 커진다. 1960~80년대 한국은 성장에 집중한 덕분에 절대 빈곤에서 벗어났다. 분배를 앞세워 기업 활동이 위축되면 결국 가장 큰 피해는 취약계층이 입는다.\"\n\n(나) \"분배는 성장의 결과가 아니라 조건이다. 격차가 지나치면 다수의 구매력이 떨어져 내수가 위축되고, 교육 격차로 인재가 사장되어 성장 잠재력 자체가 훼손된다. 국제통화기금(IMF)조차 '지나친 불평등은 성장을 저해한다'는 보고서를 냈다. 낙수효과, 즉 위쪽의 부가 아래로 흘러내린다는 가설은 여러 나라에서 기대만큼 작동하지 않았다.\"", "q": ["(가)와 (나)의 논리 구조를 비교하고, 두 입장을 종합할 수 있는 자신의 관점을 제시해 보세요."], "guide": "【제시문 분석】 (가)는 '성장→재원→분배'의 순차 논리, (나)는 '분배→구매력·인재→성장'의 순환 논리입니다. 양쪽 모두 '결국 상대가 원하는 것도 내 방식으로 달성된다'고 주장하는 구조임을 포착하세요.\n【답변 구성】 ① 두 논리 구조 비교(순서의 논리 vs 조건의 논리) → ② 각 논리가 잘 맞는 상황 구분(발전 단계, 격차 수준) → ③ 종합 관점 제시 → ④ 현재 우리 사회에의 적용 → ⑤ 정리", "a": ["(가)는 성장이 재원을 만들고 그 재원이 분배를 가능하게 한다는 '순서'의 논리이고, (나)는 적절한 분배가 있어야 구매력과 인재가 유지되어 성장이 가능하다는 '조건'의 논리입니다. 흥미로운 것은 두 입장 모두 자기 방식이 결국 상대의 목표까지 이뤄 준다고 주장한다는 점입니다.\n\n저는 두 논리가 각각 맞는 상황이 다르다고 생각합니다. 절대 빈곤이 문제였던 시기에는 (가)처럼 파이를 키우는 것이 최선이었습니다. 나눌 것 자체가 없었기 때문입니다. 그러나 이미 파이가 커진 뒤에도 격차가 계속 벌어지는 사회에서는 (나)의 경고가 현실이 됩니다. 교육 격차로 재능 있는 아이가 기회를 잃으면 그것은 형평의 문제이기 전에 성장 동력의 손실이기 때문입니다.\n\n그래서 저의 관점은 '성장이냐 분배냐'가 아니라 '어떤 분배가 성장을 돕는가'를 묻는 것입니다. 단순한 현금 지원보다는 교육, 직업 훈련, 창업 지원처럼 사람의 능력을 키우는 분배에 집중하면, 분배가 소비를 넘어 투자가 됩니다. 지금의 우리 사회는 절대 빈곤의 단계는 지났으므로, 성장의 과실이 기회의 확대로 이어지도록 설계하는 것이 두 제시문을 모두 살리는 길이라고 생각합니다."], "tips": ["'두 입장 모두 상대의 목표를 자기 방식으로 이룬다고 주장한다'는 구조 발견이 이 문제의 독해 포인트입니다.", "'시기와 조건에 따라 답이 다르다'는 접근은 경제 논쟁 전반에 통하는 종합 전략입니다.", "'사람에게 투자하는 분배'처럼 대립을 넘어서는 제3의 개념을 제시하면 최상위 답변이 됩니다."]}, {"t": "개발이냐 보전이냐 — 국립공원 케이블카", "ty": "두제시문비교", "p": "(가) \"설악산 케이블카는 40년 넘게 이어진 지역의 숙원 사업이다. 케이블카가 생기면 연간 수십만 명의 관광객이 늘어 침체된 지역 경제가 살아나고, 노약자와 장애인도 산 정상의 풍경을 누릴 수 있게 된다. 오히려 등산객이 흩어지지 않고 케이블카로 이동하면 등산로 훼손이 줄어든다는 주장도 있다. 스위스 알프스는 수많은 케이블카를 운영하며 관광과 환경을 함께 지키고 있다.\"\n\n(나) \"설악산은 천연보호구역이자 멸종위기종 산양의 서식지다. 공사와 운영 과정의 소음·진동은 야생동물의 서식지를 조각내고, 정상부에 몰리는 인파는 아고산대의 연약한 식생을 훼손한다. 한번 파괴된 생태계는 복원에 수십 년이 걸리거나 영영 돌아오지 않는다. 경제 효과 전망치도 부풀려진 경우가 많아, 전국의 지자체 케이블카 상당수가 적자 운영 중이다. 자연의 가치는 이용객 수로 환산할 수 없다.\"", "q": ["(가)와 (나)의 핵심 근거를 정리하고, 자신이 정책 결정자라면 어떤 기준과 절차로 결정할지 말해 보세요."], "guide": "【제시문 분석】 (가)의 근거는 경제 효과, 접근권(노약자·장애인), 훼손 감소 가설, 해외 사례. (나)의 근거는 생태 훼손의 비가역성, 경제 효과의 불확실성(적자 사례)입니다. 질문이 '입장'이 아니라 '기준과 절차'를 묻는다는 점에 주목하세요.\n【답변 구성】 ① 양측 근거 요약 → ② 판단의 제1기준 제시(비가역성) → ③ 검증 절차 설계(독립적 환경평가, 경제성 재검증) → ④ 조건부 결론 → ⑤ 갈등 조정 방안", "a": ["(가)의 핵심 근거는 지역 경제 활성화와 노약자·장애인의 접근권이고, (나)의 핵심 근거는 생태계 훼손의 비가역성과 경제 효과의 불확실성입니다.\n\n제가 정책 결정자라면 '되돌릴 수 있는가'를 판단의 제1기준으로 삼겠습니다. 경제적 손실은 다른 정책으로 만회할 수 있지만, 멸종위기종의 서식지는 한번 무너지면 되돌릴 수 없기 때문입니다. 이 기준에 따라 저는 세 단계의 절차를 거쳐 결정하겠습니다. 첫째, 이해관계가 없는 독립 기관의 생태 조사를 통해 산양 서식지에 미치는 영향이 복원 가능한 수준인지 검증하겠습니다. 둘째, 케이블카의 경제 효과를 찬성 측 전망치가 아니라 이미 운영 중인 전국 케이블카의 실제 수지 데이터로 재검증하겠습니다. 제시문처럼 상당수가 적자라면 '경제를 위해 환경을 희생한다'는 전제 자체가 무너지기 때문입니다. 셋째, 두 검증을 통과할 경우에만 운행 대수 제한, 정상부 출입 통제, 수익 일부의 생태 기금화 같은 조건을 붙여 승인하겠습니다.\n\n마지막으로 어떤 결론이 나든, 결정 과정에 지역 주민과 환경단체가 함께 참여하는 공론화 절차를 거치겠습니다. 결과 못지않게 절차의 공정성이 갈등의 크기를 결정한다고 생각하기 때문입니다."], "tips": ["'입장'이 아니라 '기준과 절차'를 묻는 문제입니다. 찬반 선언으로 시작하면 질문을 놓친 것입니다.", "'비가역성'은 환경 문제 전반에서 가장 강력한 판단 기준입니다. 개념으로 기억해 두세요.", "상대 진영의 데이터(적자 사례)로 상대의 전제를 검증하는 방식은 자료해석형 문제에도 통합니다."]}, {"t": "전통시장 보호와 소비자의 선택", "ty": "두제시문비교", "p": "(가) \"대형마트 의무휴업제는 골목상권과 전통시장을 지키기 위한 최소한의 안전망이다. 자본력에서 상대가 되지 않는 경쟁을 시장에만 맡기면 소상공인은 고사하고, 지역 상권이 무너지면 그 피해는 결국 지역 공동체 전체가 입는다. 유럽 여러 나라도 대형 상업시설의 영업시간을 규제하며 소상공인과 노동자를 보호한다.\"\n\n(나) \"의무휴업 10년의 결과를 보면, 대형마트가 쉬는 날 소비자들이 전통시장으로 가는 대신 온라인 쇼핑으로 옮겨 갔다는 조사가 많다. 규제의 비용은 맞벌이 가정처럼 주말에만 장을 볼 수 있는 소비자가 치르고 있다. 경쟁자를 묶어 두는 방식의 보호는 전통시장의 경쟁력을 키우지 못했고, 진짜 승자는 규제 밖의 온라인 유통이었다. 보호가 아니라 혁신 지원이 답이다.\"", "q": ["(가)와 (나)의 주장과 근거를 비교하고, 소상공인을 위한 더 나은 정책 방향을 제안해 보세요."], "guide": "【제시문 분석】 (가)는 '보호의 정당성'(공동체 가치, 힘의 불균형), (나)는 '보호의 실효성 부족'(풍선효과: 온라인으로 이동, 소비자 비용)을 근거로 합니다. (나)가 정책의 '결과 데이터'를 근거로 삼는다는 점이 논리적 강점입니다.\n【답변 구성】 ① 두 주장 비교(가치의 논리 vs 효과의 논리) → ② 평가: 목적은 정당하나 수단이 낡음 → ③ 대안 제시(경쟁력 강화형 지원 2~3가지) → ④ 정리", "a": ["(가)는 힘의 불균형과 지역 공동체의 가치를 들어 보호의 정당성을 주장하고, (나)는 지난 10년의 결과 데이터를 들어 그 보호가 실효성이 없었다고 반박합니다. (가)가 '무엇이 옳은가'의 논리라면, (나)는 '무엇이 작동하는가'의 논리입니다.\n\n저는 (가)의 목적은 정당하지만 수단은 (나)의 지적대로 낡았다고 생각합니다. 소상공인 보호라는 목표 자체는 지역 공동체를 위해 여전히 중요합니다. 하지만 소비의 무게중심이 온라인으로 넘어간 시대에 오프라인 경쟁자만 묶어 두는 규제는, 전통시장을 돕지 못하면서 소비자의 불편만 남기는 정책이 되었습니다.\n\n그래서 저는 '경쟁자를 묶는 보호'에서 '경쟁력을 키우는 지원'으로 방향을 바꿔야 한다고 제안합니다. 첫째, 전통시장의 온라인 진출 지원입니다. 시장 상품을 묶어 배송하는 공동 물류와 온라인 장보기 시스템을 구축하면, 시장도 바뀐 소비 환경 안에서 싸울 수 있습니다. 둘째, 시장만이 줄 수 있는 경험을 키우는 것입니다. 청년 상인 창업 지원과 지역 축제 연계로 '가 볼 이유'를 만드는 것입니다. 셋째, 의무휴업 규제는 지역별 상권 데이터를 근거로 효과가 확인되는 곳에만 유지하는 유연화가 필요합니다. 좋은 정책의 기준은 취지가 아니라 실제로 약자의 삶이 나아졌는가라고 생각합니다."], "tips": ["'가치의 논리 vs 효과의 논리'라는 비교 프레임은 규제 논쟁 전반에 쓸 수 있습니다.", "'목적은 정당, 수단은 재검토'는 정책 평가 문제의 대표적인 균형 답안 구조입니다.", "대안은 반드시 2~3개로 항목화하고, 각각 한 문장의 근거를 붙이세요."]}, {"t": "세계시민과 국가 이익", "ty": "두제시문비교", "p": "(가) \"백신, 기후, 난민 문제 앞에서 국경은 무력하다. 한 나라의 감염병은 곧 모두의 감염병이 되고, 한 나라의 탄소 배출은 모두의 해수면을 높인다. 인류가 공동의 문제를 안고 있는 이상, 우리는 한 나라의 국민이기 이전에 세계시민으로 사고해야 한다. 자국의 이익만 좇는 각자도생은 결국 모두의 손해로 돌아온다.\"\n\n(나) \"세계시민이라는 말은 아름답지만, 위기의 순간 각국은 예외 없이 자국민을 먼저 챙겼다. 감염병 대유행 때 백신을 확보한 것은 국제기구가 아니라 각국 정부의 계약 경쟁이었다. 세금을 내고 병역을 지는 공동체는 국가이며, 정부의 첫 번째 책임은 자국민 보호다. 국익을 지키지 못하는 나라의 국민에게 세계시민의 이상은 사치일 수 있다.\"", "q": ["(가)와 (나)의 입장 차이를 설명하고, 두 입장이 충돌하는 구체적 상황을 하나 들어 자신이라면 어떻게 판단할지 말해 보세요."], "guide": "【제시문 분석】 (가)는 문제의 성격(초국경성)에서 세계시민주의를, (나)는 책임의 구조(국가만이 실질적 보호자)에서 자국 우선주의를 끌어냅니다. 문제가 '충돌하는 구체적 상황'을 요구하므로 백신 배분, 탄소 감축, 난민 중 하나를 골라 시뮬레이션하는 것이 핵심입니다.\n【답변 구성】 ① 두 입장의 논리적 뿌리 비교 → ② 충돌 상황 설정(예: 백신 부족 상황) → ③ 판단과 근거(단기/장기 이익 구분) → ④ '국익과 세계시민 의식은 장기적으로 수렴한다'는 종합 → ⑤ 정리", "a": ["(가)는 기후나 감염병처럼 국경을 넘는 문제 앞에서는 세계시민의 관점이 필수라고 보고, (나)는 실제로 국민을 보호할 책임과 능력을 가진 단위는 국가뿐이라는 현실을 강조합니다. (가)가 문제의 성격에서 출발한다면, (나)는 책임의 구조에서 출발합니다.\n\n두 입장이 충돌하는 상황으로 백신 배분을 들어 보겠습니다. 우리나라가 확보한 백신이 부족한 상황에서, 이웃 개발도상국의 유행이 심각해 국제기구가 백신 공여를 요청한다면 어떻게 해야 할까요. 저라면 먼저 고위험군인 우리 국민의 접종 물량은 확보하되, 그 이후 물량의 일부는 공여에 참여하겠습니다. 근거는 두 가지입니다. 첫째, 정부가 세금으로 확보한 백신의 일차적 책임은 자국민에게 있다는 (나)의 논리는 부정할 수 없는 책임의 순서이기 때문입니다. 둘째, 그러나 변이 바이러스는 유행이 방치된 곳에서 생겨나 결국 우리에게 돌아오므로, 이웃 나라의 방역은 곧 우리의 방역이기도 합니다. 즉 세계시민적 행동이 장기적으로는 국익과 수렴합니다.\n\n결론적으로 저는 (가)와 (나)를 '이상과 현실'의 대립이 아니라 '단기와 장기'의 문제로 봅니다. 단기적 책임은 국가 단위로 지키되, 장기적 이익은 세계시민의 시야로 계산하는 것이 성숙한 국익 추구라고 생각합니다."], "tips": ["'구체적 상황을 들라'는 요구에는 가상의 시나리오를 만들어 답하는 훈련이 필요합니다. 백신·탄소·난민 중 하나를 미리 준비하세요.", "'세계시민적 행동이 장기적 국익'이라는 수렴 논리는 국제 이슈 전반의 종합 전략입니다.", "국제고 지원자라면 이 주제가 학교의 교육 목표와 직결된다는 점을 기억하세요."]}, {"t": "합계출산율 추이 분석", "ty": "자료해석", "p": "합계출산율은 여성 한 명이 평생 낳을 것으로 예상되는 평균 자녀 수로, 한 사회의 인구가 현재 규모를 유지하려면 2.1명이 필요하다. 다음 그래프는 2000년 이후 우리나라 합계출산율의 변화를 나타낸 것이다.\n\n우리나라의 합계출산율은 경제협력개발기구(OECD) 회원국 가운데 가장 낮으며, 1명 미만으로 떨어진 나라는 한국이 유일하다. 정부는 지난 20년 가까이 저출산 대응에 수백조 원의 예산을 투입했지만 하락 추세를 되돌리지 못했다. 주거비와 사교육비 부담, 장시간 노동과 일·가정 양립의 어려움, 경쟁적인 사회 분위기 등이 복합적인 원인으로 지목된다.", "q": ["그래프에서 확인할 수 있는 사실을 두 가지 이상 말해 보세요.", "이 추세가 지속될 때 20년 후 우리 사회에 나타날 변화를 예측하고, 가장 시급하게 대응해야 할 분야와 그 이유를 말해 보세요."], "guide": "【자료 분석】 그래프를 읽을 때는 ① 전체 추세(하락) ② 기준선과의 비교(2.1명의 절반 이하) ③ 변곡점(2015년 이후 급락)의 순서로 봅니다. '사실'과 '해석'을 구분해 말하는 것이 자료해석의 기본입니다.\n【답변 구성】 [1] 수치를 정확히 인용하며 사실만 2~3개 진술 [2] ① 인과 사슬로 미래 예측(학령인구→병력
